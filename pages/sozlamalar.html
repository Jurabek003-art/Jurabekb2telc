<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sozlamalar</title><script src="../app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#10182d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:center}.top a{color:#fff;text-decoration:none;font-size:28px}.card{background:#ffffff12;border:1px solid #ffffff1f;border-radius:20px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff12}.row:last-child{border:0}select,input[type=range]{max-width:48%}button{width:100%;padding:14px;border:0;border-radius:14px;background:#526fce;color:#fff;font-weight:700}.danger{background:#8e3f4b}
/* Shared responsive shell: phone/tablet/desktop */
html,body{max-width:100%;overflow-x:hidden}
@media(min-width:760px){
  body>main,body>.wrap,body>.container{max-width:1040px;margin-left:auto!important;margin-right:auto!important}
}
@media(min-width:1100px){
  body>main,body>.wrap,body>.container{max-width:1100px}
}

</style></head><body><main class="app"><div class="top"><a href="profil.html">‹</a><h1>⚙️ Sozlamalar</h1></div><div class="card"><div class="row"><span>Ko‘rinish</span><select id="theme"><option value="dark">Qorong‘i</option><option value="light">Yorug‘</option></select></div><div class="row"><span>Ovoz</span><input id="sound" type="checkbox"></div><div class="row"><span>Ovoz balandligi</span><input id="volume" type="range" min="0" max="100"></div><div class="row"><span>Vibratsiya</span><input id="haptic" type="checkbox"></div><div class="row"><span>Eslatmalar</span><input id="notifications" type="checkbox"></div><div class="row"><span>Matn kattaligi</span><input id="font" type="range" min="85" max="125"></div></div><button onclick="save()">💾 Saqlash</button><div class="card"><button class="danger" onclick="resetProgress()">Progressni tozalash</button></div></main><script>let s=JB2.settings();for(const k of ["theme","volume","font"])document.getElementById(k).value=s[k];for(const k of ["sound","haptic","notifications"])document.getElementById(k).checked=!!s[k];function save(){const n={theme:theme.value,volume:+volume.value,font:+font.value,sound:sound.checked,haptic:haptic.checked,notifications:notifications.checked,lang:"uz"};JB2.set("jurabekB2Settings",n);alert("Sozlamalar saqlandi");location.reload()}function resetProgress(){if(!confirm("Natijalar, XP va xatolarni tozalashni tasdiqlaysizmi?"))return;["jurabekB2Profile","jurabekB2Mistakes","wrongQuestions","testResults"].forEach(k=>localStorage.removeItem(k));alert("Progress tozalandi")}</script></body></html>
