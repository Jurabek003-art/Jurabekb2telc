, sagt Kati Jago. Denn beim Tauschen zählte auch das soziale Miteinander.\n\n2\n\n„Man gönnt sich ja sonst nicht.“ Und schon ist die Einkaufstüte voll und das Konto leer. Macht das glücklich? Oder wieso sonst kauft man mehr, als man eigentlich geplant hat?\n\nEin Einkauf kann sich ähnlich anfühlen wie eine Belohnung, sagt der Psychologe Daniel Stöber. Denn dabei wird ein Glückshormon ausgeschüttet. Manchmal könne das sogar in einem Kaufrausch enden. Denn das Glücksgefühl, das Konsumenten beim Kaufen erleben, könne sie dazu anregen, „immer mehr Geld auszugeben“.\n\nDoch die Ernüchterung folge oft schnell, warnte er: Denn wer später merke, wie teuer das alles gewesen sei, schütte Stresshormone aus. Dies könne zu Schlafstörungen und schlechter Laune führen. Langfristig lässt sich so die eigene Lebenszufriedenheit also gewiss nicht steigern.\n\n3\n\nGeklickt, gekauft, zurückgeschickt: Kunden nutzen im Online-Handel gerne die Möglichkeit, Waren innerhalb einer bestimmten Frist kostenlos zurückzusenden. Vor allem im Modehandel steigt die Zahl der Rücksendungen immer weiter an. Oft bestellen Kunden gleich mehrere Modelle in unterschiedlichen Größen, um sie zu Hause in Ruhe anzuprobieren.\n\nDie Kosten für die Retouren trägt der Anbieter. Dennoch lohnt sich für die Online-Händler das Geschäft. Die zurückgegebene Kleidung kann zum Beispiel oft so aufbereitet werden, dass sie erneut zum Verkauf angeboten werden kann.\n\nRücksendungen werden sich im Online-Handel nie ganz vermeiden lassen, erklärt Birgit Steinköhler vom Bundesverband Online-Handel. Dennoch ist es möglich, dass sich ihre Anzahl in Zukunft senken lässt. Dies wünschen sich natürlich auch die Online-Verkäufer und suchen nach neuen Möglichkeiten: etwa detailliertere Produktinformationen oder neue Technologien, die die individuellen Maße der Kunden ermitteln.\n\nDennoch: Rücksendungen werden im Online-Handel wohl immer zum Geschäftsmodell gehören.\n\n4\n\nKeine Lust mehr auf die Konsum-Gesellschaft? Dann könnte es ein erster Schritt sein, den Lieblingspulli zu stopfen statt zu entsorgen oder den alten Wecker vom Oma noch mal zum Laufen zu bringen.\n\nOb Fahrrad, Fernseher oder Smartphone – man muss bei Defekten nicht gleich alles wegwerfen. In sogenannten Repair-Cafés können defekte Gegenstände unter fachkundiger Anleitung wieder instandgesetzt werden.\n\n„Damit schonen wir die Umwelt und den Geldbeutel“, erklärt Thomas Rederitz, Inhaber eines solchen Reparaturcafés.\n  Repair-Cafés verstehen sich als Initiative gegen die Wegwerf-Mentalität.\n\nDa viele Firmen keinen Reparaturservice mehr anbieten, muss vieles aufwendig entsorgt werden, sagt Rederitz. Das sei nicht immer nötig. Manchmal ist ja auch nur eine Schraube locker, oder es fehlt ein kleines Bauteil, das leicht ersetzt werden kann.\n\n„Im Reparaturcafé wird gemeinsam gewerkelt, geschraubt, genäht, gebastelt – und auch gelacht und geredet.“ Die Reparatur wird in jedem Fall sachgerecht durchgeführt; denn zu den freiwilligen Mitarbeitern von Repair-Cafés gehört Handwerksmeister der unterschiedlichsten Fachrichtungen.\n\n5\n\nViele Menschen sind erstaunlich großzügig: Sie machen anderen gern Geschenke, spenden Geld für gute Zwecke oder opfern Zeit für ehrenamtliche Tätigkeiten. Aber was motiviert sie dazu?\n\nDie Wissenschaft liefert ganz unterschiedliche Erklärungsansätze. Eine Erklärung lautet, dass großzügige Menschen auf Gegenseitigkeit hoffen: Wer viel gibt, bekommt auch viel zurück.\n\nEine Studie konnte nun aber zeigen, dass die Antwort vielleicht ganz einfach ist: Großzügigkeit macht eben glücklich. Dies fanden Forscher der Universität Lübeck heraus.\n\nDieses enge Verknüpfung zwischen großzügigem Verhalten und Glücksgefühl zeige sich auch im Gehirn. So aktivieren ein solches Verhalten ein Hirnareal, das eng mit unserem Belohnungszentrum verknüpft ist.\n\nDas Ergebnis ihrer Studie könnte weitreichende Folge für die Gesellschaft haben. Wer glücklicher werden möchte, könne sich diese neuen Erkenntnisse zunutze machen: Denn wer für andere da ist, tut auch etwas für das eigene Wohlbefinden.", "1.29": "Überschriften\n\na) Neue Kinderhandys auf den Markt gebracht\n\nb) Profi-Tipps für bessere Urlaubsbilder\n\nc) Modern schnurlose Geräte vermindern die Strahlenbelastung\n\nd) Mehr Mut zum Fotografieren\n\ne) Handy im Ausland: Aufpassen und tricksen!\n\nf) Kinder-Überwachung für Eltern per Handy wird geplant\n\ng) Tipps zum Telefonieren mit weniger Strahlung\n\nh) Handy-TV zur Fußball-WM 2006\n\ni) Der neue Eurotarif\n\nj) Mobilfernsehgenuss wird zum Alltag\n\n1\n\nVielen Menschen verursachen ein mulmiges Gefühl: Die meisten Schnurlos-Telefone strahlen auch dann, wenn man gar nicht telefoniert. Vor allem DECT-Geräte (Digital Enhanced Telecommunications – digital verbesserte schnurlose Kommunikation) sind deshalb in die Kritik geraten.\n\nAllmählich nehmen Hersteller die Bedenken ernst und bieten Geräte an, die das Bundesamt für Strahlenschutz (BfS) als „bedingt strahlungsarm“ einstuft. Stehen diese Telefone auf der Ladestation, wird die Sendeleistung von Handgerät und Basis abgeschaltet oder radikal vermindert.\n\nVoraussetzung: Nur ein Mobilteil ist angemeldet. Einige Modelle reduzieren die Strahlung auch, wenn man nahe der Basisstation telefoniert: Nur 25 Prozent Sendeleistung braucht das Siemens Gigaset E360 im Umkreis von fünf Metern, das AEG Fame 400 kommt mit rund 30 Prozent aus.\n\n2\n\nWenn Kinder ein Handy haben, dann ist das schön und gut. Doch was, wenn der Filius nicht dran geht? Wenn er möglicherweise etwas Besseres zu tun hat, als zurückzurufen? Und noch schlimmer, wenn sich Heranwachsende im prüden Amerika schmutzige Bilder auf dem Handydisplay anschauen? Das schreit nach Kontrolle.\n\nUnd genau die will Motorolas CEO Edward Zander den Eltern über ihre Kinder geben: Sie sollen jederzeit wissen, wo sie (oder deren Mobiltelefon) sind und was sie damit tun. Verbunden werden soll die Einführung von einem solchen Handy mit einer Reihe Merkmale, die junge Menschen ansprechen, wie zum Beispiel mit dem für nächsten Monat anvisierten Start des iTunes-Handys.\n\n„Handys sind heute das, was in meiner Jugend der Fernseher war“, so Zander. „Aber es gibt einen Weg, es sicher zu machen.“ Eltern müssten sich in die entstehende Jugendkultur rund um Handys stärker einbringen, und sie sollten sich stärker dafür interessieren, was sie hören, sehen und lesen, so Zander weiter. Handys mit entsprechender Zensur-Software seien bereits in Vorbereitung.\n\n3\n\nWer unter Palmen liegt, greift gern zum Handy. Doch trotz neuer Preisobergrenzen bleibt das ein teurer Spaß! Die Verbraucherzentrale Schleswig-Holstein erklärt, wie Sie richtig wählen.\n\nBis 30. Juli müssen alle europäischen Mobilfunkanbieter den neuen „Eurotarif“ anbieten. Er gilt in allen EU-Staaten und schreibt Preislimits von maximal 49 Cent/Min. für eigene Anrufe bzw. maximal 24 Cent für ankommende Gespräche vor.\n\nAber aufgepasst:\n\nFalle 1: kein Rabatt im Juli/August!\n\nFalle 2: Mehrwertsteuer!\nZu den Kosten für abgehende bzw. angenommene Anrufe kommen noch 19 % Mehrwertsteuer dazu.\n\nFalle 3: Alte Sondertarife!\nBis 20 Prozent der Handy-Nutzer haben Sonderverträge für Auslandsgespräche. Gefahr: Sie kennen den neuen Eurotarif nicht nutzen. Unbedingt informieren!\n\nDie besten Spar-Tricks: Prepaid-Karte. Besonders für Viel-Telefonierer interessant. Zurzeit zahlen die meisten Kunden mit Vertrag mindestens 99 Cent pro angefangene Minute, mit Prepaid-Karte nur etwa 58,31 Cent. SMS schreiben im Vergleich zu Telefonaten sind Kurznachrichten (SMS) auch im Urlaub meistens günstiger.\n\n4\n\nManche Momente muss man einfach festhalten – mit einem Foto. Doch dessen Qualität hängt von vielen Faktoren ab: der Kamera, den Verhältnissen vor Ort und der Erfahrung des Fotografen.\n\nFür ein paar schöne Erinnerungsfotos lohnt sich aber eine teure Profi-Ausrüstung selten. Vom Pauken schwieriger technischer Details ganz zu schweigen. Das ist heute auch längst nicht mehr nötig. Schon mit normalen Digitalkameras lassen sich wunderbare Bilder schießen – mit ein paar Tricks abwechslungsreiche Motivwahl.\n\nDie meisten Urlauber fotografieren gerne Sehenswürdigkeiten mit ihren Liebsten.\n  Schaut man sich die Bilder später an, sind sie oft eine Variation des ewig Gleichen: der Sohn auf dem Kamel, vor der Kathedrale, im Pool. Der Sohn ist niedlich, keine Frage. Es kann jedoch nicht schaden, die Motive zu variieren: verschiedene Personen und Orte, zu unterschiedlichen Tageszeiten – mal den menschenleeren Strand, mal das Marktgetümmel.\n\nNähe und Distanz. Mehr Abwechslung erreichen Sie auch, wenn Sie mit der Nähe zum Objekt spielen: hier eine Totale mit dem Weitwinkel, dort eine Nahaufnahme. Perspektive und Technik. Schnelle Schnappschüsse gelingen nicht immer. Nehmen Sie sich Zeit für Porträt- und Landschaftsaufnahmen. Nutzen Sie dabei auch den extra einstellbaren Modus bei Digitalkameras. Er stellt Objektiv und Belichtung perfekt auf die gewählte Variante ein.\n\nLicht und Schatten. Für stimmungsvolle Bilder eignen sich am besten Vormittags- und Spätnachmittagsstunden, weil das Licht dann besonders weich ist.\n\n5\n\nEs gibt in Deutschland wohl kaum eine bessere Chance für die Einführung von Handy-TV als die Fußball-WM 2006. Doch ein rechtzeitiger Start ist ungewiss.\n\nDie Problemfelder sind vielschichtig. Drei Standards kämpfen darum, das erste deutsche Mobilfernsehen zu sein: UMTS, DMB und DVB-H. Und das möglichst pünktlich zum 9. Juni 2006, dem Start der Fußball-WM.\n\nDieser Drei-Kampf wird von Experten jedoch kritisch betrachtet. In Südostasien floriert dieser Markt doch schon seit vielen Monaten. In Korea beispielsweise gehört der mobile Fernsehgenuss zum Alltag. Bis zu zwei Stunden täglich schauen Besitzer der kleinen TV-Handys dort unterwegs auf die Mini-Mattscheibe.\n\nWarum sollte dies mittelfristig nicht auch in Deutschland realisierbar sein? In einem sind sich Experten jedoch sicher: Handy-TV wird die Fernsehbranche verändern.\n\nKenner sprechen von drei neuen Prime Times (Hauptfernsehzeiten), die durch die mobile Glotze entstehen: Der Weg zur Arbeit, die Mittagspause und der Heimweg. Dafür ist jedoch eine andere Art von Inhalten notwendig, vor allem kurz müssen sie sein, denn kaum jemand wird sich einen kompletten Spielfilm auf dem kleinen Bildschirm ansehen wollen.", "1.30": "Überschriften\n\na) Das Geheimnis des schnellen Schwimmens\n\nb) Extremer Lebensraum\n\nc) Fische im Fokus der Forscher von der Technischen Universität in Berlin\n\nd) Wie wird Technik in der Natur eingesetzt\n\ne) Bioniker erforschen die Wüstennatur\n\nf) Ein Fisch in den Dünen\n\ng) Die Ursachen für den Wassermangel\n\nh) Rasante Flucht\n\ni) Trinkwasser aus Nebel\n\nj) Auf der Suche nach verborgenen Details\n\n1\n\nWillkommen in der Wüste. Die Sonne brennt gnadenlos. Endlose Weite. Nur Sand und Geröll, so weit das Auge reicht. Kein Baum, kein Strauch, kein noch so winziges Tier.\n\nBilder wie diese kommen wohl den meisten in den Sinn, wenn sie an die Wüste denken. Doch diese Vorstellung stimmt nicht ganz. Denn so hart und lebensfeindlich die Bedingungen in der Wüste auch sind: Es gibt einige Überlebenskünstler, die es selbst hier schaffen, zu existieren.\n\nUm in der Wüste zu überleben, mussten sie sich im Laufe der Jahrmillionen perfekt an die harten Lebensbedingungen anpassen. Sie wurden zu ausgesprochenen Spezialisten. Zu Spezialisten, von denen Wissenschaftler jede Menge lernen können.\n\nUnd so zieht es jedes Jahr Bioniker aus vielen Ländern der Erde in die entlegenen Wüsten der Welt. Auf der Suche nach kleinen, aber wirksamen Tricks für das Leben in einer extremen Umgebung.\n\n2\n\nDenn Bioniker entwickeln technische Anlagen nach dem Vorbild der Natur. Der Begriff Bionik setzt sich zusammen aus den Wörtern „Biologie“ und „Technik“.\n\nIhre Aufgabe: die Pflanzen und Tiere erst genau beobachten, kleinste Details entdecken und deren Geheimnisse lüften. Warum kann ein Gecko an der Wand hochlaufen? Wie kann ein Kolibri rückwärts fliegen?\n\nWenn die Bioniker die Abläufe verstanden haben, fängt der größte Teil ihrer Arbeit erst an. Dann versuchen sie, aus dem Gelernten eine technische Anwendung zu entwickeln.\n\nAuch die besonderen Eigenschaften von Wüstentieren eignen sich dafür, wie die folgenden Beispiele zeigen.\n\n3\n\nDer Sandfisch ist eigentlich gar kein Fisch, sondern eine kleine Echse. Doch seinen Namen hat er sich redlich verdient. Denn er kann ausgezeichnet schwimmen. Zwar nicht im Wasser, dafür aber umso besser im Sand der Sahara.\n\nDroht dem wenige Zentimeter großen Tier Gefahr, dann verschwindet es rasend schnell im Wüstensand, nur um Augenblicke später einige Meter entfernt wieder aufzutauchen. Was im Wasser jedes Kind beherrscht, scheint im Sand unmöglich. Doch nicht für den Sandfisch.\n\nDenn er hat ein winziges Geheimnis: Seine Haut erscheint nur auf den ersten Blick ganz glatt. Unter dem Mikroskop fanden Wissenschaftler der Technischen Universität (TU) Berlin winzige Grate auf seiner Haut, nur wenige Nanometer groß (ein Nanometer entspricht dem millionsten Teil eines Millimeters).\n\nGenau diese Grate verhindern, dass der Sand an der Haut des Sandfisches hängen bleibt. Die Forscher konnten es kaum glauben und bauten in ihrem Labor eine Oberfläche mit vergleichbaren Strukturen nach.\n\nUnd siehe da: An einer vollkommen glatten Oberfläche bleibt der Sand förmlich kleben, an der mit den kleinen Erhebungen findet er keinen Halt.\n\nDie Idee für eine technische Umsetzung dieser Oberfläche ließ nicht lange auf sich warten. So arbeiten die Forscher am Institut für Bionik und Evolutionstechnik der TU Berlin etwa an besonderen Leitungsrohren. Mit einer „Sandfisch-Haut“ im Inneren können die Rohre ein für alle Mal vor einer Verstopfung bewahrt werden.\n\n4\n\nDas größte Problem aller Wüstenbewohner ist die Wasserbeschaffung. In allen Wüsten der Erde herrscht fast ständig akuter Wassermangel. In vielen fällt jahrelang kein einziger Regentropfen vom Himmel. In einigen Regionen der Atacama-Wüste in Südamerika soll es seit mehreren hundert Jahren keinen Niederschlag mehr gegeben haben.\n\nDer Nebeltrinker-Käfer hat seine ganz eigene Strategie gegen den Wassermangel entwickelt. Er lebt in der Namib-Wüste im Südwesten Afrikas. Viele Tage im Jahr krabbelt er emsig die Sanddünen hinauf, macht eine Art Kopfstand und wartet auf den Nebel, der vom Atlantik her über den Rand der Wüste zieht.\n  Dabei senkt er den Kopf und hebt sein Hinterteil in die Höhe. Die Flüssigkeit des Nebels kondensiert an seinem nur anderthalb Zentimeter langen Körper und läuft über eine kleine Vertiefung auf seinem Rücken direkt in sein Maul.\n\nHier liegt die technische Anwendung auf der Hand: Wassergewinnung aus Nebel. Tatsächlich wird diese Methode auch schon einige Jahre genutzt. In der Nähe des Dorfes El Tofo in Chile wurden sogenannte Nebelnetze errichtet. Pro Nebeltag kondensieren hier bis zu 11.000 Liter frisches Wasser an den Netzen, eine stolze Ausbeute.\n\n5\n\nBeispiel Nummer drei: die Räderspinne. Auch sie lebt in der Wüste Namib und wurde erst vor wenigen Jahren entdeckt.\n\nDie Wissenschaftler waren ziemlich verblüfft, als sie die ungewöhnliche Fluchtmethode des Achtbeiners sahen: einfach die Beine anwinkeln und dann wie ein Rad die Sanddünen hinunterrollen.\n\nDie Bioniker filmten die Spinne mehrmals und schauten sich das Video unzählige Male an. Dann war ihnen klar: Mit ihren Vorderbeinen stößt sich die Spinne während des Rollens immer wieder vom Boden ab. Dadurch kullert sie nicht einfach nur passiv den Hang hinunter. Vielmehr kann sie durch diese Methode auf ihrer Flucht wieder ordentlich an Tempo zulegen.\n\nDoch welche technische Anwendung soll dabei herausspringen? Hier beweisen die Forscher Mut zur Vision: An der TU Berlin soll ein Mars-Auto entstehen, das im unwegsamen Gelände fahren kann.", "1.31": "Überschriften\n\na) Neue Richtlinie für Zertifizierung von Medikamenten für Kinder\n\nb) Neue Verfahren in der Kinderheilkunde\n\nc) Gefahren zu hohen Fernsehkonsums bei Kindern\n\nd) Alternative Heilverfahren: Wie gut sind sie wirklich?\n\ne) Naturkosmetik aus Geschwisterhand\n\nf) Kinder bekommen immer mehr Medikamente\n\ng) Studie: Schulkinder treiben zu wenig Sport\n\nh) Schlechte Noten für Baby-TV\n\ni) Kinder und Jugendliche: Risikofaktor Übergewicht\n\nj) Neueste Forschungsergebnisse zur Wirkung von Ginseng\n\n1\n\nFernsehen ist der Sprachentwicklung bei Kleinkindern nicht förderlich. Sie sind bunt und lustig, die Teletubbys, die am Bildschirm auch deutsche Kinder beglücken. Doch gute Sprachlehrer für Babys sind sie nicht – so das Ergebnis einer US-amerikanischen Studie.\n\n„Manche Eltern mögen davon träumen, dass ihre Kinder die ersten Worte beim Fernsehen lernen“, sagt eine Linguistin, „aber das funktioniert nicht.“\n\nDie Kommunikationsexpertin hat 48 Kleinkinder im Alter von 5 bis 24 Monaten getestet. Zuerst bekamen sie Gegenstände zu Gesicht, für die sie noch keine Worte hatten – etwa einen Schraubenzieher. Für das gezeigte Objekt erfanden die Forscher dann ein Fantasiewort wie „Deet“.\n\n„Damit wollten wir sicherstellen, dass die Kinder den Begriff wirklich noch nie gehört hatten“, erklärt die Expertin. Dann wurde es fünfmal wiederholt – entweder in einem Teletubby-ähnlichen Video oder direkt von einer anwesenden Person.\n\nNach kurzer Pause legten die Forscher ihren Probanden einige Gegenstände vor und forderten sie auf: „Zeig mir Deet.“\n\nBabys, die das Wort direkt gelernt hatten, reagierten spätestens bei der dritten Wiederholung. Die jungen TV-Seher aber waren meist ratlos.\n\n2\n\nPharmakologen am Universitätsklinikum Tübingen haben kürzlich bei einer Auswertung von 1,6 Millionen Rezeptverordnungen für Kinder und Jugendliche festgestellt, dass gut 13 Prozent der Fälle das jeweils verschriebene Medikament gar nicht eigens für Kinder zugelassen war oder in einer für sie nicht getesteten Dosierung verwendet wurde.\n\nIn Kinderkliniken sind etwa 50 Prozent, auf Intensivstationen für Neugeborene sogar bis zu 90 Prozent der verabreichten Medikamente nicht speziell für Kinder konzipiert.\n\nNoch bedenklicher: Je kleiner und je kränker ein Kind ist, desto mehr dieser „Off-Label“-Verordnungen hat es zu erwarten.\n\nBesonders bei den in Kliniken behandelten, ernsthafteren Krankheiten aber können die Ärzte oft gar nicht anders, als für Kinder nicht getestete Medikamente zu verabreichen. Da Kinder vergleichsweise selten schwer erkranken, sind die aufwendigen Testverfahren zur Herstellung altersspezifischer Medikamente für die Hersteller häufig wirtschaftlich uninteressant.\n\nGlücklicherweise ändert sich dieser Zustand durch eine EU-Verordnung, die seit Januar 2007 gilt. Demnach müssen alle in der Entwicklung befindlichen Medikamente, die für Kinder und Jugendliche in Betracht kommen, auch an ihnen geprüft werden.\n\nFür bereits zugelassene Präparate gibt es finanzielle Anreize, sie nachträglich an jungen Altersgruppen zu erproben. Geprüfte Medikamente erhalten dann den Packungsaufdruck: „Für Kinder geprüft.“\n\n3\n\nAlternative Heilverfahren können vor allem bei leichten Erkrankungen hilfreich sein. Dabei gilt es, Nützliches von Scharlatanerie zu unterscheiden.\n\nViele sprechen noch von „alternativer“ Heilkunde. Doch inzwischen ist die für etwa 400 Heilverfahren jenseits der Schulmedizin der Ausdruck „Komplementärmedizin“ üblich geworden.\n\nDenn die Akupunktur, Aromatherapie, anthroposophische Medizin, Pflanzenheilkunde, Homöopathie und viele andere begreifen ihre besonderen Methoden meist als Ergänzung der herkömmlichen Medizin und nicht als deren Ersatz.\n\nIn dieser Funktion ist die Komplementärmedizin heute weithin akzeptiert. Auch in der Kinderheilkunde sind die Verfahren beliebt. Ob sie wirksam sind, lässt sich mithilfe klinischer Studien überprüfen. Die aber sind aufwendig und teuer, weshalb es oft an wissenschaftlichen Wirksamkeitsnachweisen mangelt. Sicher nachgewiesen ist vor allem die Wirksamkeit von Pflanzenpräparaten.\n  Mehr Forschung auf dem Gebiet der Komplementärmedizin könnte verhindern, dass mancher vielleicht nützliche Behandlungsansatz den Schulmedizinern völlig aus dem Blick gerät. Und einige Ärzte sollten vielleicht darüber nachdenken, was ein Kenner jener Szene vor einiger Zeit auf einem Kongress des Berufsverbandes der Kinder- und Jugendärzte gesagt hat: Das Erfolgsgeheimnis der Anbieter nicht-konventioneller Methoden beruhe vor allem darauf, dass sie den Eltern das Gefühl vermittelten, „endlich einmal ernst genommen zu werden“.\n\n4\n\nDie eine liebt Flora und Fauna, die andere hat ein Händchen für Kommunikation und Marketing: Zusammen betreiben die Schwestern Henrike Rodemeier und Gesine Wischmann „Deutschlands einzige Ginseng-Farm im niedersächsischen Bockhorn“.\n\nAls studierte Agraringenieurin ist die 38-jährige Rodemeier für den Anbau zuständig. Die vier Jahre ältere Schwester vertreibt über ihre Firma Florafarm die aus den Wurzeln gewonnenen Arzneimittel. Zudem entwickelte die gelernte Pharmareferentin eine eigene Ginseng-Kosmetiklinie.\n\nDen Anfang hatte ihr Vater Heinrich Wischmann bereits vor 24 Jahren gemacht: Er gab die unrentable traditionelle Landwirtschaft auf und konzentrierte sich auf den Anbau von Ginsengwurzeln, die unter anderem das Immunsystem stärken und den Blutdruck regulieren.\n\nTrotz Ruhestand ist auch er noch auf der Farm aktiv. Doch die Zukunft gehört den Töchtern – die planen bereits eine Dependance.\n\n5\n\nKinder essen zu viel Fast Food, aber zu wenig Obst und Gemüse, so eine Expertin vom Deutschen Institut für Ernährungsmedizin und Diätetik (D.I.E.T.) in Bad Aachen.\n\nNach Angabe der Deutschen Gesellschaft für Ernährung sind 10 bis 20 Prozent aller Schulkinder und Jugendlichen übergewichtig, Tendenz steigend. Übergewicht kann schon im frühen Alter zu Folgeerkrankungen wie Hypertonie, Fettstoffwechselstörungen, Diabetes oder Gallensteinleiden führen.\n\nZu den Ursachen gehören eine oftmals zu hohe tägliche Energie- und Fettzufuhr und mangelnde Bewegung. Gerade bei einer genetischen Vorbelastung führt das zu einer Zunahme der Fettmasse des Körpers.\n\nDas D.I.E.T. rät daher allen Eltern, ihren Kindern von klein auf eine gesunde Kost zu bieten. Durch einen regelmäßigen Mahlzeitenrhythmus im Tagesablauf kann außerdem unkontrolliertes „Zwischendurchessen“ vermieden werden.\n\nEin kompletter Verzicht auf Süßes ist aus psychologischen Gründen nicht empfehlenswert, ein vernünftiger Umgang mit Süßigkeiten muss erlernt werden. Durch vermehrte körperliche Aktivität wird der Energieverbrauch erhöht.\n\nEltern sollten versuchen, bei ihren Kindern sportliche Interessen zu wecken und Hobbys zu fördern.", "1.32": "Überschriften\n\na) Am Strand im Dienst – mehr Sicherheit für Urlauber\n\nb) Bäder, Seen und Natur – im hessischen Paradies\n\nc) Freiheit und Natur – nach sechs Wochen harter Arbeit\n\nd) Jugendliche arbeiten für Jugendliche\n\ne) Kinderarbeit in Deutschland: Jugendliche werden zur Arbeit gezwungen\n\nf) Nach harter Arbeit durch nordische Gewässer\n\ng) Schaden an Kreuzfahrtschiff verhindert Weiterfahrt\n\nh) Urlaub an deutschen Seen immer gefährlicher\n\ni) Wegen Niedrigwasser: vom Fluss auf die Straße\n\nj) Zu Gast bei den Fürsten\n\n1\n\nEntdecken Sie interessante Städte und Regionen. Im Herzen Deutschlands liegen wunderbare Landschaften, mit einem für deutsche Verhältnisse sehr milden Klima – und keine typischen Touristenziele. Von der Stadt Gießen ausgehend kann man in den hessischen Kreisen Bergstraße und Waldeck-Frankenberg viele Orte entdecken, die noch ein Geheimtipp sind. Vor allem gilt dies für den Kreis Waldeck-Frankenberg. Wer nicht gerade in Hessen wohnt, wird kaum wissen, wo diese Region eigentlich liegt. Es ist ein herrliches Stück Deutschland ohne besonders große Städte, eine Gegend, die Natur pur bietet.\n\nDa wundert es nicht, dass man hier einige Kurorte findet wie Bad Arolsen oder Bad Wildungen oder den Luftkurort Edertal-Kleinern. Apropos Edertal: Der zwölf Quadratkilometer große Edersee gehört zu den vier schönen blauen „Augen“ des Kreises. Der Landkreis Waldeck-Frankenberg ist Hessens attraktivstes Umland. In der Region der Berge und Seen spürt man auch heute noch einen Hauch von Fürstlichkeit. Majestätisch erhebt sich über dem Edersee das Schloss Waldeck. Auch in Bad Arolsen, einer ehemals Residenzstadt, ist vieles noch vom früheren Adel geprägt. Unbedingt besuchen sollte man darüber hinaus das über 1000 Jahre alte Korbach wie auch die Fachwerkstadt Frankenberg.\n\n2\n\nPferde waren schon immer Melanie Schilles Leidenschaft. „Und jetzt kann ich Hobby und Beruf miteinander verbinden“, freut sich die Beamtin aus Hannover. In diesem Jahr verstärkt sie die Strandwache an der Nordseeküste.\n\nIhr Arbeitsplatz ist der Strand: Mit „Magnus“, einem 11-jährigen Pferd, patrouilliert sie dort, wo die kleinen Sandburgen bauen, Urlauber bei einem Buch entspannen oder sich in die kühlen Fluten stürzen.\n\nMelanie Schille und ihr Hannoveraner sind eine Attraktion in dem Ferienort. Immer wieder wollen Gäste das Tier streicheln, von der Polizistin wissen, was sie hier macht. „Wir sorgen für mehr Sicherheit am Strand“, erklärt Melanie Schille und Rüdiger Teichmann (42). Sie suchen im Watt nach Vermissten, klären über Gefahren auf, verhindern Diebstähle und Sachbeschädigungen.\n\nNachweislich gingen die Delikte zurück, seit es die Streife hoch zu Ross gibt. Die Polizistin: „Wir sind in dem unwegsamen Gelände oft schneller am Einsatzort als die Kollegen per Fahrrad oder mit dem Auto.“\n\nAußerdem schone wir die Natur. Für sich persönlich sieht Melanie Schille noch einen großen Vorteil: Es ist schön, mal keine Demonstration sichern zu müssen, stattdessen genieße ich die frische Luft mit fröhlichen Urlaubern.\n\nNur eins vermisst die 22-Jährige, die mit Polizeipferd „Magnus“ auf einem Bauernhof Quartier bezogen hat, während ihres sechswöchigen Einsatzes: Freund Robert (23). Er fährt als Polizist in Hannover Streife und wartet auf sie.\n\n3\n\nEin neuer Urlaubstrend setzt sich durch: Statt faul am Strand zu liegen, wird man aktiv. Ein besonders beliebtes Ziel ist Schweden: So kann man am Ufer des Flusses Klarälven in der Provinz Värmland selbst ein Floß bauen. Das dauert drei bis sechs Stunden, anschließend macht man darauf Urlaub.\n\nDas ist Abenteuerurlaub pur“, schwärmt Johan Bengtson, der mit seiner Frau und den drei Kindern zum zweiten Mal Floßferien macht. Sich auf dem Fluss treiben lassen und in der Wildnis leben – dieses Gefühl ist super!\n\nSeit zehn Jahren veranstaltet Marie Junler von der Agentur Vildmark i Värmland die Holzfloßtrips. Wir haben die Bengtsons an ihrem ersten Urlaubstag begleitet. Mit dabei ist auch Veranstalterin Marie Junler, die der Familie hilft, das Floß zu bauen.\n\nEs ist ein herrlicher Sonnentag.\n  In einer sanften Kurve des Flusses Klarälven steht Marie bis zu den Hüften im tiefblauen Wasser. Mit dicken grünen Seilen schnürt sie Holzstämme zusammen und gibt Kommandos: Einer hält den Stamm, der andere knotet den Seemannsknoten, wie wir ihn vorhin an Land geübt haben.\n\nOhne einen Nagel werden 96 Baumstämme verzurrt im Wasser, sonst wäre das Holz zu schwer. Mindestens zwei Erwachsene sind nötig, um ein Floß zu bauen, einer allein packt das nicht.\n\nNach drei Stunden ist es geschafft: Das Urlaubsparadies der Bengtsons es misst übrigens 6 mal 3 Meter und wiegt 2 Tonnen – treibt am Ufer. Noch schnell das Sonnensegel befestigen, darunter Vorratskasten, Frischwassertank, Chemie-Klo, Küchenausrüstung, Zelt, Rettungsring, Schwimmwesten und das Paddel zum Steuern und Manövrieren verstauen und ab geht’s.\n\n4\n\nVon 9 bis 15 Uhr arbeitet Sebastian Keller (18) in einem Altenwohnheim in Hamburg-Altona: Er kümmert sich um die Essensausgabe, putzt die Küche und dann ist noch Zeit, um den Senioren vorzulesen oder mit ihnen Karten zu spielen.\n\nZur selben Zeit putzen Rebecca (12) und Christiane (13) den Eingang des Hamburger Michels, der wohl bekanntesten Kirche der Stadt, und Friederike (17) füttert schon frühmorgens Kühe, Schweine und Hühner auf einem Bio-Bauernhof bei Wedel.\n\n„Endlich mal ein sinnvoller Job“, sagen die fünf übereinstimmend. Sie stehen stellvertretend für etwa 100.000 Jugendliche, die beim „Sozialen Tag“ mitgemacht haben. Hut ab! Und was mindestens ebenso beeindruckend ist: Der Verein Hamburgs Schüler Helfen (HSH) wurde von Jugendlichen im Jahr 2004 gegründet und seitdem findet jedes Jahr im August der Soziale Tag statt.\n\nMit Behörden und Firmen sind Schüler aus Hamburg für einen Tag abgeschlossen. Die Schülerinnen und Schüler verdienen dann am „Sozialen Tag“ zwischen 6 und 8 Euro pro Stunde – aber nicht für sich selbst, sondern für andere. Denn der Verdienst wird gespendet.\n\nDie Jugendlichen wählen selbst ein Projekt aus, an das sie die Gelder spenden wollen. Einzige Bedingung: Es muss ein Projekt sein, von dem Jugendliche profitieren.\n\nIm letzten Jahr zum Beispiel wurde die Gesamtsumme von 1,2 Millionen Euro an das Projekt Frieden für alle gespendet. Dessen Ziel ist es, Jugendliche in Kriegsregionen zu unterstützen, den Dialog unter Jugendlichen aus verschiedenen Ländern zu fördern und auch das Kennenlernen anderer Kulturen zu ermöglichen.\n\nFür Ralf Waldner (20) vom HSH steht fest: Wir können und werden anderen auch in Zukunft helfen, das Engagement der Schülerinnen und Schüler in Hamburg ist in den letzten Jahren schließlich immer weiter gestiegen.\n\n5\n\nDie Windjacken waren schon eingepackt, die Koffer geschlossen. Thomas Meurer (64) und Wiebke Fuchs (62) aus Hannover freuten sich auf ihre Flusskreuzfahrt mit der MS Eurostar von Potsdam nach Prag.\n\nStattliche 2500 Euro kostete die Reise pro Person, und beide hatten lange gespart, um sich das leisten zu können. Doch aus der Kreuzfahrt wurde eine Bustour.\n\nMeurer berichtet, was er erlebt hat: „Wir waren am Abend auf das Schiff gegangen und hatten unsere Kabinen bezogen. Am nächsten Morgen ging es los. Aber schon bald machte das Schiff wieder fest und alle Gäste mussten von Bord.“\n\nWiebke Fuchs ergänzt: „Der Fluss hatte einfach zu wenig Wasser, da konnten wir mit dem großen Kreuzfahrtschiff nicht weiterfahren!“\n\nPer Bus ging es nach Prag. Beide wollen nun einen Teil des Reisepreises zurück, aber der Veranstalter Hapag-Lloyd wehrt ab: „Das war höhere Gewalt, da kann man nichts machen.“", "1.33": "Überschriften\n\na) Schlechtere Chancen für Frauen am Arbeitsmarkt\n\nb) Schnell essen macht dick\n\nc) Neue Broschüre: Studieren im Ausland\n\nd) Was tun nach der Schule? Neue Ausbildungsmöglichkeiten\n\ne) Initiative: Frauen für Männerberufe begeistern\n\nf) Immer mehr Frauen machen Karriere im technischen Bereich\n\ng) Experiment in Florida: Schlank in zwölf Stunden\n\nh) Ernährungstipps kostenlos am Telefon\n\ni) Schweizer Frauen kämpfen für mehr Rechte im Beruf\n\nj) Wissenschaftler warnen: Immer mehr dicke Mädchen in Österreich!\n\n1\n\nEin hochwertiger Schulabschluss gilt gemeinhin als Schlüssel zum Berufsein- und -aufstieg. Das ist aber nur bedingt richtig, denn sonst hätten die Frauen auf dem Arbeitsmarkt längst die Nase vorn. Mehr als die Hälfte aller Absolventen an höheren Schulen ist weiblich. Trotz besserer Qualifikation haben Frauen aber das Nachsehen.\n\nZu diesem Schluss kommt eine Untersuchung des städtischen Frauenreferats zur Ausbildungssituation von Frauen und Mädchen in Frankfurt. Eine Erklärung für die schlechte Lage von weiblichen Arbeitskräften ist aber auch die Tatsache, dass Frauen nach wie vor für Familie und Kindererziehung auf Karriere verzichten.\n\n2\n\nÜbergewicht könnte erblich, durch Krankheiten, aber auch durch falsche Essgewohnheiten bedingt sein. Psychiater der Universität Florida haben jetzt das schnelle Essen als mögliche Ursache für Fettleibigkeit entdeckt.\n\nDie Wissenschaftler untersuchten, was genau im Hirn bei der Nahrungsaufnahme passiert. Zu diesem Zweck bekamen Testpersonen nach einer zwölfstündigen Fastenzeit eine Zuckerlösung zu trinken.\n\nZuerst zeigte sich verstärkte Gehirntätigkeit, ausgelöst durch Schlucken, Geruch und Geschmack. Dann, zehn Minuten später, signalisierte das Gehirn, dass der Körper genug habe.\n\nBei Menschen, die zu schnell essen, ist dieses Signal stark verzögert. Daher dürfte das Sprichwort „Iss langsam, Kind!“ tatsächlich eine Weisheit sein.\n\n3\n\nWenn Sie mehr über richtige Ernährung und das ideale Gewicht wissen wollen, informieren Sie der „Fonds Gesundes Österreich“ und der Verein für Konsumenteninformation.\n\nUnter 0 810 810 27 werden gratis firmenunabhängige, wissenschaftlich fundierte Informationen über ausgewogene und gesunde Ernährung angeboten.\n\nDie Verantwortlichen reagieren damit auf den erschreckenden Trend, dass die Zahl der dicken Menschen, darunter vor allem Kinder, immer mehr zunimmt.\n\nIn den vergangenen 15 Jahren habe sich die Zahl übergewichtiger Kinder und Jugendlichen mehr als verdoppelt. Bewegungsmangel und fettes Essen seien die Hauptgründe dafür.\n\n4\n\nDas Arbeitsamt Berlin hat seine beiden Informationshefte „Alternative zum Studium“ neu aufgelegt. Auf 200 Seiten zeigt die Behörde neue Ausbildungsmöglichkeiten für junge Frauen und Männer nach der Schule außerhalb der Universitäten.\n\nEin Heft befasst sich mit betriebswirtschaftlichen Ausbildungen bzw. fremdsprachlichen Angeboten im sozialen Bereich, das andere mit dem technisch-naturwissenschaftlichen Bereich.\n\nMit diesen Broschüren geht auch eine Informationsoffensive einher, die die hohe Zahl an Studienbewerbern in Deutschland reduzieren helfen und andere Wege einer guten Berufsausbildung für junge Leute aufzeigen soll.\n\n5\n\nJunge Frauen in der Schweiz sollen nun mehr Chancen für eine offene Berufswahl haben. Mit einer Motivationskampagne wollen die Fachleute zum Umdenken anregen und neue Horizonte öffnen.\n\n„Von wem würden Sie lieber Ihr Auto reparieren lassen?“ oder „Wem vertrauen Sie eher eine Herzoperation an?“, heißt es unter jeweils zwei Porträts einer Frau und eines Mannes. Die Plakate sollen für den „kleinen Unterschied“ im Kopf sensibilisieren, wonach Frauen nicht dasselbe zugetraut wird wie Männern.\n\nImmer noch ergreifen junge Frauen typische Frauenberufe wie Textilverkäuferin oder Sekretärin. Mit einem Internetwettbewerb soll das Thema „Frauen und Technik“ fokussiert werden, im Speziellen der Informationssektor, der in der Schweiz noch ganz in Männerhand ist.", "1.34": "Überschriften\n\na) Eine ungewöhnliche Geschenkidee\n\nb) Gut informiert mit neuer Wetter-App\n\nc) Heftiger Sturm sorgt für Verkehrschaos in Deutschland\n\nd) Junge Erfinder zeigen ihr Können\n\ne) Kostenlose Wetter-Apps sind nicht empfehlenswert\n\nf) Präzise Vorhersage von Stürmen durch neue Messinstrumente\n\ng) Schüler erfinden App und gewinnen Wettbewerb\n\nh) Sturm richtet schwere Schäden an Flughäfen an\n\ni) Vorhersage von Stürmen ist schwierig\n\nj) Warum Tiefs immer weibliche Namen haben\n\n1\n\nKyrill, Friederike, Lothar oder Xaver – all dies sind Namen von Stürmen, die in Deutschland und Europa in den vergangenen Jahrzehnten für Schlagzeilen gesorgt haben. Aber wie kommen Stürme eigentlich zu ihren Namen?\n\nDie Antwort auf diese Frage findet man beim Institut für Meteorologie in Berlin. Hier werden bereits seit 1954 Namen für alle Hoch- und Tiefdruckgebiete vergeben, die das Wetter in Deutschland mitbestimmen. Zunächst hatten alle Tiefs weibliche Namen und alle Hochs männliche. Seit Ende der 90er-Jahre wird abgewechselt: In einigen Jahren tragen die Tiefs männliche Namen, in anderen weibliche.\n\nSeit 2002 haben alle Bürgerinnen und Bürger außerdem eine ganz besondere Möglichkeit: Sie können ein Hoch oder ein Tief „kaufen“, ihm einen Namen geben oder es sogar verschenken. Der Deutsche Wetterdienst und die Medien übernehmen diesen Namen dann und verwenden ihn in den Wetterberichten. So können sie einem lieben Menschen eine originelle Überraschung bereiten oder sich selbst eine Freude machen.\n\n2\n\nDer Jugendwettbewerb „Naturwissenschaft & Technik“ geht in die nächste Runde. Auch in diesem Jahr haben Schülerinnen und Schüler wieder die Möglichkeit, ihre Erfindungen der Öffentlichkeit zu präsentieren.\n\nEine Jury bewertet die Wettbewerbsbeiträge und wählt die fünf besten aus. Auch das Publikum vor Ort darf abstimmen und einen „Publikumsliebling“ wählen. Insgesamt sind Sachpreise im Wert von 3000 Euro zu gewinnen, gesponsert von Unternehmen aus der Region.\n\nTeilnehmen können Schülerteams aller Schularten ab der fünften Klasse. Mit dabei ist diesmal auch ein Team des Thomas-Mann-Gymnasiums in Neustadt. Die Oberstufe hat eine neue Wetter-App entwickelt, mit der sie in diesem Jahr die Jury und das Publikum überzeugen möchte.\n\nDer Schulleiter des Thomas-Mann-Gymnasiums, Bernd Giesinger, ist stolz auf die Schülerinnen und Schüler: „Ich freue mich sehr über das Engagement dieser jungen Menschen, die ihre Zeit und Kreativität nutzen, um unsere gemeinsame Zukunft zu gestalten.“\n\n3\n\nAm gestrigen Abend fegte Sturmtief Charlotte über Deutschland hinweg und legte große Teile des Landes lahm. Mit Spitzengeschwindigkeiten von 140 Kilometern pro Stunde sei Charlotte einer der stärksten Stürme der vergangenen Jahre, sagte Meteorologe Andreas Fischer.\n\nInsbesondere in Hessen, Nordrhein-Westfalen und im Saarland sind wegen umgestürzter Bäume unzählige Straßen und Bahnstrecken blockiert. Viele Züge konnten gestern nicht mehr weiterfahren und Hunderte Bahnreisende saßen zum Teil bis spät in die Nacht auf freier Strecke fest.\n\nIn Hessen wurde der Bahnverkehr zeitweise komplett eingestellt. An den Flughäfen Frankfurt, Düsseldorf und Köln/Bonn kam es zu zahlreichen Verspätungen und Flugausfällen. Ankommende Maschinen wurden teilweise zu anderen Flughäfen umgeleitet.\n\nVon dort gestaltete sich die Weiterfahrt für viele Reisende allerdings ebenfalls sehr schwierig. Die Aufräumarbeiten laufen derzeit auf Hochtouren und werden noch einige Zeit in Anspruch nehmen. Im Moment ist es noch nicht absehbar, wie lange es dauern wird, bis alle Strecken wieder frei sind.\n\n4\n\nSoll ich einen Pullover anziehen oder reicht ein T-Shirt? Muss man einen Schirm mitnehmen oder braucht man eine Sonnenbrille? Jedes Smartphone hat heutzutage eine vorinstallierte Wetter-App, aber genaue Wettervorhersagen liefern die meisten nicht.\n\nEs gibt aber gute Alternativen. Wer einen zuverlässigen Wetterdienst für sein Smartphone oder Tablet sucht, ist mit der neuen App Wetterwissen bestens beraten.\n  Schon in der kostenlosen Version bietet die App umfangreiche Daten zur aktuellen Wetterlage, leicht verständliche Prognosen und Unwetterwarnungen. Der Regenradar zeigt Ihnen genau, wo sich Regenwolken bilden und ob diese in Ihre Richtung ziehen oder nicht.\n\nFür 1,99 Euro gibt es ein Premium-Abo mit zusätzlichen Wetter-Videos und Informationen zu Wintersport und Badewetter. Die App ist in der Premium-Version werbefrei, in der kostenlosen Version wird am unteren Rand Werbung eingeblendet, die viele Nutzer aber nicht als störend wahrnehmen.\n\nDie App punktet außerdem mit einem modernen Design und schafft es damit ganz klar in die Top 10 der Wetter-Apps.\n\n5\n\nZehn Jahre ist es her, dass sich aus einem scheinbar harmlosen Tiefdruckgebiet schnell und überraschend der gefährliche Sturm Tinka entwickelte, der in Norddeutschland immense Schäden anrichtete und als einer der teuersten Stürme in die Geschichte einging.\n\nDen Wetterdiensten wurde damals vorgeworfen, die Entwicklung des Tiefdruckgebietes nicht richtig berechnet und die Bevölkerung nicht rechtzeitig gewarnt zu haben.\n\nObwohl die Messinstrumente immer präziser geworden sind, lassen sich manche Wetterereignisse wie zum Beispiel Gewitter und Stürme nur schwer vorhersagen. Ein Sturm kann von vielen Faktoren abhängig sein und entwickelt sich oft kurzfristig. Daher kann es passieren, dass die Prognosen völlig verschieden ausfallen, manchmal sogar auch ganz falsch sind.\n\nUm dies zu vermeiden, vergleichen Meteorologen möglichst viele Wetterlagen. Je mehr Übereinstimmungen es gibt, desto wahrscheinlicher ist es, dass ihre Prognose zutrifft.\n\nMit einer Trefferquote von etwa 80 Prozent kann die Entwicklung eines Sturms inzwischen auch recht gut eingeschätzt werden – aber eben nicht zu 100 Prozent.", "1.35": "Überschriften\n\na) Jeder kann Netzreporter werden\n\nb) Historisches Wissen ohne Mühe\n\nc) Hotels online vermarkten\n\nd) Sprachen lernen per Computer\n\ne) Neues Hotelangebot spart Geschäftsleuten Zeit\n\nf) Verschenken Sie Ihr Geld nicht an den Staat!\n\ng) Neuer Computerkurs an der Volkshochschule\n\nh) Elektronischer Weg aus dem Steuerlabyrinth\n\ni) Onlinebibliothek für Referate und Kurznachrichten\n\nj) Pädagogen gegen Internetdienste\n\n1\n\n„Auf meinen elektronischen Steuerberater kann ich mich hundertprozentig verlassen“, erklärt Rainer Wüst, Inhaber einer kleinen Elektronikfirma in Hamburg. Die Steuererstattung, die er für das vergangene Jahr vom Finanzamt erhielt, stimmte völlig mit dem überein, was sein Steuersparprogramm ausgerechnet hatte.\n\nImmer mehr Deutsche sparen sich den teuren Gang zum Steuerberater und setzen auf Computerprogramme. Die Vorteile liegen auf der Hand: Am heimischen Rechner lassen sich alle steuerrelevanten Daten bequem in die richtigen Formulare eingeben und per Internet an das Finanzamt schicken.\n\nDas Programm fragt nach wichtigen Zahlen, kennt Steuerspartipps und hilft zuverlässig durch den Steuerdschungel – ohne Terminabsprachen und langwierige Sitzungen beim Steuerberater, wie das früher üblich war.\n\nIn einigen Fällen muss man aber trotzdem noch Belege und andere Unterlagen beim Finanzamt einreichen – und zwar per herkömmlicher Post.\n\n2\n\nKundenberaterin Sabine E. ist ständig auf Achse. Als Repräsentantin einer großen Plastikgeschirrfirma für Süddeutschland besucht sie Messen, Ausstellungen und Kunden, um den Verkauf anzukurbeln. Heute München, morgen Stuttgart, übermorgen Mainz – Sabine E. ist an das Leben einer modernen Geschäftsfrau gewöhnt.\n\nUmso mehr schätzt sie den Service, den eine immer größere Zahl an Hotels Geschäftsreisenden wie ihr anbieten: das Hotelzimmer mit komplettem Büroservice. Dem Hotelgast stehen nicht nur Internetzugang und Telefon kostenlos zur Verfügung, er kann auch Kopien in Auftrag geben, Dokumente ausdrucken lassen oder schnell noch vom Zimmer aus ein Fax verschicken.\n\n„Für mich hat das viele Vorteile“, sagt Frau E. „Meine Aufträge und Abrechnungen kann ich jetzt oft schon während meiner Kundentermine in mein Notebook eintippen und dann am Abend per E-Mail versenden. Unterlagen kann ich auch zwischendurch ausdrucken und Verträge unterschreiben und verschicken. Das spart mir viel Zeit, die ich jetzt dafür nutze, um auch mal abends auszugehen und die Gastronomie der Stadt, in der ich mich gerade befinde, kennenzulernen.“\n\n3\n\nEin Referat für den Geschichtsunterricht über Karl den Großen zur nächsten Woche – kein Problem. Mussten sich Schüler früher durch Berge von Sachbüchern kämpfen, Lexika wälzen und die Nachmittage in den Lesesälen der Bibliotheken verbringen, genügt heute ein Mausklick auf die Webseite eines Onlinediensts, der kostenlos oder für wenig Geld für Schüler fertige Referate zu fast jedem Thema liefert.\n\nStatt im staubigen Bibliothekssaal zu sitzen, entspannt sich der Schüler von heute im Schwimmbad vom Schulstress. Und trägt im Unterricht ein Referat vor, von dem er oft nicht einmal das Thema geschweige denn Details kennt, was spätestens bei Nachfragen der Lehrer schließlich auffällt.\n\nDie Praxis, fertige Referate per Internet anzubieten, stößt bei Lehrern und Schulpolitikern auf Kritik. Sie fordern deshalb einhellig Maßnahmen gegen die Anbieter, die zwar Schülern die Arbeit abnehmen, aber nichts zur Wissensvermittlung beitragen.\n\n4\n\nWer könnte interessantere Meldungen aus allen Ecken des World Wide Web liefern als die Internetnutzer selbst? Deshalb sind auf vielen Nachrichtenportalen keine Nachrichtenprofis am Werk, sondern ganz normale Surfer, die selbst zu Onlinereportern werden.\n\nDas Prinzip solcher Seiten ist genial einfach: Wer irgendwo im Netz eine Meldung aufspürt, die auch andere Surfer interessieren könnte, schreibt eine kurze Zusammenfassung und reicht diese einfach ein. Dort wird dann vom Betreiber nur geprüft, ob der angegebene Link, also die Fundstelle im Netz, auch funktioniert und die Quelle seriös ist.\n  Auf diese Weise können Falschmeldungen aussortiert werden. Nach erfolgreicher Prüfung wird aus dem Internetfundstück auch schon eine Nachricht. Wer die Meldungen liest, kann dann selbst an der Quelle überprüfen, ob er den Informationen vertraut.\n\n5\n\nZu Beginn des Englischkurses fragt Verena Baum ihre Mitlernenden nach ihren Namen, wie es in einem Sprachkurs eben üblich ist. Doch stellt auf einem harten Schulstuhl sitzt sie ganz bequem auf ihrem körpergerechten Schreibtischstuhl zu Hause vor ihrem PC.\n\nVor zwei Jahren startete eine Sprachenschule vor den Toren Frankfurts am Main auf Initiative einer pfiffigen Kursleiterin ein Pilotprojekt: „Überall Englisch“.\n\nDie Lernenden eignen sich ihre Sprachkenntnisse über ein Computerprogramm an, das extra für dieses Projekt entwickelt wurde. Per Internet treten sie in Dialog mit den anderen Kursteilnehmern und üben und kommunizieren gemeinsam auf Englisch.\n\nAlle sechs bis acht Wochen trifft man sich aber nach Möglichkeit an der Schule zum Austausch, zur Lernkontrolle und natürlich, um die Fragen zu beantworten, auf die der PC keine persönliche Antwort wusste.\n\nFür Verena Baum und die meisten anderen Teilnehmer an „Überall Englisch“ war es zuerst ungewohnt, sich nicht in einem Kursraum zu treffen. Aber: „Das war eine tolle Erfahrung, und das Lernen hat großen Spaß gemacht.“", "1.36": "Überschriften\n\na) Beispiel Rhön: Das Land nutzen und die Natur erhalten\n\nb) Unser Tipp: Goethes Kochbuch\n\nc) Ältere Männer verlieren Kraft und Dynamik\n\nd) Beispiel Nordsee: Immer mehr einsame Menschen im Urlaub\n\ne) Rhön-Verein bildet Bauern aus\n\nf) Andere Stimme ab 70?\n\ng) Unser Gesundheits-Tipp: Nordsee!\n\nh) Tennis für Anfänger\n\ni) Sport-Empfehlung: Schwimmen, Gehen, Radfahren\n\nj) Kochen und Reisen in Deutschland\n\n1\n\nWer sportlich aktiv sein möchte, fragt sich zu Beginn oft, welche Sportart und welches Trainingspensum wohl richtig sind. Hier eine Empfehlung von Sporttherapeuten:\n\nDas ideale Trainingspensum besteht aus drei sportlichen Aktivitäten pro Woche, zwei „trockenen“ (z. B. Radfahren) und einer „nassen“ (Schwimmen).\n\nFür die Wahl der Sportarten gilt folgendes: Verzichten Sie als Anfänger auf Tennis und Squash, denn die schnellen, abrupten Bewegungen belasten Gelenke und Bänder sehr.\n\nWalking (zügiges Gehen), Radfahren und Schwimmen hingegen sind sehr empfehlenswerte Sportarten.\n\n2\n\nKöstliches Deutschland (Südwest, 192 S., 19,50 Euro) – ein Buch, das zum Kochen und zum Reisen animieren will.\n\nDer Autor Udo Eckert hat sich Goethes Motto „Warum denn in die Ferne schweifen…“ zu eigen gemacht und sich auf einen kulinarischen Streifzug durch deutsche Regionen gemacht.\n\nDas Buch ist Bildband, solides Kochbuch und praktischer Gourmetführer gleichermaßen.\n\n3\n\nBehutsame Landnutzung im Einklang mit der Natur hat die einmalige Landschaft der Rhön geschaffen.\n\nWenn Sie mehr darüber wissen wollen, schreiben Sie uns oder schicken Sie uns diese Anzeige!\n\nNatur- und Lebensraum Rhön e.V.\nGeorg-Meilinger-Str. 3,\nD-36115 Ehrenberg-Wüstensachsen\n\n4\n\nAllein in Saltzfurt, Sonne und Seewind bekommen Körper und Seele Auftrieb. Nordsee – ein Klima, einzigartig und wie geschaffen für Gesundheit: mal sanft, mal rau.\n\nAuf jeden Fall belebend. Und eine Kur gibt zusätzlich Impulse. Mit den elementarsten Heilkräften der Natur.\n\nSternstunden der Gesundheit.\n\n5\n\nDass die Stimme – vornehmlich von Männern – im Alter oft rauer klingt, liegt an altersbedingten Umbildungen des Stimmapparats im Kehlkopf.\n\nDie veränderte Stimme der Betroffenen verliert dadurch an Kraft und Dynamik und kann sich dann ungewohnt heiser oder rau anhören.\n\nDoch vor dem 70. Lebensjahr ist mit dieser natürlichen Stimmveränderung nicht zu rechnen.\n  Das Internet macht’s möglich: Tauschplattformen für Dinge, Wohnungen oder private Autos ermöglichen es, schnell und unkompliziert denjenigen zu finden, der (oder die) das hat, was ich brauche.\n\nMit der Verbreitung digitaler Leih-, Miet- und Tauschmodelle entstehen neue Geschäftsformen, die sich auf einer neuen „Währung“ gründen: Vertrauen.\n\nDas heißt, dass der andere meine Dinge gut behandelt und mich nicht hinters Licht führt, obwohl ich den anderen noch nie gesehen habe.\n\n5\n\nWarum den teuren Zug oder Flieger nehmen, wenn es doch per Anhalter viel günstiger geht? Besonders junge Leute heben gerne den Daumen, um von A nach B zu kommen.\n\nBeim Autostoppen sollte man jedoch einige gesetzliche Regeln kennen. In Österreich ist Autostoppen auf Autobahnen oder Autostraßen generell und unabhängig vom Alter verboten.\n\nAuf Autobahn-Parkplätzen, Raststationen und an allen anderen Straßen ist an übersichtlichen Stellen das Autostoppen erlaubt.\n\nEs gilt jedoch, bundeslandspezifische Altersbestimmungen zu beachten. In Kärnten und Vorarlberg ist das Autostoppen unter 14, in der Steiermark unter 15 Jahren verboten.\n\nWer im Ausland autostoppen will, sollte sich vorab mit rechtlichen Bestimmungen und landesüblichen Gewohnheiten vertraut machen.\n\nBeispielsweise setzen Autofahrer in manchen Ländern wie Rumänien, Indien und Mexiko eine Bezahlung voraus. In den USA, Kanada oder Australien kommt es auf den jeweiligen Bundesstaat an, ob Autostoppen erlaubt ist.\n\nIn vielen afrikanischen Ländern wiederum ist Trampen selbstverständlich und ersetzt die oftmals fehlenden öffentlichen Verkehrsmittel.", "1.37": "Überschriften\n\na) Daumen hoch – aber gewusst wie!\n\nb) Durch die Städte Osteuropas. Viel zu sehen für wenig Geld!\n\nc) Was rastet, das rostet: Tipps für Stillstand und Bewegung.\n\nd) Vom eigenen Wagen zum Car-Sharing. Autofahren damals und heute.\n\ne) Tausch dich aus! Autos, Werkzeuge, Geräte & Co gemeinsam benützen.\n\nf) Mein rechter Platz ist frei… Wie berechenbar sind Mitfahrgelegenheiten?\n\ng) Die 5 Gefahren des Autostoppens.\n\nh) Preiswert durch die Welt – Reisearten im Vergleich.\n\ni) Urlaub zu Hause, Urlaub bei Fremden? Oder: Auf dem Sofa durch die Welt.\n\nj) Fast geschenkt: Autos, die man sich leisten kann.\n\n1\n\nWie wäre es, bei wildfremden Menschen einzuziehen und während der eigenen Reise dort zu übernachten? Wer nach unmittelbarer Bekanntschaft mit dem Reiseziel und seinen Gepflogenheiten lechzt, betreibt heute Couchsurfing.\n\nPrivate Gastgeber auf allen Kontinenten bieten im Internet eine Schlafgelegenheit an. Geben und Nehmen heißt das Prinzip des neuen Reisetrends: Wer bereits eine Couch in New York in Anspruch genommen hat, kann auch sein Sofa in St. Pölten für andere Touristen anbieten.\n\nSechs Millionen Menschen weltweit wissen, wie sich so etwas anfühlt, denn sie sind alle Mitglieder bei Couchsurfing.org, dem größten Online-Portal zur Vermittlung von kostenlosen Übernachtungsmöglichkeiten.\n\nHier suchen Abenteuerlustige nach privaten Übernachtungsmöglichkeiten aus aller Welt. In über 100.000 Städten sind Couchsurfer angemeldet und dementsprechend ist die Wahrscheinlichkeit recht hoch, im Urlaub als Gast bei Fremden einzuziehen.\n\nDoch genau diesen Begriff vermeidet man auf der Homepage galant, aber bestimmt. Von „Fremden“ ist hier nicht die Rede, vielmehr von „Freunden, die du noch nicht getroffen hast“.\n\n2\n\nDarauf, zu einem Wildfremden ins Auto zu steigen, basiert die Geschäftsidee von Mitfahrplattformen im Internet. Ihr Prinzip: Wer mit dem Auto von A nach B fahren will und noch Plätze frei hat, sucht online oder via App nach Mitfahrern, um sein Auto zu füllen und sich die Benzinkosten zu teilen.\n\nDas dürfte funktionieren, denn solche Websites gibt es mittlerweile zuhauf.\n\nNeu sind Mitfahrbörsen nicht: Schon in den 1950ern wurde in Frankfurt am Main – ganz und gar offline – eine Mitfahrzentrale gegründet. Eigentlich wie Autostoppen, nur besser planbar.\n\nMit dem Internet wurde die Organisation dann noch leichter. Heute weiß man vorab schon eine ganze Menge über die potenziellen Chauffeure: Sie haben Profile, auf denen sie nicht nur sich selbst, sondern auch ihr Auto präsentieren. Auch eine Ausweiskopie kann dem Profil beigefügt werden.\n\n3\n\nLanges Stehen tut selten gut, das gilt auch für Autos. Bei wenig genutzten Fahrzeugen kann unter anderem Rost an Blech und Bremsen entstehen.\n\nDamit der Wagen nach längerer Standzeit nicht nur anspringt, sondern auch verlässlich läuft, ist Vorsorge nötig. Früher wurde empfohlen, das Auto vollzutanken, damit kein Rost im Tank entsteht. Dieser Ratschlag erübrigt sich schon seit längerer Zeit, denn seit Mitte der 80er Jahre haben Autos meist einen Kunststofftank.\n\nWährend es bei älteren Autos empfehlenswert sein kann, die Batterie auszubauen, verursache dies bei neueren Modellen häufig Probleme mit der Elektronik.\n\nBesonders wichtig ist eine geeignete Unterstellmöglichkeit. Wenn es ein teures Fahrzeug ist, sollten Sie überlegen, einen Stellplatz zu mieten.\n\nDie Fachleute raten außerdem dazu, etwas mehr Luft in die Reifen zu pumpen, weil schon die Temperaturunterschiede den Druck deutlich sinken lassen können.\n\nDamit der Wagen in Form bleibt, gilt aber eigentlich das Motto „Fahren, fahren, fahren“.\n\n4\n\nEs gibt einen neuen Trend, der nicht nur in Deutschland, sondern weltweit Einzug hält: „Nutzen statt Besitzen“ lautet er und umfasst so unterschiedliche Praktiken wie Wohnungstausch, Kleidertauschpartys, Autogemeinschaften, Gemeinschaftsgärten, Tauschringe für Werkzeuge, Drucker oder DVDs und vieles andere mehr.", "1.38": "Überschriften\n\na) Für unterwegs: Leckereien im Zugrestaurant\n\nb) In der Stadt der warmen Quellen\n\nc) Irrtum: Süßes macht doch nicht glücklich\n\nd) Mitmach-Museum: Bonbons selbst herstellen\n\ne) Naschen statt wegwerfen\n\nf) Neues Thermalbad in Rom\n\ng) Reisen: Die beliebtesten Thermalbäder\n\nh) Süßwaren mit langer Tradition\n\ni) Wasser, Wärme, Wellness – antike Badefreuden\n\nj) Zucker sorgt für Stimmungshoch\n\n1\n\nBonbons machen Kinder glücklich, und zwar nicht erst seit gestern: Denn diese beliebte Süßigkeit ist viel älter, als man allgemein vermuten würde. Schon vor über 1 000 Jahren gab es im antiken China, in Griechenland und im Römischen Reich Süßwaren aus Honig, Blüten und Früchten.\n\nWer noch mehr über Bonbons erfahren möchte, sollte einen Ausflug nach Vaihingen an der Enz unternehmen: Dort gibt es nicht nur seit 1828 die Bonbon- und Zuckerwarenfabrik Jung, sondern auch das einzige Bonbon-Museum Deutschlands.\n\nAuf 300 Quadratmetern Ausstellungsfläche findet sich Antwort auf viele bunte Fragen: Man erfährt dort etwa, woher Bonbons kommen, wie sie ihre heutige Form erhielten und wie sie überhaupt hergestellt werden. Gezeigt werden auch Bonbondosen, Bonbon-Maschinen und Werbemittel. Beim Rundgang durch das Museum übernehmen kleine und große Besucher echte Teile aus den frühen Herstellungsstätten und verfolgen die Entwicklung der Fabrikproduktion unserer Zeit.\n\n2\n\nAm Frankfurter Hauptbahnhof können Reisende beim Warten auf den Zug noch schnell einen besonderen Snack genießen. Denn am Bahnhof steht jetzt ein Ret-o-mat: ein Automat, an dem abgelaufene Schokoriegel, Chips, Nüsse und andere Lebensmittel verkauft werden.\n\nDas Mindesthaltbarkeitsdatum der Produkte ist in den meisten Fällen fast abgelaufen, daher werden sie günstiger angeboten als im Handel. Auch Getränke hält der Automat bereit.\n\nDie Produkte sind überschüssig beziehungsweise stehen kurz vor oder nach dem Ablauf des Mindesthaltbarkeitsdatums, sind aber trotzdem noch gut, erklärt ein Sprecher der Deutschen Bahn. Denn sie werden natürlich sorgfältig geprüft.\n\nMit dem neuen Service wolle der Konzern den Bahnhof noch attraktiver machen und so Ressourcen schützen. Fahrgäste sollen die Möglichkeit erhalten, sich mit Süßigkeiten und Knabbereien zu versorgen und gleichzeitig etwas gegen die Lebensmittelverschwendung zu tun.\n\nAußerdem können Vorbeigehende und Reisende bei einer kleinen Probiergabe, die darauf aufmerksam macht, dass viele Lebensmittel weggeworfen werden, aufgeklärt werden.\n\n3\n\nWo heißes Wasser aus der Erde sprudelt, hat sich vielerorts das Bäder- und Kurwesen gut entwickelt. Schon im alten Rom wusste man, dass ein Bad im warmen Wasser wohltuend ist und gegen Alltagsstress, Verspannungen und Ermüdung wirkt.\n\nBadeeinrichtungen gab es überall im Römischen Reich. Gegen eine geringe Eintrittsgebühr konnte jeder, egal welcher Erhebung seiner in der gesellschaftlichen Rangordnung, Anlagen genießen; diese boten Platz für bis zu 1000 Menschen.\n\nVon ähnlichen Bauten und der speziellen Architektur konnten viele europäische Städte profitieren und Badelux kopieren. Möglichst prachtvoll wurden sie gebaut, sollten eindrucksvoll sein, und wertvolle Mosaik- und Marmorböden, mehrere Badebecken sowie Räume für Schwitz- und Dampfbäder machten sie zu gesellschaftlichen Begegnungsorten.\n\nDoch die besonderen Freizeiteinrichtungen spielten auch im gesellschaftlichen Leben eine Rolle: Denn das Gesuchte für das Auge verbandet sich hier überall auch mit einer angenehmen Atmosphäre, wo die ein Besuch in einer Therme zu einem beliebten Freizeitziel in vielerlei Art.\n\nMit den veränderten demokratischen Bedürfnissen wurde die römische Bauweise erhalten, aber die Grenze etwas reduziert.\n\n4\n\nNicht nur in Hollywoodfilmen tröstet man sich bei Liebeskummer mit Pralinen: Der Griff zu Süßigkeiten ist überall weit verbreitet. Viele glauben, dass sie die Stimmung aufhellen, die Konzentration verbessern oder gegen „Nachmittagstiefs“ im Büro helfen.\n\nDoch damit liegen sie womöglich falsch. Denn Wissenschaftler haben nun genauer erforscht, wie Zucker auf unser Gemüt wirkt.\n  In ihrer Studie stellten sie praktisch keinen positiven Einfluss des Zuckerkonsums auf die Laune fest – im Gegenteil.\n\nDie Idee, dass Zucker die Stimmung heben kann, ist auf der ganzen Welt verbreitet, sagt Konstantin Grü-ßer von der Humboldt-Universität in Berlin. „Unser Ergebnis bietet jedoch eigentlich keinen Anhaltspunkt dafür.“\n\nViele wissen überhaupt, „denn sorgt Zucker dafür, dass wir uns schlechter fühlen“. Die Auswertung deutet darauf hin, dass Probanden nach Zuckerkonsum müder und unkonzentrierter waren als jene, die nur ein Placebo bekommen hatten.\n\n5\n\nWellness und der Besuch von Kurorten und Thermalbädern haben seit Jahrhunderten Tradition in Ungarn. Das Land besitzt zwar keinen direkten Zugang zum Meer, aber dafür wimmelt es in diesem Binnenstaat nur so von Thermalquellen.\n\nDabei handelt es sich um Quellen, aus denen Grundwasser austritt, das über 20 Grad warm ist. Dieses Wasser enthält Mineralstoffe, denen eine positive Wirkung auf den Organismus zugeschrieben wird.\n\n123 Thermalquellen finden sich allein in Budapest, das berühmt für seine Bäder ist. Diese Stadt ist damit nicht nur das einzige Kurbad, das zugleich die Hauptstadt eines Landes ist, sondern auch die größte Kurstadt Europas.\n\nIn Budapest kann man zwischen über 20 Bädern wählen. Viele sind Bauten von beträchtlichem historischem und architektonischem Rang. Obwohl Budapest auch eine ausgeprägte Café-Kultur besitzt, sind die Bäder für die Stadtbewohner wichtige Treffpunkte – denn oft verabreden sich Freunde in einem Bad.", "1.39": "Überschriften\n\nA. Bewegung macht gute Laune\n\nB. Klug durch Schlaf\n\nC. Licht aus – Energiesparen im Klassenzimmer\n\nD. Professor fordert kürzere Arbeitszeiten\n\nE. Richtiges Licht fördert das Lernen\n\nF. Sind Frühaufsteher intelligenter?\n\nG. Tiere im Energiesparmodus\n\nH. Wandern im Dunkeln – Tipps für Nachtwanderungen\n\nI. Warum Menschen keinen Winterschlaf halten\n\nJ. Was hinter unserer Wintermüdigkeit steckt\n\n1\n\nIm Winter ziehen sich viele Tiere in den Winterschlaf zurück, um Energie zu sparen. Während dieser Zeit wird ihr Stoffwechsel langsamer, und ihre Körpertemperatur sinkt. Dies hilft ihnen, über einen längeren Zeitraum ohne Nahrung auszukommen. Beispiele für Tiere, die Winterschlaf halten, sind Igel, Fledermäuse und Murmeltiere.\n\n2\n\nLaut einer Studie der Universität Leipzig fördert natürliches Licht die Lernfähigkeit von Schülern. Klassenzimmer mit viel Tageslicht sorgen dafür, dass die Schüler aufmerksamer und konzentrierter sind. Die Forscher stellten außerdem fest, dass ausreichend Licht die Stimmung hebt und das Lernklima verbessert.\n\n3\n\nEin regelmäßiger Schlafrhythmus ist wichtig für die Gesundheit. Während des Schlafs produziert unser Körper das Hormon Melatonin, das den Schlaf-Wach-Rhythmus reguliert. Melatonin unterstützt den Körper dabei, sich zu entspannen, und sorgt für eine erholsame Nacht. Ein gestörter Schlafrhythmus kann jedoch zu Gesundheitsproblemen führen.\n\n4\n\nIn den letzten Jahren ist das nächtliche Wandern in der Natur zu einer beliebten Freizeitaktivität geworden. Gesundheitsexperten empfehlen, diese Praxis nicht zu verbieten, da sie positive Auswirkungen auf die körperliche und geistige Gesundheit hat.\n\nNachts zu wandern hilft, Stress abzubauen, die Sinne zu schärfen und die Verbindung zur Natur zu stärken. Zudem fördert es die Produktion von Melatonin, das den Schlaf-Wach-Rhythmus reguliert und bei Schlafproblemen hilft.\n\nExperten betonen, dass diese Bewegung besonders wohltuend ist, solange sie sicher und in geeigneten Bedingungen stattfindet.\n\n5\n\nProfessor Dr. Thoma Münch von der Universität Freiburg führte eine Studie durch, die den Zusammenhang zwischen Arbeitszeiten, Tageslicht und der Gesundheit von Arbeitnehmern untersuchte.\n\nDie Ergebnisse zeigten, dass Menschen, die ihre Arbeitszeiten besser an den natürlichen Sonnenrhythmus anpassen, weniger unter Schlafstörungen und chronischer Müdigkeit leiden. Außerdem trägt der tägliche Fußweg zur Arbeit, besonders bei Tageslicht, nicht nur zur körperlichen Gesundheit bei, sondern verbessert auch die psychische Verfassung.\n\nDer Kontakt mit natürlichem Licht reguliert den Hormonhaushalt, insbesondere die Produktion von Melatonin und Serotonin, was entscheidend für das Wohlbefinden ist.", "1.40": "Überschriften\n\nA. Anzahl und Rolle der Arten noch unklar\n\nB. Veränderte Wanderwege von Zugvögeln\n\nC. Wetterbedingungen könnten den Zerfall von Hochkulturen beschleunigt haben\n\nD. Klimawandel erschwerte die Evolution\n\nE. Optimistische Projekte, um das Artensterben aufzuhalten\n\nF. Störungen des biologischen Rhythmus von Zugvögeln\n\nG. Der Mensch ist am Aussterben von Tierarten schuld\n\nH. Keine neuen Erkenntnisse über den Niedergang der Hochkultur\n\nI. Evolution durch klimatische Veränderungen begünstigt\n\nJ. Neue Studie belegt Verwandtschaft zwischen Säugetieren\n\n1\n\nDie zunehmende Klimaveränderung macht sich bereits in der Tierwelt bemerkbar. So müssen Zugvögel ihre Eier früher legen, um sich an die wärmeren Frühjahrstemperaturen in ihren gewohnten Brutregionen anzupassen.\n\nBei bestimmten Arten ist das Zugverhalten aber nicht nur abhängig vom Klima, sondern auch von anderen Reizen, wie zum Beispiel der Länge des Tages. Diesen Vogelarten fällt es besonders schwer, die Eiablage an die geänderten klimatischen Bedingungen anzupassen.\n\nZugvögel, die eine besonders lange Strecke zwischen ihren Überwinterungsplätzen und den Brutstätten zurücklegen müssen, sind durch das Zusammenspiel von Temperaturänderung und anderen, unveränderten Außenbedingungen besonders leicht zu verwirren.\n\nDenn der Zeitpunkt für den Abflug aus den Überwinterungsregionen wird von Einflüssen bestimmt, die nichts mit der Temperatur zu tun haben. Einige Auslöser für die Wanderung sind auch genetisch bedingt. Die Tiere kehren in der Regel dann zurück, wenn es die meisten Insekten als Nahrung für ihren Nachwuchs gibt.\n\n2\n\nDas Klima hatte einen entscheidenden Einfluss auf die Entwicklung des Menschen, vermuten Wissenschaftler. Sie stellten einen Klimakalender des Menschen zusammen, demzufolge fünf dramatische Klimaänderungen zur Evolution des Menschen beigetragen haben.\n\nDie Klimawandlungen hätten diese drastisch beschleunigt. Die Notwendigkeit, sich an neue Umstände anzupassen, habe die Entwicklung des Gehirns beschleunigt und zum aufrechten Gang beigetragen.\n\nAuch die Entwicklung von verschiedenen Arbeitsgeräten sei teilweise durch den Klimawandel bedingt, denn die Veränderungen der Umweltbedingungen fielen zeitlich mit dem Erscheinen der ersten Vorfahren des Menschen in den betroffenen Gebieten zusammen.\n\nSucht man nach einem Merkmal, das den Menschen vom Tierreich abhebt, so ist das vermutlich eine außerordentliche Unabhängigkeit gegenüber den Launen der Natur. Einer Hypothese zufolge war es das stetig wechselnde Klima, das den Mensch zum Menschen machte.\n\nDie ungewöhnlich und sich ändernden Lebensbedingungen seien demnach während der letzten sechs Millionen Jahre der entscheidende Faktor in der Evolution des Menschen gewesen.\n\n3\n\nFast dreizehn Jahrhunderte lang blühte die Hochkultur der Maya, bis es zu ihrem Zusammenbruch kam. Fachleute diskutieren seit Jahrzehnten, was den plötzlichen Kollaps auslöste: Kriege, Hunger oder das Klima?\n\nEine neue Studie spricht für Letzteres: Anhaltende Trockenheit führte demnach zu Untergang – zumindest indirekt. Rund um Christi Geburt entwickelte sich im Süden und Südosten Mexikos sowie in Teilen von Guatemala, Belize und Honduras die Hochkultur der Maya.\n\nIn ihren Inschriften sind Kriege, Hochzeiten und Thronfolgen exakt festgehalten. Das Ende dieser Aufzeichnungen markiert auch den Beginn des Niedergangs: Zwischen dem 8. und dem 10. Jahrhundert wurden viele Städte aufgegeben und die Bevölkerung ging drastisch zurück.\n\nFür diesen Kollaps gibt es heute mehrere Erklärungen: Lange Zeit vermutete man vor allem blutige Auseinandersetzungen, Invasionen und soziale Konflikte dahinter, auch Epidemien und Naturkatastrophen standen als mögliche Auslöser zur Diskussion.\n\nErst in den letzten zwanzig Jahren mehren sich die Stimmen, dass eine Veränderung des Klimas die Triebfeder für den Untergang der Hochkultur gewesen sein könnte.\n\n4\n\nExperten nehmen an, dass Tag für Tag rund 100 Tierarten aussterben.\n  Sie gehen davon aus, dass innerhalb der nächsten 20 Jahre weltweit ein Viertel aller bislang bekannten Arten ausgestorben sein wird.\n\nDer Mensch treibt dieses Artensterben stark voran: Die Zerstörung von natürlichem Lebensraum, Umweltverschmutzung und Krankheiten gefährden Tiere und Pflanzen.\n\nOhne das Einwirken des Menschen auf die verschiedenen Ökosysteme der ganzen Welt würden pro Jahr höchstens 25 Arten aussterben. Neben dem eigentlichen Verlust der jeweiligen Art hat das Aussterben der Tiere Folgen für das gesamte Ökosystem: Sein natürliches Gleichgewicht wird gestört. Wenn eine Art stirbt, sterben auch andere abhängige Arten.\n\n5\n\nWie eng eine Art mit ihrem Lebensraum verbunden ist, zeigt sich oft erst, wenn sie nicht mehr da ist. War sie ein wichtiges Glied in der Nahrungskette, dann verschwinden plötzlich auch andere Lebewesen.\n\nDarüber, wie viele Arten es überhaupt gibt, gibt es unterschiedliche Schätzungen. Wissenschaftler gehen jedoch davon aus, dass der größte Teil noch gar nicht entdeckt ist.\n\nDas jetzige Tempo vorausgesetzt, würde es noch mehrere hundert Jahre dauern, bis alle Arten beschrieben sind. Wir kennen nur knapp zwei Millionen von geschätzten 30 Millionen Arten.\n\nVon sehr vielen Arten wissen wir nichts über ihre Rolle im Ökosystem – und schon gar nicht, in welcher Weise sie für den Menschen nützlich sein könnten. Aber immer mehr Lebensräume und damit Artenbestände werden ausgelöscht. Die Vereinten Nationen schätzen, dass täglich 130 Tier- und Pflanzenarten aussterben.", "1.42": "Überschriften\n\nA. Experte sagt Wohnungsnot in Städten voraus\n\nB. Selbstbestimmtes Leben im Alter für viele zu teuer\n\nC. Wie man zusätzlichen Wohnraum nutzen kann\n\nD. Hausbesitz schränkt in der Mobilität ein\n\nE. Wohnentwürfe so divers wie die Menschen\n\nF. Ansprüche an Wohnfläche altersabhängig\n\nG. Neuer Trend könnte für Steigerung der Einwohnerzahl sorgen\n\nH. Für leistbares Wohnen werden lange Wartezeiten akzeptiert\n\nI. Landleben gibt neue Energie\n\nJ. Wohnbedürfnisse der Jugend bisher vernachlässigt\n\n1\n\nWer im Alter nicht mehr alleine ein eigenständiges und selbstbestimmtes Leben führen möchte, begibt sich in Österreich meist professionell auf die Suche nach einer entsprechenden Unterkunft. Konventionell geführte Einrichtungen und -residenzen haben allerdings den Nachteil, dass die dort geltenden Regeln Bewohner einschränken und diesen außerdem Gebote oder Verbote auferlegt werden.\n\nFür viele Ältere beziehungsweise deren unmittelbare Angehörige ist zudem finanzielle Leistbarkeit ein ausschlaggebendes Thema, denn die durchschnittliche Pension erlaubt allzu hohe Ausgaben nicht. Eine günstigere Alternative bietet nun ein neues, aus einer Kooperation entstandenes Modell.\n\n2\n\nAls junger Mensch in Wien auf Wohnungssuche zu sein, ist allenfalls eine große Herausforderung. Wer ein Studium an der Universität oder Fachhochschule aufnimmt oder gerade einen Ausbildungsplatz in der Hauptstadt Österreichs erhalten hat, dem fehlen allzu oft die finanziellen Mittel, um ein halbwegs annehmbares Quartier zu finden.\n\nDie anfänglichen Kosten, die bereits vor dem Einzug in die neue Wohnung fällig sind, können durch die geforderte Kaution von meist drei Bruttomonatsmieten sowie die Vermittlungsgebühren für Maklerbüros enorm hoch werden.\n\nUm eine günstige Gemeindewohnung beantragen zu können, muss man bereits mehrere Jahre in Wien hauptgemeldet sein, und auch dann ist Geduld ungebracht. Bei einer Anmeldung sind zudem gleich alle Suchkriterien festzulegen, also etwa Wunschbezirk und Quadratmeteranzahl.\n\nFür jene, die gerade die ersten selbstständigen Schritte tun, lässt sich allerdings die Zukunft kaum so genau vorausplanen, Gemeindewohnungen sind daher meist keine Option. Die Stadt Wien will nun in den kommenden Jahren zunehmend Wohnprojekte mit flexiblen Vertragsbedingungen und kurzen Kündigungsfristen fördern und sich damit stärker an der Situation junger Leute orientieren.\n\n3\n\nWohnen wie immer? Laut Ansicht des renommierten Zukunftsforschers Adrian Gregorius wird sich innerhalb der nächsten paar Jahrzehnte ein Wandel in unserer Wohnkultur vollziehen, der durch die Bevölkerungszunahme in den Städten bedingt wird.\n\nDie Konzentration eines großen Anteils der Bevölkerung im Stadtgebiet sieht Gregorius – im deutlich wahrnehmbaren Gegensatz zum ungebremsten Landschaftsverbrauch in den umliegenden Regionen – jedoch keineswegs grundsätzlich als Problem.\n\nVielmehr sei das Leben in der Stadt, wenn es richtig geplant und umgesetzt werde, sowohl ressourcen- als auch energieschonend. Des Weiteren entfalle der klimaschädliche und stressige Berufsverkehr und eine private Autonutzung werde weitgehend überflüssig, da die gesamte städtische Infrastruktur vor Ort zur Verfügung stehe.\n\nNicht nur die Dichte, sondern auch die veränderten Gesellschaftsstrukturen werden es daher erforderlich machen, das Konzept des Wohnens in privaten und flexibel gemeinschaftlich nutzbaren Räumen adäquat anzupassen und Naturflächen im Nahbereich neu zu gestalten.\n\nEinheitslösungen könne es dabei nicht geben, so der Zukunftsforscher. Unterschiedliche Lebens-, Bau- und Wohnformen müssten der Vielfalt der Stadtbewohner Rechnung tragen.\n\n4\n\nDass sich die Menschen einmal danach sehnen würden, möglichst wenig Wohnfläche zur Verfügung zu haben, hätte wohl niemand vermutet. Eine neue, von den Vereinigten Staaten ausgehende Bewegung zielt nun darauf ab, sich von überflüssigen Materialien und Dingen zu trennen und nur mehr das zu behalten, was auf einer Fläche von 15 bis 20 Quadratmetern Platz findet.\n  Die sogenannten Tiny Houses, also kleinen Häuser, erfreuen sich auch in Österreich immer größerer Beliebtheit, da ihre Anschaffungskosten gering sind und sie bei Bedarf auch per LKW an einen anderen Standort gebracht werden können.\n\nDadurch ist man als Besitzer eines solchen Eigenheims sehr flexibel, was die Wahl des Wohnorts anbelangt. Es bedarf nur eines kleinen Stellplatzes, der für eine bestimmte Zeit gemietet oder gepachtet wird.\n\nBesonders vonseiten ländlicher Gemeinden, die stark vom Abzug Einheimischer betroffen sind, besteht großes Interesse daran, dass auf diese Art Personen in entlegeneren Ortschaften wieder ansässig werden. Deswegen wurden mancherorts oftmals auf Initiative der Bürgermeister bereits Vermittlungsbörsen für Interessierte eingerichtet.\n\n5\n\nWer hat insgeheim nicht jenen Tag herbeigesehnt, an dem die Kinder endlich selbstständig werden, eigenes Geld verdienen, das gemeinsame Zuhause verlassen und man das eigene Leben wieder in die Hand nehmen kann?\n\nFür viele Eltern ist jedoch das Fehlen des Nachwuchses in den heimischen vier Wänden letztendlich ein richtiger Schlag, der das Ende eines Lebensabschnitts signalisiert, in welchem man als Versorger gebraucht wurde.\n\nZu alledem gesellt sich der Umstand, dass man sich des eigenen Älterwerdens zunehmend bewusst wird. Tatsächlich kommt nun also eine schwierige, oftmals zu Depressionen führende Phase der Umorientierung auf die Eltern zu.\n\nUm das Gefühl von Einsamkeit und Leere zu überwinden, entschließt sich so manches Paar zu dem durchaus radikalen Schritt, das nun für zwei ältere Personen viel zu große Heim zu veräußern und sich etwas Kleineres und Günstigeres zu suchen, das besser zu den neuen Gegebenheiten passt, anstatt die vorhandenen, nun freistehenden Räumlichkeiten im Familienheim umzugestalten oder für einen eventuellen Besuch der Kinder freizuhalten."};const grid=document.getElementById('grid'),menu=document.getElementById('menu'),test=document.getElementById('test'),title=document.getElementById('title'),content=document.getElementById('content');
