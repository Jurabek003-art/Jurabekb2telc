const TESTS = {"1.1": {"headings": {"A": "Limonade aus dem Wasserhahn", "B": "Limonade ist moderner als Wasser", "C": "Sommer bedeutet in Zukunft nicht unbedingt Sonne", "D": "Mehr Sauerstoff im Wasser macht müde Menschen fit", "E": "Viel Wasser trinken - Gesundheit tanken", "F": "Frische Luft macht stark", "G": "Die Sonne macht Landwirten Probleme", "H": "Sprudel hausgemacht - Zeit des Flaschen-Tragens ist vorbei", "I": "Alarm: itrat im Regenwasser bedroht die Gesundheit", "J": "Vom Regen zum Mineralwasser"}, "texts": {"1": "Möchten Sie Kraft, Jugend und Gesundheit aus der Flasche? Dann suchen Sie bei Ihrem\nnächsten Einkauf im Supermarkt nach Sauerstoff-Mineralwasser. Für den etwas doppelten\nPreis eines normalen Mineralwassers erhalten Sie dann ein Getränk, von dem die Hersteller\nversprechen, dass es Ihnen - natürlich nur, wenn Sie es regelmäßig trinken - magische Kräfte\nverleiht. 1 n einer\nUmfrage wurden Schülerinnen und Schüler in Bayern nach ihren Erfahrungen mit dem\nSauerstoffkraftdrink befragt. Die meisten fanden, dass es nicht anders schmeckt als andere\nMineralwässer auch. Das Deutsche Institut für Ernährungsforschung in Potsdam hält es\nfür Unsinn, Wasser mit Sauerstoff anzureichern. Der menschliche Körper nimmt\nSauerstoffbauptsächlich über die Atemluft auf, höchstens 0,3 % können auch über den Magen\nDarm-Trakt aufgenommen werden. Möchten Sie immer noch Kraft, Jugend und Gesundheit?\nDanngehen Sie doch einfach mehr an die frische Luft. Und die ist\nkostenlos.", "2": "Wenn es regnet, dann ßießt das Regenwasser in den Erdboden, der es wie ein Schwamm\naufsaugt. Langsam sickert das Wasser dann in immer tiefere Erdschichten, in dene es gefiltert\nund gereinigt wird. Aus dem Regenwasser ist Trinkwasser geworden. Schließlich sammelt es\nsich in einer Schicht aus Sandstein, wo es sich mit älterem Wasser vermischt. Mehrere tausend\nJahre lang kann das Trinkwasser so in den Tiefen der Erde ruhen. Durch Brunnen, die bis in\ndie tiefen Sandsteinschichten reich ellen, ganz nach dem individuellen Geschmack des Nutzers: mal mit\nmehr, mal mit weniger Prickeln, mal süßer, mal fruchtiger. nd das Wasser kommt wie von\nselbst ins Haus, das Tragen und Stapeln von Getränkekästen ist für den cleveren\nSelbsthersteller Vergangenheit.", "5": "\"Wasser ist zum Waschen da\" lautete ein deutscher Schlager Mitte der 1950er, in dem es\nweiter hieß: \"Auch zum Zähneputzen kann man es benutzen.\" Wasser zu trinken schien\ndamals manchen Leuten nicht in die neue Wohlstandswelt zu passen. Süße Limonaden galten\nals besser als einfach nur Wasser. Dabei raten heute die meisten Ärzte zum\nWassertrinken: \"Trinken Sie täglich mindestens 2,5 Liter davon\", steht auch in nahezu allen\nmedizinischen Ratgebern von heute. Mineralwasser hat, wie man heute wieder weiß, durch\nseine mineralischen Inhaltsstoffe atrium, Kalium, Magnesium, Calzium und Spurenelemente\nfür den menschlichen Körper viele Vorteile: Es gleicht den Mineral- und Flüssigkeitsverlust\nbeim Schwitzen aus, es fördert die Verdauung und das alles ohne den Körper belastenden\nZucker und ohne Kalorien. Ob aus der Heimat oder - wie in den jetzt modischen Wasserbars\nvon der Insel Hawaii oder vom Südpol: Wasser ist wieder zum Trinken da."}, "answers": {"1": "F", "2": "J", "3": "C", "4": "H", "5": "E"}, "options": {"1": ["C", "H", "J", "I", "F", "D", "E"], "2": ["J", "D", "C", "H", "E", "F", "I"], "3": ["B", "F", "A", "D", "C", "J", "E"], "4": ["B", "A", "H", "I", "J", "E", "G"], "5": ["A", "E", "D", "I", "J", "H", "C"]}}, "1.2": {"headings": {"A": "Immer mehr Jugendliche werden Programmierer", "B": "Automobilindustrie schafft neue Arbeitsplätze", "C": "Diskussion über schulische Berufsorientierung", "D": "Förderwochenende fürjunge Softwareentwickler", "E": "Frauen in technischen Berufen werden stärker gefördert", "F": "Spannende Gewinne für wissenschaftliche achwucbstalente", "G": "Mehr Bemühungen um weiblichen Nachwuchs gefordert", "H": "Verleihung des Jugendnobelpreises in Stockholm", "I": "Berufswabl: Jugendliebe werden stark von ihrem gesellschaftlichen Umfeld geprägt", "J": "Studienabsolventen technischer Fächer sehen ihre Zukunft meist in der"}, "texts": {"1": "Martina Lux hat ein Hobby, mit dem sie im Knis ihrer Freundinnen ziemlich allein steht:\nSie programmiert in ihrer Freizeit. \"Mich hat immer schon interessiert, wie Computerprogramme\neigentlich funktionieren\", sagt die 17-Jährige. Außerdem habe sie großen Spaß an logischem Denken. Ihr\nInformatiklehrer erzählte ihr von einem\nWorkshop in Berlin: Bei \"Jugend programmiert\" traf Martina von letztem Frtitag bis Sonntag mit\ngleichgesinnten Jungen und Mädchen zwischen zwölf und 18 Jahren zusammen, um gemeinsam\nProgramme zu entwickeln. Dabei standen ihnen erfahrene Informatiker zur Seite. In 15 Gruppen\nentwickelten die jungen Nachwuchsprogrammierer ihre Projekte. Eine\nJury verlieh Preise in vier Kategorien. Bewertet wurden die originellste Idee, die sauberste Umsetzung, die\nbeste Präsentation und die größte Relevanz für die Gesellschaft. Martinas Gruppe erhielt zwar keinen\nPreis, aber das Wochenende hat sich für sie auf jeden Fall gelohnt. Sie bat zwei Mädchen kennengelernt,\nmit denen sie auch in Zukunft gemeinsam programmieren möchte. Zu wissen, dass sie nicht allein ist mit\nihrem Hobby, das ist für sie ein besonders wichtiges Ergebnis dieses Wochenendes, meint Martina.", "2": "\"Jugend forscht\" ist ein bundesweiter Nachwuchswettbewerb für junge Menschen bis zum Alter von 21\nJahren, bei dem besondere Leistungen in Mathematik, Technik, aturwissenscbaften und Informatik\nausgezeichnet werden. eben Gddpreisen werden auch einige Sonderpreise vergeben, die bei den\nJugendlieben ganz besonders begehrt sind. Dazu gehört die Teilnahme an internationalen Wettbewerben,\nbei denen die jungen Forscher Fachleuten aus aller Welt ihre Projekte vorstel.len können. Auch\nEinladungen zu Studienreisen und Kongressen im Ausland sind für viele Teilnehmer besonders attraktiv.\nIm Rahmen von \"Jugend forscht\" wird sogar eine Reise zu Nobelpreisverleihung in Stockholm angeboten.\nlm Inland haben die Preisträger die Möglichkeit, ein langes Praktikum an angesehenen\nForschungsinstituten und bei wichtigen Unternehmen zu absolvieren. Dort bekommen die Jugendlieben\nim Arbeitsalltag eine gute Vorstellung davon, wie Forschungsarbeit funktioniert. Zusätzlich gibt es auch\nAbonnements für technische und naturwissenschaftliche Fachzeitschriften zu gewinnen. Auch Schulen und\nProjektbetreuer können teilnthmen. Bei diesem Wettbewerb haben junge Menschen die Möglichkeit,\nwertvolle Erfahrungen mit Forschungsprojekten zusammen. Mitmachen lohnt sieb auf jeden Fall.", "3": "Die lndustriellenvereinigung beklagt in einer jüngsten Pressemitteilung den deutlichen Mangel an\nFachkräften in der Naturwissenschaften und den technischen Berufen. Dieser Fachkräftemangel sei\nbesonders ausgeprägt in den Bereichen Maschinenbau, Elektrotechnik, Werkstoffwissenschaften und\nVerfahrenstechnik, heißt es in dem Papier. Um dem entgegenzusteuern, ruft d.ie\nlndustriellenvereinigung unter anderem dazu auf, insbesondere Mädchen und junge Frauen für solche\nBerufe zu gewinnen. Die Berufsorientierung der Schulen müssen noch gezielter auf die vielfälti.gen und\ninteressanten Themenfelder sowie die guten Zukunftschancen technischer Berufe hinweisen.\nErfolgreiche Frauen aus diesen Bereichen sollten sich zudem verstärkt als Vorbilder für Schülerinnen\npräsentieren. In diesem Zusammenhang wird in der Pressemitteilung auch an die Möglichkeit erinnert,\nam bevorstehenden bundesweiten Mädchenzukunftstag \"Girls' Day\" an den Standorten namhafter\nFirmen Einblicke in den Arbeitsalltag in technischen Berufen zu bekommen. Die\nlndustriellenvereinigung fordert die Unternehmen und Organisationen auf, ihre Türen fiir potenzidle\nTalente zu öffnen und sich Fachkräfte für die Zukunft zu sichern .", "4": "im Kulturzentrum war gestern Abend Tobias Meyer zu Gast. Die Organisatoren hatten den\nbekannten Autor zahlreicher Sachbücher über Erziehung und Bildung eingeladen, zum Thema\nBerufsorientierung zu sprechen. In seinem Vortrag ging Meyer auf zwei wesentliche Aspekte von\nBerufsorientierung ein. Zum einen versteht er Berufsorientierung als eine Entwicklung, die eng\nmit dem persönlichen und sozialen Beziehungen eines jungen Menschen zusammenhängt. Die\nOrientierung auf einen Beruf bin wertet er als einen Teil der Persönlichkeitsentwicklung. In engem\nZusammenhang damit sieht er die Berufsvorbilder, an denen sich Jugendlicht. orientieren: Diese\nhängen ebenso wie die Erwartungen, die an einen Beruf gestellt würden, stark von der sozialen\nUmgebung ab. Zudem spielten lokale wirtschaftliche Umstände eine Rolle bei der\nBerufsorientierung. Meyer zeigte anhand konkreter Beispiele, wie große Unternehmen vor Ort die\nBerufswahl junger Menschen entscheidend beeinflussen können. Anschließend ging Meyer auf\neinen zweiten wesentlichen Aspekt, näm.lich Berufsorientierung im Rahmen der Schulen, ein. Hier\nkönnten entscheidende Impulse gesetzt werden, indem Talente und Stärken erkannt und bereits\nsehr früh gefördert würden", "5": "Wie eine repräsentative Umfrage unter Studenten kürzlich zeigte, erfreut sich die\nAutomobilindustrie nach wie vor großer Beliebtheit bei Studierenden der Fachgebiete\nWirtschaft und Technik. Gefragt nach der den fünf attraktivsten zukünftigen Arbeitgebern,\nnannten Wirtschaftsstudenten vier führende Automobilkonzerne und eine lnternet\nSucbmaschine; künftige Ingenieure nannten sogar ausschließlich Automobil\nunternehmen. Auch für Studenten der Informatik gewinnt die Automobilindustrie\nzunehmend an Attraktivität - wenig verwunderlich angesichts der rasch zunehmenden\nBedeutung, die der Elektronik in Fahrzeugen zukommt. Die Branche punktet bei jungen\nAbsolventen mit vielen spannenden Tbemen: Wie wird die Mobil.ität der Zukunft\naussehen? Welche alternativen Antriebe wird es geben? Die Automobilindustrie bietet viel\nRaum für Innovationen und somit gute Chancen für motivierte Berufseinsteiger. Doch\nausschlaggebend sind nicht nur solide Berufsaussichten. Wie die Befragung ergab, spielt\nauch dtr emotionale Faktor eine Rolle: Viele Studierende sind einfach begeistert vom\nThema Auto."}, "answers": {"1": "D", "2": "F", "3": "G", "4": "I", "5": "J"}, "options": {"1": ["B", "F", "A", "I", "E", "D", "J"], "2": ["J", "I", "D", "F", "G", "E", "H"], "3": ["G", "F", "A", "H", "I", "C", "E"], "4": ["G", "D", "B", "I", "E", "J", "H"], "5": ["J", "G", "F", "I", "D", "H", "E"]}}, "1.3": {"headings": {"A": "Ausstellung über Finanzmetropole", "B": "Fachinformationen für Finanzprofis", "C": "Finanz-ABC für Anfänger", "D": "Interessante Tätigkeit wichtiger als hohes Gehalt", "E": "Lehrreicher Rundgang zu Finanzwissen", "F": "Sammelgefäße als Ausstellungsobjekte", "G": "Sparbüchsen - Nun wieder in Mode", "H": "Vertrauen zeigt sich auf dem Konto", "I": "Wie Kinder den Umgang mit Geld lernen", "J": "Wie man Kinder zum Sparen motiviert"}, "texts": {"1": "Spardosen sind Sammelbehälter, Dekoration oder Kinderspielzeug - und :zwar seit\nJahrhunderten. Und obwohl bargeldloses Bezahlen immer mehr in Mode kommt, sind sie bis\nheute nicht aus den Kinderzimmern verschwunden. Das Spardosen-Museum im Haus\nKemnade zeigt 1200 Exemplare aus dem Mittelalter bis zum 20. Jahrhundert. Daneben\nwidmet sich das Museum der Geschichte des Geldes. In zwei Räumen sind Münzen, Scheine\nund weitere Tauschmittel aus der ganzen Welt ausgestellt. Die Sammlung\nvon Spardosen reicht von schweren Gefäßen aus Eisen über kunstvoll verzierte Truhen und\nKutschen bis zu Mickey-Mäusen aus Blech. \"Um 1900 erlebten Spardosen einen Boom\",\nerzählt Museumsleiter Jürgen Stollmann. In vielen Häusern hatten sie zwar nur als hübsche\nDekoration hergehalten, doch immer seien sie auch ein Spiegel der Gesellschaft. Zehn Jahre\nspäter schon gibt es das Museum, das interessante Einblicke in die Geldgeschichte bietet.\nJährlich lockt es über 13.000 Besucher an.", "2": "Wer beim leisen Klirren von Geldstücken ein prickelndes Gefühl verspürt, ist in der neuen\nSonderausstellung \"Die Sprache des Geldes\" im Berliner Museum für Kommunikation\nrichtig. Auf ungewöhnliche Weise nähert sieb diese kleine Schau dem Geld als Dreh- und\nAngelpunkt einer globalisierten Welt. Im Museum machen die Besucher auf 450\nQuadratmetern eine Tour durch eine fiktive Stadt: Auf dem \"Marktplatz\" erfahren sie,\nwarum sich zuerst Münzen und viel später Scheine als Zahlungsmittel durchsetzen. Bei den\nStationen \"Bank\" und \"Börse\" lernen sie das Prinzip kennen, das in guten Zeiten\ndahintersteht: Vertrauen in den Wert des Geldes. In der Station \"Einkaufszentrum\" geht es\ndagegen um die heutige Konsumgesellschaft. Entlohnt werden die Besucher für ihren\nAusstellungsbesuch natürlich auch. Wer sein neues Wissen in einem Computerquiz\nnachweisen kann, erhält einen Spielgeld-Schein mit dem eigenen Konterfei. Macht Geld denn\nnun glücklich?\" ur für einen kurzen Moment\", versichert Kurator Gregor lsenbrot. \"Wenn\nder Rausch vorbei ist, will der Mensch noch mehr. Und zwar mehr Geld\".", "3": "\"Versteh' ich ja doch nicht; ist mir zu kompliziert\". So oder ähnlich lauten die üblichen\nVorbehalte, wenn es darum geht, zu begreifen, wie Wirtschaft funktioniert und der\nFinanzsektor arbeitet. Der englische Journalist John Lanchester nimmt alle jene neugierigen\nLaien, denen die Fachsprache rund ums Geld bislang verwirrend erschien, bei der Hand. So\nschildert er in seinem Buch \"Die Sprache des Geldes und warum wir sie nicht verstehen\", wie\ner sich als Außenseiter dem Thema genähert hat. Geld habe eine eigene Sprache, erklärt\nLanchester. Wer diese nicht lerne, könne nicht mitreden. Und so erläutert er im ersten Teil\nseines Buches die Besonderheiten dieser Sprache. Den zweiten Teil bildet ein alphabetisches\nGlossar, in dem Fachwörter und amen in kurzen Artikeln erläutert werden. Anschaulich\nerklärt Lanchester etwa, was Derivate sind und wie man antizyklisch handelt. Das Buch ist\nanekdotenreich und gut lesbar, seine Lektüre zu empfehlen. Denn Lanchester ermöglicht es\ndem interessierten Wirtschaftslaien, mitreden zu können.", "4": "Eine neue ntersuchung des Instituts der deutschen Wirtschaft bestätigt eine Tatsache,\nüber die sich Sozialwissenschaftler und Psychologen schon lange einig sind: Die Höhe des\nEinkommens allein macht nicht glücklich. Wie zufrieden ein Arbeitnehmer ist, hängt\ndemnach nicht in erster Linie vom Lohn oder der Tätigkeit ab, sonder davon, wie\nemotional stabil, belastbar und selbstsicher er ist. Für die Studie hat die Ökonomin Mara\nEwers die Zusammenhänge zwischen der Lebens- und Arbeitszufriedenheit, dem\nBruttostundenlohn, der Anzahl der Bildungsjahre und dem Gesundheitszustand\nuntersucht. Sie fand heraus, dass 53 Prozent der Bundesbürger, die sich emotional als\nbesonders stabil bezeichnen, auch im Job sehr zufrieden sind. Die Fähigkeit, anderen\nMenschen zu vertrauen, steigere die Lebens- und Arbeitszufriedenheit. Die Untersuchung\nlege die These nahe, dass Einkommensunterschiede auch eine Folge der\nPersönlichkeitsentwicklung sein können, so Ewers. Wer misstrauisch sei, verwende mehr\nZeit und Kraft für Kontrollen und sei daher weniger produktiv, sagt sie. Und wer weniger\nproduktiv sei, verdiene auf Dauer auch weniger.", "5": "Über Geld sprechen viele Deutsche nicht gerne - selbst Verwandte oder Lebenspartner\nhaben oft keine Ahnung, was sieb auf den Konten ihrer Nächsten tut. Dabei spielt Geld\nbei den meisten Entscheidungen eine wichtige Rolle, und zwar auch in der Familie. Es ist\nheutzutage zum Glück üblich, dass Kinder spielerisch ein Gefühl für Geld entwickeln: Zwei\nDrittel der Vier- bis Fünfjährigen bekommen mittlerweile Taschengeld. Doch die Offenheit\nvon Eltern sollte noch weiter geben: Denn die Erziehung prägt entscheidend das spätere\nVerhältnis der Kinder zu Geld, wie Studien belegen.\nVorteilhaftes Finanzverhalten nennen Forscher das und setzen es mit der Fähigkeit gleich,\nGled sinnvoll einz ediziner das bislang unbekannte Adenovirus T MAdV. Dieser Erreger kann\nauch Menschen befallen: Ein Mitarbeiter des Primatenzentrums, der viel Kontakt zu den erkrankten\nAffen hatte, bekam Fieber und Husten. Zudem steckte er ein Mitglied seiner Familie an.Die Experten\nempfehlen, Adenoviren künftig sorgfältiger zu beobachten, um rechtzeitig auf mögliche Gefahren für den\nMenschen aufmerksam zu werden.", "2": "Virologen ist es gelungen, den Vogelgrippe-Er reger hochansteckend zu machen. un empfiehlt das US\nGesundheitsministerium Fachzeitschriften, die entsprechenden Daten nicht zu veröffentlichen, weil\nTerroristen mit ihrer Hilfe Biowaffen basteln könnten. ur die Ergebnisse der Versuche sollen erscheinen,\nnicht aber Einzelheiten über die Arbeitsweise der Forscher oder Details über die Beschaffenheit der\nViren.Das Ministerium stützt seine Entscheidung auf die Empfehlungen unabhängigen Expertengremius\nSABB. Es ist das erste Mal, dass das Gremium eine solche Empfehlung ausgesprochen hat. Ihr\nvorausgegangen war eine wochenlange Diskussion darüber, wie Forscher mit heiklen Erkenntnissen\numgehen sollen: Alles offenlegen oder brisante Versuche unterlassen und erst recht nicht veröffentlichen?\nFür die betroffenen Forscher steht die Freiheit der Forschung und der Presse auf dem Spiel. Unklar ist\nnoch, inwieweit sie und die Fachjournale den Empfehlungen des SABB folgen.Es ist für die öffentliche\nGesundheit notwtndig, dass alle Details jeder wissenschaftlichen Analyse zu lnfluenzaviren Forschern\nzugänglich sind.", "3": "Das ostfriesische Memmert ist für selten Vögel reserviert. Auf der Düneninsel, die vor ein paar\nJahrhunderten aus der Nordsee aufgetaucht ist, leben Zigtausende von Vögeln. Nur der\nInselvogt lebt zeitweise dort. Von Anfang März bis Ende Oktober ist der Forscher das einzige\nmenschliche Wesen auf der kleinen Vogelschutzinsel im Wattenmeer. Im Auftrag des Landes\nNiedersachsen ist der Inselvogt zuständig für den Schutz von atur und Vögeln auf Memmert.\nVon Mai bis Ende Juli ist Brutzeit auf der Insel. 100.000 Tiere, Vertreter von 60 verschiedenen\nVogelarten, kommen Jahr für Jahr zum Brüten nach Memmert. Während dieser Zeit besteht\nein absolutes Betretungsverbot - ausgenommen für Personen, die in Seenot geraten sind oder\neine schriftliche Genehmigung haben. Ab August, dem Ende der Brutzeit, haben auch\nUrlauber für kurze Zeit die Chance auf inen Besuch, aber ausschließlich im Rahmen einer\ngeführten Expedition. ur mit einem Experten dürfen sie die Düneninsel im Wattenmeer\nerkunden.", "4": "Die südamerikanischen Galapagosinseln locken nicht mit weißen Sandstränden und Palmen.\nDennoch sind sie das Ziel so mancher Reisesehnsüchte. Für viele Menschen gelten die fernen\nInseln als eine Art Paradies. Und tatsächlich kommt man wohl nirgendwo sonst ungezähmten\nTieren so nahe wir auf diesen Inseln: Auf den unbewohnten Galapagosinseln verhalten sich die\nTiere so, als ob keine Menschen gäbe. Für die Besucher genauso faszinierend wie für die\nEntdeckungsreisenden früherer Jahrhunderte ist dabei die Zutraulichkeit, die sich die Tiere\ndurch das Fehlen von natürlichen Feinden auf den Inseln bewahrt liaben. Man kann das ganze\nJahr über zu den Galapagosinseln reisen. Die bewohnten Inseln kann man dabei ganz gut\nallein besuchen. Anders sieht es bei den unbewohnten Inseln aus. Hier lassen die Behörden seit\neinigen Jahren nur eine begrenzte Zahl an Schiffen zu, und ohne Führer ist das Betreten nicht\nerlaubt. Die Inseln und ihre Tiere bleiben sich selbst überlassen, damit das aturparadies auch\nweiterhin erhalten bleibt.", "5": "Dass Elefanten in Thailand teurer sein können als ein Jer-BMW in München, liegt an\nihrem enormen wirtschaftlichen Potenzial: Sie sind eine der Hauptattraktionen der\nthailändischen Tourismusindustrie. Jeder dritte Besucher des Landes möchte mit Elefanten in\nKontakt kommen oder hat das bereits hinter sich, zeigt die Umfrage einer Tierschutzgruppe.\nDie Organisation schätzt, dass in dem Land mehr als 2000 Elefanten im Einsatz sind, um die\nNachfrage der Urlauber zu bedienen - so viele wie in keinem anderen Land der Welt. Was für\ndie Besitzer ein gutes Geschäft ist, steht immer häufiger bei Tierschützern in der Kritik:\nElefantenreiten sei die grausamste Tierattraktion der Welt. Sie sprechen von von einer\nlebenslangen Qual für die Elefanten. Mehr als 100 Reiseveranstalter haben solche Angebote\nschon aus den Katalogen gestrichen. Dies feiern Tierschützer als Sieg: \"Elefanten sind\nWildtiere, keine Entertainer.\" Dass die Lebensbedingungen derTourismuselefanten nicht\nartgerecht sind, ist bekannt. Doch selbst wenn sie nicht mehr als Einnahmequelle dienen, wird\ndas an ihren Lebenumständen wenig ändern."}, "answers": {"1": "B", "2": "C", "3": "D", "4": "G", "5": "E"}, "options": {"1": ["I", "D", "A", "F", "B", "G", "C"], "2": ["G", "A", "H", "F", "C", "B", "E"], "3": ["E", "H", "I", "J", "C", "G", "D"], "4": ["E", "H", "J", "G", "D", "I", "A"], "5": ["G", "E", "A", "F", "C", "B", "I"]}}, "1.6": {"headings": {"A": "Wie aus Tieren Frostschutzmittel gewonnen werden", "B": "Genussmittel erhöht die Wahrnehmung bestimmter Wörter", "C": "Insektensterben in der kalten Jahreszeit", "D": "Pflanzen und Insekten - eine gemeinsame Entwicklung", "E": "Koffeinrückstände in landwirtschaftlichen Erzeugnissen", "G": "Die bisher ältesten Pßanzensamen entdeckt", "H": "Neue Erkenntnisse über das weltweite Bienensterben", "I": "Methoden zum Überleben in der kalten Jahreszeit", "J": "Wie Kaffee unser Sprachvermögen beeinträchtigt"}, "texts": {"1": "Kaffer verleiht neuen Schwung und hebt die Stimmung. Viele Kaffeetrinker schätzen\ndiesen Effekt des Koffeins. Forscher der Ruhr-Universität Bochum haben das Phänomen untersucht und\nherausgefunden, dass Koffein selektiv das Erkennungsvermögen für positive Begriffe schärft. Die\nWahrnehmung von negativen oder neutralen Wörtern verändert der Muntermacher dagegen nicht. Es\nwar bereits vorher bekannt, dass der Mensch beim Lesen emotional meln, kommen dabei so\nrichtig in Fahrt. Wie die amerikanische Fachzeitschrift \"Science\" berichtet, erinnern sich\nBienen mit der richtigen Dosis Kaffein bis zu dreimal länger an den Duft einer Futterpflanze.\nDas hilft nicht nur den Bienen bei ihrer Suche, sondern auch den Pflanzen. In hoher\nKonzentrazion ist Koffein bitter und schreckt Insekten ab. In geringen Dosen scheint er die\nBienen aber nicht zu stören, sondern ihnen eher auf die Sprünge zu helfen. Koffein stärke\noffensichtlich das Langzeitgedächtnis der Bienen, schlussfolgerten die Forscher aus ihrem\nVersuch. Sie konnten diese Wirkung auch im Gehirn der Insekten nachweisen: Koffein\nveränderte dort die Erregbarkeit von euronen, die mit dem Geruchslernen in Verbindung\nstehen. Dadurch wird wahrscheinlich die Sammelleistung der Bienen gesteigert. Gleichzeitig\nerhalten die Pflanzen treue Bestäuber.", "4": "Es ist ein schwerer Gang im Leben jedes Imkers. Die paar Schritte hin zu seinen Völkern im\nFrühjahr, wenn an den Fluglöchern eigentlich schon seit Tagen emsiges Treiben herrschen\nsollte - aber stattdessen nur Stille von einer Tragödie kündet. Ein paar Schritte, bevor der\nImker den Deckel von der \"Beute\", wie ein Stock in der Fachsprache heißt, nimmt und\nschließlich Gewissheit über das erlangt, was er längst befürchtet hat: Das ganze Volk - tot. Es\nist frustierend, wenn ein Imker Ende Februar Handvoll um Handvoll vertrockneter Insekten\nwegschaufeln muss - aber völlig ungewöhnlich ist es nicht. Jahr für Jahr überstehen zwischen\nzehn und 15 Prozent aller Bienenvölker die Winterruhe zwischen ovember und Februar\nnicht. Verluste, auf die die heimischen Bienenzüchter eingestellt sind: icht umsonst wird dem\nzulet.zt wieder zahlreicher gewordenen lmkernachwuchs empfohlen, ihre Karriere mit\nmindestens drei Völkern zu beginnen - so hält sich die Frustation über Verluste in Grenzen,\nder Betrieb kann ungestört weitergehen.", "5": "Viele Insekten überwintern als Puppe oder Larve. Doch auch \"erwachsene\" Fliegen,\nBienen und Käfer überleben die eisige Zeit. Wichtig ist die Wahl von geschützten Orten\nwie Baumritzen, Laubstreu, Höhlen, Dachböden oder Kellern. Honigbienen bilden im est\neine Traube und wärmen sich gegenseitig durch Muskelzittern. Bei Wespen und Hummeln\nüberwintern nur die Königinnen in Erdlöchern. Sie bauen dann im Frühling neue Staaten auf.\nMaikäfer überdauern als Engerlinge den Winter, Marienkäfer suchen geschützte Bereiche auf.\nViele rnsekten unserer Regionen sind \"gefriertolerant\". Sie stellen im Herbst ihren\nOrganismus um und versetzen ihr Blut mit einem Cocktail aus Gefrierschutzmitteln. Andere\nInsekten erleben im Herbst ebenfalls enorme Umbauarbeiten in ihrem Körper. Die Organe\nwerden kleiner, Herz- und Atemfrequenz sowie Körpertemperatur sind im Winter gesenkt.\nEgal, ob mit oder ohne Winterschlaf: Es beißt Energie sparen, um die Zeit der Minusgrade,\ndes Schnees und Nahrungsmangels aushalten zu können."}, "answers": {"1": "B", "2": "D", "3": "F", "4": "C", "5": "I"}, "options": {"1": ["A", "I", "G", "B", "C", "D", "E"], "2": ["H", "A", "G", "J", "D", "I", "C"], "3": ["E", "G", "B", "F", "A", "J", "D"], "4": ["A", "H", "J", "G", "E", "B", "C"], "5": ["I", "A", "C", "E", "H", "B", "J"]}}, "1.7": {"headings": {"A": "Freizeitsport in den Alpen", "C": "Hochgebirge als Skiparadies", "D": "Höhenluft - gut fürs Herz", "E": "Junge Sportler: weniger Suchtanfällig", "F": "Mit der Zigarette an die frische Luft.", "G": "Rauchverbot in Sportvereinen", "H": "Uni-Campus: rauchfreie Zone eingerichtet", "I": "Zigaretten gegen Alleinsein", "J": "Zum Leistungssport in die Berge"}, "texts": {"1": "Für Raucher wird es an der Universität in Köln ab dem kommenden Wintersemester eng.\nDenn nach zahllosen Beschwerden sowohl vom Personal der Universität als auch von\nStudierenden erweiterte nun die Universitätsverwaltung das bereits bestehende Rauchverbot.\nBisher erstreckte es sich nur auf Hörsäle und Seminarräume. Doch kaum waren die\nVeranstaltungen zu En se wichtigen INK- Initiativen\nunter den Tisch fallen könnten.Anlässlich des letzten Treffens der Anrainerstaaten erneuerte der W\\VF seine\nKritik a n der Fleischereipolitik. Das Ziel einer nachhaltigen Fischereipolitik stehe zwar auf der Tagesordnung der\nKonferenz, die alltägliche Praxis in der EU sei jedoch durch die \"Plünderung der Fiscbht.stiinde\" gekennzeichnet.\nDie Kabeljau bestände stünden kurz vor dem Zusammenbruch, sagte der WWF-Fischerciexperte. Ein\nnotwendiger Fangstopp für diese Fischart sei jedoch nicht geplant. Ein weittres ungelöstes Problem sei das\nBeifang- Problem. Der WWF-Sprecher brachte dazu folgendes Rechenbeispiel: Auf jedes Kilo Plattfisch, das auf\nden Tellern lande, gingen über fünf Kilo ungenutzter Beifang in die 'etze der Fangflotten."}, "answers": {"1": "D", "2": "G", "3": "B", "4": "H", "5": "I"}, "options": {"1": ["G", "D", "F", "A", "J", "C", "B"], "2": ["G", "A", "H", "D", "J", "C", "E"], "3": ["F", "B", "C", "E", "H", "A", "D"], "4": ["H", "E", "A", "I", "G", "J", "B"], "5": ["I", "C", "D", "B", "J", "G", "F"]}}, "1.10A": {"headings": {"A": "Neue Insektenart in Frankreich", "B": "Kliene Insekten können Krankheiten bringen", "C": "Bauern sind gezwungen Gift gegen schädliche Insekten einzusetzen", "D": "Neue Mittel gegen Mücken", "E": "Neue Studie: icht nur Affen und Delfine erkennen sich selbst", "G": "Rhein nach Chemieunfall noch immer tot", "H": "Rückblick: Fischsterben im Rhein", "I": "Um die Zukunft der I ordsee ist es schlecht bestellt", "J": "DWWF zieht positive Bilanz für die Nordsee"}, "texts": {"1": "Heute tägt in Göteborg die Internationale Nordseekonferenz (JNK) an der Regierungsvertreter\nder acht Nordsee-Länder teilnehmen. Der World Wide Fund For Nature (WWF) kritisierte in\ndiesem Zusammenhang, dass dies das letzte Treffen dieser Art sei. Künftig sollen Fragen der\nNordsee auf europäischer Ebene behandelt werden. Der WWF befürchtet, dass die\nBerücksichtigung ökologischer Belange der Nordsee künftig im europäischen Rahmen\nvernachlässigt werde: \"Es siebt nicht gut aus für die ordsee. So fasste WWF-Meeresscbutzer\nStephan Lutter diese Besorgnis in Worte. Der WWF ist der Ansicht, dass auf den Treffen der\nlNK richtungsweisende Beschlüsse zum ordseeschutz gefasst worden seien. Das Problem sei\nallerdings die Umsetzung dieser Beschiüsse in politisches Handeln in den ordsee - Länder. Zu\ndiesen Beschlüssen gehörte beispielsweise das vor Jahren beschlossene Abkommen zum Verbot\ngiftiger Schiffsfarben und das Abkommen, das die Verunreinigung der ordsee durch von\nSchiffen abgelassenes Ballastwasser bekämpfen sollte. Diese Abkommen wurden erst zum Teil\numgesetzt. Der WWF befürchtet nun, dass diese wichtigen lNK- Initiativen unter den Tisch\nfallen könnten.Anlässlich des letzten Treffens der Regierungen der ordsee - Länder erneuerte\nder WWF seine Kritik an der FleiscbereipoHtik. Das Ziel einer nachhaltigen Fischereipolitik\nstehe zwar auf der Tagesordnung der Konferenz, die alltägliche Praxis in der EU sei jedoch\ndurch die \"Plünderung der Fischbestände gekennzeichnet.", "2": "Für immer wird eine der größten Umweltkatastrophen mit dem amen des damals in Basel\nansässigen Chemiekonzerns Sandoz verbunden bleiben, der jetzt zu ovartis gehört. 1986\nführte ein Brand in einer Lagerhalle des Konzerns zu Verunreinigung des Rheins mit 20\nTonnen bochgiftiger Pestizide und lnsektizide. Auf einer Länge von 4so Kilometern mes zu\neinem gigantischen Fischsterben. Vor allem Aale waren betroffen. Trinkwasser konnte nicht\nmehr aus dem Fluss gewonnen werden. Der offentliche Druck, der als Reaktion auf die\nUmweltkatastrophe entstanden war, führte zu großen Investitionen für den Gewässerschutz.\nIm Rahmen des \"Aktionsprogramms Rhein\" wurden rund 60 Milliarden Euro in den Ausbau\nvon Kläranlagen entlang des Rheinufers investiert. Viele Schwermetalle wie Kupfer,\nCadmium, Blei und Quecksilber konnten reduziert und telweise sogar ganz aus dem Rhein\nverbannt werden. Angesichts der getroffenen Maßnahmen spricht die Internationale\nKommission zum Schutz des Rheins (1 KSR) heute wieder von \"guter Wasserqualität\" des\nRheins, 63 Fischarten sind wieder im Rhein vertreten, darunter auch Lachse.", "3": "Der Klimawandel bringt es in Verbindung mit der Globalisierung mit sich, dass auch in Deutschland Tiere\nheimisch werden, die hier zuvor nicht beobachtet wurden. Zu diesen euankömmlingen gehören auch exotische\nStechmücken, beispielsweise der japanische Bushmosquito. Mit den exotischen Stechmücken kommen auch neue\nInfektionserreger nach Deutschland, die möglicherweise auch bisher unbekannte Krankheiten beim Menschen\nauslösen können.Eine Forschergruppe identifizerte jetzt einige bisher nur in Afrika und Asien vorkommende\nErreger. Anfang 2011 wurde ein interdisziplinäres Projekt ins Leben gerufen. Als ein erstes Ziel der Forschungsarbeit wird die Erstellung einer Mückenkarte für Deutschland angestrebt. \" Innerhalb weniger Jahre wollen wir einen Überblick über die Artenverteilung der Mücken haben und wissen was an Viren in ihnen steckt\", so der Leiter des Bernhard-Nocht-lnstitut Professor Dr. Sven Klimpel.Das Bernhard-Nocbt-lnstitut ist eine internationale anerkannte Forschungseinrichtung, die eine langjährige Erfahrung in der Virendiagnostik in das\nProjekt einbringen kann. Es verfügte übtr Laboratorien der höchsten Sicherheitsstufe, die erforderlich sind, um neue Viren mit unbekanntem Gefährdungspotent'ial zu untersuchen.", "4": "Forscher haben bei Versuchen im Broox Zoo in New York eine neue Erkenntnis über Elefanten erlangt: Sie können sich selbst im Spiegel erkennen. Zumindest eines von drei Versuchstieren versuchte, einen auf seinem Kopfe aufgemalten Fleck, der im Spiegelbild zu sehen war, zu eotfernn. Bisher war unter anderem von Affen, Delfinen und Elstern ein ähnliches Verhalten bekannt. Und auch bei diesen reagierte nicht immer alle Versuchstiere auf einen Spiegel.Es gab auch schon in der Vergangenheit solche Tests mit Elefanten, die aber auf keine Selbsterkenntnis schließen ließen. Deo Grund sieht ein Wissenschaftler im\nVu suchsaufbau: \"Das große Problem ist, einen Spiegel zu haben, der 'eltfanteofest' ist.\" Frühere\nVersuche hätten zu kleine und zu schwer zugängliche Spiegeln verwendet. Die Elefanten aber wollten \"dagegen knallen, dahinter schauen, die Sache ausprobieren, bevor Sie verstehen, was vor sich geht\".Deshalb wurde diesmal mit ein 2,5 mal 2,5 Meter großer Spiegel in einem Elefantengehege mit drei weiblichen asiatischen Elefanten montiert, der stabil genug für ausgiebige Untersuchungen durch die Tiere war. Bei ähnlichen Tests mit Affen und Delfinen gibt es oormalenveise vier Phasen der Erkenntnis im Spiegel: Zuerst der Versuch der Kommunikation mit dem vermeintlichen Artgenossen, dann eine\nphysische Inspektion des Spiegels, ein Testen des Verhaltens des Spiegelbilds und schließlich die Selbsterkenntnis. Die Elefanten übersprangen die erste Phase und schauten in Phase zwei hinter den Spiegel und griffen auch mit dem Rüssel dahinter. In Phase drei führten sie verschiedene Bewegungen durch und verglichen sie mit denen des Spiegdbildes. Auch wenn sich dann nur eines der Tiere selbst erkannte, indem es den aufgemalten Fleck untersuchte und nach einiger Zeit dann auch das Interesse an dem Fleck verlor, sehen die Wissenschaftltr das Ergebnis als eindeutigen Bewtis für die Fähigkeit zur Selbsterkenntnis.", "5": "Die anhaltenden außergewöhnlich hoben Temperaturen haben im Süden Frankreichs eJne\nTierplage bisher un bekannten Ausmaßes ausgd öst. Bei den Plagegeistern handelt es sich\num Unmengen von zwei bis dreieinhalb Zentimeter langen Heuschrecken, sogenannten\nRoten Schnarrscbrerken.Die dunklen Insekten fressen Felder und Wiesen kahl und haben innerhalb von rund\nsechs Wochen die Landschaft in eine trostlose Steppe verwandell. Die Landwirte der Region sind bereits\nverzweifelt, denn ihre gesamte Ernte hat sich buchstäblich in Luft aufgelöst. Wenn man über ein befallenes Feld\ngeht, springt bei jedem Schritt ein Schnarrschreckenschwarm auf. Der ame dieser heimischen Tierart hat\nübrigens einen ganz einfachen Ursprung: Die Heuschrecken machen ein lautes Geräusch beim Springen - sie\nschnarren also - und man sieht an ihnen leuchtend rote Hinterßügel. Daher alsoRote Schnarrschrecke\". Manche\nExperten vermuten, die Heuschrrckenplage werde durch einen drastischen Klimawandel ausgelöst. Die damit\n,,erbundene Aufheizung mache Südeuropa immer \"afrikanischer\". Ein deutscher Wissenschaftsautor wies\nkürzlich im Internet mehrfach darauf hin, dass es im Laufe der Erdgeschichte ständig einen Wechstl von\nWarmzeiten und Kaltzeiten gegeben habe, der keineswegs abgeschlossen sei. Zeitweise habe das Gebiet von\nEuropa nahe dem Äquator gelegen. Der Einsatz von Gift gegen die Heuschrecken ist sehr riskant. Denn dabei\ndarf nur ein Mittel ,,erwendet werden, das ausschließlich für die Heuschrecken tödlich ist, nicht aber für Bienen\nund andere Insekten. Auch das Vieh der Bauern darf nicht durch verseuchtes Futter gefährdet werden."}, "answers": {"1": "I", "2": "H", "3": "B", "4": "E", "5": "C"}, "options": {"1": ["B", "E", "J", "I", "D", "C", "H"], "2": ["G", "A", "D", "E", "C", "H", "J"], "3": ["H", "B", "E", "J", "I", "G", "A"], "4": ["E", "B", "A", "H", "I", "C", "J"], "5": ["J", "A", "G", "H", "I", "C", "E"]}}, "1.11": {"headings": {"A": "Freie Plätze im Tanzkurs", "B": "Neue Lerntechniken präsentiert", "C": "Stolze Eltern: vom Schüler zum Superstar", "D": "Verändertes Freizeitverhalten von Jugendlieben", "E": "Höher, schneller, weiter: Suche nach dem Nervenkitzel", "F": "Hilfen für überforderte Schüler", "G": "Keine Zeit für Langeweile", "H": "Neue Sportarten", "I": "Tanzlehrer fordern moderne Tänze bekannter machen", "J": "Befragung bestätigt alte Vorurteile"}, "texts": {"1": "Der Begriff Extremsport wird oft subjektiv verwendet. Mao kann viele gängige Sportarten als\nExtremsport bezeichnen, wenn sie mit erhöhtem Risiko für das eigene Leben ausgeübt\nwerden, z.B. Skilaufen auf ungesicherten Pisttn oder Klettern ohne Sicherung. Extremsportlern geht es\naber nicht darum, das höchste Risiko einzugehen, sondern ihre Grenzen zu erkennen. Extremsport kann\nman an vielen Orten betreiben: in der Wüste, unter Wasser, auf Klippen oder Bergen, in der Luft oder\nsogar auf seinem eigenen Hausdach. Es gibt viele Wettbewerbe in verschiedenen extremen Sportarten,\nzum Beispiel Bungee-Jumpiog, was früher ursprünglich ein Ritual für junge Männer in der Südsee war.\nEine andere Art des Extremsports ist Freeclimbing: Mann klettert ohne jegliche Sicherung an mehreren\nhundert Meter hohen Felswänden. Kein Berg ist zu hoch, keine Wand ist zu steil, keine Schlucht\nzu tief, um für den Adrenalinkick zu sorgen. Manchen Sportlern kann es nicht aufregend genug sein.\nLeider entwickeln nicht wenige Extremsportler dabei eine regelrechte \"Sportsucht\", die krankhaft ist.\nViele Extremsportler ignorieren die Gefahren, was zu schweren Unfällen führt und sie häufig genug das\nLe beo kostet.", "2": "Musik, Sport, ehrenamtliches Engagement - die Teilnahme von Jugendlieben an diesen sogenannten\nbildungsorientierten Freizeitaktivitäten hat in den vergangenen zehn Jahren deutlich zugenommen. So\nlautet das Ergebnis einer Studie des Deutschen Instituts für Wirtschaftsforschung. Während vor 10 Jahren\nerst 48 Prozent aller 16- bis 17-Jährigen an bildungsorientierten Aktivitäten teilnahmen, waren es im\nvergangenen Jahr bereits 62 Prozent. Die Daten zeigen außerdem: Während vor 10 Jahren nur etwa 10\nProzent der 16- bis 17-Jährigen musizierten, waren es im letzten Jahr bereits 18 Prozent. Noch stärker hat\nim gleichen Zeitraum das ehrenamtliche Engagement der 16- bis 17-Jährigen zugenommen (von 11 auf22\nProzent). Darüber hinaus ist auch der Anteil der Jugendlieben, die Sport treiben, tanzen oder Theater\nspielen, gestiegen. Gleichzeitig verzeichnen die Forscher einen Abwärtstrend der sogtnannten informellen\nFreizeitbuchäftigungen. So ist der Anteil derer, die täglich mit der buttn Freundin odtr dem besten\nFreund unterwegs sind, im Untersuchungszeitraum von 40 auf 25 Prozent zurückgegangen. Auffallend ist,\ndass Jugendliche aus sozial schwächeren Haushalten bildungsorientierte Angebote viel seltener nutzen als\njunge Menschen aus gut situierten Familien.", "3": "In Firmen gibt es sie schon, _jetzt wollen auch Schulen Entspannungskurse anbieten. Schüler\nsollen zwischen den Unterrichtsstunden mit Entspannungstechniken lernen, Stress abzubauen.\nEin erster Probelauf des Projekts an einer Gesamtschule in Hamburg ist bei den\nTeilnehmenden gut angekommen. Die Schüler waren zu Beginn zwar skeptisch, dann aber vom\nErgebnis überzeugt. \"leb konnte mich in meiner nächsten Stunde nach der\nEntspannungsübung viel besser konzentrieren und habe viel mehr mitbekommen\", berichtet\nJens aus der 12. Klasse. Die Schule hat damit auf Kritik von Schülern und Lehrern\nreagiert: Nach der Umstrukturierung der Stundenpläne klagten die Schüler zunehmend über\nStress und zu wenige Pausen. Gerade Entspannungspausen seien aber wichtig, erklären\nPädagogen und auch Neurowissenschaftler. Nur wer ausreichend Pausen macht, kann sich\nDinge auch langfristig merken. achdem das Projekt in Hamburg solch einen Erfolg hatte,\nwollen es jetzt auch andere Schulen anbieten .", "4": "Tanja Kleist ist von modernem Tanz absolut begeistert. Seit ihrem neunten Lebensjahr\ntanzt sie, früher auf Wettkampfniveau. Seit einigen Jahren engagiert sie sich beim TSV\nNeustadt. Die Freude, die sie beim Tanzen hat, möchte sie weitergeben und mehr\nJugendliebe motivieren, diesem einzigartigen Sport eine Chance zu geben. Und diese\nChance ist nun für alle Interessierten besonders groß. Für ihre Hip-Hop-Tanzgruppe sucht\nFrau Kleist neue tanzbegeisterte Teilnehmerinnen und Teilnehmer, da im vergangenen\nSommer viele nach dem Abitur die Gruppe verlassen haben. Das abwechslungsreiche\nTraining vereint Kreatives mit \" Handwerklichem\". Im Mittelpunkt der Übungsstunden\nsteht die Erarbeitung kleiner cboreografierter Sequenzen auf Basis von Musikvideos\nbekannter Hip-Hopper, aber auch das Techniktraining und die Schulung von akrobatischen\nGrundelementen kommen nicht zu kurz. Es entstehen Choreografien, die die Gruppe bei\nöffentlichen Auftritten vorführt. Ein tolles Tanzangebot mit viel Spaß, das es ab sofort beim\nTSV eustadt für Jugendliebe ab 14 Jahren gibt!", "5": "Montags Tennis, dienstags Klavierunterricht, mittwochs Jazztanz in der Gruppe und\ndonnerstags Treffen der Astronomie-Gruppe. Was klingt wie der Terminkalender eines\nvielbeschäftigten Erwachsenen, ist heute oft eine ganz normale Woche im Leben von Kindern\nund Jugendlieben. Nicht genug damit, dass sie sechs oder sieben Stunden Schule haben, dann\nvielleicht noch Hausaufgaben machen und natürlich auch etwas essen müssen - in ihrer\nFreizeit haben sie dann gleich weitere Termine. Dabei suchen sich das viele Kinder und\nJugendliebe gar nicht selbst aus, sondern die Eltern wollen, dass Ihr achwuchs möglichst viel\nunternimmt. Einige hoffen, aus ihrem Sohn könnte ein neuer Spitzensportler werden, andere\ndenken an eine Karriere als Musikerin, meist aber glauben die Eltern \"nur\", sie müssten ihre\nKinder ständig beschäftigen. Sonst könnte es ihnen ja langweilig werden, und wer weiß, was\nsie dann machen. Viele Eltern haben Angst, dass ihre Kinder dann \"auf dumme Gedanken\"\nkommen oder dass sie zuhause nur vor dem Fernseher oder Computer sitzen, wenn sie nicht\nständig etwas unternehmen. Ob der Freizeitstress für aIJe Beteiligten wirklich gut ist?"}, "answers": {"1": "E", "2": "D", "3": "F", "4": "A", "5": "G"}, "options": {"1": ["H", "C", "D", "A", "F", "E", "I"], "2": ["A", "I", "G", "B", "D", "C", "J"], "3": ["D", "A", "F", "G", "I", "J", "C"], "4": ["B", "A", "F", "G", "C", "E", "D"], "5": ["G", "H", "A", "D", "E", "F", "J"]}}, "1.12": {"headings": {"A": "Doping für Drogenspürhunde", "B": "Durch den Geruchssinn die Welt neu erfahren", "C": "Elefanten mit dem feinsten Näschen", "D": "Erst schmecken, dann riechen", "E": "Mit vierbeinigen Spürnasen gegen den Drogenschmuggel", "F": "Nasenkorrektur für jedermann", "G": "Neue Therapie für Allergikernasen", "H": "Schönheitsoperationen nicht um jeden Preis", "I": "Selbstreinigung für unser Riechorgan", "J": "Tierische Riechorgane – unterschiedlich ausgeprägt"}, "texts": {"1": "Wie wollen wir von anderen gesehen werden? Von unserer Schokoladenseite natürlich. Aber es gibt Menschen, die haben keine. Eine Frau mit schiefer Nase mag sich weder im Profil noch frontal zeigen.\n„Die Nase“, so der plastische Chirurg Professor Henrik Menke, „sitzt mitten im Gesicht – so banal das klingt. Zu große Abweichungen von der Norm beeinträchtigen den ganzen Menschen.“\nDer Chirurg, der an der Wiesbadener Wilhelm-Fresenius-Klinik eine Abteilung für ästhetische Chirurgie leitet, lehnt es ab, am Mängelwesen Mensch alles chirurgisch Machbare auszuführen.\nKeinem unter 18 würde er die Nase operieren – es sei denn, sie ist durch einen Unfall oder eine Krankheit verunstaltet. Menke: „Wenn ich die Probleme nachvollziehen kann, die junge Leute mit ihrer Nase haben, werde ich in allen Details mit den Patienten besprechen, was getan werden kann, lehne es aber ab, mit Videoanimation zu arbeiten. Damit kann ich zwar alles machen, jedes gewünschte Resultat herbeizaubern. Die Realität ist aber eine andere. Aus diesem Grund hat es der Gesetzgeber zurecht untersagt, mit Vorher-nachher-Bildern zu arbeiten.“\n⸻", "2": "Der Riechsinn ist unser ursprünglichster Sinn – sagt Matthias Schenk vom Schloss Freudenberg. Wer ihn schärfen will, ist im dort untergebrachten „Erfahrungsfeld der Sinne“ an der richtigen Adresse: Sieben Stationen befassen sich mit dem Riechvermögen.\nOb klein oder groß, dick oder schmal – auch wenn manch einer die Form seiner Nase schon mal verflucht hat, ohne sie können wir nicht sein.\n„Es entsteht eine neue Welt, sogar ein ganz neuer Kosmos, wenn man sich mit der Nase beschäftigt“, weiß Matthias Schenk. Sein „Erfahrungsfeld der Sinne“ wird täglich von rund 400 Gästen besucht.\nAn 140 Stationen im Gemäuer und im parkähnlichen Außenbereich lässt es sich bewusst fühlen, hören, sehen, riechen und schmecken. Der Nase kommt im „Erfahrungsfeld der Sinne“ eine zentrale Rolle zu. Schließlich, so Schenk, sei der Geruchssinn gehirngeschichtlich der älteste Sinn.\nEr ist ein Ur-Sinn, der uns mit allen Tieren verbindet. Gestützt wird diese Aussage dadurch, dass beispielsweise Säuglinge ihre Mutter riechen, bevor sie sie sehen und hören.\n⸻", "3": "Mit Drogen kennt sich Falko aus. Der sechs Jahre alte Schäferhund sucht für den Zoll nach Kokain, Haschisch und Heroin. Bis zu vier Kofferladeungen, meist aus Südamerika, Afrika und Südostasien, beschnüffelt der Vierbeiner am Tag. Rund 300 mal in der Minute atmet er dabei ein und aus – ein wahrer Nasenmarathon.\nHunde riechen bis zu einer Million mal besser als Menschen. Hat der Mensch fünf Millionen Riechzellen, so sind es bei einem Schäferhund 200 Millionen. Grundsätzlich gilt: Je länger die Hundeschnauze, desto besser das Geruchsvermögen. Schnüffler wie Falko können „stereo“ riechen, das heißt, ihre Nase kann zwischen rechts und links unterscheiden. Spürhunde erkennen deshalb auch die Richtung eines Geruchs.\nDoch die beste Hundenase nutzt nichts, wenn sie nicht geschult wird. So lernen Drogenspürhunde in jungen Jahren, wie sie sogenannte weiche und harte Drogen finden. Werden bei der Ausbildung noch alle Drogen zusammengepackt, so schafft es Falko, sie beim Kofferschnüffeln dann einzeln wahrzunehmen. Bis zu zehn Jahre können Spürhunde des Zolls arbeiten, ehe sie samt ihrer Nase in den verdienten Hunde-Ruhestand gehen dürfen.\n⸻", "4": "Beim Menschen ist das Sehen der Sinn Nummer eins, gefolgt vom Hören und an dritter Stelle dem Riechen. Ganz anders sieht es bei vielen Tieren aus, zum Beispiel bei Hunden. „Ein Hund, der nicht sehen kann, ist wie ein Mensch ohne Geruch – das ist nicht schön, aber auch nicht dramatisch“, sagt Ralf Spangenberg, Tierarzt aus Ingelheim.\nZum Vergleich: Während die Riechschleimhaut des Menschen rund fünf Quadratzentimeter misst, bringt es der Hund auf 85 Quadratzentimeter und mehr. „Hunde sind Riechweltmeister“, bringt es der Tierarzt auf den Punkt.\nNicht die beste, dafür die längste Nase der Welt hat der Elefant. „Das Riechen ist allerdings Nebensache – beim Elefant ist die Nase zum Werkzeug geworden.\n“ Er kann damit Baumstämme umschlingen und schleppen, die Nase kann als Rüsseldusche genutzt werden – und natürlich als Esswerkzeug.\nInteressant sind auch die Nasen der Spinnen. Deren Riechorgane stecken in den Beinen. „Da sind sie ganz nah an den Dingen dran“, erklärt Spangenberg.\nWiederum anders verhält es sich bei Schlangen: „Sie nehmen über die Zunge Gerüche auf.“ Und damit nicht genug: Weil die Zunge gespalten ist, können sie auch rechts und links unterscheiden – und genau die Richtung bestimmen, in der sie ihre Beute finden.\nAuch die scheinbar nasenlosen Fische können riechen. „Haie zum Beispiel riechen und schmecken Blut über Kilometer“, so Spangenberg.\n⸻", "5": "Niesen ist eine Reaktion auf die Umwelt. Mal kitzelt Staub die Nase, mal reizt ein chemischer Stoff oder ein anderer Fremdkörper in der Luft unser Riechorgan. Sogar grelles Licht kann durch die Verbindung der Gesichtsnerven zum Niesen führen.\nUnwillkürlich wird ein Reflex ausgelöst, der die Nase „säubern“ soll.\nEs kommt zu einem explosionsartigen Ausstoßen der Luft durch die Nase – dem Niesen. Allergiker niesen oft serienweise, bis der letzte Reiz aus der Nase entfernt ist.\nAuf die Reizmeldung hin holt der Körper tief Luft – bis die Lungen maximal gefüllt sind. Dann wird der Atem kurz angehalten. Und schließlich stößt der Körper in Sekundenschnelle die eingeatmete Luft wieder aus. Dabei kann diese leicht eine Geschwindigkeit von 150 bis 160 Stundenkilometern erreichen.\nLautlos geht das Niesen selten vonstatten. Das „Ha“ – oft gleich mehrfach vor dem befreienden „Tschi“ hervorgestoßen – entsteht, weil beim Einatmen die Stimmbänder aufgemacht werden. Beim „Tschi“ wird die Luft dann wieder ausgestoßen. Der Laut entsteht, weil gleichzeitig die Zunge hinter die Vorderzähne gepresst wird. Denn der Körper will, dass möglichst viel Luft durch die Nase und möglichst wenig durch den Mund entweicht, daher verschließt die Zunge der Luft teilweise den Weg.\na) Das neue Schülerticket – rund ums Jahr mit Bus und Bahn fahren.\nb) Das richtige Alter für die Einschulung.\nc) Mit Schulanfängern richtiges Verhalten im Verkehr üben.\nd) Neue Methode: So lernen Kinder leichter lesen und schreiben.\ne) Neues Buch für kleine Leseanfänger.\nf) Traditionen zum Schulanfang.\ng) VORSICHT AN HALTESTELLEN!\nh) Weniger Fahrten in den Schulferien.\ni) Woher stammt der Brauch mit der Schultüte?\nj) Wörterbuch mit CD – Neuerscheinung.\nText 1\nNach der englischen Bezeichnung für „Schultüte“ sucht man vergebens. Die mit Süßigkeiten und kleinen Geschenken gefüllte Spitztüte aus Karton, die Kinder in Deutschland am ersten Schultag von ihren Eltern bekommen, ist offenbar etwas typisch Deutsches. In Großbritannien besucht die Klassenlehrerin oder der Klassenlehrer die Familie zu Hause, bevor das Kind in die Schule kommt. So können sich Lehrer, Schüler und Eltern schon vor dem Schuleintritt kennenlernen. In den USA bekommen die Kinder vor dem ersten Schultag kleine Geschenke: Dinge, die sie in der Schule gebrauchen können. In Russland wird zum Schulanfang zu Hause ein großes Familienfest gefeiert. Den Lehrerinnen und Lehrern überreichen die Schulanfänger Blumen. Gefeiert wird die Einschulung auch in Japan, allerdings nicht zu Hause, sondern in der Schule. Dort gibt es Ansprachen und Aufführungen von älteren Schülerinnen und Schülern. In Indien wird am ersten Schultag ein besonderer Joghurt gegessen. Er soll den Schulanfängern Glück bringen. Am wenigsten Aufhebens macht man in Frankreich von der Einschulung: Dort gibt es keine besonderen Bräuche.\nText 2\nRaban Rabovič ist ein kleiner Rabe. Seit Wochen denkt er nur noch an eines: den Schulanfang! Nun ist es endlich so weit: Für ihn und neun andere Rabenkinder beginnt die Schule. Wie es Raban dabei ergeht, erzählt Antonija Tomic in „Schulanfang in der Rabenschule“.\nSo heißt ihr Erstlesebuch, das gerade erschienen ist. Antonija Tomic hat als Lektorin in einem Kinderbuchverlag gearbeitet, bevor sie selbst begonnen hat, Erzählungen zu schreiben. Inzwischen hat sie sich vor allem als Bilderbuchautorin für Kinder einen Namen gemacht.\nVon ihr stammen dabei nicht nur die Geschichten, sondern auch die meist farbigen Illustrationen. Auch die ersten Schultage von Raban begleiten liebevoll gezeichnete Bilder.\nDazu gibt es eine CD mit Liedern, die kleine Rabenkinder gerne singen. In einem Begleitheft finden sich zudem Arbeitsblätter mit Mal- und Schreibübungen.\nFür alle ABC-Schützen, die gerade lesen und schreiben lernen, und ein ideales Geschenk für den ersten Schultag!\nText 3\nAuf den Straßen sind ab Schulbeginn wieder viele Kinder unterwegs. Autofahrer sind deshalb zu erhöhter Aufmerksamkeit aufgefordert, besonders beim Überholen an Haltestellen der öffentlichen Verkehrsmittel. In der Straßenverkehrsordnung ist das Überholen von Bussen und Straßenbahnen genau geregelt: An Omnibussen des Linienverkehrs, an Straßenbahnen und an gekennzeichneten Schulbussen, die an Haltestellen stehen bleiben, darf man nur vorsichtig vorbeifahren. Wenn Fahrgäste ein- oder aussteigen, dürfen Autofahrer rechts nur mit Schrittgeschwindigkeit vorbeifahren. Sie müssen auch genügend Abstand wahren, um die Fahrgäste nicht zu gefährden. Wenn nötig, müssen die Autofahrer warten. Omnibusse des Linienverkehrs und gekennzeichnete Schulbusse, die sich einer Haltestelle nähern und das Warnblinklicht eingeschaltet haben, darf man gar nicht überholen.\nAuf jeden Fall sollten Autofahrer damit rechnen, dass sich Kinder dort vielleicht nicht so verhalten, wie sie es eigentlich sollten, zum Beispiel beim Überqueren der Fahrbahn. Dann ist es Aufgabe der Autofahrer, für die Sicherheit der Kinder zu sorgen.\nText 4\nIn Deutschland herrscht für alle Kinder Schulpflicht: Ab einem gewissen Alter muss jedes Kind die Schule besuchen. An ihrem ersten Schultag können sie fünf, sechs oder sieben Jahre alt sein. Der genaue Zeitpunkt des Schuleintritts wurde Ende der 1990er Jahre bewusst flexibler gestaltet. Denn das optimale Alter für den Schuleintritt ist umstritten.\nZum einen setzen die einzelnen Bundesländer unterschiedliche Stichtage und Mindestalter fest. Zum anderen gibt es höchst unterschiedliche Ansichten über den Zeitpunkt, zu dem ein Kind reif sein soll für die Schule. Die einen argumentieren, dass auch Fünfjährige schon lesen und schreiben lernen können. Die anderen warnen vor Überforderung und Leistungsdruck. Entscheidend ist aber nicht das Alter, sondern die Entwicklung eines Kindes: Wenn sich ein fünfjähriges Kind im Kindergarten langweilt und sich auf die Schule freut, ist es vermutlich bereit für den Schulanfang. Ein sechsjähriges Kind aber, das kaum stillsitzen kann, ist im Kindergarten noch gut aufgehoben.\nText 5\nEin Großteil des Busverkehrs in der Region dient vor allem dem Schülerverkehr. Fast die Hälfte der in unserem Gebiet eingesetzten Busse fährt ausschließlich an Schultagen. Daher sind viele Fahrten in den Fahrplänen mit einem S gekennzeichnet. Diese Fußnote steht für „nur an Schultagen“. Zudem gibt es auch Fahrten, die „nur in den Ferien“ stattfinden; diese sind mit einem „F“ gekennzeichnet. Die mit einem „S“ gekennzeichneten Fahrten stehen natürlich jedem Fahrgast zur Verfügung und sind nicht ausschließlich für die Beförderung von Schülerinnen und Schülern zugelassen. Allerdings muss man bei diesen Fahrten mit gewissen Einschränkungen rechnen: Sie gelten nicht an Ferientagen. Hierbei ist zudem zu berücksichtigen, dass auch die Ferien in den angrenzenden Bundesländern ausschlaggebend sein können. Bitte achten Sie auf jeden Fall auf die Anmerkungen in den jeweiligen Fußnoten. Bei Regionalzügen und Straßenbahnen gibt es ebenfalls bestimmte Fahrten, die sich an Schul- und Feiertagen unterscheiden. Bitte beachten Sie auch hier die Angaben in den Fahrplänen."}, "answers": {"1": "H", "2": "B", "3": "E", "4": "J", "5": "I"}, "options": {"1": ["I", "B", "F", "H", "D", "E", "C"], "2": ["C", "E", "B", "D", "I", "J", "G"], "3": ["I", "H", "D", "E", "C", "B", "G"], "4": ["J", "F", "A", "G", "I", "D", "E"], "5": ["D", "G", "B", "A", "J", "I", "C"]}}, "1.14": {"headings": {"A": "Auf dem Weg zu internationalen Wettkämpfen", "B": "Durch Wassergymnastik Verspannungen lösen", "C": "Ein tierischer Lernspaß für alle", "D": "Fit und gesund auch nach der Pensionierung", "E": "Gefahren beim Tauchen", "F": "Mit dem eigenen Pferd zu Olympia", "G": "Muskeln wie ein Gewichtheber", "H": "Neueröffnetes Internat für jungen Sporttaucher", "I": "Schlank, fit und glücklich im Flug", "J": "Sport treiben wie ein Fisch unter Wasser"}, "texts": {"1": "Wir bieten Bewegungsförderung mit und auf Pferden zur Stärkung der körperlichen und geistigen Fitness. Ponys und Pferde stehen im Mittelpunkt dieses Programms. Sie zu beobachten, füttern, streicheln, putzen, führen oder reiten zu können, übt auf Teenies eine große Faszination aus. Spielerisch werden sie in Kontakt mit unseren Tieren gebracht und haben dann vielfältige Möglichkeiten, unter Anleitung Aufgaben für, mit oder auf den Pferden durchzuführen. Zudem können sie auf dem Gelände der Ranch weitere ungewohnte Bewegungs- und Wahrnehmungserfahrungen sammeln, z. B. auf dem Erlebnis-Parcour. Die Betreuung erfolgt durch einen Reitlehrer und qualifiziertes Personal. Unsere Sattel- und Kleiderkammer verfügt über alle notwendigen Utensilien. Selbstverständlich kann auch eigene Ausrüstung mitgebracht werden.", "2": "Die Schwimm- und Sportfreunde 1905 e.V. gehörten in den 70er und 80er Jahren zu den besten Vereinen im deutschen Schwimmsport. Auch noch zu Beginn der 90er Jahre stellte der Verein Schwimmer für die Nationalmannschaft, die bei Weltmeisterschaften oder Olympischen Spielen für Deutschland an den Start gingen. Seit 2010 versuchen die Schwimm- und Sportfreunde, wieder an alte Zeit anzuknüpfen. Mit idealen Voraussetzungen, nämlich der vereinseigenen 50-Meter-Bahn im Sportpark Nord, dem Stadion, der großen Mehrfachsporthalle über dem Bad, einem sehr gut eingerichteten Kraftraum und einer idealen Betreuung durch zwei ganztags angestellte Trainer, stellten sich in den letzten Jahren wieder Erfolge auf Landes- und Bundesebene ein. Die Sportler können auch das Teilzeitinternat zu nutzen. Dann wohnen und trainieren sie für eine Zeitlang zusammen, was den Jugendlichen ihren Tagesablauf sowie die Organisation von Schule und Training leichter macht.", "3": "In unserem modernen Studio bieten wir Ihnen alle Arten von Gesundheits-, Kraft-, und Fitnesstraining an. Wer selbst im Rentenalter noch einen durchtrainierten Körper haben möchte, der sollte schon in jungen Jahren das Ausdauertraining nicht vernachlässigen. Aber auch wer spät mit dem Sport beginnt, fühlt sich nach dem Training einfach besser. Um auch im Alter noch mit allen Problemen des Alltags klarzukommen, ist Ausdauertraining wirklich wichtig. Deshalb haben wir für Sie zum Beispiel moderne Trainingsgeräte, die Ihren Herzschlag kontrollieren. Auch bei Rückenschmerzen hilft das Fitnessstudio. Wer kennt sie nicht, die Rückenschmerzen. Acht von zehn Deutschen haben sie, aber sie werden beim Arzt selten richtig behandelt. Die Gründe für die Rückenprobleme liegen nämlich darin, dass die Muskeln nicht ausreichend trainiert sind. Wenn Sie bei uns trainieren, werden sie bald merken, dass die Schmerzen nachlassen und schließlich verschwinden. Sind sie neugierig geworden? Dann vereinbaren Sie doch ein Probetraining bei uns!", "4": "Das Trampolin ist ein einzigartiges Trainingsgerät, das die Möglichkeit bietet, auch bei verschiedenen körperlichen Einschränkungen ein umfassendes Trainingsprogramm zu absolvieren. Die Übungen auf dem Trampolin haben vielfältige positive Effekte auf den Körper und den gesamten Organismus. Neben einer Gewichtsabnahme (der Kalorienverbrauch ist ähnlich hoch wie beim Joggen) und der Straffung des Körpergewebes werden Muskeln gelockert, Verspannungen lösen sich und der komplette Bewegungsapparat wird nicht so hart belastet wie bei herkömmlichen Sportarten. Ein weiterer wichtiger Effekt für den Körper ist die Unterstützung des Lymphflusses. Aber auch Geist und Seele werden positiv beeinflusst.\nEs bietet sich also an, auf hochwertigen Therapiegeräten unter fachkompetenter Anleitung Luftsprünge zu machen.", "5": "Sporttauchen ist eine fantastische Natursportart. In den Vereinen und Tauchschulen des Verbandes Deutscher Sporttaucher wird das immer wieder faszinierende Sporttauchen mit verschiedenen Schwerpunkten angeboten. Dort wird auch Tauchfitness aufgebaut und regelmäßig trainiert. Sie können sich in allen Bereichen von gut geschulten Trainern ausbilden lassen und die Welt unter Wasser kennen lernen. Im Sporttauchen sollte man sich auf jeden Fall durch regelmäßiges Training „tauchfit“ halten. Eine ausreichende Kondition unter Wasser ist sehr wichtig, denn untrainiert ist man als Sporttaucher ein Risiko für sich und andere. Ziel des Tauchtrainings ist ebenfalls das Lernen der richtigen Technik für das Atmen und das Beherrschen der Techniken für das Abtauchen. Eigentlich braucht man für das Tauchen nicht viel. Für das allgemeine Training reichen eine Tauchermaske, ein Schnorchel, mit dem man auch ohne Geräte Luft bekommt und Flossen, die wie Schuhe über die Füße gezogen werden. Alle anderen Tauchgeräte kann man in praktisch jedem Verein oder in einer der vielen Tauchschulen im In- und Ausland preiswert ausleihen."}, "answers": {"1": "E", "2": "A", "3": "D", "4": "I", "5": "J"}, "options": {"1": ["H", "F", "B", "J", "I", "E", "D"], "2": ["B", "I", "G", "F", "E", "A", "H"], "3": ["C", "J", "H", "F", "A", "D", "G"], "4": ["I", "A", "H", "C", "J", "D", "E"], "5": ["E", "G", "I", "D", "F", "J", "A"]}}, "1.15": {"headings": {"A": "Keine Zeit für die Kinder", "B": "Vorsicht vor zweifelhaften Kontaktagenturen!", "C": "Liebe fürs Leben muss wachsen", "D": "Mehr Zeit für Hobbys", "E": "Partnervermittlungen generell empfehlenswert", "F": "Wer sucht, der findet", "G": "Probleme bei der Kindererziehung", "H": "Partnervermittlung per Telefon", "I": "Wenn die Kinder aus dem Haus sind", "J": "Zeitprobleme in der Familie"}, "texts": {"1": "Die Krüger sind eine ganz normale Familie. Vater Bernd arbeitet 40 Stunden pro Woche in einer Versicherungsagentur, Mutter Yvonne hat einen Teilzeitjob als Arzthelferin. Das Paar hat zwei Kinder. Tom ist neun, Linda ist vier Jahre alt. Nach ihrer Arbeit holt Yvonne die beiden aus der Schule und dem Kindergarten ab. Dann geht sie einkaufen, sie wäscht, putzt und kocht, sie bringt Tom zum Fußballtraining oder Linda zum Turnen. Wenn Bernd abends nach Hause kommt, kontrolliert er noch Hausaufgaben oder besucht seinen alten Vater, der immer öfter seine Hilfe braucht. Bernd Krüger kann sich nicht erinnern, wann er das letzte Buch gelesen hat. Für Sport bleibt keine Zeit, Freunde treffen seine Frau und er eher selten. Und wenn dann ein langer Tag zu Ende geht und die beiden Kinder endlich schlafen, sitzen Bernd und Yvonne Krüger total müde auf der Couch. In vielen Familien ist es ähnlich. Vor allem Eltern befindet sich in der Gefahr, die Doppelbelastung von Beruf und Familie nicht mehr tragen zu können. Was hilft, ist Zeitmanagement. Der Begriff ist allerdings missverständlich. Die Zeit lässt sich nicht managen. Wir können uns nur selbst managen.", "2": "Der Wunsch nach der Zweisamkeit hat sich zu einem guten Geschäft entwickelt, denn gerade reiferen Alleinstehenden fällt es oft schwer, neue Partnerschaften herzustellen. Vermittlungsagenturen bieten ihre Dienste im Internet oder in den Tageszeitungen an. Neben vielen seriösen Firmen finden sich auf dem Markt aber auch zahlreiche Schwarze Schafe. Bei solchen Anbietern beginnen die Tricks bereits bei den Anzeigen in der Zeitung oder im Netz. Dort stellen Personen angeblich sich selbst vor. Ihre Beschreibung ist direkte auf die Wünsche älterer Singles zugeschnitten, oft genug auch schon mit ansprechendem „Originalfoto“. Wer die angegebene Telefonnummer wählt, muss dann plötzlich feststellen, es in Wirklichkeit mit einer Partnervermittlungsagentur zu tun zu haben. Und die gehen dann in der Regel schnell und aggressiv vor. Es wird ein Treffen vereinbart – und wenn man sich wirklich darauf einlassen möchte, heißt es schon hier: Aufgepasst! Wird nämlich ein neutraler Treffpunkt, beispielsweise ein Café vereinbart, verliert der Kunde sein 14-tägiges Widerrufs- bzw. Rücktrittsrecht, das ihm bei einem Hausbesuch zustehen und ihn von einem vielleicht zu schnell unterschriebenen Vertrag befreien würde.", "3": "Hat man den richtigen Partner gefunden, muss man an der Beziehung gearbeitet werden. Was viele nicht wissen: die Partnerschaft verläuft in Phasen. Fast jede Liebe beginnt mit einer Hochphase der Verliebtheit. Ist diese Phase vorüber, folgt eine Phase des satten Glücks, in der beide den Wunsch haben, mit diesem Menschen ein ganzes Leben zu verbringen. Fast alle Paare binden innerhalb einer Zeit in der Alltag in die Beziehung eintritt. Man ist gezwungen, sich in einem realistischeren Licht zu sehen. In der folgenden Stress- und Streitphase geht es darum, die Bedingungen des Zusammenlebens festzulegen, Lösungen für Partnerschaft und Beruf zu finden. Bleibt ein Paar nach dieser schwierigen Phase zusammen, festigt sich die Partnerschaft in der fünften Phase weiter und wird ruhiger. Die Partner finden zu sich selbst, erlauben sich gegenseitig mehr freie Zeit und eigene Interessen. In der letzten Phase bildet sich, was man die Liebe fürs Leben nennen kann. In der Beziehung haben sich so viel Sicherheit und Vertrauen gebildet, dass die Beziehung eine feste Basis für die Zukunft hat.", "4": "Knapp 13 Millionen Singul-Haushalte – d.h. Haushalte von Alleinlebenden – gibt es in Deutschland, und das meist unfreiwillig. Fast jeder, der alleine lebt, wünscht sich der richtigen Partner.\nDoch wie und wo ist er oder sie zu finden? Glückliche Zweisamkeit – davon träumen die meisten Singles. Oftmals stecken Singles in einer schwierigen Situation: Wer lange allein gelebt hat, wünscht sich zwar eine feste Bindung, gleichzeitig wächst aber auch die Angst davor. Dieses Wechselbad aus Wollen und Vorsichtig-Sein macht die Sache immer schwieriger – und nicht selten vergehen so die Jahre des Alleinseins. Zwar sollte man die Hoffnung nie aufgeben, den oder die Richtige irgendwann zufällig zu finden. Aber dass die Traumfrau auf einmal an die Tür klopft oder ganz plötzlich der Traummann auf einem weißen Schimmel um die Ecke reitet, ist ziemlich unwahrscheinlich: Deswegen lautet der Rat für alle Singles, ob es Ihnen gefällt oder nicht: Ausgehen, Ausgehen, Ausgehen.", "5": "Nach dem Abitur, zum Studium oder weil der Zeitpunkt einfach gekommen ist: Wenn die Kinder ausziehen, verändert sich viel, auch für die Eltern. Neben der Freude, endlich wieder Zeit und Raum für sich zu haben, entsteht auch eine Leere, die es nun zu füllen gilt. Erika Paxmann hat drei Kinder. Benni, Anna und Alina. Zwei ihrer Kinder sind schon ausgezogen, innerhalb von vier Monaten. Zurück blieben die Eltern und die 14-jährige Alina. Noch während die Kinder zu Hause wohnten, hat Erika Paxmann sich beruflich weitergebildet und sich neue Aufgaben gesucht. Trotzdem war sie traurig, als die Kinder auszogen. Die Selbständigkeit des Kindes bedeutet, dass auch die Eltern wieder ein unabhängiges Leben führen können. Die Ehepartner habe wieder mehr Zeit füreinander. Das kann auch bisher unbewusste Probleme an den Tag bringen. Viele Partner müssen sich erst wieder an ein Leben zu zweit gewöhnen. Hilfreich ist es, sich schon frühzeitig auf ein Leben „ohne“ Kinder einzustellen. Man kann sich z.B. beruflich fortbilden oder anderen eigenen Interessen nachgehen. Die Umstellung, wenn die Kinder ausziehen, ist dann nicht mehr so groß."}, "answers": {"1": "J", "2": "B", "3": "E", "4": "F", "5": "I"}, "options": {"1": ["F", "J", "G", "I", "B", "C", "H"], "2": ["B", "G", "F", "E", "A", "H", "I"], "3": ["B", "C", "A", "E", "H", "D", "J"], "4": ["G", "H", "J", "E", "B", "I", "F"], "5": ["I", "J", "A", "G", "B", "H", "C"]}}, "1.15A": {"headings": {"A": "Termindruck schon bei Kindern.", "B": "Vorsicht vor zweifelhaften Kontaktagenturen!", "C": "Liebe fürs Leben muss wachsen.", "D": "Kinder bleiben immer länger bei den Eltern wohnen.", "E": "Partnervermittlungen generell empfehlenswert.", "F": "Aktive Partnersuche gegen das Alleinsein.", "G": "Problem bei der Kindererziehung", "H": "Partnervermittlung per Telefon.", "I": "Wenn die Kinder aus dem Hause sind.", "J": "Zeitproblem in der Familie"}, "texts": {"1": "Die Krügers sind eine ganz normale Familie. Vater Bernd arbeitet 40 Stunden pro Woche bei einer Versicherung, Mutter Yvonne hat einen Teilzeitjob als Arzthelferin. Das Paar hat zwei Kinder. Tom ist neun, Linda vier Jahre alt. Nach der Arbeit holt Yvonne die beiden aus der Schule und dem Kindergarten ab. Dann geht sie einkaufen, wäscht, putzt und kocht. Wenn Bernd abends nach Hause kommt, kontrolliert er noch Hausaufgaben oder besucht seinen alten Vater, der immer häufiger Hilfe braucht. Bernd Krüger kann sich nicht erinnern, wann er das letzte Buch gelesen hat. Für Hobbys oder Bekannte bleibt keine Zeit und wenn dann ein langer Tag zu Ende geht und die beiden Kinder schlafen, sitzen Bernd und Yvonne Krüger total müde auf der Couch. In vielen Familien ist es ähnlich. Vor allem manche Eltern können die Doppelbelastung von Beruf und Familie kaum noch tragen. Was hilft, ist Zeitmanagement. Der Begriff ist allerdings missverständlich. Die Zeit lässt sich nicht managen. Wir können uns nur selbst managen.", "2": "Der Wunsch nach der Zweisamkeit hat sich zu einem guten Geschäft entwickelt, denn gerade reiferen Alleinstehenden fällt es oft schwer, neue Partner zu finden. Vermittlungsagenturen bieten ihre Dienste im Internet oder in den Tageszeitungen an. Neben vielen seriösen Firmen finden sich auf dem Markt aber auch Schwarze Schafe. Bei solchen Anbietern beginnen die Tricks bereits bei den Anzeigen in der Zeitung oder im Netz. Dort stellen Personen angeblich sich selbst vor. Ihre Beschreibung ist direkt auf die Wünsche älterer Singles zugeschnitten, oft genug auch mit ansprechendem „Originalfoto“. Wer die angegebene Telefonnummer wählt, muss dann plötzlich feststellen, es in Wirklichkeit mit einer Partnervermittlungsagentur zu tun zu haben. Und die gehen dann in der Regel schnell und aggressiv vor. Es wird ein Treffen vereinbart – und wenn man sich wirklich darauf einlassen möchte, heißt es schon hier: Aufgepasst! Wird nämlich ein neutraler Treffpunkt, beispielsweise ein Café, vereinbart, verliert der Kunde sein 14-tägiges Widerrufs- bzw. Rücktrittsrecht, das ihm bei einem Hausbesuch zustehen und ihn von einem vielleicht zu schnell unterschriebenen Vertrag befreien würde.", "3": "Wie entsteht eine langfristige Beziehung? – Was viele nicht wissen: Die Partnerschaft verläuft in Phasen. Fast jede Liebe beginnt mit einer Hochphase der Verliebtheit. Ist diese Phase vorüber, folgt eine Phase des satten Glücks, in der beide den Wunsch haben, mit diesem Menschen ein ganzes Leben zu verbringen. Fast alle Paare erleben danach eine Zeit, in der der Alltag eintritt. Man ist gezwungen, sich in einem realistischeren Licht zu sehen. In der folgenden Stress- und Streitphase geht es darum, die Bedingungen des Zusammenlebens, Lösungen für Partnerschaft und Beruf zu finden. Bleibt ein Paar nach dieser schwierigen Phase zusammen, festigt sich die Partnerschaft in der falschen Phase weiter und wird ruhiger. Die Partner finden zu sich selbst, erleben sich gegenseitig mehr frei Zeit und eigene Interessen. In der letzten Phase entsteht das, was man die Liebe, die fürs Leben nennen kann. In der Beziehung hat sich so viel Vertrauen gebildet, dass die Beziehung eine feste Basis für die Zukunft hat.", "4": "Knapp 13 Millionen Single-Haushalte gibt es in Deutschland, und das meist unfreiwillig. Fast jeder, der allein lebt, wünscht sich einen Partner. Doch wie und wo ist er oder sie zu finden? Oftmals stecken Singles in einer schwierigen Situation: Wer lange allein gelebt hat, wünscht sich zwar eine feste Bindung, gleichzeitig wächst aber auch die Angst davor.\nDieses Wechselbad aus Wollen und Vorsichtig-Sein macht die Sache immer schwieriger – und nicht selten vergehen so die Jahre des Alleinseins. Zwar sollte man die Hoffnung nie aufgeben, den oder die Richtige irgendwann zufällig zu finden. Aber dass die Traumfrau auf einmal an die Tür klopft oder plötzlich der Traumprinz auf einem weißen Schimmel um die Ecke reitet, ist unwahrscheinlich. Deswegen lautet der Rat für alle Singles: Ergreifen Sie die Initiative!", "5": "Nach dem Abitur, zum Studium oder weil der Zeitpunkt einfach gekommen ist: Wenn die Kinder ausziehen, verändert sich auch das Leben der Eltern. Neben der Freude, endlich wieder Zeit und Raum für sich zu haben, entsteht auch eine Leere, die es nun zu füllen gilt. Die Selbständigkeit des Kindes bedeutet, dass auch die Eltern wieder ein unabhängiges Leben führen können. Die Ehepartner haben wieder mehr Zeit füreinander. Das kann auch bisher unbewusste Probleme an den Tag bringen. Viele Partner müssen sich erst wieder an ein Leben zu zweit gewöhnen. Hilfreich ist es, sich frühzeitig auf ein Leben „ohne“ Kinder einzustellen. Man kann sich z. B. beruflich fortbilden oder anderen, eigenen Interessen nachgehen. Die Umstellung, wenn die Kinder ausziehen, ist dann nicht mehr so groß."}, "answers": {"1": "J", "2": "A", "3": "C", "4": "F", "5": "I"}, "options": {"1": ["A", "D", "E", "J", "F", "B", "H"], "2": ["A", "E", "G", "J", "H", "I", "B"], "3": ["A", "F", "I", "D", "E", "J", "C"], "4": ["F", "H", "B", "I", "G", "J", "D"], "5": ["D", "C", "I", "G", "E", "B", "H"]}}, "1.16": {"headings": {"A": "Viele Trampoline haben erhebliche Sicherheitsmängel.", "B": "Traditionelle Nachrichtenmedien immer noch gefragt.", "C": "Soziale Medien ersetzen alte Informationsquellen.", "D": "SCHÜLER BEREITEN NACHRICHTENSENDUNGEN VOR", "E": "Mit Nachrichten im Unterricht arbeiten.", "F": "Medienkonsum fördert ungesunde Lebensweise.", "G": "Kritik an der Nachrichtensprache", "H": "Jugendliche konsumieren mehr Fett und Zucker.", "I": "Informationen leichter verstehen.", "J": "Fachleute warnen vor unsachgemäßer Nutzung von Sprunggeräten"}, "texts": {"1": "Die meisten Menschen verbinden den Begriff Barrierefreiheit mit dem zu Gebäuden oder Transportmitteln. Dabei betrifft Barrierefreiheit viele mehr Bereich unseres Alltags so zum Beispiel auch die Informations und kommunikationstechnologie. Die A.p.A. Die Austria presse Agentur hat deshalb einen Nachrichtendienst.in einfacher.und Leicht verständlich Sprache ins leben gerufen Er wendet sich an Menschen die lese oder Lernschwierigkeiten haben oder die die deutsch sprache noch nicht so gut beherrschen für diesen Nachrichtendienst werden die wichtigsten Meldungen des Tages aus politik wirtschaft Sport kultur und Lokalnachrichten für die Niveaustufen A2 und B1 geschrieben Interessenten.können sich die Text fünfmal pro woche am späten Nachmittag per E mail schicken lassen oder über eine besondere Informationsplattform bekommen.Das projekt wird vom Sozialministerium gefördert und wurde gemeinsam mit einem Grazer Unternehmen entwickelt das auf Textübertragungen für verschiedene schwierigkeitsstufen.spezialisiert ist Der Nachrichtendienst wurde bereits als Innovativer Beitrag zum Thema Barrierefreiheit ausgezeichnet.", "2": "Die WHO, die Weltgesundheitsorganisation warnt vor den Folgen ungesunder Werbung im Internet. Kinder und Jugendliche treffen beim Nutzen der Sozialen Medien häufig auf Anzeigen für ungesunde Lebensmittel wie Süßigkeiten oder salzig und fettreiche Snacks. So werden Übergewicht und damit zusammenhängende Krankheiten im Erwachsenenalter gefördert, mahnt die Organisation. Sie fordert deshalb Regierungen dazu auf, diese Werbung zum Schutze der Kinder stärker zu begrenzen. Die WHO weist außerdem auf die Gefahr von Bewegungsmangel im Zusammenhang mit den Neuen Medien hin. Das betrifft nicht nur Jugendliche, sondern auch Kleinkinder. Gerade in den ersten sollte der natürliche Bewegungsdrang der Kinder genutzt werden, damit sie Freude an Bewegung und Sport entwickeln. Kleinkinder sollten sich mindestens drei Stunden pro Tag bewegen und so wenig Zeit wie möglich vor einem Bildschirm verbringen. Überhaupt sollten Kinder, die jünger als zwei Jahre sind, grundsätzlich nicht vor ein Tablet oder einen PC gesetzt werden. Denn wer viel sitzt, wird in der Folge leichter krank.", "3": "Schülerinnen und Schüler sollen im Schulunterricht auch den Umgang mit Nachrichten lernen. Das forderten kürzlich in Wien die Teilnehmenden an einer Konferenz zur politischen Bildung von Jugendlichen Das Ziel dabei ist, jungen Menschen den kritischen Umgang mit den Inhalten und der Präsentation von Nachrichten beizubringen. Heute ist der Zugriff auf Nachrichten dagegen so einfach wie noch nie. Viele Nachrichtensendungen des ORF können mindestens eine Woche lang im internet abgerufen werden Schülerinnen und Schüler können sie so zur eigenen Arbeit nutzen oder gemeinsam in der klasse besprechen. Die Konferenz nannte auch gleich konkrete Fragen für die Analyse von Nachrichtensendungen: Welche Nachrichten werden angeboten - Politik und Wirtschaft, Unfälle Sport oder Prominens? Berichten die Moderatorinnen und Moderatoren sachlich oder machen sie persönliche Bemerkungen zu den einzelnen Nachrichten? Wie ist die Reihenfolge wie ist die Reihenfolge die lange sind die Beiträge? Am besten eignen sich die Unterrichtsfächer Politische Bildung, Geschichte in Deutsch oder Englisch, so die Expertenrunde.", "4": "Mit dem Trampolin den Körper in Schwung bringen für viele Menschen ist das Sprunggerät eine gute Möglichkeit, sich mit viel Spaß und ohne allzu großen Aufwand zu bewegen.\nBesonders beliebt ist das Trampolin bei Kindern. Expertinnen und Experten betonen auch die Vorteile des Hüpfens auf dem Trampolin. Die Bewegung auf dem Trampolin fördert nicht nur die Beweglichkeit sondern auch die Koordination. Allerdings ist sie nicht ganz ungefährlich. Orthopäden weisen auf die extreme hohe Unfallgefahr hin. Die Ärzteschaft möchte Kindern und Eltern keineswegs die Freude am Trampolinspringen verderben. Vielmehr möchte sie dazu aufrufen, einige Sicherheitsregeln zu befolgen, mit denen sich Unfälle leicht vermeiden lassen. Eine harte, ebene Stellfläche und ein Sicherheitsnetz sind dabei unverzichtbare Voraussetzungen, Viele Sportvereine bieten Kurse an, in denen Kinder sicheres Trampolinspringen lernen können.", "5": "Die Klage, dass Jugendliche und Junge Erwachsene kein Interesse mehr an Nachrichten haben, ist unbegründet. So lautet zumindest eine der Schlussfolgerungen aus einer Studie zum durchschnittlichen Medienkonsum junger Menschen mit dem Schwerpunkt Nachrichten. Demnach lesen oder hören in Österreich nahezu 50% der Personen unter 30 Jahren täglich Nachrichten viele der Befragten gaben an, dass sie sich nicht auf die Inhalte der Sozialen Medien verlassen möchte, da ihre Glaubwürdigkeit oft angezweifelt wird. Den Klassischen Medien wie Nachrichtensendungen oder Tageszeitungen wird hingegen eher geglaubt. Soziale Netzwerke können herkömmliche Nachrichtenquellen nicht ersetzen, so die vorherrschende Meinung auch wenn diese Quellen in der Gestaltung oft als eher langweilig empfunden werden."}, "answers": {"1": "I", "2": "F", "3": "E", "4": "J", "5": "B"}, "options": {"1": ["J", "D", "G", "E", "I", "C", "A"], "2": ["D", "B", "J", "C", "A", "E", "F"], "3": ["J", "C", "G", "I", "B", "E", "D"], "4": ["A", "I", "G", "B", "F", "C", "J"], "5": ["B", "J", "C", "A", "E", "I", "G"]}}, "1.17": {"headings": {"A": "Sport ist gesund – wenn man einige wichtige Regeln beachtet.", "B": "Griechische Sportler so erfolgreich wie nie zuvor.", "C": "Fitness auch mit wenig Zeitaufwand erreichbar.", "D": "Geprüfte Qualität für Babys.", "E": "Bluthochdruck beschleunigt das Abnehmen.", "F": "Sportbegeisterte Eltern – und auch die Babys sind beim Joggen dabei.", "G": "Täglich kurze Sprints besser als langes Ausdauertraining.", "H": "Ein Leistungssport für jedes Alter.", "I": "Unüberschaubares Angebot an Kinderwagen überfordert junge Eltern.", "J": "Autoindustrie: In Zukunft Mobilität ohne Grenzen"}, "texts": {"1": "An der Ostküste Attikas in Griechenland lag in der Antike der Ort Marathon. Dort siegte der griechische König Milthiades im Jahr 490 vor Christus über das Heer der Perser. Der Sage nach soll ein Soldat die 42,2 km lange Strecke nach Athen gerannt sein, um die Nachricht dieses für Griechenland wichtigen Sieges zu überbringen. Bei seiner Ankunft in Athen brach er noch während er die Nachricht verkündete, vor Erschöpfung tot zusammen. Auf diese Legende geht eine sportliche Disziplin zurück: der Marathonlauf. Bereits seit 1896 ist er olympische Disziplin, seit 1984 auch für Frauen. Die Streckenlänge von 42195 m wurde 1924 festgelegt. Der Marathonlauf gilt als einziger Leistungssport, der bis ins hohe Alter ausgeübt werden kann Wissenschaftler erklären das mit der menschlichen Evolution. Der Mensch jagte in der Frühzeit seine Beute so lange vor sich her bis diese vor Erschöpfung nicht mehr weiter konnte Die Fähigkeit ausdauernd über lang strecken zu rennen ist also in den Menschen Genen verankert.", "2": "Warum soll sich der Mensch nun auf Straßen und Wegen fortbewegen? Sich in Feld und Wald, über Stock und Stein fortzubewegen, ist mindestens interessant interessant. Daher erfand die Autoindustrie den Geländewagen und die Fahrradindustrie das Mountainbike. Da fehlte eigentlich nur noch eine Neuentwicklung eines Gefährts, seine Mobilitätsfähigkeit vorher relativ zu vergrößern. Doch das ist jetzt auch vorbei: Im Trend liegt jetzt der Jogging-Kinderwagen, ein Kinderwagen mit nur noch drei bereiften Rädern. Diese neuen Tra
