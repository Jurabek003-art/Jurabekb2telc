 unter fachkompetenter Anleitung Luftsprünge zu machen.\n\nText 5\n\nSporttauchen ist eine fantastische Natursportart. In den Vereinen und Tauchschulen des Verbandes Deutscher Sporttaucher wird das immer wieder faszinierende Sporttauchen mit verschiedenen Schwerpunkten angeboten. Dort wird auch Tauchfitness aufgebaut und regelmäßig trainiert. Sie können sich in allen Bereichen von gut geschulten Trainern ausbilden lassen und die Welt unter Wasser kennen lernen. Im Sporttauchen sollte man sich auf jeden Fall durch regelmäßiges Training „tauchfit“ halten. Eine ausreichende Kondition unter Wasser ist sehr wichtig, denn untrainiert ist man als Sporttaucher ein Risiko für sich und andere. Ziel des Tauchtrainings ist ebenfalls das Lernen der richtigen Technik für das Atmen und das Beherrschen der Techniken für das Abtauchen. Eigentlich braucht man für das Tauchen nicht viel. Für das allgemeine Training reichen eine Tauchermaske, ein Schnorchel, mit dem man auch ohne Geräte Luft bekommt und Flossen, die wie Schuhe über die Füße gezogen werden. Alle anderen Tauchgeräte kann man in praktisch jedem Verein oder in einer der vielen Tauchschulen im In- und Ausland preiswert ausleihen.", "1.15": "Überschriften\n\na) Keine Zeit für die Kinder\n\nb) Vorsicht vor zweifelhaften Kontaktagenturen!\n\nc) Liebe fürs Leben muss wachsen\n\nd) Mehr Zeit für Hobbys\n\ne) Partnervermittlungen generell empfehlenswert\n\nf) Wer sucht, der findet\n\ng) Probleme bei der Kindererziehung\n\nh) Partnervermittlung per Telefon\n\ni) Wenn die Kinder aus dem Haus sind\n\nj) Zeitprobleme in der Familie\n\nText 1\n\nDie Krüger sind eine ganz normale Familie. Vater Bernd arbeitet 40 Stunden pro Woche in einer Versicherungsagentur, Mutter Yvonne hat einen Teilzeitjob als Arzthelferin. Das Paar hat zwei Kinder. Tom ist neun, Linda ist vier Jahre alt. Nach ihrer Arbeit holt Yvonne die beiden aus der Schule und dem Kindergarten ab. Dann geht sie einkaufen, sie wäscht, putzt und kocht, sie bringt Tom zum Fußballtraining oder Linda zum Turnen. Wenn Bernd abends nach Hause kommt, kontrolliert er noch Hausaufgaben oder besucht seinen alten Vater, der immer öfter seine Hilfe braucht. Bernd Krüger kann sich nicht erinnern, wann er das letzte Buch gelesen hat. Für Sport bleibt keine Zeit, Freunde treffen seine Frau und er eher selten. Und wenn dann ein langer Tag zu Ende geht und die beiden Kinder endlich schlafen, sitzen Bernd und Yvonne Krüger total müde auf der Couch. In vielen Familien ist es ähnlich. Vor allem Eltern befindet sich in der Gefahr, die Doppelbelastung von Beruf und Familie nicht mehr tragen zu können. Was hilft, ist Zeitmanagement. Der Begriff ist allerdings missverständlich. Die Zeit lässt sich nicht managen. Wir können uns nur selbst managen.\n\nText 2\n\nDer Wunsch nach der Zweisamkeit hat sich zu einem guten Geschäft entwickelt, denn gerade reiferen Alleinstehenden fällt es oft schwer, neue Partnerschaften herzustellen. Vermittlungsagenturen bieten ihre Dienste im Internet oder in den Tageszeitungen an. Neben vielen seriösen Firmen finden sich auf dem Markt aber auch zahlreiche Schwarze Schafe. Bei solchen Anbietern beginnen die Tricks bereits bei den Anzeigen in der Zeitung oder im Netz. Dort stellen Personen angeblich sich selbst vor. Ihre Beschreibung ist direkte auf die Wünsche älterer Singles zugeschnitten, oft genug auch schon mit ansprechendem „Originalfoto“. Wer die angegebene Telefonnummer wählt, muss dann plötzlich feststellen, es in Wirklichkeit mit einer Partnervermittlungsagentur zu tun zu haben. Und die gehen dann in der Regel schnell und aggressiv vor. Es wird ein Treffen vereinbart – und wenn man sich wirklich darauf einlassen möchte, heißt es schon hier: Aufgepasst! Wird nämlich ein neutraler Treffpunkt, beispielsweise ein Café vereinbart, verliert der Kunde sein 14-tägiges Widerrufs- bzw. Rücktrittsrecht, das ihm bei einem Hausbesuch zustehen und ihn von einem vielleicht zu schnell unterschriebenen Vertrag befreien würde.\n\nText 3\n\nHat man den richtigen Partner gefunden, muss man an der Beziehung gearbeitet werden. Was viele nicht wissen: die Partnerschaft verläuft in Phasen. Fast jede Liebe beginnt mit einer Hochphase der Verliebtheit. Ist diese Phase vorüber, folgt eine Phase des satten Glücks, in der beide den Wunsch haben, mit diesem Menschen ein ganzes Leben zu verbringen. Fast alle Paare binden innerhalb einer Zeit in der Alltag in die Beziehung eintritt. Man ist gezwungen, sich in einem realistischeren Licht zu sehen. In der folgenden Stress- und Streitphase geht es darum, die Bedingungen des Zusammenlebens festzulegen, Lösungen für Partnerschaft und Beruf zu finden. Bleibt ein Paar nach dieser schwierigen Phase zusammen, festigt sich die Partnerschaft in der fünften Phase weiter und wird ruhiger. Die Partner finden zu sich selbst, erlauben sich gegenseitig mehr freie Zeit und eigene Interessen. In der letzten Phase bildet sich, was man die Liebe fürs Leben nennen kann. In der Beziehung haben sich so viel Sicherheit und Vertrauen gebildet, dass die Beziehung eine feste Basis für die Zukunft hat.\n\nText 4\n\nKnapp 13 Millionen Singul-Haushalte – d.h. Haushalte von Alleinlebenden – gibt es in Deutschland, und das meist unfreiwillig. Fast jeder, der alleine lebt, wünscht sich der richtigen Partner.\n  Doch wie und wo ist er oder sie zu finden? Glückliche Zweisamkeit – davon träumen die meisten Singles. Oftmals stecken Singles in einer schwierigen Situation: Wer lange allein gelebt hat, wünscht sich zwar eine feste Bindung, gleichzeitig wächst aber auch die Angst davor. Dieses Wechselbad aus Wollen und Vorsichtig-Sein macht die Sache immer schwieriger – und nicht selten vergehen so die Jahre des Alleinseins. Zwar sollte man die Hoffnung nie aufgeben, den oder die Richtige irgendwann zufällig zu finden. Aber dass die Traumfrau auf einmal an die Tür klopft oder ganz plötzlich der Traummann auf einem weißen Schimmel um die Ecke reitet, ist ziemlich unwahrscheinlich: Deswegen lautet der Rat für alle Singles, ob es Ihnen gefällt oder nicht: Ausgehen, Ausgehen, Ausgehen.\n\nText 5\n\nNach dem Abitur, zum Studium oder weil der Zeitpunkt einfach gekommen ist: Wenn die Kinder ausziehen, verändert sich viel, auch für die Eltern. Neben der Freude, endlich wieder Zeit und Raum für sich zu haben, entsteht auch eine Leere, die es nun zu füllen gilt. Erika Paxmann hat drei Kinder. Benni, Anna und Alina. Zwei ihrer Kinder sind schon ausgezogen, innerhalb von vier Monaten. Zurück blieben die Eltern und die 14-jährige Alina. Noch während die Kinder zu Hause wohnten, hat Erika Paxmann sich beruflich weitergebildet und sich neue Aufgaben gesucht. Trotzdem war sie traurig, als die Kinder auszogen. Die Selbständigkeit des Kindes bedeutet, dass auch die Eltern wieder ein unabhängiges Leben führen können. Die Ehepartner habe wieder mehr Zeit füreinander. Das kann auch bisher unbewusste Probleme an den Tag bringen. Viele Partner müssen sich erst wieder an ein Leben zu zweit gewöhnen. Hilfreich ist es, sich schon frühzeitig auf ein Leben „ohne“ Kinder einzustellen. Man kann sich z.B. beruflich fortbilden oder anderen eigenen Interessen nachgehen. Die Umstellung, wenn die Kinder ausziehen, ist dann nicht mehr so groß.", "1.15A": "Überschriften\n\na) Termindruck schon bei Kindern.\n\nb) Vorsicht vor zweifelhaften Kontaktagenturen!\n\nc) Liebe fürs Leben muss wachsen.\n\nd) Kinder bleiben immer länger bei den Eltern wohnen.\n\ne) Partnervermittlungen generell empfehlenswert.\n\nf) Aktive Partnersuche gegen das Alleinsein.\n\ng) Problem bei der Kindererziehung\n\nh) Partnervermittlung per Telefon.\n\ni) Wenn die Kinder aus dem Hause sind.\n\nj) Zeitproblem in der Familie\n\nText 1\n\nDie Krügers sind eine ganz normale Familie. Vater Bernd arbeitet 40 Stunden pro Woche bei einer Versicherung, Mutter Yvonne hat einen Teilzeitjob als Arzthelferin. Das Paar hat zwei Kinder. Tom ist neun, Linda vier Jahre alt. Nach der Arbeit holt Yvonne die beiden aus der Schule und dem Kindergarten ab. Dann geht sie einkaufen, wäscht, putzt und kocht. Wenn Bernd abends nach Hause kommt, kontrolliert er noch Hausaufgaben oder besucht seinen alten Vater, der immer häufiger Hilfe braucht. Bernd Krüger kann sich nicht erinnern, wann er das letzte Buch gelesen hat. Für Hobbys oder Bekannte bleibt keine Zeit und wenn dann ein langer Tag zu Ende geht und die beiden Kinder schlafen, sitzen Bernd und Yvonne Krüger total müde auf der Couch. In vielen Familien ist es ähnlich. Vor allem manche Eltern können die Doppelbelastung von Beruf und Familie kaum noch tragen. Was hilft, ist Zeitmanagement. Der Begriff ist allerdings missverständlich. Die Zeit lässt sich nicht managen. Wir können uns nur selbst managen.\n\nText 2\n\nDer Wunsch nach der Zweisamkeit hat sich zu einem guten Geschäft entwickelt, denn gerade reiferen Alleinstehenden fällt es oft schwer, neue Partner zu finden. Vermittlungsagenturen bieten ihre Dienste im Internet oder in den Tageszeitungen an. Neben vielen seriösen Firmen finden sich auf dem Markt aber auch Schwarze Schafe. Bei solchen Anbietern beginnen die Tricks bereits bei den Anzeigen in der Zeitung oder im Netz. Dort stellen Personen angeblich sich selbst vor. Ihre Beschreibung ist direkt auf die Wünsche älterer Singles zugeschnitten, oft genug auch mit ansprechendem „Originalfoto“. Wer die angegebene Telefonnummer wählt, muss dann plötzlich feststellen, es in Wirklichkeit mit einer Partnervermittlungsagentur zu tun zu haben. Und die gehen dann in der Regel schnell und aggressiv vor. Es wird ein Treffen vereinbart – und wenn man sich wirklich darauf einlassen möchte, heißt es schon hier: Aufgepasst! Wird nämlich ein neutraler Treffpunkt, beispielsweise ein Café, vereinbart, verliert der Kunde sein 14-tägiges Widerrufs- bzw. Rücktrittsrecht, das ihm bei einem Hausbesuch zustehen und ihn von einem vielleicht zu schnell unterschriebenen Vertrag befreien würde.\n\nText 3\n\nWie entsteht eine langfristige Beziehung? – Was viele nicht wissen: Die Partnerschaft verläuft in Phasen. Fast jede Liebe beginnt mit einer Hochphase der Verliebtheit. Ist diese Phase vorüber, folgt eine Phase des satten Glücks, in der beide den Wunsch haben, mit diesem Menschen ein ganzes Leben zu verbringen. Fast alle Paare erleben danach eine Zeit, in der der Alltag eintritt. Man ist gezwungen, sich in einem realistischeren Licht zu sehen. In der folgenden Stress- und Streitphase geht es darum, die Bedingungen des Zusammenlebens, Lösungen für Partnerschaft und Beruf zu finden. Bleibt ein Paar nach dieser schwierigen Phase zusammen, festigt sich die Partnerschaft in der falschen Phase weiter und wird ruhiger. Die Partner finden zu sich selbst, erleben sich gegenseitig mehr frei Zeit und eigene Interessen. In der letzten Phase entsteht das, was man die Liebe, die fürs Leben nennen kann. In der Beziehung hat sich so viel Vertrauen gebildet, dass die Beziehung eine feste Basis für die Zukunft hat.\n\nText 4\n\nKnapp 13 Millionen Single-Haushalte gibt es in Deutschland, und das meist unfreiwillig. Fast jeder, der allein lebt, wünscht sich einen Partner. Doch wie und wo ist er oder sie zu finden? Oftmals stecken Singles in einer schwierigen Situation: Wer lange allein gelebt hat, wünscht sich zwar eine feste Bindung, gleichzeitig wächst aber auch die Angst davor.\n  Dieses Wechselbad aus Wollen und Vorsichtig-Sein macht die Sache immer schwieriger – und nicht selten vergehen so die Jahre des Alleinseins. Zwar sollte man die Hoffnung nie aufgeben, den oder die Richtige irgendwann zufällig zu finden. Aber dass die Traumfrau auf einmal an die Tür klopft oder plötzlich der Traumprinz auf einem weißen Schimmel um die Ecke reitet, ist unwahrscheinlich. Deswegen lautet der Rat für alle Singles: Ergreifen Sie die Initiative!\n\nText 5\n\nNach dem Abitur, zum Studium oder weil der Zeitpunkt einfach gekommen ist: Wenn die Kinder ausziehen, verändert sich auch das Leben der Eltern. Neben der Freude, endlich wieder Zeit und Raum für sich zu haben, entsteht auch eine Leere, die es nun zu füllen gilt. Die Selbständigkeit des Kindes bedeutet, dass auch die Eltern wieder ein unabhängiges Leben führen können. Die Ehepartner haben wieder mehr Zeit füreinander. Das kann auch bisher unbewusste Probleme an den Tag bringen. Viele Partner müssen sich erst wieder an ein Leben zu zweit gewöhnen. Hilfreich ist es, sich frühzeitig auf ein Leben „ohne“ Kinder einzustellen. Man kann sich z. B. beruflich fortbilden oder anderen, eigenen Interessen nachgehen. Die Umstellung, wenn die Kinder ausziehen, ist dann nicht mehr so groß.", "1.16": "Überschriften\n\na) Viele Trampoline haben erhebliche Sicherheitsmängel.\n\nb) Traditionelle Nachrichtenmedien immer noch gefragt.\n\nc) Soziale Medien ersetzen alte Informationsquellen.\n\nd) SCHÜLER BEREITEN NACHRICHTENSENDUNGEN VOR\n\ne) Mit Nachrichten im Unterricht arbeiten.\n\nf) Medienkonsum fördert ungesunde Lebensweise.\n\ng) Kritik an der Nachrichtensprache\n\nh) Jugendliche konsumieren mehr Fett und Zucker.\n\ni) Informationen leichter verstehen.\n\nj) Fachleute warnen vor unsachgemäßer Nutzung von Sprunggeräten\n\nText 1\n\nDie meisten Menschen verbinden den Begriff Barrierefreiheit mit dem zu Gebäuden oder Transportmitteln. Dabei betrifft Barrierefreiheit viele mehr Bereich unseres Alltags so zum Beispiel auch die Informations und kommunikationstechnologie. Die A.p.A. Die Austria presse Agentur hat deshalb einen Nachrichtendienst.in einfacher.und Leicht verständlich Sprache ins leben gerufen Er wendet sich an Menschen die lese oder Lernschwierigkeiten haben oder die die deutsch sprache noch nicht so gut beherrschen für diesen Nachrichtendienst werden die wichtigsten Meldungen des Tages aus politik wirtschaft Sport kultur und Lokalnachrichten für die Niveaustufen A2 und B1 geschrieben Interessenten.können sich die Text fünfmal pro woche am späten Nachmittag per E mail schicken lassen oder über eine besondere Informationsplattform bekommen.Das projekt wird vom Sozialministerium gefördert und wurde gemeinsam mit einem Grazer Unternehmen entwickelt das auf Textübertragungen für verschiedene schwierigkeitsstufen.spezialisiert ist Der Nachrichtendienst wurde bereits als Innovativer Beitrag zum Thema Barrierefreiheit ausgezeichnet.\n\nText 2\n\nDie WHO, die Weltgesundheitsorganisation warnt vor den Folgen ungesunder Werbung im Internet. Kinder und Jugendliche treffen beim Nutzen der Sozialen Medien häufig auf Anzeigen für ungesunde Lebensmittel wie Süßigkeiten oder salzig und fettreiche Snacks. So werden Übergewicht und damit zusammenhängende Krankheiten im Erwachsenenalter gefördert, mahnt die Organisation. Sie fordert deshalb Regierungen dazu auf, diese Werbung zum Schutze der Kinder stärker zu begrenzen. Die WHO weist außerdem auf die Gefahr von Bewegungsmangel im Zusammenhang mit den Neuen Medien hin. Das betrifft nicht nur Jugendliche, sondern auch Kleinkinder. Gerade in den ersten sollte der natürliche Bewegungsdrang der Kinder genutzt werden, damit sie Freude an Bewegung und Sport entwickeln. Kleinkinder sollten sich mindestens drei Stunden pro Tag bewegen und so wenig Zeit wie möglich vor einem Bildschirm verbringen. Überhaupt sollten Kinder, die jünger als zwei Jahre sind, grundsätzlich nicht vor ein Tablet oder einen PC gesetzt werden. Denn wer viel sitzt, wird in der Folge leichter krank.\n\nText 3\n\nSchülerinnen und Schüler sollen im Schulunterricht auch den Umgang mit Nachrichten lernen. Das forderten kürzlich in Wien die Teilnehmenden an einer Konferenz zur politischen Bildung von Jugendlichen Das Ziel dabei ist, jungen Menschen den kritischen Umgang mit den Inhalten und der Präsentation von Nachrichten beizubringen. Heute ist der Zugriff auf Nachrichten dagegen so einfach wie noch nie. Viele Nachrichtensendungen des ORF können mindestens eine Woche lang im internet abgerufen werden Schülerinnen und Schüler können sie so zur eigenen Arbeit nutzen oder gemeinsam in der klasse besprechen. Die Konferenz nannte auch gleich konkrete Fragen für die Analyse von Nachrichtensendungen: Welche Nachrichten werden angeboten - Politik und Wirtschaft, Unfälle Sport oder Prominens? Berichten die Moderatorinnen und Moderatoren sachlich oder machen sie persönliche Bemerkungen zu den einzelnen Nachrichten? Wie ist die Reihenfolge wie ist die Reihenfolge die lange sind die Beiträge? Am besten eignen sich die Unterrichtsfächer Politische Bildung, Geschichte in Deutsch oder Englisch, so die Expertenrunde.\n\nText 4\n\nMit dem Trampolin den Körper in Schwung bringen für viele Menschen ist das Sprunggerät eine gute Möglichkeit, sich mit viel Spaß und ohne allzu großen Aufwand zu bewegen.\n  Besonders beliebt ist das Trampolin bei Kindern. Expertinnen und Experten betonen auch die Vorteile des Hüpfens auf dem Trampolin. Die Bewegung auf dem Trampolin fördert nicht nur die Beweglichkeit sondern auch die Koordination. Allerdings ist sie nicht ganz ungefährlich. Orthopäden weisen auf die extreme hohe Unfallgefahr hin. Die Ärzteschaft möchte Kindern und Eltern keineswegs die Freude am Trampolinspringen verderben. Vielmehr möchte sie dazu aufrufen, einige Sicherheitsregeln zu befolgen, mit denen sich Unfälle leicht vermeiden lassen. Eine harte, ebene Stellfläche und ein Sicherheitsnetz sind dabei unverzichtbare Voraussetzungen, Viele Sportvereine bieten Kurse an, in denen Kinder sicheres Trampolinspringen lernen können.\n\nText 5\n\nDie Klage, dass Jugendliche und Junge Erwachsene kein Interesse mehr an Nachrichten haben, ist unbegründet. So lautet zumindest eine der Schlussfolgerungen aus einer Studie zum durchschnittlichen Medienkonsum junger Menschen mit dem Schwerpunkt Nachrichten. Demnach lesen oder hören in Österreich nahezu 50% der Personen unter 30 Jahren täglich Nachrichten viele der Befragten gaben an, dass sie sich nicht auf die Inhalte der Sozialen Medien verlassen möchte, da ihre Glaubwürdigkeit oft angezweifelt wird. Den Klassischen Medien wie Nachrichtensendungen oder Tageszeitungen wird hingegen eher geglaubt. Soziale Netzwerke können herkömmliche Nachrichtenquellen nicht ersetzen, so die vorherrschende Meinung auch wenn diese Quellen in der Gestaltung oft als eher langweilig empfunden werden.", "1.17": "Überschriften\n\na) Sport ist gesund – wenn man einige wichtige Regeln beachtet.\n\nb) Griechische Sportler so erfolgreich wie nie zuvor.\n\nc) Fitness auch mit wenig Zeitaufwand erreichbar.\n\nd) Geprüfte Qualität für Babys.\n\ne) Bluthochdruck beschleunigt das Abnehmen.\n\nf) Sportbegeisterte Eltern – und auch die Babys sind beim Joggen dabei.\n\ng) Täglich kurze Sprints besser als langes Ausdauertraining.\n\nh) Ein Leistungssport für jedes Alter.\n\ni) Unüberschaubares Angebot an Kinderwagen überfordert junge Eltern.\n\nj) Autoindustrie: In Zukunft Mobilität ohne Grenzen\n\nText 1\n\nAn der Ostküste Attikas in Griechenland lag in der Antike der Ort Marathon. Dort siegte der griechische König Milthiades im Jahr 490 vor Christus über das Heer der Perser. Der Sage nach soll ein Soldat die 42,2 km lange Strecke nach Athen gerannt sein, um die Nachricht dieses für Griechenland wichtigen Sieges zu überbringen. Bei seiner Ankunft in Athen brach er noch während er die Nachricht verkündete, vor Erschöpfung tot zusammen. Auf diese Legende geht eine sportliche Disziplin zurück: der Marathonlauf. Bereits seit 1896 ist er olympische Disziplin, seit 1984 auch für Frauen. Die Streckenlänge von 42195 m wurde 1924 festgelegt. Der Marathonlauf gilt als einziger Leistungssport, der bis ins hohe Alter ausgeübt werden kann Wissenschaftler erklären das mit der menschlichen Evolution. Der Mensch jagte in der Frühzeit seine Beute so lange vor sich her bis diese vor Erschöpfung nicht mehr weiter konnte Die Fähigkeit ausdauernd über lang strecken zu rennen ist also in den Menschen Genen verankert.\n\nText 2\n\nWarum soll sich der Mensch nun auf Straßen und Wegen fortbewegen? Sich in Feld und Wald, über Stock und Stein fortzubewegen, ist mindestens interessant interessant. Daher erfand die Autoindustrie den Geländewagen und die Fahrradindustrie das Mountainbike. Da fehlte eigentlich nur noch eine Neuentwicklung eines Gefährts, seine Mobilitätsfähigkeit vorher relativ zu vergrößern. Doch das ist jetzt auch vorbei: Im Trend liegt jetzt der Jogging-Kinderwagen, ein Kinderwagen mit nur noch drei bereiften Rädern. Diese neuen Transportmittel für Babys können sportbegeisterte und von grenzenloser Mobilität träumende Eltern jetzt samt Kind beim Joggen oder beim Inlineskaten vor sich herschieben. Die Babys sollen sich darum kümmern, sein von der Rechte, die mit sich zu fühlen, um sich zu kümmern. Doch der die Gerätesicherheitsbewährte TÜV, bei Fahrzeugbesitzern in Deutschland schon seit langem als Spielverderber bekannt, warnte vor den Joggingbummel: Sie haben einen ungünstigen Schwerpunkt auf der Hinterachse, d.h. sie kippen leicht nach hinten um, und sie können sich leicht selbständig machen – jedenfalls solange, bis die Babys das Bremsen lernen haben.\n\nText 3\n\nSchweizer Forscher haben herausgefunden, dass nur 6 Minuten Hochleistungstraining pro Woche – also weniger als eine Minute pro Tag – ausreichen, um den Körper fit zu halten. In einem Versuch mit mehreren Probanden nahm eine Gruppe an einem traditionellen Ausdauertraining teil, mit je ein bis zwei Trainingsstunden täglich. Die zweite Gruppe führte täglich 60 Sekunden dauernde Radsprints durch, wobei die Teilnehmer quasi aus dem Stand Höchstgeschwindigkeit erzielen mussten. Das Resultat war überraschend: Beide Gruppen zeigten die gleichen gesundheitlichen Verbesserungen. Die Muskeln nahmen gleich viel Sauerstoff auf, und auch die Werte des für die Sauerstoffaufnahme verantwortlichen Zitratzyklus waren gleich. Sehr kurze und hochintensive sportliche Übungen verbessern die Fitness genauso wie das zeitraubende traditionelle Ausdauertraining.\n\nText 4\n\nMehr Bewegung als Ausgleich für zu langes Sitzen im Büro und in der Freizeit ist jetzt angesagt, um Übergewicht, Bluthochdruck und Herz-Kreislauf-Erkrankungen vorzubeugen und um fit zu bleiben. Gerade für Anfänger gibt es jedoch bei den die Ausdauer trainierenden Sportarten wie die gegen einige Grundregeln, die beachtet werden müssen, will man gesundheitliche Schäden vermeiden.\n[25.07.2026 11:18] Jurabek: Die ersten Trainingseinheiten sollen nicht länger als 20 bis 30 Minuten dauern und zweimal pro Woche durchgeführt werden. Der Puls sollte nie den Wert 200 minus Lebensalter überschreiten, bei einem 20-Jährigen kann er also bei 180, bei einem 60-Jährigen hingegen nur bei 140 liegen. Außerdem gilt für alle, die beim Sport abnehmen möchten: Je höher der Pulsschlag, desto weniger Fett wird verbrannt. Hoher Pulsschlag lässt Sporttreibenden langsamer abnehmen.\n\nText 5\n\nViele frischgebackene Eltern stehen einem riesigen Angebot an Kinderwagen gegenüber, das in Kinderläden und Großmärkten feilgeboten wird. Doch welcher ist der richtige? Experten raten, beim Kauf dieses für die ersten Jahre mit dem Kleinkind wichtigen Gefährts auf ein paar Dinge zu achten. Erstens sollte die Matratze nicht zu weich sein, damit das Kind nicht einsinkt, wodurch die Atmung behindert werden kann. Zweitens sollten die Räder gefedert sein, um Erschütterungen auf unebenen Wegen auszugleichen. Ein hoher Wagen schützt die Babys vor dem Auspuff der Autos an Straßenkreuzungen. Zusammenklappbare Wagen passen in jeden Kofferraum und lassen sich fast überallhin mitnehmen. Der Wagen sollte vor allem kippsicher sein und keine scharfen Kanten haben, an denen sich die Kinder verletzen können. Vom TÜV geprüfte Kinderwagen erhalten ein Prüfzeichen. Damit haben die Eltern eine gewisse Sicherheit, dass der Kinderwagen auch nach Dauergebrauch nicht zu einem Sicherheitsrisiko für ihr Kind werden kann.", "1.18": "Überschriften\n\na) Erneuerungskur für einen alten Markt\n\nb) Junge Influencer werben für Bioprodukte\n\nc) Neues Buch über einen Wiener Architekten erschienen\n\nd) Österreichs beliebteste Marktplätze\n\ne) Schreiben im Internet für die Karriere\n\nf) Schulung zum Erfolg im Beruf\n\ng) Seminar: Produkte erfolgreich verkaufen\n\nh) Warum immer mehr Menschen auf Märkten einkaufen\n\ni) Wenn Blogger Firmengeheimnisse verraten\n\nj) Wissenswertes über Wiens größten innerstädtischen Markt.\n\nText 1\n\nDas Lesemagazin MENU hat eine Umfrage zu den populärsten Märkten in Österreich durchgeführt. Vor der eigentlichen Abstimmung hatte das Magazin seine Leserinnen und Leser dazu aufgerufen, Märkte zu nominieren. Aus den häufigsten Nennungen hat das Redaktionsteam eine Liste mit zwanzig Märkten aus ganz Österreich erstellt und zwei Wochen lang online zur Abstimmung angeboten. Als klarer Sieger ging der Markt am Domplatz von St. Pölten hervor. Dieser ist berühmt für sein ganzjähriges Einkaufsvergnügen. Als Nahversorger für die Innenstadt und Anziehungspunkt für Menschen aus dem Umland trägt er erheblich zur Lebensqualität der Bevölkerung bei. Auf Platz zwei und drei folgten zwei burgenländische Märkte, nämlich der Markt der Erde in Parndorf und der Regionalmarkt in den ehemaligen Stallungen von Schloss Esterházy in Eisenstadt. Das große Interesse an der Abstimmung zeigt laut MENU, wie sehr die Konsumentinnen und Konsumenten Märkte schätzen.\n\nText 2\n\nSie sind der Meinung, dass Ihre Qualifikationen ausreichen, um Karriere zu machen? Qualifikationen und Berufserfahrung sind zwar wichtige Kriterien für den erfolgreichen Aufstieg auf der Karriereleiter, doch ohne gutes Selbstmarketing werden Sie auf halbem Wege stehenbleiben. Das ist letztlich genauso wie beim Verkauf eines Produktes: Es reicht nicht, dass ein Produkt gut ist, es muss auch gut beworben werden. Während Marketing das Produkt vorteilhaft am Markt platzieren möchte, verfolgt man beim Selbstmarketing das Ziel, seine persönlichen und Stärken bewusst hervorzuheben. Mit anderen Worten: Es geht darum, sich gut zu verkaufen. Selbstmarketing beginnt schon bei der Bewerbung und dem Vorstellungsgespräch und setzt sich im Job fort. Auch dort müssen Sie auf sich aufmerksam machen. Doch Achtung: Angeber mag niemand! Wie Sie das richtige Maß finden, erfahren Sie in einem Seminar, das an vier Wochenenden im April in Klagenfurt stattfindet. Alle Details gibt es hier.\n\nText 3\n\nDer Wiener Naschmarkt gehört zu Österreichs beliebtesten Märkten. Mit einer Fläche von mehr als zwei Hektar ist er der größte Markt in der Innenstadt. Schon 1780 handelten Bauern dort mit Milchprodukten. Gemauerte Marktstände entstanden erst mehr als 100 Jahre später. Von 1910 an wurden mehr als 120 fixe Marktstände im einheitlichen Stil von Otto Wagner geplant und errichtet. Das Marktamtsgebäude bei der Kettenbrückengasse wurde 1916 fertiggestellt. Heute ist der Naschmarkt eine begehrte Wiener Sehenswürdigkeit. Bei Schönwetter zählt der Markt mehr als 65.000 Personen pro Woche, viele davon Touristen. Ein Teil der Marktfläche ist für Gastronomiebetriebe reserviert. Nun erzählt ein neuer Reiseführer die Geschichte des Naschmarktes, reich illustriert mit alten Aufnahmen. Ein Kapitel behandelt auch die berühmten Wienzeilenhäuser Otto Wagners, die sich an der Linken Wienzeile im Bereich des Naschmarktes befinden. Dazu gibt es Einkaufstipps und Beschreibungen der Lokale. „Der Markt am Wienfluss“. Hrsg. Hannes Ortner, 35 Seiten, 17 Euro.\n\nText 4\n\nWer bloggt, zeigt neben Fachkompetenz auch Kreativität. Das schätzen auch 4 Arbeitgeber. Ob man über fachliche Fragestellungen schreibt oder einfach nur über das Leben – das Themenspektrum von Blogs ist riesig. Genauso vielfältig sind auch die Möglichkeiten, die sie Bewerberinnen und Bewerbern bieten. Wer einen Blog professionell betreibt, kann seine fachlichen Kompetenzen präsentieren und gleichzeitig seinen Ideenreichtum unter Beweis stellen. Doch auch die Darstellung eines Hobbys zeigt, dass der Bewerber aktiv und kreativ ist.\n  Experten raten daher Bloggerinnen und Bloggern, in ihren Bewerbungsunterlagen gezielt darauf hinzuweisen. Doch Achtung: Ein Blog kann Bewerber auch in einem schlechten Licht erscheinen lassen. Bloggen während der Arbeitszeit und das Schreiben über Firmeninterna sind natürlich tabu.\n\nText 5\n\nBis Herbst soll ein neues Marktkonzept für den altehrwürdigen Salzburger Grünmarkt vorliegen. Damit der Markt für Besucherinnen und Besucher wieder attraktiver wird, setzt die zuständige Stelle im Magistrat auf Nachhaltigkeit. Biologische Lebensmittel aus nachhaltiger Produktion, im Idealfall aus der Region, sollen den Markt wieder zu einem Fixpunkt in der Altstadt werden lassen. Der für Märkte, Stadtnatur und Lebensqualität zuständige Vizebürgermeister hofft, dass der Markt dazu beitragen kann, ein positives Lebensgefühl zu vermitteln. Obwohl die Stadt die Verkaufsstände vor einigen Jahren aufwändig hatte restaurieren lassen, verzeichneten die Händler zuletzt einen deutlichen Rückgang an Kundschaft. Zudem haben einige von ihnen altersbedingt ihre Verkaufsstände aufgegeben. In diesem Zusammenhang wurde auch die beliebte Foodbloggerin Jasmin May engagiert. Sie soll dazu beitragen, das Konzept in der Öffentlichkeit bekannter zu machen. Wir werden das Projekt weiterverfolgen und von seinem Fortgang berichten.", "1.19": "Überschriften\n\na) Der Wald als neues Zuhause\n\nb) Die Auswirkungen künstlichen Lichts\n\nc) Landbewohner fordern besseren öffentlichen Nahverkehr.\n\nd) Plötzlich geht das Licht aus – was tun bei Strom\n\ne) Stadtbewohner entdecken das Landleben\n\nf) Stadtbewohner leben umweltfreundlicher\n\ng) Trend: Großstädter machen Urlaub im Wald\n\nh) Warum Licht für unser Wohlbefinden wichtig ist\n\ni) Was tun, wenn es Nacht wird? Lichtquellen vergangener Zeiten\n\nj) Wohnungsnot in Metropolen\n\nText 1\n\nHeute machen die elektrische Beleuchtung in Wohnhäusern, Straßenlaternen, Ampeln, Neonreklame und Scheinwerferlicht draußen die Nacht fast zum Tag. Vor der Erfindung der Elektrizität war dies anders. Der Arbeitsalltag der Menschen wurde von den Jahreszeiten und vom Tageslicht bestimmt. Gearbeitet wurde von Sonnenaufgang bis Sonnenuntergang. Danach war Beleuchtung nur mit anderen Hilfsmitteln wie z. B. Feuer, Kerzen und Petroleum möglich.\n\nDas Museum für Dorfkultur in Weinheim zeigt in einer Sonderausstellung, wie sich das Landleben früher nach Einbruch der Dunkelheit abspielte. Man erfährt zum Beispiel, wie man vor Erfindung des Streichholzes Feuer entfachte. Es geht um die Bedeutung der Kerzen im bäuerlichen Leben und darum, welche weitreichenden Umbrüche die Erfindung der Gasbeleuchtung und des elektrischen Lichts mit sich brachte.\n\nText 2\n\nJahrelang zog es vor allem junge Berufstätige in die Großstädte, denn diese sind attraktiv, bieten umfangreiche Einkaufsmöglichkeiten und einen gut ausgebauten öffentlichen Nahverkehr. Doch seit einiger Zeit beobachten Forscher eine gegenläufige Bewegung. Immer mehr Menschen kehren den Metropolen den Rücken und lassen sich im Umland nieder wegen der Ruhe und der günstigeren Preise.\n\nDie Städte, die immer teurer werden, die Freiräume, die der ländliche Raum bietet, sowie die neuen Formen des digitalen Arbeitens begünstigen die Stadtflucht. Unter den neuen Landbewohnern finden sich einerseits Berufstätige, die ortsunabhängig arbeiten können, wie Programmierer, Journalisten oder Grafikdesigner, andererseits aber zum Beispiel auch Lehrer, Ärzte und Handwerker, heißt es in der Studie. Die Wissenschaftler sprechen schon von einer Trendwende, die sich vor allem in den Ballungszentren Berlin, Hamburg, München, Frankfurt und Stuttgart abzeichnet.\n\nText 3\n\nSatellitenbilder der Erde bei Nacht zeigen ein strahlendes Lichtermeer, das sich fast durchgehend über den Globus erstreckt. Seit der Erfindung der Glühbirne steht Licht für Wohlstand und Fortschritt. Die Städte sind nachts hell erleuchtet, nicht immer jedoch zum Wohle von Mensch und Umwelt: Denn zu viel Licht hat Folgen für Menschen und Tiere.\n\nAn Straßenlaternen verenden jede Nacht Milliarden von Insekten, Zugvögel verlieren die Orientierung, und selbst der Mensch wird durch das Kunstlicht um einen gesunden Schlaf gebracht. Wissenschaftler sprechen bereits von einer massiven Lichtverschmutzung. Weltweit gehen Forscher jetzt der Frage nach, wie sich die Lichtflut auf ein gesundes Maß reduzieren lässt.\n\nDabei arbeiten Physiker, Biologen, Mediziner und Ingenieure an der Beleuchtung der Zukunft an einem Licht, das weder Energie verschwendet noch unnötig den Nachthimmel erhellt, keine Insekten verenden und durch besondere Farbspektren auch den Menschen unbehelligt schlafen lässt. Denn es geht nicht darum, die Städte völlig dunkel zu machen. Es geht darum, sie nachhaltiger und intelligenter zu beleuchten.\n\nText 4\n\nVor zehn Jahren lebten Dirk und Antje Sebens noch in Mannheim, mitten in der Stadt. Dann kauften sie sich ein altes Forsthaus im Wald. Sie hatten es zufällig entdeckt, denn eigentlich hatten sie nur einen ruhigen Ort gesucht, um am Wochenende dem Stadtleben entfliehen zu können.\n\nDoch sie waren sofort von dem Haus begeistert, dass es dort weder Strom noch fließendes Wasser gab, schreckte sie nicht ab. Heute versuchen die beiden, so autark wie möglich zu leben. Die Solaranlage auf dem Dach liefert Strom, eigenes Holz die Wärme, der Brunnen vor dem Haus das Wasser.\n  Im Sommer bauen Dirk und Antje Sebens Gemüse an, das sie für den Winter einwecken.\n\nDas nächste Dorf ist mehrere Kilometer entfernt und außer Besuchern verirrt sich höchstens mal ein Wanderer zu ihnen. „Die absolute Dunkelheit draußen in der Nacht war am Anfang sehr ungewohnt“, erzählt Antje Sebens. Denn elektrische Straßenlaternen wie in der Stadt gibt es im Wald natürlich nicht. Bereut haben die beiden ihre Entscheidung nie. Noch immer empfinden sie es als großes Abenteuer, mitten in der Natur zu sein und auf viele Annehmlichkeiten zu verzichten.\n\nText 5\n\nWer verbringt nicht gerne sein Wochenende fernab der Stadt? Im Grünen, wo es noch Wiesen und Schmetterlinge gibt und weder Staus noch Lärm. Viele zieht es gleich ganz aufs Land. Doch dort braucht man meist ein Auto. Wer nicht im Home-Office arbeiten kann, wird zum Pendler.\n\nHinzu kommt, dass es in vielen Dörfern kaum noch Einkaufsmöglichkeiten oder Schulen gibt und der öffentliche Nahverkehr in ländlichen Grundschulbewohner nicht ohne PKW auskommen können. Forscher haben errechnet, dass wir bis zu 87 Prozent der Emissionen aus unserer Alltagsmobilität einsparen können, wenn wir in verkehrstechnisch günstiger Lage wohnen, also am besten in der Stadt mit Einkaufsmöglichkeiten vor der Tür.\n\nAuch das Argument, das Wohnen auf dem Land sei günstiger, überzeugt immer weniger. Zwar waren dort früher Mieten und Bauland auf dem Land vergleichsweise erschwinglich, wird heute das Preisgefälle zwischen Stadt und Land immer flacher, das Ergebnis könnte ernüchternd sein und das Leben in der Stadt attraktiver machen.", "1.20": "Überschriften\n\na) Alte Spiele stärken das Miteinander\n\nb) Dinge zum Anfassen bleiben beliebt.\n\nc) Je mehr Spielsachen, desto größer die Kreativität.\n\nd) Kleine Züge mit langer Geschichte.\n\ne) Massenfertigung von Kuscheltieren\n\nf) Naturgetreue Handarbeit für das Kinderzimmer.\n\ng) Technik Spielzeug von früher wieder im Handel\n\nh) Überfluss im Kinderzimmer\n\ni) Viele Computerspiele kommen schnell aus der Mode\n\nj) Warum sich Leser von Büchern abwenden\n\nText 1\n\nDie erste Kosener Puppenfabrik wurde 1912 von Käthe Kruse gegründet. 80 Jahre später übernahm der Unternehmer Helmut Schache die traditionsreiche Spielzeugmanufaktur in Sachsen-Anhalt, seitdem wird sie von seiner Familie geführt. Dort werden noch wie früher Plüschtiere einzeln angefertigt, rund 80.000 jährlich, von der kleinen Maus bis zum 1,65 Meter großen Bären.\n\nWir machen keine niedlichen Plüschtiere. Wir versuchen die Tiere so zu gestalten, wie sie in ihrer Umwelt sind“, erklärt Helmut Schache. Die Plüschtiere entstehen nicht in Fließbandproduktion, sondern werden einzeln zusammengenäht, manche aus über 100 Teilen. Nur so gelingt es, die charakteristischen Merkmale der Tiere authentisch abzubilden. Jedem Entwurf gehen ausführliche anatomische Beobachtungen und Studien in der Natur und im Zoo voraus. Dann erst folgen Skizzen und erste Modelle aus Ton. 15 bis 20 neue Tiere bringt die Kösener Spielzeugmanufaktur jedes Jahr auf den Markt. Verkauft werden sie in 25 Ländern.\n\nText 2\n\nDie Modelleisenbahn hat auch im Computerzeitalter ihre Anziehungskraft nicht verloren. Bis heute bringt sie die Augen von großen und kleinen Eisenbahnfans zum Leuchten. Doch ihre ersten Erfolge feierte sie schon vor langer Zeit: 1891 rollte die erste Uhrwerkeisenbahn zum Aufziehen über die Gleise, und mit ihr begann der Aufstieg der Firma Märklin zum führenden Hersteller von Spielzeugeisenbahnen.\n\nDamals brachte die beginnende Industrialisierung mit ihren neuen Technologien auch für durch die Spielzeugherstellung neue Impulse. Dampfmaschinen im Kleinformat und funktionierende Kinder-Koch-Herde hielten Einzug in die Kinderstuben. 1895 brachte Märklin die erste dampfbetriebene Spielzeugeisenbahn auf den Markt. Einige Jahre später entwickelte man daraus die elektrische Modelleisenbahn, wie sie noch immer zu kaufen ist. Diese faszinierte Generationen technikbegeisterter Fans und wurde zum Sammelobjekt. Gewiss werden die Miniatureisenbahnen noch lange durch Kinderzimmer und Hobbykeller rattern.\n\nText 3\n\nGedruckten Büchern wurde vor einigen Jahren von Experten ein schnelles Ende vorausgesagt. Das papierlose Lesen sei die Zukunft, hieß es. Höchstens als Nischenprodukt könnten Bücher noch existieren. Doch schon wenig später stiegen deren Verkaufszahlen überraschend an. Vieles deutet darauf hin, dass sich Sachen, die man selbst in die Hand nehmen kann, doch nicht so leicht von digitalen Inhalten verdrängen lassen.\n\nZum Beispiel sind Papierkalender nicht aus den Geschäften verschwunden und die Schallplatte findet trotz der Verbreitung von Streaming-Angeboten viele Käufer. Zukunftsforscher erkennen darin sogar einen Trend, nämlich eine Gegenbewegung zur Digitalisierung. Dafür gibt es natürlich Gründe. Wer will schon nur Passwörter, PINs, Speicherplatz und Kontaktdaten besitzen? Alte Bücher, Hörspielkassetten oder Fotoalben wecken dagegen Gefühle“, erklärt der Konsumforscher Peter Riefenberg. Nimmt man das Taschenbuch in die Hand, das man am Strand gelesen hat, fühlt man sich gleich wieder in den Sommerurlaub zurückversetzt. Gegenstände wecken also Erinnerungen – das werden sie digitalen Produkten immer voraushaben.\n\nText 4\n\nImmer neue Spielekonsolen, Spielformate und Apps drängen auf den elektronischen Spielemarkt und dennoch haben Brettspiele nie an Bedeutung verloren. Die Hersteller vermelden sogar Jahr für Jahr steigende Umsätze.\n  Was aber macht den Zauber des klassischen analogen Brettspiels aus? Wer selbst sein Glück am Würfelbecher versucht, kommt dem Geheimnis schnell auf die Spur: Beim gemeinsamen Spiel genießen die Mitspieler besondere Momente der Zusammengehörigkeit.\n\n„Bei solchen Spielen steht das gemeinsame Erlebnis im Vordergrund: Familie und Freunde kommen an einem Tisch zusammen“, erklärt Stefan Wiese, Geschäftsführer des Naumburger Spieleverlags. „Das gute Brettspiel von früher wird auch in Zukunft Anhänger haben. Nach einer gemeinsamen Spielrunde stehen meist alle mit einem Lächeln vom Tisch auf“, ergänzt er. Das Spielen in analogen statt digitalen Welten steigert also Zufriedenheit und Gemeinschaftsgefühl.\n\nText 5\n\nJahr für Jahr gehört der Umsatz der Spielzeughersteller. Und das ist auch kein Wunder: Denn kaum etwas erfreut Eltern mehr als die leuchtenden Augen der Kinder, wenn sie ein neues Spielzeug bekommen. Und so sind die Schränke und Spielzeugkisten der lieben Kleinen voll mit Puppen, Kuscheltieren und Autos. Doch das hat auch unerwünschte Folgen.\n\nWenn ein Kind zu viel Spielzeug hat, wird sich seine Phantasie nicht weiterentwickeln“, warnt Spielforscher Jens Junge. Deshalb verzichten manche Kindergärten auf überflüssiges Spielzeug. Im Berlin Musikkindergarten zum Beispiel quillt kaum ein Regal über – und trotzdem wird den Kindern hier nie langweilig. Es gibt Musikinstrumente, Bastelmaterialien und auch Spielzeug – aber nie zu viel, sodass die Kinder nicht überfordert sind. Es komme für die Kinder gar nicht so sehr darauf an, womit sie spielen, sondern vor allem mit wem, betont Mitarbeiterin Lara Schwarz. Das gemeinsame mit Freunden sei für Kinder sowieso am wichtigsten.", "1.21": "(Unvollständiger Text)\n\nÜberschriften\n\nA)Die Löwen sind sehr beliebt unter den Besuchern.\nB)Mehr Bemühungen für den Tierschutz.\nC)Löwen als Zeichen für den Mangel an Touristen.\nD)Löwen als Haustier.\nE)Planung für den Tierschutz.\n\nText 1\n\nBerlin hat einen berühmten Zoo.\n\nDer Text sagt, dass die Besucher in den großen Park von Berlin kommen.\n\nSie treffen die Tiere, besonders die Löwen.\n\nText 2\n\nIn Südafrika sagt der Text, dass die Menschen Angst vor den Löwen hatten.\n\nDeshalb haben sie angefangen, sie zu töten.\n\nAus diesem Grund hat die Regierung beschlossen, Reservate zum Schutz der Löwen vor dem Aussterben zu schaffen.\n\nDie Regierung hat eine Entscheidung getroffen, ein Schutzgebiet zu errichten.\n\nDie Regierung hat beschlossen, ein Schutzgebiet zu schließen.\n\nText 3\n\nIn den USA sagt der Text, dass es dort einen Zoo gab.\n\nDas Interesse an Löwen hatte eine besondere Bedeutung für die Anziehung von Touristen.\n\nText 4\n\nDie reichen Familien haben meistens etwas Besonderes.\n\nHier ist es klar, dass viele Texte sagen, dass es reiche Familien in Asien gibt.\n\nSie haben die Tendenz, exotische Tiere zu züchten.\n\nIn ihren Palästen gibt es Tiere wie Löwen und Leoparden.\n\nText 5\n\nDie Tierschutzorganisation ruft an.\n\nDer Text spricht über eine Sitzung einer Tierrechtsorganisation.\n\nEs wird ein Update über den Umgang mit Tieren vorgestellt.\n\nEs geht um die Schaffung spezieller Gebiete für sie.\n\nAußerdem wird die Ausbildung von Menschen im Umgang mit Tieren thematisiert.", "1.22": "Überschriften\n\na) Altes Handwerk und alte Technik anschaulich präsentiert\n\nb) Attraktive Kleinstadt – touristischer Geheimtipp\n\nc) Ein Altes Kloster als Feuerwache\n\nd) Eine Universität mit langer Geschichte\n\ne) Eliteschule für Schriftsteller\n\nf) Entdeckung und Verbreitung des Kaffees\n\ng) Kaffee macht die Leute süß\n\nh) Klösterliche Strenge für berühmte Schüler\n\ni) Mehr Ziegenmilch dank Energy-Drink\n\nj) Ohne Kaffee geht hier nichts\n\nText 1\n\nDas erste Kaffeehaus in Leipzig, „Zum arabischen Coffee-Baum“, öffnete 1685 seine Pforten. Seitdem ist der Kaffee in Sachsen zum beliebten Getränk geworden, das weder zu Hause auf Party und Feiern noch beim Ausgehen fehlen darf. Kaffeesachsen wurden früher die Bewohner des Landes zwischen Leipzig und polnischer Grenze auch deswegen scherzhaft von den anderen Deutschen genannt. Bevorzugt wird der Kaffee heiß und süß getrunken.\n\nSüße Ergänzungen wie Dresdner Stollen oder Leipziger Lerchen, beides traditionell gebackene Kuchenspezialitäten, gehören zum Kaffee wie das Tüpfelchen zum „i“. Dabei wird das Gebäck auf echt sächsische Art „gedibbscht“, das heißt: Es wird in den Kaffee getunkt, bevor es gegessen wird. Die Sachsen schwören darauf, dass sowohl das Gebäck als auch der Kaffee so und nur so ihr volles Aroma entfalten.\n\nWer es selbst ausprobieren möchte: Zahlreiche Kaffeehäuser laden in allen größeren und kleineren Städten Sachsens dazu ein, dies auszuprobieren.\n\nText 2\n\nEppingen liegt etwa auf halbem Weg zwischen Karlsruhe und Heilbronn im Kraichgau, einer geschichtsträchtigen Region mit wunderschöner Landschaft und bodenständiger Kultur, die von Erholung suchenden Menschenmassen noch nicht überrollt ist.\n\nDie Altstadt des Städtchens ist ein einziges Museum: Über 100 Fachwerkhäuser mit ihrem romantisch anmutenden Muster aus braunen Holzbalken und weiß getünchtem Lehm können hier bewundert werden. Die bekanntesten davon sind das „Baumannsche Haus“ (erbaut 1582), heute ein Hotel, und die „Alte Universität“, heute ein Museum. Hier befand sich 1564/1565 die Heidelberger Universität, die, als in Heidelberg die Pest wütete, hierhin ausgelagert wurde.\n\nIm heutigen Museum kann man die Fachwerkkunst studieren. Seit 1993 findet im Juli und August der „Carillonsommer“ statt. Dann geben international bekannte Orgelinterpreten Glockenspielkonzerte, die vom achteckigen Turm der Stadtpfarrkirche erklingen.\n\nEine lange Tradition in Eppingen hat die Bierbrauerei. Das hier gebraute „Palmbräu“-Bier kann an Ort und Stelle in der Brauereigaststätte probiert werden. Eppingen ist auch Ausgangspunkt zahlreicher Wanderwege, auf denen der Kraichgau zu Fuß erkundet werden kann.\n\nText 3\n\nDas Kloster Maulbronn wurde 1147 von Zisterziensermönchen gegründet. Man sagt, ein Maulesel, den die Mönche auf ihren Wanderungen mitgeführt hatten, solle hier einen Brunnen gefunden haben und man habe daraufhin beschlossen, an dieser Stelle das Kloster zu bauen.\n\nIm 16. Jahrhundert wurde es im Verlauf der Reformation säkularisiert und zum Internat umfunktioniert. Heute von der UNESCO zum Weltkulturerbe der Menschheit erhoben, ist das Kloster ein Touristenmagnet.\n\nSelbst vom berüchtigten Doktor Faust wird erzählt, er sei einmal dort gewesen. Das Kloster soll einmal kein Geld mehr gehabt haben, und der sonst gottesfürchtige Abt habe geglaubt, mit Hilfe des Doktor Faust und dessen Zauberkünsten wieder zu Geld zu kommen.\n\nMaulbronn war besonders wegen seiner Klosterschule bekannt, die von namhaften Persönlichkeiten besucht wurde: Johannes Kepler lernte hier Latein und Mathematik, der Schriftsteller Hermann Hesse litt bekanntlich sehr unter der eisernen Disziplin und Härte, die hier nach seiner Meinung vorherrschte. Hermann Hesse hat die Klosteranlage später in seinen Romanen „Unterm Rad“ und „Narziß und Goldmund“ zum Schauplatz gemacht.\n\nText 4\n\nAuf einer Anhöhe oberhalb des Bodensees liegt, ca. 10 km vom See entfernt in idyllischer ländlicher Umgebung, das ehemalige Zisterzienserkloster Salem.\n\nInnerhalb der weitläufigen Klosteranlage aus dem 12.\n  Jahrhundert befinden sich heute mehrere Museen und das gotische Münster. Im Feuerwehrmuseum findet der interessierte Besucher alte Feuerwehrwagen, die noch von Pferden gezogen wurden, alte Geräte, Spritzen und Pumpen sowie mehrere Modellanlagen.\n\nIm Weinbaumuseum bekommt man einen Überblick über die Weinproduktion der Bodenseeregion. Hier können regionale Weine probiert und auch gekauft werden. In den angrenzenden Gebäuden kann man zuschauen, wie – noch in Handarbeit – Musikinstrumente gebaut werden, Glas geblasen oder Goldschmuck hergestellt wird.\n\nEin kleiner aber feiner Park lädt zum Ausruhen und Verweilen ein. International bekannt ist jedoch das von Kurt Hahn und dem Prinzen Max von Baden 1920 gegründete Internat Salem, das von den Söhnen und Töchtern bekannter Familien aus ganz Europa besucht wurde und wird: Der erste deutsche Bundespräsident Theodor Heuss ging hier ebenso zur Schule wie der Ehemann der britischen Königin Elisabeth II., Prinz Philipp.\n\nText 5\n\nVermutlich vor fast 900 Jahren, irgendwann im dreizehnten Jahrhundert, sollen die Menschen herausgefunden haben, was es mit dem Kaffee auf sich hat.\n\nEine Legende erzählt von einem jemenitischen Ziegenhirten, dessen Ziegen sich nach dem Genuss der roten Beeren eines bestimmten Strauches merkwürdig lebendig und aufgedreht benommen haben sollen. Im Dorf habe der Dorfgelehrte dann herausgefunden, dass die Früchte, die bisher nur den Ziegen zu viel „Energie“ verholfen hatten, auch beim Menschen ihre Wirkung zeigten.\n\nNach mehreren Experimenten habe man dann herausgefunden, dass die Beeren, wenn man sie trocknet und dann mit heißem Wasser aufkocht, am besten schmecken. Der Kaffee war erfunden.\n\nWegen seiner berauschenden Wirkung, so eine Theorie, soll das Getränk dann arabisch „qahwa“ genannt worden sein, was auch einen Wein bezeichnen konnte. Nach einer anderen Theorie stammt der Kaffee aus der Region „Kaffa“ im südwestlichen Äthiopien. Von hier aus nahm jedenfalls sein Siegeszug über die ganze Welt seinen Ausgang. 1582 erreichte der Kaffee schließlich Europa, wo er bis heute zu einem der beliebtesten Getränke wurde.", "1.23": "Überschriften\n\na) Bilder einer bedeutenden Künstlerin\nb) Das Ende der Dunkelheit\nc) Die bemerkenswerte Karriere eines Fotografen\nd) Ein Fotograf auf Reisen\ne) Eine Fotografin dreht einen Film\nf) Entwicklungsgeschichte der Lampen\ng) Erde, Mond und Sterne – wie man sie noch nie gesehen hat\nh) Familienfotos berühmter Persönlichkeiten\ni) Gelungene Einführung in die moderne Fotografie\nj) Mit Profis eine neue Foto-Technik erlernen\n\nRichtige Antworten\n\n1 → b) Das Ende der Dunkelheit\n2 → i) Gelungene Einführung in die moderne Fotografie\n3 → a) Bilder einer bedeutenden Künstlerin\n4 → g) Erde, Mond und Sterne – wie man sie noch nie gesehen hat\n5 → c) Die bemerkenswerte Karriere eines Fotografen\n\n⸻\n\nText 1\n\nDer Buchtitel erinnert an eine Horrorgeschichte: „Die Nacht“. Aber dem Autor Paul Bogart geht es nicht um Fantasiewelten, sondern um sehr reale Dinge. Das Thema des Autors ist die nächtliche Finsternis.\n\nWer erlebt noch eine dunkle Nacht? Großstadtbewohner eher nicht, außer im abgedunkelten Schlafzimmer. Ein natürlicher Nachthimmel mit unzähligen Sternen ist die Ausnahme, deshalb sind wir überwältigt, wenn wir ihn doch einmal zu sehen bekommen. Das war früher anders, und zwar bis Gaslicht und Glühlampe erfunden wurden. Heute sieht man in Städten gerade noch den Mond und, wenn man Glück hat, eine Handvoll der hellsten Sterne.\n\nPaul Bogart erläutert, warum künstliches Licht so weit verbreitet ist, und betrachtet dies sehr kritisch. Der Autor fesselt seine Leser dabei mit beachtlichem Fachwissen. Außerdem ist er weit gereist. Überall, so berichtet er, gebe es Organisationen, die sich für eine Reduzierung des künstlichen Lichts einsetzen – auch in Deutschland. Paul Bogart fände es positiv, wenn die Organisationen sich durchsetzen könnten. Denn der Autor – und das macht er sehr deutlich – hält nicht viel davon, dass es heute kaum noch völlig dunkel ist.\n\n➡️ Javob: b) Das Ende der Dunkelheit\n\n⸻\n\nText 2\n\nFotos machen ist heute nicht schwer. Schnell nimmt man das Handy und macht einen Schnappschuss. Wer aber besondere und eindrucksvolle Bilder haben möchte, muss sich mit dem Thema Fotografie schon etwas intensiver befassen. Dietmar Spehrs neuer Fotografie-Ratgeber ist dabei ein gutes Hilfsmittel. Auf 424 Seiten erklärt der Autor und Journalist mit einfachen, aber kompetenten Worten, was zu beachten ist.\n\nDer Ratgeber versteht sich als Fotokurs für Ein- und Aufsteiger und richtet sich an die vielen Menschen, die gerne fotografieren, aber wenig Fachwissen haben. Diesen Hobbyfotografen vermittelt das Buch sehr verständlich Schritt für Schritt solides Basiswissen. Spehr setzt dabei auf Beispielbilder, Tabellen und Grafiken und schreibt so wenig wie möglich, aber so viel wie nötig.\n\nDas sorgt dafür, dass der Ratgeber sehr unterhaltsam zu lesen ist und nicht wie ein langweiliges Lehrbuch daherkommt. Von der Auswahl des Motivs über die richtige Kameraeinstellung bis hin zur optimierenden Nachbearbeitung am Computer wird alles Wissenswerte vermittelt.\n\n➡️ Javob: i) Gelungene Einführung in die moderne Fotografie\n\n⸻\n\nText 3\n\nBilder der Fotografin Annie Leibovitz sind ab kommendem Samstag im Kunsthaus Wien zu sehen. Die Ausstellung besticht durch ihre umfangreiche Bildauswahl. Zum einen kann man zahlreiche Portraits berühmter Schauspieler, Politiker oder Musiker bestaunen. Zum anderen sieht man Bilder aus dem privaten Fotoalbum der Künstlerin.\n\nDie zum Teil sehr persönlichen Aufnahmen dokumentieren ihr Leben und zeigen bisher unveröffentlichte Werke, die zum Teil sehr bedrückend sind. Bilder ihres Vaters berühren den Besucher und oftmals ist man von der Offenheit der Fotografin überrascht.\n\nZwischen Aufnahmen der Fotografin selbst stehen zahlreiche Portraits ihrer Eltern und Urlaubsfotos der Familie. Die bunte Mischung von großformatigen und kleinformatigen Bildern sorgt für Abwechslung.\n\nUm die Fotografin besser kennenzulernen, können Besucher einen ca. 1,5 Stunden langen Film über die Karriere von Annie Leibovitz sehen.\n  Eines ist nach der Ausstellung und dem Film klar: Annie Leibovitz zählt zu den bedeutendsten Fotografinnen des 20. und beginnenden 21. Jahrhunderts.\n\n➡️ Javob: a) Bilder einer bedeutenden Künstlerin\n\n⸻\n\nText 4\n\nDie Abkürzung TWAN klingt nach einem neuen Computerprogramm, aber tatsächlich steht sie für eine neue fotografische Methode, die der Iraner Babak Amin Tafreshi entwickelt hat. Diese neue Methode führt zu atemberaubenden Ergebnissen: Noch nie hat man die Sterne so eindrucksvoll über den Landschaften der Erde gesehen wie auf den Bildern in diesem Buch – ein Genuss für die Augen.\n\nWas man auf den 160 Seiten des Buches sieht, ist meines Wissens ohne Beispiel. Viele der gezeigten Orte und Landschaften sind bekannte Motive, hier aber wirken sie doch vollkommen anders, als man sie kennt. Da sieht man Sterne über den Ruinen von Persepolis, den Mond über ungarischen Wäldern, die Milchstraße über dem kalifornischen Mammutbaum „General Grant“.\n\nDie drei Herausgeber Stefan Seip, Gernot Meiser und Babak A. Tafreshi wurden unterstützt von einem weltweiten Team erfahrener Naturfotografen. Auf den letzten Seiten des Buches erfährt man auch, dass „Fotografieren im TWAN-Stil heißt, bei fortgeschrittener Dämmerung oder Dunkelheit Aufnahmen zu machen, auch wenn man selbst nicht mehr viel sehen kann“.\n\nNeben aller Technik kommt es aber auf den künstlerischen Blick des Fotografen an – und viel Geduld.\n\n➡️ Javob: g) Erde, Mond und Sterne – wie man sie noch nie gesehen hat\n\n⸻\n\nText 5\n\nEr gehörte zu den ganz Großen seines Fachs: Andreas Feininger. Eine neue Biografie erzählt die Lebensgeschichte des weltberühmten Fotografen. Neben einem Text auf Deutsch und Englisch enthält sie auch eine kleine, aber gute Auswahl seiner Fotoarbeiten aus allen Schaffensphasen.\n\nDie Autoren zeigen den Weg des 1906 in Paris geborenen Fotografen von der Kindheit in Berlin über die Jahre in Weimar und Dessau bis hin zum Leben in Hamburg, Stockholm und schließlich New York, dessen Stadtansichten Feininger weltberühmt machen.\n\nDabei hatte Feininger keineswegs das Ziel, Fotograf zu sein. Eigentlich war Andreas Feininger gelernter Architekt. Als Feininger mit seiner Frau 1933 nach Stockholm auswandert, findet er dort als Architekt keine Anstellung. So macht er aus der Not eine Tugend: Weil er die kleine Familie mit Sohn Thomas ernähren muss, macht er seine Leidenschaft, die Fotografie, zum Broterwerb.\n\nDen Durchbruch als weltweit anerkannter Fotograf schafft er schließlich in New York, wohin seine Familie 1939 auswandert.\n\n➡️ Javob: c) Die bemerkenswerte Karriere eines Fotografen", "1.24": "Überschriften\n\na) Jugend forscht – auch auf dem Meer\nb) Jugend engagiert sich für den Umweltschutz\nc) Kochen für Eltern und Kinder\nd) Mehr Gewalt auf Schulhöfen\ne) Psychoterror an der Schule\nf) Schiffsreise für Jugendliche\ng) Starker Wettbewerb um Schüler\nh) Von der Diät zur Krankheit\ni) Wenn Lernen krank macht\nj) Wenn aus Erdbeeren Tomaten werden\n\nRichtige Antworten\n\n1 → j) Wenn aus Erdbeeren Tomaten werden\n2 → h) Von der Diät zur Krankheit\n3 → b) Jugend engagiert sich für den Umweltschutz\n4 → a) Jugend forscht – auch auf dem Meer\n5 → e) Psychoterror an der Schule\n\n⸻\n\n1\n\nDie Zahlen wirken auf den ersten Blick dramatisch: 15 Prozent der Kinder sind übergewichtig und davon sechs Prozent sogar fettleibig. Der Ernährungswissenschaftler Timo Schmidt betreibt in Berlin ein Kochstudio für Kinder und Jugendliche.\n\nTimo Schmidt meint, es fehle vor allem an Praxis-Erfahrungen in der Küche. Kinder und Jugendliche können heute oft nicht (mehr) kochen, so seine Erfahrung. Das Interesse ist oft da, und die Kinder wollen kochen. Aber das Problem sind die Eltern. Oft haben sie keine Zeit, den Kindern alles zu erklären. Zum anderen haben sie Angst wegen der scharfen Messer. Dabei ist die Quote von Schnittverletzungen im Kinder- und Jugendkochstudio verschwindend gering.\n\nBesonders erschreckend findet Schmidt, dass viele Kinder Lebensmittel einfach nicht mehr erkennen. So standen im Kochstudio beispielsweise Erdbeeren auf dem Tisch, die dann für Tomaten gehalten wurden. Und eine gelbe Zucchini wird gerne mal alles Banane bezeichnet.\n\n„Was fehlt, ist die Praxis“, meint Schmidt. „Deswegen schneiden die Kinder dann mit der stumpfen Seite des Messers oder wissen nicht, wie heiß die Pfanne beim Kochen wird“.\n\n➡️ j) Wenn aus Erdbeeren Tomaten werden\n\n⸻\n\n2\n\nImmer mehr Mädchen leiden an schweren Essstörungen – und das, obwohl Ärzte und Fachleute seit Jahren vor den negativen Folgen des Schlankheitswahns warnen. Die Kinder- und Jugendpsychiatrie im Kinderkrankenhaus in Hannover schlägt jetzt Alarm. „Allein in den letzten zwei Jahren hat die Nachfrage für einen Therapieplatz um fast 50 Prozent zugenommen“, sagt der leitende Psychologe Gerd Kuznik.\n\nVon 33 zur Verfügung stehenden Plätzen in der Jugendpsychiatrie seien derzeit 25 von Mädchen mit Essstörungen belegt. „Wir wissen längst, dass dünn zu sein weder gesund noch lebensverlängernd ist“, sagt Kuznik, „doch unsere Gesellschaft konfrontiert gerade junge Mädchen noch immer mit völlig überzogenen Schlankheitsvorstellungen“.\n\nDas allein verursacht noch keine Essstörung. „Wenn aber noch ein grundlegendes familiäres Problem hinzukommt, legen viele Mädchen einen übertriebenen Wert auf ihr Aussehen“. So berichtet eine 17-Jährige, dass sie aus dem Gefühl heraus, „nichts hinzubekommen“, eine Diät gemacht habe. Und die Diät war dann endlich etwas, das klappte. Als Folge davon hat sie nicht nur wie geplant zwei Kilo abgenommen, sondern dreizehn.\n\nSo zieht Gerd Kuznik nicht nur in diesem Fall das Fazit: Mit einer harmlosen Diät fängt es meist an, mit einer schweren Krankheit kann es enden.\n\n➡️ h) Von der Diät zur Krankheit\n\n⸻\n\n3\n\nEnergiesparlampen, umweltfreundliche Elektrogeräte, Bio-Nagellack – sieht man sich die Themen an, mit denen sich die Teilnehmer des 46. Regionalwettbewerbs „Jugend forscht“ beschäftigt haben, wird vor allem eines klar: Das ökologische Bewusstsein hat die Klassenzimmer erreicht.\n\nKnapp 100 Schüler nahmen an dem Wettbewerb teil. Die Teilnehmer schreckten auch vor komplexen Themen nicht zurück. Die Zwölftklässler Adrian, Thanh und Son beschäftigten sich mit der Herstellung künstlicher Muskeln. „Die Herausforderung war, sich mit drei Fachgebieten – Anatomie, Technik und Chemie – zu beschäftigen“, sagt Adrian. Gelohnt hat es sich – in der Rubrik Technik erreichte die Gruppe den ersten Platz.\n\nIn der Rubrik Arbeitswelt ermittelten die Abiturientinnen Yara-Alessandra und Bahir die Ökobilanz von Gartengeräten.\n  „Wir haben festgestellt, dass Laubbläser mit Benzinmotor nicht nur große Mengen Kohlenstoffdioxid produzieren, sie vernichten auch Würmer und Insekten, die für das Gleichgewicht der Umwelt wichtig sind“, sagt Yara-Alessandra. Die Jury honorierte das Projekt mit dem zweiten Platz. Die Gewinner bereiten sich nun auf den Landeswettbewerb „Jugend forscht“ vor.\n\n➡️ b) Jugend engagiert sich für den Umweltschutz\n\n⸻\n\n4\n\n13,5 Meter lang und leuchtend gelb – die „Aldebaran“ zieht die Blicke im Jachthafen auf sich. Für drei Schüler aus Diepholz ist ein Traum wahr geworden. Als Meeresforscher auf See arbeiten sie an einem eigenen Forschungsprojekt. Sie nehmen am Meereswettbewerb „Forschen auf See“ teil.\n\nZiel des Projektes: junge Leute an wissenschaftlichen Arbeiten heranzuführen. Die drei Schüler Jonas, Annika und Katharina sind 17 Jahre alt. Ihr Thema: die Verschmutzung der Nordsee mit winzigen Plastikteilchen.\n\nMit ihrer Forschung wollen die Schüler die Aufmerksamkeit auf die Verschmutzung der Nordsee lenken. Zu Hause in Diepholz engagieren sich die drei in der Umwelt-Arbeitsgruppe ihrer Schule. Über die Verschmutzung der Meere mit winzigen Plastikteilchen und die Gefahren für Fische und Meeressäuger wissen sie schon einiges.\n\nMit ihren Untersuchungen wollen sie die Aufmerksamkeit auf das Problem lenken. Die Proben sind zwar noch nicht ausgewertet, die ersten Plastikteilchen haben die Jugendlichen aber schon gefunden. „Es sieht so aus, dass wir Ergebnisse kriegen, die gut für unser Projekt sind – aber nicht gut für die Umwelt“.\n\n➡️ a) Jugend forscht – auch auf dem Meer\n\n⸻\n\n5\n\nMobbing ist kein neues Phänomen. Es ist auch in Schulen weitverbreitet. Da spricht zum Beispiel eine Lehrerin vor der Klasse negativ über eine Schülerin, weil sie etwas nicht versteht oder immer wieder krank ist. Oder die Mitschüler lachen oder lassen beleidigende Bemerkungen fallen, wenn ein bestimmter Schüler sich zu Wort meldet.\n\nDa lauern Jungen einer 4. Klasse einem schüchternen Mitschüler auf dem Schulweg auf und erpressen von ihm Geld oder Kleidung. Häufig sind die Erwachsenen ratlos oder schauen weg, während die Opfer die Schuld bei sich selbst suchen und zunehmend in eine soziale Isolation geraten.\n\nLehrkräfte sind meist überrascht, wenn man sie auf Mobbing in einer Klasse anspricht. Denn die Schikanen geschehen oft zu subtil und meist außerhalb des Unterrichts, während der Pausen oder auf dem Schulweg.\n\n➡️ e) Psychoterror an der Schule", "1.25": "Überschriften\n\n2 → a) Farben in der Wohnung als Therapie\n3 → b) Pflanzen machen den Wohnraum gesünder\nc) Zimmerpflanzen sind selten krank\nd) Möbel als Energiequellen der Zukunft\ne) Gesunder durch kräftige, leuchtende Farben in der Wohnung\nf) Farbberatung durch den Gesunder oder die Floristin\n1 → g) Wohnen in Harmonie mit den Kräften der Natur\n4 → h) Kräuter als Zimmerpflanzen\ni) Kräuter bringen Farbe in Wohnräume\n5 → j) Zimmerpflanzen sorgen für gute Stimmung bei Menschen\n\n⸻\n\n1\n\nFeng Shui – wörtlich „Wind Wasser“ – ist die taoistische Lehre vom Leben im Einklang mit der Umgebung. Seit Jahrhunderten wird Feng Shui in China und anderen fernöstlichen Kulturpraktiziert, inzwischen ist es auch bei uns beliebt. Wohnen mit Feng Shui bedeutet ein Gleichgewicht herzustellen – beginnend bei der Auswahl des Grundstücks, der Anordnung von Türen und Fenstern und der Gestaltung der Wohnräume.\n\nTüren und Fenster leiten den Energiefluss wie Schleusen, die Position der Möbel lässt die positive Energie weiterströmen oder behindert sie. Wie man vorhandene Energie-Störungen durch einfaches Umstellen der Möbel beseitigen kann, zeigen Feng-Shui-erfahrene Innenarchitekten.\n\n➡️ g) Wohnen in Harmonie mit den Kräften der Natur\n\n⸻\n\n2\n\nFarben haben eine stärkere Wirkung auf Menschen, als viele vermuten. Der Einfluss der Farben ist sogar so groß, dass er für therapeutische Zwecke genutzt wird. Bei der farblichen Gestaltung einer neuen Wohnung sollte man zuerst einmal zurückhaltend sein. Ist der Raum nämlich in knalligem Rot oder blendendem Gelb gestrichen, müssen die Möbel und andere Gegenstände farblich darauf abgestimmt sein, da sonst eine unruhige oder aggressive Atmosphäre entstehen kann.\n\nWeiß gestrichene Wände stehen hingegen zwar in dem Ruf, langweilig zu sein, sie lassen sich aber mit allen Möbeln, Stoffen und Dekorationsgegenständen kombinieren und schaffen so leicht eine gemütliche und für das Auge ansprechende Atmosphäre.\n\n➡️ a) Farben in der Wohnung als Therapie\n\n⸻\n\n3\n\nEin allgemeingültiger Optimalwert wird von Fachleuten ungern benannt, da kaum ein Wert so hohen natürlichen Schwankungen unterliegt wie die Luftfeuchte. Witterung, Temperaturunterschiede, Wohngewohnheiten, alles sorgt für ständiges Auf und Ab.\n\nAls Mittelwert kann 40–60 % angenommen werden. Die relative Luftfeuchtigkeit sollte in Wohnräumen nie dauerhaft unter 30 % oder über 70 % liegen. In den meisten Wohnräumen ist die Luft zu trocken. Die Luftfeuchtigkeit beträgt nur 20 %.\n\nBesonders Zentralheizungen und Klimaanlagen trocknen die Luft aus und wirbeln Staub, Keime und Schadstoffe auf. Atemwegserkrankungen und Allergien sind oft die Folge. Auslöser sind meist Keime oder Bakterien, die bei trockener Luft gut gedeihen. Gegen üble Gerüche und zu hohe Lufttrockenheit helfen am besten Pflanzen. Sie geben Wasserdampf an die Umgebung ab und sorgen für ein gutes Raumklima.\n\n➡️ b) Pflanzen machen den Wohnraum gesünder\n\n⸻\n\n4\n\nFrische Kräuter machen jedes Essen zum Genuss. Man braucht keinen großen Garten, um sich für den Eigenbedarf aromatische Gewürzpflanzen selbst ziehen zu können. Die meisten dieser Kräuter gedeihen nämlich auch im Blumentopf auf dem Balkon oder auf der Fensterbank.\n\nDabei sind natürlich solche Pflanzen, die im Freien wachsen können, durch den Einfluss des Sonnenlichts aromatischer als solche, die nur hinter Glas wachsen können. Die Pflanzen im Zimmer brauchen auch mehr Pflege als ihre Kollegen an der frischen Luft.\n\nWegen der Lufttrockenheit in den Wohnungen müssen sie z. B. viel häufiger gegossen werden als Freilandpflanzen, auch sind sie weniger widerstandsfähig gegen Schädlinge und Pflanzenkrankheiten.\n\n➡️ h) Kräuter als Zimmerpflanzen\n\n⸻\n\n5\n\nBei der Wohnungsgestaltung lässt sich viel erreichen mit der richtigen Auswahl der Zimmerpflanzen. Es müssen nicht nur grünblättrige Gummibäume oder Palmen sein, die einen Raum verschönern – vielfältig Blatt- und Blütenfarben machen selbst trostlos wirkende Räume farbenfroh und fröhlich.\n  So können Blühpflanzen auf der Fensterbank auch im Herbst oder Winter die Bewohner in gute Laune versetzen. Grünpflanzen beruhigen zudem und man fühlt sich beim Anblick der Natur in der eigenen Wohnung einfach ruhiger und ausgeglichener.\n\nBedenken Sie aber: Pflanzen müssen am richtigen Platz stehen, wenn man lange an ihnen Freude haben möchte. Viele Gärtnereien oder Blumengeschäfte bieten daher einen Beratungsservice an.\n\n➡️ j) Zimmerpflanzen sorgen für gute Stimmung bei Menschen", "1.26": "a) Benzingeld sparen: Tipp vom Tankwart\nb) Die wichtigsten Erste-Hilfe-Ratschläge\nc) Einmal die Welt als Ganzes sehen\nd) Einmal um die Welt ohne einen Tropfen Benzin\ne) Fliegen statt fahren\nf) Innerdeutsche Reisen besonders beliebt\ng) Frau im All\nh) Schweizer nutzen Solartaxis\ni) Steigende Spritpreise: die Tricks der Autofahrer\nj) Die richtige Unfallversicherung\n\n1\n\nAussteigen, tanken, wegfahren: Wenn die Benzinpreise steigen, ist wieder Hochsaison bei den Benzindieben. Früh morgens und abends schlagen sie besonders gerne zu. Viele setzen auf den Schutz der Dunkelheit. Vor Weihnachten und im Januar und Februar häufen sich die Fälle. Auch am Monatsende, wenn das Geld knapp wird, steigt die Zahl der Benzindiebstähle. Doch sparen lässt sich durch Benzinklau nicht. Fast alle Täter werden von der Polizei gefasst. Schließlich gibt es an jeder Tankstelle eine Kamera, die das Autokennzeichen aufgenommen hat.\n\nTankwart Kurt Jochimsen aus Emden zeigt uns einen Fall aus seiner großen Videosammlung. Ein Wagen mit zwei Insassen fährt an die Zapfsäule. Der Fahrer tankt, seine Frau geht in den Shop. Sie kauft dort zwei Cola und bezahlt. Aber nicht das Benzin. Der Mann hat inzwischen voll getankt und wartet im Wagen.\n\n„Hier sehen Sie: Die Frau kommt raus, steigt ein und das Fahrzeug fährt davon. Hinterher heißt es dann, ich habe doch glatt vergessen, das Benzin zu bezahlen“, erklärt Kurt Jochimsen. Bei der Polizei kennt man diese Ausreden. Polizeioberkommissar Werner Knips: „Vergessen gilt nicht, es gibt immer eine Anzeige. Und dann wird es richtig teuer.“\n\n2\n\nViele Autofahrer, die in einen Unfall verwickelt sind, sind so aufgeregt, dass sie vergessen, was zu tun ist. Der Versicherungsexperte Klaus Lenhoff gibt die wichtigsten Tipps:\n\nUnfallstelle absichern: Warnblinkanlage einschalten und Warndreieck in 100 Metern Entfernung aufstellen.\nRettung aus dem Gefahrenbereich: alle Unfallbeteiligten aus dem Gefahrenbereich retten. Eingeschlossene befreien und Brände sofort bekämpfen.\nRettungskräfte informieren: bei schweren Unfällen und wenn es Verletzte gibt, die Polizei (Ruf 110) oder die Rettungsleitstelle (Ruf 112) informieren. Dabei an die „fünf Ws“ denken: Wo ist es passiert? Was ist passiert? Wie viele Verletzte? Welche Verletzungen? Warten Sie auf Rückfragen.\nVerletzten Hilfe leisten, zum Beispiel: Kontrolle von Atmung und Puls, Atemspende, stabile Seitenlage, Erkennen und Behandeln eines Schocks, Stillen von Blutungen.\nLokalisierung auf der Autobahn: Wo hat sich der Unfall ereignet?\nBeweismittel sichern: am besten Fotos oder eine Skizze von der Unfallstelle machen.\nVerkehrsfluss wiederherstellen, also schnell die Fahrbahn räumen.\nName, Anschrift und Telefonnummern von Zeugen notieren.\nVorsicht bei Aussagen: die Aufregung am Unfallort verleitet zu missverständlichen Äußerungen. Keine Aussagen unter Druck machen.\nVersicherung des Unfallgegners ermitteln.\n\n3\n\nHast du schon mal mit dem Gedanken gespielt, Pilotin zu werden? Nicht? Dann geht es euch wahrscheinlich wie den meisten Mädchen oder Frauen. Warum wollen eigentlich so wenige Frauen Pilotinnen werden? Nur weil der Beruf angeblich ein typischer Männerberuf ist? Wir haben eine Pilotin getroffen: Monique Bellin ist 39 Jahre alt, wohnt im Süden Frankfurts und ist Pilotin.\n\n„Schon seit früher Kindheit habe ich mich für die Fliegerei interessiert. Es hat mich immer fasziniert, dass es mit Hilfe technischer Mittel möglich ist, die Schwerkraft zu überwinden und die Welt aus der Vogelperspektive zu betrachten. Und irgendwann wollte ich diese Technik dann auch selbst beherrschen“, so Belling.\n\nSeit sie in diesem Beruf arbeite, habe sich ihre Einstellung zu vielen Dingen verändert: „Ich bin toleranter als vor meiner ‚Fliegerlehre‘ – vielleicht weil ich versuche, mein Umfeld aus anderen Perspektiven zu betrachten. Auch meine Freizeit und meine Familie sind mir noch kostbarer geworden, seit ich in diesem Beruf tätig bin“, erklärt sie.\n  Hat sie noch Träume? „Aber ja!“, sagt Monique Belling: „Mit einem Shuttle ins Weltall fliegen, um die Erde als Kugel zu sehen und das Gefühl absoluter Schwerelosigkeit zu erleben.“\n\n4\n\nDer Schweizer Louis Palmer hat eine Weltumrundung mit seinem „Solartaxi“ fast abgeschlossen. Er habe bereits 47.000 km mit seinem Solarauto zurückgelegt, sagte Palmer bei einem Stopp in Paris. „Nun habe ich fast den ganzen Planeten umrundet, ohne einen Tropfen Benzin zu brauchen“.\n\nDie Batterien des bis zu 90 Stundenkilometer schnellen Solarmobils können Energie für eine Reichweite von 400 km speichern. „Das Wetter spielt keine Rolle“, sagte Palmer. „Es kann mehrere Tage in Folge regnen, ich fahre ohne Probleme weiter.“\n\nPalmer war mit seinem dreirädrigen „Taxi“ im Juli in Luzern gestartet. Seitdem hat er Europa, Asien, Australien, Neuseeland und Nordamerika durchquert. Er zieht einen Anhänger mit sechs Quadratmetern Solarzellen hinter sich her und die Sonnenenergie treibt das Gefährt an. Seit dem Start ist das Solartaxi nur zwei Tage ausgefallen, weil ein Kabel beschädigt war. Gebaut wurde das innovative Fahrzeug von vier Schweizer Ingenieurschulen. Palmer hat auch Platz für Beifahrer: Neben ihm saßen schon berühmte Persönlichkeiten aus Politik, Wirtschaft und Showgeschäft im „Solartaxi“.\n\n5\n\nDie Bundesregierung und ihre Spitzenbeamten sind auf Dienstreisen gern mit dem Flugzeug unterwegs – aber nicht nur, wenn es um Fernreisen geht, sondern auch bei kurzen Inlandsreisen. Wie aus der Antwort des Innenministeriums auf eine Frage eines Abgeordneten hervorgeht, gab die Bundesregierung im letzten Jahr 7,7 Millionen Euro für innerdeutsche Flugreisen aus.\n\nFahrkarten der Bahn hingegen schlugen lediglich mit 3,2 Millionen zu Buche. Der Vergleich mit anderen Jahren zeigt aber, dass sich die meisten Politiker bemühen, immer häufiger vom Flugzeug auf die Bahn umzusteigen. Eine Ausnahme bildet das Kanzleramt (Flugkosten um 30 % erhöht gegenüber dem Vorjahr) sowie ausgerechnet das Ressort des Bundesumweltministers (plus 7 %). Vergleichszahlen für den erhöhten und gesenkten Benzinverbrauch für die Dienstwagen der Bundesregierung liegen noch nicht vor.", "1.27": "Überschriften\n\na) An deutschen Grundschulen sind männliche Lehrkräfte selten\n\nb) Bildungsexperten warnen: Deutsche Lehrer sind schlecht ausgebildet\n\nc) Bildungsforscher: Lehrermangel wird in Deutschland nicht eintreten\n\nd) Die Zahl der männlichen Lehrkräfte an Grundschulen nimmt zu\n\ne) Experten befürchten zunehmenden Lehrermangel in Deutschland\n\nf) Gewerkschaft erwartet Lehrermangel in Berlin\n\ng) GEW befürchtet Abwanderung von gut ausgebildeten Lehrkräften aus Berlin\n\nh) Immer mehr Berliner wandern aus\n\ni) Immer weniger Frauen machen ein Grundschullehrer-Studium\n\nj) Vorausschauende Politiker verhindern Lehrermangel in Berlin\n\n1\n\nBerlin wird in 10 Jahren rund 5.000 Lehrkräfte weniger brauchen als derzeit. Für den Unterricht an den Schulen werden dann, wie die Gewerkschaft Erziehung und Wissenschaft (GEW) errechnet hat, noch etwa 25.500 von heute 30.000 Pädagogen benötigt.\n\nDie Gewerkschaft befürchtet zugleich, dass bis zu diesem Zeitpunkt zu wenig Nachwuchskräfte ausgebildet werden und es deshalb zu einer dramatischen Unterversorgung kommt. Nach Meinung der GEW steuert die Hauptstadt bei der Personalausstattung der Schulen auf ein Fiasko zu, weil in den nächsten 10 Jahren mehr als 10.000 Lehrkräfte aus Altersgründen in den Ruhestand gehen.\n\nAußerdem würden jährlich zirka 400 Lehrer die Berliner Schulen verlassen, so dass nach Ansicht der GEW letztlich 9.000 Stellen fehlen. Wenn die Zahl der Studienanfänger nicht kräftig gesteigert werde, könne langfristig nicht einmal die Hälfte des prognostizierten Einstellungsbedarfs gedeckt werden.\n\nAußerdem sei die Hauptstadt für Berufseinsteiger nicht so attraktiv wie andere Bundesländer, da sie selbst für Mangelfächer nur befristete Verträge anbietet.\n\n2\n\nWer sich in Berlin um eine Stelle als Lehrer bewirbt, muss hart im Nehmen sein. „Während man in Hamburg respektvoll behandelt wird, rechnen Vertreter der Berliner Schulverwaltung den Bewerbern vor, wie teuer Lehrer sind. Da fühlt man sich nicht richtig gewollt“, sagt Maria Schütz.\n\nDie 27-Jährige gehört zu den rund 500 Referendaren, die in zwei Wochen mit ihrem Studium fertig werden. Maria Schütz, die ihr Examen mit der Note 1,5 bestanden hat und unbedingt in Berlin unterrichten wollte, hat mit ihrer Bewerbung leidvolle Erfahrungen hinter sich.\n\n„Während man in Hamburg sofort eine feste Stelle im Beamtenverhältnis angeboten hat, konnte mir in Berlin keiner zusagen, dass ich im nächsten Schuljahr gebraucht werde.“ Die junge Frau hat das gute Angebot aus Hamburg einer unsicheren Zukunft in Berlin vorgezogen.\n\nFür Anna Richter, Vorsitzende der Lehrergewerkschaft GEW, ist Marias Geschichte nur eine von vielen. Ihre Organisation ist besorgt darüber, dass Berlin auf diese Weise viele gut qualifizierte Lehrer an andere Bundesländer verlieren könnte.\n\n3\n\nDie Hilferufe aus den Schulen wollen nicht verstummen: Schüler klagen über ständigen Lehrerwechsel, Eltern über Stundenausfall und Schulleiter über fehlende Bewerber. Doch es könnte noch schlimmer werden.\n\nDer Verband Bildung und Erziehung (VBE) rechnet in den nächsten 15 Jahren mit einem „gewaltigen Lehrermangel“ in Deutschland. Der Verbandsvorsitzende Ludwig Eckinger sagte am Donnerstag, er gehe für diesen Zeitraum von bis zu 400.000 Lehrern aus, die aus Altersgründen aus dem Schuldienst ausscheiden. Für 100 pensionierte Lehrer kämen jedoch nur 50 neue Kollegen.\n\nDer Lehrernotstand kommt nicht überraschend, Forscher sagten ihn längst voraus. Und auch die Konferenz der Kultusminister präsentierte schon vor fünf Jahren beunruhigende Zahlen: Es werden an deutschen Schulen 70.000 Pädagogen fehlen, denn fast die Hälfte der 800.000 Lehrer geht in Pension.\n\nDeshalb fordern Experten seit langem einen bundesweiten Entwicklungsplan, denn Untersuchungen des Lehrerarbeitsmarktes zeigten eher „Chaos als systematische Planung“. Deutschland steuere auf Zustände wie in den Niederlanden zu. Dort ist der Lehrermangel so groß, dass sich Schulen gegenseitig Lehrer ausspannen.\n\n4\n\nBildungspolitiker und Lehrervertreter wollen Abiturienten scharenweise in den Lehrerberuf locken.\n  Sie sollen große Lücken schließen, die durch Pensionierungen entstehen. Doch das Versprechen vom sicheren Job lässt sich womöglich nicht einlösen – es basiere auf falschen Annahmen, sagen Essener Bildungsforscher.\n\nDie Arbeitsgruppe Bildungsforschung/Bildungsplanung unter der Leitung des Wissenschaftlers Klaus Klemm kommt in ihrem Bericht zu einem ganz anderen Ergebnis. Während die Kultusministerkonferenz mit 70.000 fehlenden Lehrern rechnet und der Philologenverband gar mit 80.000, errechnete die Forschungsgruppe, dass es zu einer insgesamt ausgeglichenen Bilanz zwischen Nachfrage und Angebot auf dem Lehrer-Arbeitsmarkt kommen werde.\n\nWenn sich die „Einstellungspolitik der Bundesländer nicht ändert, dürften wir sogar einen Lehrerüberschuss bekommen“, sagte Klemm. Er warnt Abiturienten, ihre Studienentscheidung von den angeblich rosigen Aussichten für Lehrer abhängig zu machen.\n\n„Die Abiturienten hören, es werden Lehrer gesucht, und schon studieren sie Germanistik fürs Gymnasium. Das ist ein Fehler“, sagt Klemm. Denn schon jetzt zeichne sich ab, dass es Deutsch-, Geschichts- und Fremdsprachenlehrer eher schwer haben werden.\n\n5\n\nMädchen haben tendenziell bessere Noten und stellen 56 Prozent der Abiturienten. Dagegen sind zwei Drittel der Schulabbrecher und drei Viertel der Sonderschüler Jungen.\n\nLiegt die Ursache in der Grundschule, wo von den knapp 200.000 Lehrkräften nur rund 26.000 männlich sind? An der Grundschule sind Männer eine Rarität. Wer sich dorthin verirrt, arbeitet allein unter Frauen.\n\nIm Schuljahr 1990/1991 unterrichtete noch ein Drittel Männer an Grundschulen, im Schuljahr 2006/2007 liegt der Frauenanteil an den Grundschullehrern bei 86,9 Prozent, während an weiterführenden Schulen das Geschlechterverhältnis nahezu ausgeglichen ist.\n\nIm Extremfall kann das bedeuten, dass Jungen bis zum Alter von 10 oder 12 Jahren in Krippe, Kindergarten und Grundschule ausschließlich von Frauen betreut und unterrichtet werden.\n\nAuch die Familienministerin vermisst die Männer an den Grundschulen. „In den wichtigen frühen Jahren fehlen den Jungen männliche Vorbilder, an denen sie sich im Alltag orientieren können“, sagte sie in einem Interview.\n\nDas gelte gerade für Kinder mit Migrationshintergrund. Gründe dafür sieht sie in der gesellschaftlichen Anerkennung des Berufs und in den Gehaltsstrukturen.", "1.28": "Überschriften\n\na) Gemeinsam kaputte Geräte retten.\n\nb) Kaufsucht überwinden – diese Möglichkeiten gibt es.\n\nc) Neue Besitzer für nicht mehr gebrauchte Gegenstände.\n\nd) Reparatur alter Haushaltsgeräte lohnt oft nicht.\n\ne) Rücksendungen verderben Online-Händlern das Geschäft.\n\nf) Rücksendungen verringern: Händler hoffen auf Lösungen.\n\ng) Studie zeigt, welche Geschenke glücklich machen.\n\nh) Verein mit Preis für Umweltschutz ausgezeichnet.\n\ni) Volle Einkaufstüten machen nur kurze Zeit Freude.\n\nj) Wer Engagement zeigt, steigert sein Glücksgefühl.\n\n1\n\nSie sind eine gut funktionierende Gemeinschaft mit einer Vision: Schon seit den 80er Jahren leben Mitglieder des „Tauschrings Harmsdorf e.V.“ vor, wie man nachhaltig mit Ressourcen umgehen kann und dadurch die Umwelt schont. Tauschen, nicht wegwerfen ist das Motto dieser Initiative – die damals als eine der ersten dieser Art in Deutschland noch belächelt wurde, heute aber viel Lob und Anerkennung bekommt.\n\nOb Küchengeräte, Bücher oder auch Kleidungsstücke, die man nicht mehr anzieht: Was ungenutzt, findet bei jemandem Verwendung, der noch etwas damit anfangen kann. Getauscht werden nicht nur Güter, sondern auch Dienstleistungen. Eine der Voraussetzungen für das Gelingen: „Die Dienstleistungen dürfen nicht in Konkurrenz zum Handwerk stehen“, erklärt Tauschring-Mitglied Kati Jago. Besonders gefragt seien Fahrdienste, etwa zum Arzt.\n\nIhre monatlichen Zusammenkünfte an der Rathausstraße sind für die derzeit 30 Vereinsmitglieder viel mehr als bloße Tauschtreffs: „Man darf den Faktor Mensch nicht unterschätzen“
