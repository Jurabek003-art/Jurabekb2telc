nsportmittel für Babys können sportbegeisterte und von grenzenloser Mobilität träumende Eltern jetzt samt Kind beim Joggen oder beim Inlineskaten vor sich herschieben. Die Babys sollen sich darum kümmern, sein von der Rechte, die mit sich zu fühlen, um sich zu kümmern. Doch der die Gerätesicherheitsbewährte TÜV, bei Fahrzeugbesitzern in Deutschland schon seit langem als Spielverderber bekannt, warnte vor den Joggingbummel: Sie haben einen ungünstigen Schwerpunkt auf der Hinterachse, d.h. sie kippen leicht nach hinten um, und sie können sich leicht selbständig machen – jedenfalls solange, bis die Babys das Bremsen lernen haben.", "3": "Schweizer Forscher haben herausgefunden, dass nur 6 Minuten Hochleistungstraining pro Woche – also weniger als eine Minute pro Tag – ausreichen, um den Körper fit zu halten. In einem Versuch mit mehreren Probanden nahm eine Gruppe an einem traditionellen Ausdauertraining teil, mit je ein bis zwei Trainingsstunden täglich. Die zweite Gruppe führte täglich 60 Sekunden dauernde Radsprints durch, wobei die Teilnehmer quasi aus dem Stand Höchstgeschwindigkeit erzielen mussten. Das Resultat war überraschend: Beide Gruppen zeigten die gleichen gesundheitlichen Verbesserungen. Die Muskeln nahmen gleich viel Sauerstoff auf, und auch die Werte des für die Sauerstoffaufnahme verantwortlichen Zitratzyklus waren gleich. Sehr kurze und hochintensive sportliche Übungen verbessern die Fitness genauso wie das zeitraubende traditionelle Ausdauertraining.", "4": "Mehr Bewegung als Ausgleich für zu langes Sitzen im Büro und in der Freizeit ist jetzt angesagt, um Übergewicht, Bluthochdruck und Herz-Kreislauf-Erkrankungen vorzubeugen und um fit zu bleiben. Gerade für Anfänger gibt es jedoch bei den die Ausdauer trainierenden Sportarten wie die gegen einige Grundregeln, die beachtet werden müssen, will man gesundheitliche Schäden vermeiden.\n[25.07.2026 11:18] Jurabek: Die ersten Trainingseinheiten sollen nicht länger als 20 bis 30 Minuten dauern und zweimal pro Woche durchgeführt werden. Der Puls sollte nie den Wert 200 minus Lebensalter überschreiten, bei einem 20-Jährigen kann er also bei 180, bei einem 60-Jährigen hingegen nur bei 140 liegen. Außerdem gilt für alle, die beim Sport abnehmen möchten: Je höher der Pulsschlag, desto weniger Fett wird verbrannt. Hoher Pulsschlag lässt Sporttreibenden langsamer abnehmen.", "5": "Viele frischgebackene Eltern stehen einem riesigen Angebot an Kinderwagen gegenüber, das in Kinderläden und Großmärkten feilgeboten wird. Doch welcher ist der richtige? Experten raten, beim Kauf dieses für die ersten Jahre mit dem Kleinkind wichtigen Gefährts auf ein paar Dinge zu achten. Erstens sollte die Matratze nicht zu weich sein, damit das Kind nicht einsinkt, wodurch die Atmung behindert werden kann. Zweitens sollten die Räder gefedert sein, um Erschütterungen auf unebenen Wegen auszugleichen. Ein hoher Wagen schützt die Babys vor dem Auspuff der Autos an Straßenkreuzungen. Zusammenklappbare Wagen passen in jeden Kofferraum und lassen sich fast überallhin mitnehmen. Der Wagen sollte vor allem kippsicher sein und keine scharfen Kanten haben, an denen sich die Kinder verletzen können. Vom TÜV geprüfte Kinderwagen erhalten ein Prüfzeichen. Damit haben die Eltern eine gewisse Sicherheit, dass der Kinderwagen auch nach Dauergebrauch nicht zu einem Sicherheitsrisiko für ihr Kind werden kann."}, "answers": {"1": "B", "2": "F", "3": "E", "4": "A", "5": "D"}, "options": {"1": ["B", "D", "H", "F", "I", "E", "A"], "2": ["F", "D", "E", "J", "H", "I", "A"], "3": ["B", "A", "C", "H", "E", "D", "J"], "4": ["F", "I", "H", "C", "A", "G", "E"], "5": ["B", "C", "J", "F", "A", "E", "D"]}}, "1.18": {"headings": {"A": "Erneuerungskur für einen alten Markt", "B": "Junge Influencer werben für Bioprodukte", "C": "Neues Buch über einen Wiener Architekten erschienen", "D": "Österreichs beliebteste Marktplätze", "E": "Schreiben im Internet für die Karriere", "F": "Schulung zum Erfolg im Beruf", "G": "Seminar: Produkte erfolgreich verkaufen", "H": "Warum immer mehr Menschen auf Märkten einkaufen", "I": "Wenn Blogger Firmengeheimnisse verraten", "J": "Wissenswertes über Wiens größten innerstädtischen Markt."}, "texts": {"1": "Das Lesemagazin MENU hat eine Umfrage zu den populärsten Märkten in Österreich durchgeführt. Vor der eigentlichen Abstimmung hatte das Magazin seine Leserinnen und Leser dazu aufgerufen, Märkte zu nominieren. Aus den häufigsten Nennungen hat das Redaktionsteam eine Liste mit zwanzig Märkten aus ganz Österreich erstellt und zwei Wochen lang online zur Abstimmung angeboten. Als klarer Sieger ging der Markt am Domplatz von St. Pölten hervor. Dieser ist berühmt für sein ganzjähriges Einkaufsvergnügen. Als Nahversorger für die Innenstadt und Anziehungspunkt für Menschen aus dem Umland trägt er erheblich zur Lebensqualität der Bevölkerung bei. Auf Platz zwei und drei folgten zwei burgenländische Märkte, nämlich der Markt der Erde in Parndorf und der Regionalmarkt in den ehemaligen Stallungen von Schloss Esterházy in Eisenstadt. Das große Interesse an der Abstimmung zeigt laut MENU, wie sehr die Konsumentinnen und Konsumenten Märkte schätzen.", "2": "Sie sind der Meinung, dass Ihre Qualifikationen ausreichen, um Karriere zu machen? Qualifikationen und Berufserfahrung sind zwar wichtige Kriterien für den erfolgreichen Aufstieg auf der Karriereleiter, doch ohne gutes Selbstmarketing werden Sie auf halbem Wege stehenbleiben. Das ist letztlich genauso wie beim Verkauf eines Produktes: Es reicht nicht, dass ein Produkt gut ist, es muss auch gut beworben werden. Während Marketing das Produkt vorteilhaft am Markt platzieren möchte, verfolgt man beim Selbstmarketing das Ziel, seine persönlichen und Stärken bewusst hervorzuheben. Mit anderen Worten: Es geht darum, sich gut zu verkaufen. Selbstmarketing beginnt schon bei der Bewerbung und dem Vorstellungsgespräch und setzt sich im Job fort. Auch dort müssen Sie auf sich aufmerksam machen. Doch Achtung: Angeber mag niemand! Wie Sie das richtige Maß finden, erfahren Sie in einem Seminar, das an vier Wochenenden im April in Klagenfurt stattfindet. Alle Details gibt es hier.", "3": "Der Wiener Naschmarkt gehört zu Österreichs beliebtesten Märkten. Mit einer Fläche von mehr als zwei Hektar ist er der größte Markt in der Innenstadt. Schon 1780 handelten Bauern dort mit Milchprodukten. Gemauerte Marktstände entstanden erst mehr als 100 Jahre später. Von 1910 an wurden mehr als 120 fixe Marktstände im einheitlichen Stil von Otto Wagner geplant und errichtet. Das Marktamtsgebäude bei der Kettenbrückengasse wurde 1916 fertiggestellt. Heute ist der Naschmarkt eine begehrte Wiener Sehenswürdigkeit. Bei Schönwetter zählt der Markt mehr als 65.000 Personen pro Woche, viele davon Touristen. Ein Teil der Marktfläche ist für Gastronomiebetriebe reserviert. Nun erzählt ein neuer Reiseführer die Geschichte des Naschmarktes, reich illustriert mit alten Aufnahmen. Ein Kapitel behandelt auch die berühmten Wienzeilenhäuser Otto Wagners, die sich an der Linken Wienzeile im Bereich des Naschmarktes befinden. Dazu gibt es Einkaufstipps und Beschreibungen der Lokale. „Der Markt am Wienfluss“. Hrsg. Hannes Ortner, 35 Seiten, 17 Euro.", "4": "Wer bloggt, zeigt neben Fachkompetenz auch Kreativität. Das schätzen auch 4 Arbeitgeber. Ob man über fachliche Fragestellungen schreibt oder einfach nur über das Leben – das Themenspektrum von Blogs ist riesig. Genauso vielfältig sind auch die Möglichkeiten, die sie Bewerberinnen und Bewerbern bieten. Wer einen Blog professionell betreibt, kann seine fachlichen Kompetenzen präsentieren und gleichzeitig seinen Ideenreichtum unter Beweis stellen. Doch auch die Darstellung eines Hobbys zeigt, dass der Bewerber aktiv und kreativ ist.\nExperten raten daher Bloggerinnen und Bloggern, in ihren Bewerbungsunterlagen gezielt darauf hinzuweisen. Doch Achtung: Ein Blog kann Bewerber auch in einem schlechten Licht erscheinen lassen. Bloggen während der Arbeitszeit und das Schreiben über Firmeninterna sind natürlich tabu.", "5": "Bis Herbst soll ein neues Marktkonzept für den altehrwürdigen Salzburger Grünmarkt vorliegen. Damit der Markt für Besucherinnen und Besucher wieder attraktiver wird, setzt die zuständige Stelle im Magistrat auf Nachhaltigkeit. Biologische Lebensmittel aus nachhaltiger Produktion, im Idealfall aus der Region, sollen den Markt wieder zu einem Fixpunkt in der Altstadt werden lassen. Der für Märkte, Stadtnatur und Lebensqualität zuständige Vizebürgermeister hofft, dass der Markt dazu beitragen kann, ein positives Lebensgefühl zu vermitteln. Obwohl die Stadt die Verkaufsstände vor einigen Jahren aufwändig hatte restaurieren lassen, verzeichneten die Händler zuletzt einen deutlichen Rückgang an Kundschaft. Zudem haben einige von ihnen altersbedingt ihre Verkaufsstände aufgegeben. In diesem Zusammenhang wurde auch die beliebte Foodbloggerin Jasmin May engagiert. Sie soll dazu beitragen, das Konzept in der Öffentlichkeit bekannter zu machen. Wir werden das Projekt weiterverfolgen und von seinem Fortgang berichten."}, "answers": {"1": "D", "2": "F", "3": "J", "4": "E", "5": "A"}, "options": {"1": ["H", "D", "G", "F", "I", "J", "B"], "2": ["F", "D", "G", "B", "H", "E", "J"], "3": ["E", "J", "B", "G", "I", "F", "D"], "4": ["J", "D", "H", "F", "C", "E", "A"], "5": ["I", "C", "A", "B", "D", "E", "J"]}}, "1.19": {"headings": {"A": "Der Wald als neues Zuhause", "B": "Die Auswirkungen künstlichen Lichts", "C": "Landbewohner fordern besseren öffentlichen Nahverkehr.", "D": "Plötzlich geht das Licht aus – was tun bei Strom", "E": "Stadtbewohner entdecken das Landleben", "F": "Stadtbewohner leben umweltfreundlicher", "G": "Trend: Großstädter machen Urlaub im Wald", "H": "Warum Licht für unser Wohlbefinden wichtig ist", "I": "Was tun, wenn es Nacht wird? Lichtquellen vergangener Zeiten", "J": "Wohnungsnot in Metropolen"}, "texts": {"1": "Heute machen die elektrische Beleuchtung in Wohnhäusern, Straßenlaternen, Ampeln, Neonreklame und Scheinwerferlicht draußen die Nacht fast zum Tag. Vor der Erfindung der Elektrizität war dies anders. Der Arbeitsalltag der Menschen wurde von den Jahreszeiten und vom Tageslicht bestimmt. Gearbeitet wurde von Sonnenaufgang bis Sonnenuntergang. Danach war Beleuchtung nur mit anderen Hilfsmitteln wie z. B. Feuer, Kerzen und Petroleum möglich.\nDas Museum für Dorfkultur in Weinheim zeigt in einer Sonderausstellung, wie sich das Landleben früher nach Einbruch der Dunkelheit abspielte. Man erfährt zum Beispiel, wie man vor Erfindung des Streichholzes Feuer entfachte. Es geht um die Bedeutung der Kerzen im bäuerlichen Leben und darum, welche weitreichenden Umbrüche die Erfindung der Gasbeleuchtung und des elektrischen Lichts mit sich brachte.", "2": "Jahrelang zog es vor allem junge Berufstätige in die Großstädte, denn diese sind attraktiv, bieten umfangreiche Einkaufsmöglichkeiten und einen gut ausgebauten öffentlichen Nahverkehr. Doch seit einiger Zeit beobachten Forscher eine gegenläufige Bewegung. Immer mehr Menschen kehren den Metropolen den Rücken und lassen sich im Umland nieder wegen der Ruhe und der günstigeren Preise.\nDie Städte, die immer teurer werden, die Freiräume, die der ländliche Raum bietet, sowie die neuen Formen des digitalen Arbeitens begünstigen die Stadtflucht. Unter den neuen Landbewohnern finden sich einerseits Berufstätige, die ortsunabhängig arbeiten können, wie Programmierer, Journalisten oder Grafikdesigner, andererseits aber zum Beispiel auch Lehrer, Ärzte und Handwerker, heißt es in der Studie. Die Wissenschaftler sprechen schon von einer Trendwende, die sich vor allem in den Ballungszentren Berlin, Hamburg, München, Frankfurt und Stuttgart abzeichnet.", "3": "Satellitenbilder der Erde bei Nacht zeigen ein strahlendes Lichtermeer, das sich fast durchgehend über den Globus erstreckt. Seit der Erfindung der Glühbirne steht Licht für Wohlstand und Fortschritt. Die Städte sind nachts hell erleuchtet, nicht immer jedoch zum Wohle von Mensch und Umwelt: Denn zu viel Licht hat Folgen für Menschen und Tiere.\nAn Straßenlaternen verenden jede Nacht Milliarden von Insekten, Zugvögel verlieren die Orientierung, und selbst der Mensch wird durch das Kunstlicht um einen gesunden Schlaf gebracht. Wissenschaftler sprechen bereits von einer massiven Lichtverschmutzung. Weltweit gehen Forscher jetzt der Frage nach, wie sich die Lichtflut auf ein gesundes Maß reduzieren lässt.\nDabei arbeiten Physiker, Biologen, Mediziner und Ingenieure an der Beleuchtung der Zukunft an einem Licht, das weder Energie verschwendet noch unnötig den Nachthimmel erhellt, keine Insekten verenden und durch besondere Farbspektren auch den Menschen unbehelligt schlafen lässt. Denn es geht nicht darum, die Städte völlig dunkel zu machen. Es geht darum, sie nachhaltiger und intelligenter zu beleuchten.", "4": "Vor zehn Jahren lebten Dirk und Antje Sebens noch in Mannheim, mitten in der Stadt. Dann kauften sie sich ein altes Forsthaus im Wald. Sie hatten es zufällig entdeckt, denn eigentlich hatten sie nur einen ruhigen Ort gesucht, um am Wochenende dem Stadtleben entfliehen zu können.\nDoch sie waren sofort von dem Haus begeistert, dass es dort weder Strom noch fließendes Wasser gab, schreckte sie nicht ab. Heute versuchen die beiden, so autark wie möglich zu leben. Die Solaranlage auf dem Dach liefert Strom, eigenes Holz die Wärme, der Brunnen vor dem Haus das Wasser.\nIm Sommer bauen Dirk und Antje Sebens Gemüse an, das sie für den Winter einwecken.\nDas nächste Dorf ist mehrere Kilometer entfernt und außer Besuchern verirrt sich höchstens mal ein Wanderer zu ihnen. „Die absolute Dunkelheit draußen in der Nacht war am Anfang sehr ungewohnt“, erzählt Antje Sebens. Denn elektrische Straßenlaternen wie in der Stadt gibt es im Wald natürlich nicht. Bereut haben die beiden ihre Entscheidung nie. Noch immer empfinden sie es als großes Abenteuer, mitten in der Natur zu sein und auf viele Annehmlichkeiten zu verzichten.", "5": "Wer verbringt nicht gerne sein Wochenende fernab der Stadt? Im Grünen, wo es noch Wiesen und Schmetterlinge gibt und weder Staus noch Lärm. Viele zieht es gleich ganz aufs Land. Doch dort braucht man meist ein Auto. Wer nicht im Home-Office arbeiten kann, wird zum Pendler.\nHinzu kommt, dass es in vielen Dörfern kaum noch Einkaufsmöglichkeiten oder Schulen gibt und der öffentliche Nahverkehr in ländlichen Grundschulbewohner nicht ohne PKW auskommen können. Forscher haben errechnet, dass wir bis zu 87 Prozent der Emissionen aus unserer Alltagsmobilität einsparen können, wenn wir in verkehrstechnisch günstiger Lage wohnen, also am besten in der Stadt mit Einkaufsmöglichkeiten vor der Tür.\nAuch das Argument, das Wohnen auf dem Land sei günstiger, überzeugt immer weniger. Zwar waren dort früher Mieten und Bauland auf dem Land vergleichsweise erschwinglich, wird heute das Preisgefälle zwischen Stadt und Land immer flacher, das Ergebnis könnte ernüchternd sein und das Leben in der Stadt attraktiver machen."}, "answers": {"1": "I", "2": "E", "3": "B", "4": "A", "5": "F"}, "options": {"1": ["A", "J", "D", "I", "H", "B", "F"], "2": ["A", "E", "B", "J", "D", "G", "H"], "3": ["A", "F", "E", "C", "B", "D", "J"], "4": ["J", "F", "E", "D", "A", "B", "I"], "5": ["D", "E", "G", "C", "I", "F", "A"]}}, "1.20": {"headings": {"A": "Alte Spiele stärken das Miteinander", "B": "Dinge zum Anfassen bleiben beliebt.", "C": "Je mehr Spielsachen, desto größer die Kreativität.", "D": "Kleine Züge mit langer Geschichte.", "E": "Massenfertigung von Kuscheltieren", "F": "Naturgetreue Handarbeit für das Kinderzimmer.", "G": "Technik Spielzeug von früher wieder im Handel", "H": "Überfluss im Kinderzimmer", "I": "Viele Computerspiele kommen schnell aus der Mode", "J": "Warum sich Leser von Büchern abwenden"}, "texts": {"1": "Die erste Kosener Puppenfabrik wurde 1912 von Käthe Kruse gegründet. 80 Jahre später übernahm der Unternehmer Helmut Schache die traditionsreiche Spielzeugmanufaktur in Sachsen-Anhalt, seitdem wird sie von seiner Familie geführt. Dort werden noch wie früher Plüschtiere einzeln angefertigt, rund 80.000 jährlich, von der kleinen Maus bis zum 1,65 Meter großen Bären.\nWir machen keine niedlichen Plüschtiere. Wir versuchen die Tiere so zu gestalten, wie sie in ihrer Umwelt sind“, erklärt Helmut Schache. Die Plüschtiere entstehen nicht in Fließbandproduktion, sondern werden einzeln zusammengenäht, manche aus über 100 Teilen. Nur so gelingt es, die charakteristischen Merkmale der Tiere authentisch abzubilden. Jedem Entwurf gehen ausführliche anatomische Beobachtungen und Studien in der Natur und im Zoo voraus. Dann erst folgen Skizzen und erste Modelle aus Ton. 15 bis 20 neue Tiere bringt die Kösener Spielzeugmanufaktur jedes Jahr auf den Markt. Verkauft werden sie in 25 Ländern.", "2": "Die Modelleisenbahn hat auch im Computerzeitalter ihre Anziehungskraft nicht verloren. Bis heute bringt sie die Augen von großen und kleinen Eisenbahnfans zum Leuchten. Doch ihre ersten Erfolge feierte sie schon vor langer Zeit: 1891 rollte die erste Uhrwerkeisenbahn zum Aufziehen über die Gleise, und mit ihr begann der Aufstieg der Firma Märklin zum führenden Hersteller von Spielzeugeisenbahnen.\nDamals brachte die beginnende Industrialisierung mit ihren neuen Technologien auch für durch die Spielzeugherstellung neue Impulse. Dampfmaschinen im Kleinformat und funktionierende Kinder-Koch-Herde hielten Einzug in die Kinderstuben. 1895 brachte Märklin die erste dampfbetriebene Spielzeugeisenbahn auf den Markt. Einige Jahre später entwickelte man daraus die elektrische Modelleisenbahn, wie sie noch immer zu kaufen ist. Diese faszinierte Generationen technikbegeisterter Fans und wurde zum Sammelobjekt. Gewiss werden die Miniatureisenbahnen noch lange durch Kinderzimmer und Hobbykeller rattern.", "3": "Gedruckten Büchern wurde vor einigen Jahren von Experten ein schnelles Ende vorausgesagt. Das papierlose Lesen sei die Zukunft, hieß es. Höchstens als Nischenprodukt könnten Bücher noch existieren. Doch schon wenig später stiegen deren Verkaufszahlen überraschend an. Vieles deutet darauf hin, dass sich Sachen, die man selbst in die Hand nehmen kann, doch nicht so leicht von digitalen Inhalten verdrängen lassen.\nZum Beispiel sind Papierkalender nicht aus den Geschäften verschwunden und die Schallplatte findet trotz der Verbreitung von Streaming-Angeboten viele Käufer. Zukunftsforscher erkennen darin sogar einen Trend, nämlich eine Gegenbewegung zur Digitalisierung. Dafür gibt es natürlich Gründe. Wer will schon nur Passwörter, PINs, Speicherplatz und Kontaktdaten besitzen? Alte Bücher, Hörspielkassetten oder Fotoalben wecken dagegen Gefühle“, erklärt der Konsumforscher Peter Riefenberg. Nimmt man das Taschenbuch in die Hand, das man am Strand gelesen hat, fühlt man sich gleich wieder in den Sommerurlaub zurückversetzt. Gegenstände wecken also Erinnerungen – das werden sie digitalen Produkten immer voraushaben.", "4": "Immer neue Spielekonsolen, Spielformate und Apps drängen auf den elektronischen Spielemarkt und dennoch haben Brettspiele nie an Bedeutung verloren. Die Hersteller vermelden sogar Jahr für Jahr steigende Umsätze.\nWas aber macht den Zauber des klassischen analogen Brettspiels aus? Wer selbst sein Glück am Würfelbecher versucht, kommt dem Geheimnis schnell auf die Spur: Beim gemeinsamen Spiel genießen die Mitspieler besondere Momente der Zusammengehörigkeit.\n„Bei solchen Spielen steht das gemeinsame Erlebnis im Vordergrund: Familie und Freunde kommen an einem Tisch zusammen“, erklärt Stefan Wiese, Geschäftsführer des Naumburger Spieleverlags. „Das gute Brettspiel von früher wird auch in Zukunft Anhänger haben. Nach einer gemeinsamen Spielrunde stehen meist alle mit einem Lächeln vom Tisch auf“, ergänzt er. Das Spielen in analogen statt digitalen Welten steigert also Zufriedenheit und Gemeinschaftsgefühl.", "5": "Jahr für Jahr gehört der Umsatz der Spielzeughersteller. Und das ist auch kein Wunder: Denn kaum etwas erfreut Eltern mehr als die leuchtenden Augen der Kinder, wenn sie ein neues Spielzeug bekommen. Und so sind die Schränke und Spielzeugkisten der lieben Kleinen voll mit Puppen, Kuscheltieren und Autos. Doch das hat auch unerwünschte Folgen.\nWenn ein Kind zu viel Spielzeug hat, wird sich seine Phantasie nicht weiterentwickeln“, warnt Spielforscher Jens Junge. Deshalb verzichten manche Kindergärten auf überflüssiges Spielzeug. Im Berlin Musikkindergarten zum Beispiel quillt kaum ein Regal über – und trotzdem wird den Kindern hier nie langweilig. Es gibt Musikinstrumente, Bastelmaterialien und auch Spielzeug – aber nie zu viel, sodass die Kinder nicht überfordert sind. Es komme für die Kinder gar nicht so sehr darauf an, womit sie spielen, sondern vor allem mit wem, betont Mitarbeiterin Lara Schwarz. Das gemeinsame mit Freunden sei für Kinder sowieso am wichtigsten."}, "answers": {"1": "F", "2": "D", "3": "B", "4": "A", "5": "H"}, "options": {"1": ["J", "E", "G", "C", "B", "H", "F"], "2": ["D", "B", "H", "C", "A", "E", "F"], "3": ["F", "C", "E", "H", "B", "D", "A"], "4": ["F", "D", "B", "A", "G", "E", "J"], "5": ["C", "H", "E", "J", "B", "G", "A"]}}, "1.22": {"headings": {"A": "Altes Handwerk und alte Technik anschaulich präsentiert", "B": "Attraktive Kleinstadt – touristischer Geheimtipp", "C": "Ein Altes Kloster als Feuerwache", "D": "Eine Universität mit langer Geschichte", "E": "Eliteschule für Schriftsteller", "F": "Entdeckung und Verbreitung des Kaffees", "G": "Kaffee macht die Leute süß", "H": "Klösterliche Strenge für berühmte Schüler", "I": "Mehr Ziegenmilch dank Energy-Drink", "J": "Ohne Kaffee geht hier nichts"}, "texts": {"1": "Das erste Kaffeehaus in Leipzig, „Zum arabischen Coffee-Baum“, öffnete 1685 seine Pforten. Seitdem ist der Kaffee in Sachsen zum beliebten Getränk geworden, das weder zu Hause auf Party und Feiern noch beim Ausgehen fehlen darf. Kaffeesachsen wurden früher die Bewohner des Landes zwischen Leipzig und polnischer Grenze auch deswegen scherzhaft von den anderen Deutschen genannt. Bevorzugt wird der Kaffee heiß und süß getrunken.\nSüße Ergänzungen wie Dresdner Stollen oder Leipziger Lerchen, beides traditionell gebackene Kuchenspezialitäten, gehören zum Kaffee wie das Tüpfelchen zum „i“. Dabei wird das Gebäck auf echt sächsische Art „gedibbscht“, das heißt: Es wird in den Kaffee getunkt, bevor es gegessen wird. Die Sachsen schwören darauf, dass sowohl das Gebäck als auch der Kaffee so und nur so ihr volles Aroma entfalten.\nWer es selbst ausprobieren möchte: Zahlreiche Kaffeehäuser laden in allen größeren und kleineren Städten Sachsens dazu ein, dies auszuprobieren.", "2": "Eppingen liegt etwa auf halbem Weg zwischen Karlsruhe und Heilbronn im Kraichgau, einer geschichtsträchtigen Region mit wunderschöner Landschaft und bodenständiger Kultur, die von Erholung suchenden Menschenmassen noch nicht überrollt ist.\nDie Altstadt des Städtchens ist ein einziges Museum: Über 100 Fachwerkhäuser mit ihrem romantisch anmutenden Muster aus braunen Holzbalken und weiß getünchtem Lehm können hier bewundert werden. Die bekanntesten davon sind das „Baumannsche Haus“ (erbaut 1582), heute ein Hotel, und die „Alte Universität“, heute ein Museum. Hier befand sich 1564/1565 die Heidelberger Universität, die, als in Heidelberg die Pest wütete, hierhin ausgelagert wurde.\nIm heutigen Museum kann man die Fachwerkkunst studieren. Seit 1993 findet im Juli und August der „Carillonsommer“ statt. Dann geben international bekannte Orgelinterpreten Glockenspielkonzerte, die vom achteckigen Turm der Stadtpfarrkirche erklingen.\nEine lange Tradition in Eppingen hat die Bierbrauerei. Das hier gebraute „Palmbräu“-Bier kann an Ort und Stelle in der Brauereigaststätte probiert werden. Eppingen ist auch Ausgangspunkt zahlreicher Wanderwege, auf denen der Kraichgau zu Fuß erkundet werden kann.", "3": "Das Kloster Maulbronn wurde 1147 von Zisterziensermönchen gegründet. Man sagt, ein Maulesel, den die Mönche auf ihren Wanderungen mitgeführt hatten, solle hier einen Brunnen gefunden haben und man habe daraufhin beschlossen, an dieser Stelle das Kloster zu bauen.\nIm 16. Jahrhundert wurde es im Verlauf der Reformation säkularisiert und zum Internat umfunktioniert. Heute von der UNESCO zum Weltkulturerbe der Menschheit erhoben, ist das Kloster ein Touristenmagnet.\nSelbst vom berüchtigten Doktor Faust wird erzählt, er sei einmal dort gewesen. Das Kloster soll einmal kein Geld mehr gehabt haben, und der sonst gottesfürchtige Abt habe geglaubt, mit Hilfe des Doktor Faust und dessen Zauberkünsten wieder zu Geld zu kommen.\nMaulbronn war besonders wegen seiner Klosterschule bekannt, die von namhaften Persönlichkeiten besucht wurde: Johannes Kepler lernte hier Latein und Mathematik, der Schriftsteller Hermann Hesse litt bekanntlich sehr unter der eisernen Disziplin und Härte, die hier nach seiner Meinung vorherrschte. Hermann Hesse hat die Klosteranlage später in seinen Romanen „Unterm Rad“ und „Narziß und Goldmund“ zum Schauplatz gemacht.", "4": "Auf einer Anhöhe oberhalb des Bodensees liegt, ca. 10 km vom See entfernt in idyllischer ländlicher Umgebung, das ehemalige Zisterzienserkloster Salem.\nInnerhalb der weitläufigen Klosteranlage aus dem 12.\nJahrhundert befinden sich heute mehrere Museen und das gotische Münster. Im Feuerwehrmuseum findet der interessierte Besucher alte Feuerwehrwagen, die noch von Pferden gezogen wurden, alte Geräte, Spritzen und Pumpen sowie mehrere Modellanlagen.\nIm Weinbaumuseum bekommt man einen Überblick über die Weinproduktion der Bodenseeregion. Hier können regionale Weine probiert und auch gekauft werden. In den angrenzenden Gebäuden kann man zuschauen, wie – noch in Handarbeit – Musikinstrumente gebaut werden, Glas geblasen oder Goldschmuck hergestellt wird.\nEin kleiner aber feiner Park lädt zum Ausruhen und Verweilen ein. International bekannt ist jedoch das von Kurt Hahn und dem Prinzen Max von Baden 1920 gegründete Internat Salem, das von den Söhnen und Töchtern bekannter Familien aus ganz Europa besucht wurde und wird: Der erste deutsche Bundespräsident Theodor Heuss ging hier ebenso zur Schule wie der Ehemann der britischen Königin Elisabeth II., Prinz Philipp.", "5": "Vermutlich vor fast 900 Jahren, irgendwann im dreizehnten Jahrhundert, sollen die Menschen herausgefunden haben, was es mit dem Kaffee auf sich hat.\nEine Legende erzählt von einem jemenitischen Ziegenhirten, dessen Ziegen sich nach dem Genuss der roten Beeren eines bestimmten Strauches merkwürdig lebendig und aufgedreht benommen haben sollen. Im Dorf habe der Dorfgelehrte dann herausgefunden, dass die Früchte, die bisher nur den Ziegen zu viel „Energie“ verholfen hatten, auch beim Menschen ihre Wirkung zeigten.\nNach mehreren Experimenten habe man dann herausgefunden, dass die Beeren, wenn man sie trocknet und dann mit heißem Wasser aufkocht, am besten schmecken. Der Kaffee war erfunden.\nWegen seiner berauschenden Wirkung, so eine Theorie, soll das Getränk dann arabisch „qahwa“ genannt worden sein, was auch einen Wein bezeichnen konnte. Nach einer anderen Theorie stammt der Kaffee aus der Region „Kaffa“ im südwestlichen Äthiopien. Von hier aus nahm jedenfalls sein Siegeszug über die ganze Welt seinen Ausgang. 1582 erreichte der Kaffee schließlich Europa, wo er bis heute zu einem der beliebtesten Getränke wurde."}, "answers": {"1": "J", "2": "B", "3": "H", "4": "A", "5": "F"}, "options": {"1": ["A", "I", "F", "E", "H", "C", "J"], "2": ["A", "G", "C", "I", "B", "H", "D"], "3": ["A", "D", "J", "I", "E", "F", "H"], "4": ["A", "D", "I", "F", "E", "C", "H"], "5": ["I", "B", "C", "D", "A", "F", "G"]}}, "1.23": {"headings": {"A": "Bilder einer bedeutenden Künstlerin", "B": "Das Ende der Dunkelheit", "C": "Die bemerkenswerte Karriere eines Fotografen", "D": "Ein Fotograf auf Reisen", "E": "Eine Fotografin dreht einen Film", "F": "Entwicklungsgeschichte der Lampen", "G": "Erde, Mond und Sterne – wie man sie noch nie gesehen hat", "H": "Familienfotos berühmter Persönlichkeiten", "I": "Gelungene Einführung in die moderne Fotografie", "J": "Mit Profis eine neue Foto-Technik erlernen"}, "texts": {"1": "Der Buchtitel erinnert an eine Horrorgeschichte: „Die Nacht“. Aber dem Autor Paul Bogart geht es nicht um Fantasiewelten, sondern um sehr reale Dinge. Das Thema des Autors ist die nächtliche Finsternis.\nWer erlebt noch eine dunkle Nacht? Großstadtbewohner eher nicht, außer im abgedunkelten Schlafzimmer. Ein natürlicher Nachthimmel mit unzähligen Sternen ist die Ausnahme, deshalb sind wir überwältigt, wenn wir ihn doch einmal zu sehen bekommen. Das war früher anders, und zwar bis Gaslicht und Glühlampe erfunden wurden. Heute sieht man in Städten gerade noch den Mond und, wenn man Glück hat, eine Handvoll der hellsten Sterne.\nPaul Bogart erläutert, warum künstliches Licht so weit verbreitet ist, und betrachtet dies sehr kritisch. Der Autor fesselt seine Leser dabei mit beachtlichem Fachwissen. Außerdem ist er weit gereist. Überall, so berichtet er, gebe es Organisationen, die sich für eine Reduzierung des künstlichen Lichts einsetzen – auch in Deutschland. Paul Bogart fände es positiv, wenn die Organisationen sich durchsetzen könnten. Denn der Autor – und das macht er sehr deutlich – hält nicht viel davon, dass es heute kaum noch völlig dunkel ist.\n➡️ Javob: b) Das Ende der Dunkelheit\n⸻", "2": "Fotos machen ist heute nicht schwer. Schnell nimmt man das Handy und macht einen Schnappschuss. Wer aber besondere und eindrucksvolle Bilder haben möchte, muss sich mit dem Thema Fotografie schon etwas intensiver befassen. Dietmar Spehrs neuer Fotografie-Ratgeber ist dabei ein gutes Hilfsmittel. Auf 424 Seiten erklärt der Autor und Journalist mit einfachen, aber kompetenten Worten, was zu beachten ist.\nDer Ratgeber versteht sich als Fotokurs für Ein- und Aufsteiger und richtet sich an die vielen Menschen, die gerne fotografieren, aber wenig Fachwissen haben. Diesen Hobbyfotografen vermittelt das Buch sehr verständlich Schritt für Schritt solides Basiswissen. Spehr setzt dabei auf Beispielbilder, Tabellen und Grafiken und schreibt so wenig wie möglich, aber so viel wie nötig.\nDas sorgt dafür, dass der Ratgeber sehr unterhaltsam zu lesen ist und nicht wie ein langweiliges Lehrbuch daherkommt. Von der Auswahl des Motivs über die richtige Kameraeinstellung bis hin zur optimierenden Nachbearbeitung am Computer wird alles Wissenswerte vermittelt.\n➡️ Javob: i) Gelungene Einführung in die moderne Fotografie\n⸻", "3": "Bilder der Fotografin Annie Leibovitz sind ab kommendem Samstag im Kunsthaus Wien zu sehen. Die Ausstellung besticht durch ihre umfangreiche Bildauswahl. Zum einen kann man zahlreiche Portraits berühmter Schauspieler, Politiker oder Musiker bestaunen. Zum anderen sieht man Bilder aus dem privaten Fotoalbum der Künstlerin.\nDie zum Teil sehr persönlichen Aufnahmen dokumentieren ihr Leben und zeigen bisher unveröffentlichte Werke, die zum Teil sehr bedrückend sind. Bilder ihres Vaters berühren den Besucher und oftmals ist man von der Offenheit der Fotografin überrascht.\nZwischen Aufnahmen der Fotografin selbst stehen zahlreiche Portraits ihrer Eltern und Urlaubsfotos der Familie. Die bunte Mischung von großformatigen und kleinformatigen Bildern sorgt für Abwechslung.\nUm die Fotografin besser kennenzulernen, können Besucher einen ca. 1,5 Stunden langen Film über die Karriere von Annie Leibovitz sehen.\nEines ist nach der Ausstellung und dem Film klar: Annie Leibovitz zählt zu den bedeutendsten Fotografinnen des 20. und beginnenden 21. Jahrhunderts.\n➡️ Javob: a) Bilder einer bedeutenden Künstlerin\n⸻", "4": "Die Abkürzung TWAN klingt nach einem neuen Computerprogramm, aber tatsächlich steht sie für eine neue fotografische Methode, die der Iraner Babak Amin Tafreshi entwickelt hat. Diese neue Methode führt zu atemberaubenden Ergebnissen: Noch nie hat man die Sterne so eindrucksvoll über den Landschaften der Erde gesehen wie auf den Bildern in diesem Buch – ein Genuss für die Augen.\nWas man auf den 160 Seiten des Buches sieht, ist meines Wissens ohne Beispiel. Viele der gezeigten Orte und Landschaften sind bekannte Motive, hier aber wirken sie doch vollkommen anders, als man sie kennt. Da sieht man Sterne über den Ruinen von Persepolis, den Mond über ungarischen Wäldern, die Milchstraße über dem kalifornischen Mammutbaum „General Grant“.\nDie drei Herausgeber Stefan Seip, Gernot Meiser und Babak A. Tafreshi wurden unterstützt von einem weltweiten Team erfahrener Naturfotografen. Auf den letzten Seiten des Buches erfährt man auch, dass „Fotografieren im TWAN-Stil heißt, bei fortgeschrittener Dämmerung oder Dunkelheit Aufnahmen zu machen, auch wenn man selbst nicht mehr viel sehen kann“.\nNeben aller Technik kommt es aber auf den künstlerischen Blick des Fotografen an – und viel Geduld.\n➡️ Javob: g) Erde, Mond und Sterne – wie man sie noch nie gesehen hat\n⸻", "5": "Er gehörte zu den ganz Großen seines Fachs: Andreas Feininger. Eine neue Biografie erzählt die Lebensgeschichte des weltberühmten Fotografen. Neben einem Text auf Deutsch und Englisch enthält sie auch eine kleine, aber gute Auswahl seiner Fotoarbeiten aus allen Schaffensphasen.\nDie Autoren zeigen den Weg des 1906 in Paris geborenen Fotografen von der Kindheit in Berlin über die Jahre in Weimar und Dessau bis hin zum Leben in Hamburg, Stockholm und schließlich New York, dessen Stadtansichten Feininger weltberühmt machen.\nDabei hatte Feininger keineswegs das Ziel, Fotograf zu sein. Eigentlich war Andreas Feininger gelernter Architekt. Als Feininger mit seiner Frau 1933 nach Stockholm auswandert, findet er dort als Architekt keine Anstellung. So macht er aus der Not eine Tugend: Weil er die kleine Familie mit Sohn Thomas ernähren muss, macht er seine Leidenschaft, die Fotografie, zum Broterwerb.\nDen Durchbruch als weltweit anerkannter Fotograf schafft er schließlich in New York, wohin seine Familie 1939 auswandert.\n➡️ Javob: c) Die bemerkenswerte Karriere eines Fotografen"}, "answers": {"1": "B", "2": "I", "3": "A", "4": "G", "5": "C"}, "options": {"1": ["D", "E", "B", "G", "C", "I", "H"], "2": ["E", "F", "C", "J", "G", "D", "I"], "3": ["G", "H", "A", "J", "D", "E", "I"], "4": ["I", "B", "D", "J", "H", "G", "C"], "5": ["F", "C", "J", "E", "B", "G", "H"]}}, "1.24": {"headings": {"A": "Jugend forscht – auch auf dem Meer", "B": "Jugend engagiert sich für den Umweltschutz", "C": "Kochen für Eltern und Kinder", "D": "Mehr Gewalt auf Schulhöfen", "E": "Psychoterror an der Schule", "F": "Schiffsreise für Jugendliche", "G": "Starker Wettbewerb um Schüler", "H": "Von der Diät zur Krankheit", "I": "Wenn Lernen krank macht", "J": "Wenn aus Erdbeeren Tomaten werden"}, "texts": {"1": "Die Zahlen wirken auf den ersten Blick dramatisch: 15 Prozent der Kinder sind übergewichtig und davon sechs Prozent sogar fettleibig. Der Ernährungswissenschaftler Timo Schmidt betreibt in Berlin ein Kochstudio für Kinder und Jugendliche.\nTimo Schmidt meint, es fehle vor allem an Praxis-Erfahrungen in der Küche. Kinder und Jugendliche können heute oft nicht (mehr) kochen, so seine Erfahrung. Das Interesse ist oft da, und die Kinder wollen kochen. Aber das Problem sind die Eltern. Oft haben sie keine Zeit, den Kindern alles zu erklären. Zum anderen haben sie Angst wegen der scharfen Messer. Dabei ist die Quote von Schnittverletzungen im Kinder- und Jugendkochstudio verschwindend gering.\nBesonders erschreckend findet Schmidt, dass viele Kinder Lebensmittel einfach nicht mehr erkennen. So standen im Kochstudio beispielsweise Erdbeeren auf dem Tisch, die dann für Tomaten gehalten wurden. Und eine gelbe Zucchini wird gerne mal alles Banane bezeichnet.\n„Was fehlt, ist die Praxis“, meint Schmidt. „Deswegen schneiden die Kinder dann mit der stumpfen Seite des Messers oder wissen nicht, wie heiß die Pfanne beim Kochen wird“.\n➡️ j) Wenn aus Erdbeeren Tomaten werden\n⸻", "2": "Immer mehr Mädchen leiden an schweren Essstörungen – und das, obwohl Ärzte und Fachleute seit Jahren vor den negativen Folgen des Schlankheitswahns warnen. Die Kinder- und Jugendpsychiatrie im Kinderkrankenhaus in Hannover schlägt jetzt Alarm. „Allein in den letzten zwei Jahren hat die Nachfrage für einen Therapieplatz um fast 50 Prozent zugenommen“, sagt der leitende Psychologe Gerd Kuznik.\nVon 33 zur Verfügung stehenden Plätzen in der Jugendpsychiatrie seien derzeit 25 von Mädchen mit Essstörungen belegt. „Wir wissen längst, dass dünn zu sein weder gesund noch lebensverlängernd ist“, sagt Kuznik, „doch unsere Gesellschaft konfrontiert gerade junge Mädchen noch immer mit völlig überzogenen Schlankheitsvorstellungen“.\nDas allein verursacht noch keine Essstörung. „Wenn aber noch ein grundlegendes familiäres Problem hinzukommt, legen viele Mädchen einen übertriebenen Wert auf ihr Aussehen“. So berichtet eine 17-Jährige, dass sie aus dem Gefühl heraus, „nichts hinzubekommen“, eine Diät gemacht habe. Und die Diät war dann endlich etwas, das klappte. Als Folge davon hat sie nicht nur wie geplant zwei Kilo abgenommen, sondern dreizehn.\nSo zieht Gerd Kuznik nicht nur in diesem Fall das Fazit: Mit einer harmlosen Diät fängt es meist an, mit einer schweren Krankheit kann es enden.\n➡️ h) Von der Diät zur Krankheit\n⸻", "3": "Energiesparlampen, umweltfreundliche Elektrogeräte, Bio-Nagellack – sieht man sich die Themen an, mit denen sich die Teilnehmer des 46. Regionalwettbewerbs „Jugend forscht“ beschäftigt haben, wird vor allem eines klar: Das ökologische Bewusstsein hat die Klassenzimmer erreicht.\nKnapp 100 Schüler nahmen an dem Wettbewerb teil. Die Teilnehmer schreckten auch vor komplexen Themen nicht zurück. Die Zwölftklässler Adrian, Thanh und Son beschäftigten sich mit der Herstellung künstlicher Muskeln. „Die Herausforderung war, sich mit drei Fachgebieten – Anatomie, Technik und Chemie – zu beschäftigen“, sagt Adrian. Gelohnt hat es sich – in der Rubrik Technik erreichte die Gruppe den ersten Platz.\nIn der Rubrik Arbeitswelt ermittelten die Abiturientinnen Yara-Alessandra und Bahir die Ökobilanz von Gartengeräten.\n„Wir haben festgestellt, dass Laubbläser mit Benzinmotor nicht nur große Mengen Kohlenstoffdioxid produzieren, sie vernichten auch Würmer und Insekten, die für das Gleichgewicht der Umwelt wichtig sind“, sagt Yara-Alessandra. Die Jury honorierte das Projekt mit dem zweiten Platz. Die Gewinner bereiten sich nun auf den Landeswettbewerb „Jugend forscht“ vor.\n➡️ b) Jugend engagiert sich für den Umweltschutz\n⸻", "4": "13,5 Meter lang und leuchtend gelb – die „Aldebaran“ zieht die Blicke im Jachthafen auf sich. Für drei Schüler aus Diepholz ist ein Traum wahr geworden. Als Meeresforscher auf See arbeiten sie an einem eigenen Forschungsprojekt. Sie nehmen am Meereswettbewerb „Forschen auf See“ teil.\nZiel des Projektes: junge Leute an wissenschaftlichen Arbeiten heranzuführen. Die drei Schüler Jonas, Annika und Katharina sind 17 Jahre alt. Ihr Thema: die Verschmutzung der Nordsee mit winzigen Plastikteilchen.\nMit ihrer Forschung wollen die Schüler die Aufmerksamkeit auf die Verschmutzung der Nordsee lenken. Zu Hause in Diepholz engagieren sich die drei in der Umwelt-Arbeitsgruppe ihrer Schule. Über die Verschmutzung der Meere mit winzigen Plastikteilchen und die Gefahren für Fische und Meeressäuger wissen sie schon einiges.\nMit ihren Untersuchungen wollen sie die Aufmerksamkeit auf das Problem lenken. Die Proben sind zwar noch nicht ausgewertet, die ersten Plastikteilchen haben die Jugendlichen aber schon gefunden. „Es sieht so aus, dass wir Ergebnisse kriegen, die gut für unser Projekt sind – aber nicht gut für die Umwelt“.\n➡️ a) Jugend forscht – auch auf dem Meer\n⸻", "5": "Mobbing ist kein neues Phänomen. Es ist auch in Schulen weitverbreitet. Da spricht zum Beispiel eine Lehrerin vor der Klasse negativ über eine Schülerin, weil sie etwas nicht versteht oder immer wieder krank ist. Oder die Mitschüler lachen oder lassen beleidigende Bemerkungen fallen, wenn ein bestimmter Schüler sich zu Wort meldet.\nDa lauern Jungen einer 4. Klasse einem schüchternen Mitschüler auf dem Schulweg auf und erpressen von ihm Geld oder Kleidung. Häufig sind die Erwachsenen ratlos oder schauen weg, während die Opfer die Schuld bei sich selbst suchen und zunehmend in eine soziale Isolation geraten.\nLehrkräfte sind meist überrascht, wenn man sie auf Mobbing in einer Klasse anspricht. Denn die Schikanen geschehen oft zu subtil und meist außerhalb des Unterrichts, während der Pausen oder auf dem Schulweg.\n➡️ e) Psychoterror an der Schule"}, "answers": {"1": "J", "2": "H", "3": "B", "4": "A", "5": "E"}, "options": {"1": ["G", "I", "F", "J", "E", "A", "B"], "2": ["H", "C", "G", "E", "F", "A", "I"], "3": ["C", "E", "J", "I", "B", "G", "F"], "4": ["D", "C", "G", "I", "A", "J", "B"], "5": ["H", "A", "B", "E", "C", "J", "D"]}}, "1.26": {"headings": {"A": "Benzingeld sparen: Tipp vom Tankwart", "B": "Die wichtigsten Erste-Hilfe-Ratschläge", "C": "Einmal die Welt als Ganzes sehen", "D": "Einmal um die Welt ohne einen Tropfen Benzin", "E": "Fliegen statt fahren", "F": "Innerdeutsche Reisen besonders beliebt", "G": "Frau im All", "H": "Schweizer nutzen Solartaxis", "I": "Steigende Spritpreise: die Tricks der Autofahrer", "J": "Die richtige Unfallversicherung"}, "texts": {"1": "Aussteigen, tanken, wegfahren: Wenn die Benzinpreise steigen, ist wieder Hochsaison bei den Benzindieben. Früh morgens und abends schlagen sie besonders gerne zu. Viele setzen auf den Schutz der Dunkelheit. Vor Weihnachten und im Januar und Februar häufen sich die Fälle. Auch am Monatsende, wenn das Geld knapp wird, steigt die Zahl der Benzindiebstähle. Doch sparen lässt sich durch Benzinklau nicht. Fast alle Täter werden von der Polizei gefasst. Schließlich gibt es an jeder Tankstelle eine Kamera, die das Autokennzeichen aufgenommen hat.\nTankwart Kurt Jochimsen aus Emden zeigt uns einen Fall aus seiner großen Videosammlung. Ein Wagen mit zwei Insassen fährt an die Zapfsäule. Der Fahrer tankt, seine Frau geht in den Shop. Sie kauft dort zwei Cola und bezahlt. Aber nicht das Benzin. Der Mann hat inzwischen voll getankt und wartet im Wagen.\n„Hier sehen Sie: Die Frau kommt raus, steigt ein und das Fahrzeug fährt davon. Hinterher heißt es dann, ich habe doch glatt vergessen, das Benzin zu bezahlen“, erklärt Kurt Jochimsen. Bei der Polizei kennt man diese Ausreden. Polizeioberkommissar Werner Knips: „Vergessen gilt nicht, es gibt immer eine Anzeige. Und dann wird es richtig teuer.“", "2": "Viele Autofahrer, die in einen Unfall verwickelt sind, sind so aufgeregt, dass sie vergessen, was zu tun ist. Der Versicherungsexperte Klaus Lenhoff gibt die wichtigsten Tipps:\nUnfallstelle absichern: Warnblinkanlage einschalten und Warndreieck in 100 Metern Entfernung aufstellen.\nRettung aus dem Gefahrenbereich: alle Unfallbeteiligten aus dem Gefahrenbereich retten. Eingeschlossene befreien und Brände sofort bekämpfen.\nRettungskräfte informieren: bei schweren Unfällen und wenn es Verletzte gibt, die Polizei (Ruf 110) oder die Rettungsleitstelle (Ruf 112) informieren. Dabei an die „fünf Ws“ denken: Wo ist es passiert? Was ist passiert? Wie viele Verletzte? Welche Verletzungen? Warten Sie auf Rückfragen.\nVerletzten Hilfe leisten, zum Beispiel: Kontrolle von Atmung und Puls, Atemspende, stabile Seitenlage, Erkennen und Behandeln eines Schocks, Stillen von Blutungen.\nLokalisierung auf der Autobahn: Wo hat sich der Unfall ereignet?\nBeweismittel sichern: am besten Fotos oder eine Skizze von der Unfallstelle machen.\nVerkehrsfluss wiederherstellen, also schnell die Fahrbahn räumen.\nName, Anschrift und Telefonnummern von Zeugen notieren.\nVorsicht bei Aussagen: die Aufregung am Unfallort verleitet zu missverständlichen Äußerungen. Keine Aussagen unter Druck machen.\nVersicherung des Unfallgegners ermitteln.", "3": "Hast du schon mal mit dem Gedanken gespielt, Pilotin zu werden? Nicht? Dann geht es euch wahrscheinlich wie den meisten Mädchen oder Frauen. Warum wollen eigentlich so wenige Frauen Pilotinnen werden? Nur weil der Beruf angeblich ein typischer Männerberuf ist? Wir haben eine Pilotin getroffen: Monique Bellin ist 39 Jahre alt, wohnt im Süden Frankfurts und ist Pilotin.\n„Schon seit früher Kindheit habe ich mich für die Fliegerei interessiert. Es hat mich immer fasziniert, dass es mit Hilfe technischer Mittel möglich ist, die Schwerkraft zu überwinden und die Welt aus der Vogelperspektive zu betrachten. Und irgendwann wollte ich diese Technik dann auch selbst beherrschen“, so Belling.\nSeit sie in diesem Beruf arbeite, habe sich ihre Einstellung zu vielen Dingen verändert: „Ich bin toleranter als vor meiner ‚Fliegerlehre‘ – vielleicht weil ich versuche, mein Umfeld aus anderen Perspektiven zu betrachten. Auch meine Freizeit und meine Familie sind mir noch kostbarer geworden, seit ich in diesem Beruf tätig bin“, erklärt sie.\nHat sie noch Träume? „Aber ja!“, sagt Monique Belling: „Mit einem Shuttle ins Weltall fliegen, um die Erde als Kugel zu sehen und das Gefühl absoluter Schwerelosigkeit zu erleben.“", "4": "Der Schweizer Louis Palmer hat eine Weltumrundung mit seinem „Solartaxi“ fast abgeschlossen. Er habe bereits 47.000 km mit seinem Solarauto zurückgelegt, sagte Palmer bei einem Stopp in Paris. „Nun habe ich fast den ganzen Planeten umrundet, ohne einen Tropfen Benzin zu brauchen“.\nDie Batterien des bis zu 90 Stundenkilometer schnellen Solarmobils können Energie für eine Reichweite von 400 km speichern. „Das Wetter spielt keine Rolle“, sagte Palmer. „Es kann mehrere Tage in Folge regnen, ich fahre ohne Probleme weiter.“\nPalmer war mit seinem dreirädrigen „Taxi“ im Juli in Luzern gestartet. Seitdem hat er Europa, Asien, Australien, Neuseeland und Nordamerika durchquert. Er zieht einen Anhänger mit sechs Quadratmetern Solarzellen hinter sich her und die Sonnenenergie treibt das Gefährt an. Seit dem Start ist das Solartaxi nur zwei Tage ausgefallen, weil ein Kabel beschädigt war. Gebaut wurde das innovative Fahrzeug von vier Schweizer Ingenieurschulen. Palmer hat auch Platz für Beifahrer: Neben ihm saßen schon berühmte Persönlichkeiten aus Politik, Wirtschaft und Showgeschäft im „Solartaxi“.", "5": "Die Bundesregierung und ihre Spitzenbeamten sind auf Dienstreisen gern mit dem Flugzeug unterwegs – aber nicht nur, wenn es um Fernreisen geht, sondern auch bei kurzen Inlandsreisen. Wie aus der Antwort des Innenministeriums auf eine Frage eines Abgeordneten hervorgeht, gab die Bundesregierung im letzten Jahr 7,7 Millionen Euro für innerdeutsche Flugreisen aus.\nFahrkarten der Bahn hingegen schlugen lediglich mit 3,2 Millionen zu Buche. Der Vergleich mit anderen Jahren zeigt aber, dass sich die meisten Politiker bemühen, immer häufiger vom Flugzeug auf die Bahn umzusteigen. Eine Ausnahme bildet das Kanzleramt (Flugkosten um 30 % erhöht gegenüber dem Vorjahr) sowie ausgerechnet das Ressort des Bundesumweltministers (plus 7 %). Vergleichszahlen für den erhöhten und gesenkten Benzinverbrauch für die Dienstwagen der Bundesregierung liegen noch nicht vor."}, "answers": {"1": "I", "2": "B", "3": "C", "4": "D", "5": "E"}, "options": {"1": ["H", "D", "J", "A", "C", "F", "I"], "2": ["B", "H", "E", "J", "F", "A", "G"], "3": ["B", "F", "C", "E", "A", "J", "I"], "4": ["D", "G", "J", "B", "F", "I", "E"], "5": ["I", "H", "A", "J", "D", "E", "F"]}}, "1.27": {"headings": {"A": "An deutschen Grundschulen sind männliche Lehrkräfte selten", "B": "Bildungsexperten warnen: Deutsche Lehrer sind schlecht ausgebildet", "C": "Bildungsforscher: Lehrermangel wird in Deutschland nicht eintreten", "D": "Die Zahl der männlichen Lehrkräfte an Grundschulen nimmt zu", "E": "Experten befürchten zunehmenden Lehrermangel in Deutschland", "F": "Gewerkschaft erwartet Lehrermangel in Berlin", "G": "GEW befürchtet Abwanderung von gut ausgebildeten Lehrkräften aus Berlin", "H": "Immer mehr Berliner wandern aus", "I": "Immer weniger Frauen machen ein Grundschullehrer-Studium", "J": "Vorausschauende Politiker verhindern Lehrermangel in Berlin"}, "texts": {"1": "Berlin wird in 10 Jahren rund 5.000 Lehrkräfte weniger brauchen als derzeit. Für den Unterricht an den Schulen werden dann, wie die Gewerkschaft Erziehung und Wissenschaft (GEW) errechnet hat, noch etwa 25.500 von heute 30.000 Pädagogen benötigt.\nDie Gewerkschaft befürchtet zugleich, dass bis zu diesem Zeitpunkt zu wenig Nachwuchskräfte ausgebildet werden und es deshalb zu einer dramatischen Unterversorgung kommt. Nach Meinung der GEW steuert die Hauptstadt bei der Personalausstattung der Schulen auf ein Fiasko zu, weil in den nächsten 10 Jahren mehr als 10.000 Lehrkräfte aus Altersgründen in den Ruhestand gehen.\nAußerdem würden jährlich zirka 400 Lehrer die Berliner Schulen verlassen, so dass nach Ansicht der GEW letztlich 9.000 Stellen fehlen. Wenn die Zahl der Studienanfänger nicht kräftig gesteigert werde, könne langfristig nicht einmal die Hälfte des prognostizierten Einstellungsbedarfs gedeckt werden.\nAußerdem sei die Hauptstadt für Berufseinsteiger nicht so attraktiv wie andere Bundesländer, da sie selbst für Mangelfächer nur befristete Verträge anbietet.", "2": "Wer sich in Berlin um eine Stelle als Lehrer bewirbt, muss hart im Nehmen sein. „Während man in Hamburg respektvoll behandelt wird, rechnen Vertreter der Berliner Schulverwaltung den Bewerbern vor, wie teuer Lehrer sind. Da fühlt man sich nicht richtig gewollt“, sagt Maria Schütz.\nDie 27-Jährige gehört zu den rund 500 Referendaren, die in zwei Wochen mit ihrem Studium fertig werden. Maria Schütz, die ihr Examen mit der Note 1,5 bestanden hat und unbedingt in Berlin unterrichten wollte, hat mit ihrer Bewerbung leidvolle Erfahrungen hinter sich.\n„Während man in Hamburg sofort eine feste Stelle im Beamtenverhältnis angeboten hat, konnte mir in Berlin keiner zusagen, dass ich im nächsten Schuljahr gebraucht werde.“ Die junge Frau hat das gute Angebot aus Hamburg einer unsicheren Zukunft in Berlin vorgezogen.\nFür Anna Richter, Vorsitzende der Lehrergewerkschaft GEW, ist Marias Geschichte nur eine von vielen. Ihre Organisation ist besorgt darüber, dass Berlin auf diese Weise viele gut qualifizierte Lehrer an andere Bundesländer verlieren könnte.", "3": "Die Hilferufe aus den Schulen wollen nicht verstummen: Schüler klagen über ständigen Lehrerwechsel, Eltern über Stundenausfall und Schulleiter über fehlende Bewerber. Doch es könnte noch schlimmer werden.\nDer Verband Bildung und Erziehung (VBE) rechnet in den nächsten 15 Jahren mit einem „gewaltigen Lehrermangel“ in Deutschland. Der Verbandsvorsitzende Ludwig Eckinger sagte am Donnerstag, er gehe für diesen Zeitraum von bis zu 400.000 Lehrern aus, die aus Altersgründen aus dem Schuldienst ausscheiden. Für 100 pensionierte Lehrer kämen jedoch nur 50 neue Kollegen.\nDer Lehrernotstand kommt nicht überraschend, Forscher sagten ihn längst voraus. Und auch die Konferenz der Kultusminister präsentierte schon vor fünf Jahren beunruhigende Zahlen: Es werden an deutschen Schulen 70.000 Pädagogen fehlen, denn fast die Hälfte der 800.000 Lehrer geht in Pension.\nDeshalb fordern Experten seit langem einen bundesweiten Entwicklungsplan, denn Untersuchungen des Lehrerarbeitsmarktes zeigten eher „Chaos als systematische Planung“. Deutschland steuere auf Zustände wie in den Niederlanden zu. Dort ist der Lehrermangel so groß, dass sich Schulen gegenseitig Lehrer ausspannen.", "4": "Bildungspolitiker und Lehrervertreter wollen Abiturienten scharenweise in den Lehrerberuf locken.\nSie sollen große Lücken schließen, die durch Pensionierungen entstehen. Doch das Versprechen vom sicheren Job lässt sich womöglich nicht einlösen – es basiere auf falschen Annahmen, sagen Essener Bildungsforscher.\nDie Arbeitsgruppe Bildungsforschung/Bildungsplanung unter der Leitung des Wissenschaftlers Klaus Klemm kommt in ihrem Bericht zu einem ganz anderen Ergebnis. Während die Kultusministerkonferenz mit 70.000 fehlenden Lehrern rechnet und der Philologenverband gar mit 80.000, errechnete die Forschungsgruppe, dass es zu einer insgesamt ausgeglichenen Bilanz zwischen Nachfrage und Angebot auf dem Lehrer-Arbeitsmarkt kommen werde.\nWenn sich die „Einstellungspolitik der Bundesländer nicht ändert, dürften wir sogar einen Lehrerüberschuss bekommen“, sagte Klemm. Er warnt Abiturienten, ihre Studienentscheidung von den angeblich rosigen Aussichten für Lehrer abhängig zu machen.\n„Die Abiturienten hören, es werden Lehrer gesucht, und schon studieren sie Germanistik fürs Gymnasium. Das ist ein Fehler“, sagt Klemm. Denn schon jetzt zeichne sich ab, dass es Deutsch-, Geschichts- und Fremdsprachenlehrer eher schwer haben werden.", "5": "Mädchen haben tendenziell bessere Noten und stellen 56 Prozent der Abiturienten. Dagegen sind zwei Drittel der Schulabbrecher und drei Viertel der Sonderschüler Jungen.\nLiegt die Ursache in der Grundschule, wo von den knapp 200.000 Lehrkräften nur rund 26.000 männlich sind? An der Grundschule sind Männer eine Rarität. Wer sich dorthin verirrt, arbeitet allein unter Frauen.\nIm Schuljahr 1990/1991 unterrichtete noch ein Drittel Männer an Grundschulen, im Schuljahr 2006/2007 liegt der Frauenanteil an den Grundschullehrern bei 86,9 Prozent, während an weiterführenden Schulen das Geschlechterverhältnis nahezu ausgeglichen ist.\nIm Extremfall kann das bedeuten, dass Jungen bis zum Alter von 10 oder 12 Jahren in Krippe, Kindergarten und Grundschule ausschließlich von Frauen betreut und unterrichtet werden.\nAuch die Familienministerin vermisst die Männer an den Grundschulen. „In den wichtigen frühen Jahren fehlen den Jungen männliche Vorbilder, an denen sie sich im Alltag orientieren können“, sagte sie in einem Interview.\nDas gelte gerade für Kinder mit Migrationshintergrund. Gründe dafür sieht sie in der gesellschaftlichen Anerkennung des Berufs und in den Gehaltsstrukturen."}, "answers": {"1": "F", "2": "G", "3": "E", "4": "C", "5": "A"}, "options": {"1": ["C", "B", "H", "F", "G", "J", "I"], "2": ["I", "J", "A", "B", "F", "E", "G"], "3": ["B", "I", "A", "C", "E", "D", "H"], "4": ["C", "E", "G", "I", "A", "D", "H"], "5": ["D", "H", "G", "B", "A", "J", "I"]}}, "1.28": {"headings": {"A": "Gemeinsam kaputte Geräte retten.", "B": "Kaufsucht überwinden – diese Möglichkeiten gibt es.", "C": "Neue Besitzer für nicht mehr gebrauchte Gegenstände.", "D": "Reparatur alter Haushaltsgeräte lohnt oft nicht.", "E": "Rücksendungen verderben Online-Händlern das Geschäft.", "F": "Rücksendungen verringern: Händler hoffen auf Lösungen.", "G": "Studie zeigt, welche Geschenke glücklich machen.", "H": "Verein mit Preis für Umweltschutz ausgezeichnet.", "I": "Volle Einkaufstüten machen nur kurze Zeit Freude.", "J": "Wer Engagement zeigt, steigert sein Glücksgefühl."}, "texts": {"1": "Sie sind eine gut funktionierende Gemeinschaft mit einer Vision: Schon seit den 80er Jahren leben Mitglieder des „Tauschrings Harmsdorf e.V.“ vor, wie man nachhaltig mit Ressourcen umgehen kann und dadurch die Umwelt schont. Tauschen, nicht wegwerfen ist das Motto dieser Initiative – die damals als eine der ersten dieser Art in Deutschland noch belächelt wurde, heute aber viel Lob und Anerkennung bekommt.\nOb Küchengeräte, Bücher oder auch Kleidungsstücke, die man nicht mehr anzieht: Was ungenutzt, findet bei jemandem Verwendung, der noch etwas damit anfangen kann. Getauscht werden nicht nur Güter, sondern auch Dienstleistungen. Eine der Voraussetzungen für das Gelingen: „Die Dienstleistungen dürfen nicht in Konkurrenz zum Handwerk stehen“, erklärt Tauschring-Mitglied Kati Jago. Besonders gefragt seien Fahrdienste, etwa zum Arzt.\nIhre monatlichen Zusammenkünfte an der Rathausstraße sind für die derzeit 30 Vereinsmitglieder viel mehr als bloße Tauschtreffs: „Man darf den Faktor Mensch nicht unterschätzen“, sagt Kati Jago. Denn beim Tauschen zählte auch das soziale Miteinander.", "2": "„Man gönnt sich ja sonst nicht.“ Und schon ist die Einkaufstüte voll und das Konto leer. Macht das glücklich? Oder wieso sonst kauft man mehr, als man eigentlich geplant hat?\nEin Einkauf kann sich ähnlich anfühlen wie eine Belohnung, sagt der Psychologe Daniel Stöber. Denn dabei wird ein Glückshormon ausgeschüttet. Manchmal könne das sogar in einem Kaufrausch enden. Denn das Glücksgefühl, das Konsumenten beim Kaufen erleben, könne sie dazu anregen, „immer mehr Geld auszugeben“.\nDoch die Ernüchterung folge oft schnell, warnte er: Denn wer später merke, wie teuer das alles gewesen sei, schütte Stresshormone aus. Dies könne zu Schlafstörungen und schlechter Laune führen. Langfristig lässt sich so die eigene Lebenszufriedenheit also gewiss nicht steigern.", "3": "Geklickt, gekauft, zurückgeschickt: Kunden nutzen im Online-Handel gerne die Möglichkeit, Waren innerhalb einer bestimmten Frist kostenlos zurückzusenden. Vor allem im Modehandel steigt die Zahl der Rücksendungen immer weiter an. Oft bestellen Kunden gleich mehrere Modelle in unterschiedlichen Größen, um sie zu Hause in Ruhe anzuprobieren.\nDie Kosten für die Retouren trägt der Anbieter. Dennoch lohnt sich für die Online-Händler das Geschäft. Die zurückgegebene Kleidung kann zum Beispiel oft so aufbereitet werden, dass sie erneut zum Verkauf angeboten werden kann.\nRücksendungen werden sich im Online-Handel nie ganz vermeiden lassen, erklärt Birgit Steinköhler vom Bundesverband Online-Handel. Dennoch ist es möglich, dass sich ihre Anzahl in Zukunft senken lässt. Dies wünschen sich natürlich auch die Online-Verkäufer und suchen nach neuen Möglichkeiten: etwa detailliertere Produktinformationen oder neue Technologien, die die individuellen Maße der Kunden ermitteln.\nDennoch: Rücksendungen werden im Online-Handel wohl immer zum Geschäftsmodell gehören.", "4": "Keine Lust mehr auf die Konsum-Gesellschaft? Dann könnte es ein erster Schritt sein, den Lieblingspulli zu stopfen statt zu entsorgen oder den alten Wecker vom Oma noch mal zum Laufen zu bringen.\nOb Fahrrad, Fernseher oder Smartphone – man muss bei Defekten nicht gleich alles wegwerfen. In sogenannten Repair-Cafés können defekte Gegenstände unter fachkundiger Anleitung wieder instandgesetzt werden.\n„Damit schonen wir die Umwelt und den Geldbeutel“, erklärt Thomas Rederitz, Inhaber eines solchen Reparaturcafés.\nRepair-Cafés verstehen sich als Initiative gegen die Wegwerf-Mentalität.\nDa viele Firmen keinen Reparaturservice mehr anbieten, muss vieles aufwendig entsorgt werden, sagt Rederitz. Das sei nicht immer nötig. Manchmal ist ja auch nur eine Schraube locker, oder es fehlt ein kleines Bauteil, das leicht ersetzt werden kann.\n„Im Reparaturcafé wird gemeinsam gewerkelt, geschraubt, genäht, gebastelt – und auch gelacht und geredet.“ Die Reparatur wird in jedem Fall sachgerecht durchgeführt; denn zu den freiwilligen Mitarbeitern von Repair-Cafés gehört Handwerksmeister der unterschiedlichsten Fachrichtungen.", "5": "Viele Menschen sind erstaunlich großzügig: Sie machen anderen gern Geschenke, spenden Geld für gute Zwecke oder opfern Zeit für ehrenamtliche Tätigkeiten. Aber was motiviert sie dazu?\nDie Wissenschaft liefert ganz unterschiedliche Erklärungsansätze. Eine Erklärung lautet, dass großzügige Menschen auf Gegenseitigkeit hoffen: Wer viel gibt, bekommt auch viel zurück.\nEine Studie konnte nun aber zeigen, dass die Antwort vielleicht ganz einfach ist: Großzügigkeit macht eben glücklich. Dies fanden Forscher der Universität Lübeck heraus.\nDieses enge Verknüpfung zwischen großzügigem Verhalten und Glücksgefühl zeige sich auch im Gehirn. So aktivieren ein solches Verhalten ein Hirnareal, das eng mit unserem Belohnungszentrum verknüpft ist.\nDas Ergebnis ihrer Studie könnte weitreichende Folge für die Gesellschaft haben. Wer glücklicher werden möchte, könne sich diese neuen Erkenntnisse zunutze machen: Denn wer für andere da ist, tut auch etwas für das eigene Wohlbefinden."}, "answers": {"1": "C", "2": "I", "3": "F", "4": "A", "5": "J"}, "options": {"1": ["A", "E", "H", "B", "G", "D", "C"], "2": ["J", "E", "F", "A", "B", "I", "C"], "3": ["J", "G", "E", "A", "I", "F", "D"], "4": ["G", "A", "B", "F", "E", "J", "C"], "5": ["G", "C", "D", "B", "J", "I", "A"]}}, "1.29": {"headings": {"A": "Neue Kinderhandys auf den Markt gebracht", "B": "Profi-Tipps für bessere Urlaubsbilder", "C": "Modern schnurlose Geräte vermindern die Strahlenbelastung", "D": "Mehr Mut zum Fotografieren", "E": "Handy im Ausland: Aufpassen und tricksen!", "F": "Kinder-Überwachung für Eltern per Handy wird geplant", "G": "Tipps zum Telefonieren mit weniger Strahlung", "H": "Handy-TV zur Fußball-WM 2006", "I": "Der neue Eurotarif", "J": "Mobilfernsehgenuss wird zum Alltag"}, "texts": {"1": "Vielen Menschen verursachen ein mulmiges Gefühl: Die meisten Schnurlos-Telefone strahlen auch dann, wenn man gar nicht telefoniert. Vor allem DECT-Geräte (Digital Enhanced Telecommunications – digital verbesserte schnurlose Kommunikation) sind deshalb in die Kritik geraten.\nAllmählich nehmen Hersteller die Bedenken ernst und bieten Geräte an, die das Bundesamt für Strahlenschutz (BfS) als „bedingt strahlungsarm“ einstuft. Stehen diese Telefone auf der Ladestation, wird die Sendeleistung von Handgerät und Basis abgeschaltet oder radikal vermindert.\nVoraussetzung: Nur ein Mobilteil ist angemeldet. Einige Modelle reduzieren die Strahlung auch, wenn man nahe der Basisstation telefoniert: Nur 25 Prozent Sendeleistung braucht das Siemens Gigaset E360 im Umkreis von fünf Metern, das AEG Fame 400 kommt mit rund 30 Prozent aus.", "2": "Wenn Kinder ein Handy haben, dann ist das schön und gut. Doch was, wenn der Filius nicht dran geht? Wenn er möglicherweise etwas Besseres zu tun hat, als zurückzurufen? Und noch schlimmer, wenn sich Heranwachsende im prüden Amerika schmutzige Bilder auf dem Handydisplay anschauen? Das schreit nach Kontrolle.\nUnd genau die will Motorolas CEO Edward Zander den Eltern über ihre Kinder geben: Sie sollen jederzeit wissen, wo sie (oder deren Mobiltelefon) sind und was sie damit tun. Verbunden werden soll die Einführung von einem solchen Handy mit einer Reihe Merkmale, die junge Menschen ansprechen, wie zum Beispiel mit dem für nächsten Monat anvisierten Start des iTunes-Handys.\n„Handys sind heute das, was in meiner Jugend der Fernseher war“, so Zander. „Aber es gibt einen Weg, es sicher zu machen.“ Eltern müssten sich in die entstehende Jugendkultur rund um Handys stärker einbringen, und sie sollten sich stärker dafür interessieren, was sie hören, sehen und lesen, so Zander weiter. Handys mit entsprechender Zensur-Software seien bereits in Vorbereitung.", "3": "Wer unter Palmen liegt, greift gern zum Handy. Doch trotz neuer Preisobergrenzen bleibt das ein teurer Spaß! Die Verbraucherzentrale Schleswig-Holstein erklärt, wie Sie richtig wählen.\nBis 30. Juli müssen alle europäischen Mobilfunkanbieter den neuen „Eurotarif“ anbieten. Er gilt in allen EU-Staaten und schreibt Preislimits von maximal 49 Cent/Min. für eigene Anrufe bzw. maximal 24 Cent für ankommende Gespräche vor.\nAber aufgepasst:\nFalle 1: kein Rabatt im Juli/August!\nFalle 2: Mehrwertsteuer!\nZu den Kosten für abgehende bzw. angenommene Anrufe kommen noch 19 % Mehrwertsteuer dazu.\nFalle 3: Alte Sondertarife!\nBis 20 Prozent der Handy-Nutzer haben Sonderverträge für Auslandsgespräche. Gefahr: Sie kennen den neuen Eurotarif nicht nutzen. Unbedingt informieren!\nDie besten Spar-Tricks: Prepaid-Karte. Besonders für Viel-Telefonierer interessant. Zurzeit zahlen die meisten Kunden mit Vertrag mindestens 99 Cent pro angefangene Minute, mit Prepaid-Karte nur etwa 58,31 Cent. SMS schreiben im Vergleich zu Telefonaten sind Kurznachrichten (SMS) auch im Urlaub meistens günstiger.", "4": "Manche Momente muss man einfach festhalten – mit einem Foto. Doch dessen Qualität hängt von vielen Faktoren ab: der Kamera, den Verhältnissen vor Ort und der Erfahrung des Fotografen.\nFür ein paar schöne Erinnerungsfotos lohnt sich aber eine teure Profi-Ausrüstung selten. Vom Pauken schwieriger technischer Details ganz zu schweigen. Das ist heute auch längst nicht mehr nötig. Schon mit normalen Digitalkameras lassen sich wunderbare Bilder schießen – mit ein paar Tricks abwechslungsreiche Motivwahl.\nDie meisten Urlauber fotografieren gerne Sehenswürdigkeiten mit ihren Liebsten.\nSchaut man sich die Bilder später an, sind sie oft eine Variation des ewig Gleichen: der Sohn auf dem Kamel, vor der Kathedrale, im Pool. Der Sohn ist niedlich, keine Frage. Es kann jedoch nicht schaden, die Motive zu variieren: verschiedene Personen und Orte, zu unterschiedlichen Tageszeiten – mal den menschenleeren Strand, mal das Marktgetümmel.\nNähe und Distanz. Mehr Abwechslung erreichen Sie auch, wenn Sie mit der Nähe zum Objekt spielen: hier eine Totale mit dem Weitwinkel, dort eine Nahaufnahme. Perspektive und Technik. Schnelle Schnappschüsse gelingen nicht immer. Nehmen Sie sich Zeit für Porträt- und Landschaftsaufnahmen. Nutzen Sie dabei auch den extra einstellbaren Modus bei Digitalkameras. Er stellt Objektiv und Belichtung perfekt auf die gewählte Variante ein.\nLicht und Schatten. Für stimmungsvolle Bilder eignen sich am besten Vormittags- und Spätnachmittagsstunden, weil das Licht dann besonders weich ist.", "5": "Es gibt in Deutschland wohl kaum eine bessere Chance für die Einführung von Handy-TV als die Fußball-WM 2006. Doch ein rechtzeitiger Start ist ungewiss.\nDie Problemfelder sind vielschichtig. Drei Standards kämpfen darum, das erste deutsche Mobilfernsehen zu sein: UMTS, DMB und DVB-H. Und das möglichst pünktlich zum 9. Juni 2006, dem Start der Fußball-WM.\nDieser Drei-Kampf wird von Experten jedoch kritisch betrachtet. In Südostasien floriert dieser Markt doch schon seit vielen Monaten. In Korea beispielsweise gehört der mobile Fernsehgenuss zum Alltag. Bis zu zwei Stunden täglich schauen Besitzer der kleinen TV-Handys dort unterwegs auf die Mini-Mattscheibe.\nWarum sollte dies mittelfristig nicht auch in Deutschland realisierbar sein? In einem sind sich Experten jedoch sicher: Handy-TV wird die Fernsehbranche verändern.\nKenner sprechen von drei neuen Prime Times (Hauptfernsehzeiten), die durch die mobile Glotze entstehen: Der Weg zur Arbeit, die Mittagspause und der Heimweg. Dafür ist jedoch eine andere Art von Inhalten notwendig, vor allem kurz müssen sie sein, denn kaum jemand wird sich einen kompletten Spielfilm auf dem kleinen Bildschirm ansehen wollen."}, "answers": {"1": "C", "2": "F", "3": "E", "4": "B", "5": "J"}, "options": {"1": ["E", "I", "A", "G", "B", "D", "C"], "2": ["I", "C", "J", "G", "F", "E", "B"], "3": ["F", "J", "B", "I", "D", "C", "E"], "4": ["E", "C", "F", "J", "A", "B", "H"], "5": ["D", "J", "G", "I", "A", "E", "H"]}}, "1.30": {"headings": {"A": "Das Geheimnis des schnellen Schwimmens", "B": "Extremer Lebensraum", "C": "Fische im Fokus der Forscher von der Technischen Universität in Berlin", "D": "Wie wird Technik in der Natur eingesetzt", "E": "Bioniker erforschen die Wüstennatur", "F": "Ein Fisch in den Dünen", "G": "Die Ursachen für den Wassermangel", "H": "Rasante Flucht", "I": "Trinkwasser aus Nebel", "J": "Auf der Suche nach verborgenen Details"}, "texts": {"1": "Willkommen in der Wüste. Die Sonne brennt gnadenlos. Endlose Weite. Nur Sand und Geröll, so weit das Auge reicht. Kein Baum, kein Strauch, kein noch so winziges Tier.\nBilder wie diese kommen wohl den meisten in den Sinn, wenn sie an die Wüste denken. Doch diese Vorstellung stimmt nicht ganz. Denn so hart und lebensfeindlich die Bedingungen in der Wüste auch sind: Es gibt einige Überlebenskünstler, die es selbst hier schaffen, zu existieren.\nUm in der Wüste zu überleben, mussten sie sich im Laufe der Jahrmillionen perfekt an die harten Lebensbedingungen anpassen. Sie wurden zu ausgesprochenen Spezialisten. Zu Spezialisten, von denen Wissenschaftler jede Menge lernen können.\nUnd so zieht es jedes Jahr Bioniker aus vielen Ländern der Erde in die entlegenen Wüsten der Welt. Auf der Suche nach kleinen, aber wirksamen Tricks für das Leben in einer extremen Umgebung.", "2": "Denn Bioniker entwickeln technische Anlagen nach dem Vorbild der Natur. Der Begriff Bionik setzt sich zusammen aus den Wörtern „Biologie“ und „Technik“.\nIhre Aufgabe: die Pflanzen und Tiere erst genau beobachten, kleinste Details entdecken und deren Geheimnisse lüften. Warum kann ein Gecko an der Wand hochlaufen? Wie kann ein Kolibri rückwärts fliegen?\nWenn die Bioniker die Abläufe verstanden haben, fängt der größte Teil ihrer Arbeit erst an. Dann versuchen sie, aus dem Gelernten eine technische Anwendung zu entwickeln.\nAuch die besonderen Eigenschaften von Wüstentieren eignen sich dafür, wie die folgenden Beispiele zeigen.", "3": "Der Sandfisch ist eigentlich gar kein Fisch, sondern eine kleine Echse. Doch seinen Namen hat er sich redlich verdient. Denn er kann ausgezeichnet schwimmen. Zwar nicht im Wasser, dafür aber umso besser im Sand der Sahara.\nDroht dem wenige Zentimeter großen Tier Gefahr, dann verschwindet es rasend schnell im Wüstensand, nur um Augenblicke später einige Meter entfernt wieder aufzutauchen. Was im Wasser jedes Kind beherrscht, scheint im Sand unmöglich. Doch nicht für den Sandfisch.\nDenn er hat ein winziges Geheimnis: Seine Haut erscheint nur auf den ersten Blick ganz glatt. Unter dem Mikroskop fanden Wissenschaftler der Technischen Universität (TU) Berlin winzige Grate auf seiner Haut, nur wenige Nanometer groß (ein Nanometer entspricht dem millionsten Teil eines Millimeters).\nGenau diese Grate verhindern, dass der Sand an der Haut des Sandfisches hängen bleibt. Die Forscher konnten es kaum glauben und bauten in ihrem Labor eine Oberfläche mit vergleichbaren Strukturen nach.\nUnd siehe da: An einer vollkommen glatten Oberfläche bleibt der Sand förmlich kleben, an der mit den kleinen Erhebungen findet er keinen Halt.\nDie Idee für eine technische Umsetzung dieser Oberfläche ließ nicht lange auf sich warten. So arbeiten die Forscher am Institut für Bionik und Evolutionstechnik der TU Berlin etwa an besonderen Leitungsrohren. Mit einer „Sandfisch-Haut“ im Inneren können die Rohre ein für alle Mal vor einer Verstopfung bewahrt werden.", "4": "Das größte Problem aller Wüstenbewohner ist die Wasserbeschaffung. In allen Wüsten der Erde herrscht fast ständig akuter Wassermangel. In vielen fällt jahrelang kein einziger Regentropfen vom Himmel. In einigen Regionen der Atacama-Wüste in Südamerika soll es seit mehreren hundert Jahren keinen Niederschlag mehr gegeben haben.\nDer Nebeltrinker-Käfer hat seine ganz eigene Strategie gegen den Wassermangel entwickelt. Er lebt in der Namib-Wüste im Südwesten Afrikas. Viele Tage im Jahr krabbelt er emsig die Sanddünen hinauf, macht eine Art Kopfstand und wartet auf den Nebel, der vom Atlantik her über den Rand der Wüste zieht.\nDabei senkt er den Kopf und hebt sein Hinterteil in die Höhe. Die Flüssigkeit des Nebels kondensiert an seinem nur anderthalb Zentimeter langen Körper und läuft über eine kleine Vertiefung auf seinem Rücken direkt in sein Maul.\nHier liegt die technische Anwendung auf der Hand: Wassergewinnung aus Nebel. Tatsächlich wird diese Methode auch schon einige Jahre genutzt. In der Nähe des Dorfes El Tofo in Chile wurden sogenannte Nebelnetze errichtet. Pro Nebeltag kondensieren hier bis zu 11.000 Liter frisches Wasser an den Netzen, eine stolze Ausbeute.", "5": "Beispiel Nummer drei: die Räderspinne. Auch sie lebt in der Wüste Namib und wurde erst vor wenigen Jahren entdeckt.\nDie Wissenschaftler waren ziemlich verblüfft, als sie die ungewöhnliche Fluchtmethode des Achtbeiners sahen: einfach die Beine anwinkeln und dann wie ein Rad die Sanddünen hinunterrollen.\nDie Bioniker filmten die Spinne mehrmals und schauten sich das Video unzählige Male an. Dann war ihnen klar: Mit ihren Vorderbeinen stößt sich die Spinne während des Rollens immer wieder vom Boden ab. Dadurch kullert sie nicht einfach nur passiv den Hang hinunter. Vielmehr kann sie durch diese Methode auf ihrer Flucht wieder ordentlich an Tempo zulegen.\nDoch welche technische Anwendung soll dabei herausspringen? Hier beweisen die Forscher Mut zur Vision: An der TU Berlin soll ein Mars-Auto entstehen, das im unwegsamen Gelände fahren kann."}, "answers": {"1": "B", "2": "J", "3": "F", "4": "I", "5": "H"}, "options": {"1": ["G", "I", "E", "B", "A", "C", "H"], "2": ["C", "B", "D", "J", "H", "A", "F"], "3": ["A", "I", "E", "F", "H", "B", "C"], "4": ["B", "J", "I", "H", "D", "A", "C"], "5": ["A", "J", "D", "E", "F", "G", "H"]}}, "1.31": {"headings": {"A": "Neue Richtlinie für Zertifizierung von Medikamenten für Kinder", "B": "Neue Verfahren in der Kinderheilkunde", "C": "Gefahren zu hohen Fernsehkonsums bei Kindern", "D": "Alternative Heilverfahren: Wie gut sind sie wirklich?", "E": "Naturkosmetik aus Geschwisterhand", "F": "Kinder bekommen immer mehr Medikamente", "G": "Studie: Schulkinder treiben zu wenig Sport", "H": "Schlechte Noten für Baby-TV", "I": "Kinder und Jugendliche: Risikofaktor Übergewicht", "J": "Neueste Forschungsergebnisse zur Wirkung von Ginseng"}, "texts": {"1": "Fernsehen ist der Sprachentwicklung bei Kleinkindern nicht förderlich. Sie sind bunt und lustig, die Teletubbys, die am Bildschirm auch deutsche Kinder beglücken. Doch gute Sprachlehrer für Babys sind sie nicht – so das Ergebnis einer US-amerikanischen Studie.\n„Manche Eltern mögen davon träumen, dass ihre Kinder die ersten Worte beim Fernsehen lernen“, sagt eine Linguistin, „aber das funktioniert nicht.“\nDie Kommunikationsexpertin hat 48 Kleinkinder im Alter von 5 bis 24 Monaten getestet. Zuerst bekamen sie Gegenstände zu Gesicht, für die sie noch keine Worte hatten – etwa einen Schraubenzieher. Für das gezeigte Objekt erfanden die Forscher dann ein Fantasiewort wie „Deet“.\n„Damit wollten wir sicherstellen, dass die Kinder den Begriff wirklich noch nie gehört hatten“, erklärt die Expertin. Dann wurde es fünfmal wiederholt – entweder in einem Teletubby-ähnlichen Video oder direkt von einer anwesenden Person.\nNach kurzer Pause legten die Forscher ihren Probanden einige Gegenstände vor und forderten sie auf: „Zeig mir Deet.“\nBabys, die das Wort direkt gelernt hatten, reagierten spätestens bei der dritten Wiederholung. Die jungen TV-Seher aber waren meist ratlos.", "2": "Pharmakologen am Universitätsklinikum Tübingen haben kürzlich bei einer Auswertung von 1,6 Millionen Rezeptverordnungen für Kinder und Jugendliche festgestellt, dass gut 13 Prozent der Fälle das jeweils verschriebene Medikament gar nicht eigens für Kinder zugelassen war oder in einer für sie nicht getesteten Dosierung verwendet wurde.\nIn Kinderkliniken sind etwa 50 Prozent, auf Intensivstationen für Neugeborene sogar bis zu 90 Prozent der verabreichten Medikamente nicht speziell für Kinder konzipiert.\nNoch bedenklicher: Je kleiner und je kränker ein Kind ist, desto mehr dieser „Off-Label“-Verordnungen hat es zu erwarten.\nBesonders bei den in Kliniken behandelten, ernsthafteren Krankheiten aber können die Ärzte oft gar nicht anders, als für Kinder nicht getestete Medikamente zu verabreichen. Da Kinder vergleichsweise selten schwer erkranken, sind die aufwendigen Testverfahren zur Herstellung altersspezifischer Medikamente für die Hersteller häufig wirtschaftlich uninteressant.\nGlücklicherweise ändert sich dieser Zustand durch eine EU-Verordnung, die seit Januar 2007 gilt. Demnach müssen alle in der Entwicklung befindlichen Medikamente, die für Kinder und Jugendliche in Betracht kommen, auch an ihnen geprüft werden.\nFür bereits zugelassene Präparate gibt es finanzielle Anreize, sie nachträglich an jungen Altersgruppen zu erproben. Geprüfte Medikamente erhalten dann den Packungsaufdruck: „Für Kinder geprüft.“", "3": "Alternative Heilverfahren können vor allem bei leichten Erkrankungen hilfreich sein. Dabei gilt es, Nützliches von Scharlatanerie zu unterscheiden.\nViele sprechen noch von „alternativer“ Heilkunde. Doch inzwischen ist die für etwa 400 Heilverfahren jenseits der Schulmedizin der Ausdruck „Komplementärmedizin“ üblich geworden.\nDenn die Akupunktur, Aromatherapie, anthroposophische Medizin, Pflanzenheilkunde, Homöopathie und viele andere begreifen ihre besonderen Methoden meist als Ergänzung der herkömmlichen Medizin und nicht als deren Ersatz.\nIn dieser Funktion ist die Komplementärmedizin heute weithin akzeptiert. Auch in der Kinderheilkunde sind die Verfahren beliebt. Ob sie wirksam sind, lässt sich mithilfe klinischer Studien überprüfen. Die aber sind aufwendig und teuer, weshalb es oft an wissenschaftlichen Wirksamkeitsnachweisen mangelt. Sicher nachgewiesen ist vor allem die Wirksamkeit von Pflanzenpräparaten.\nMehr Forschung auf dem Gebiet der Komplementärmedizin könnte verhindern, dass mancher vielleicht nützliche Behandlungsansatz den Schulmedizinern völlig aus dem Blick gerät. Und einige Ärzte sollten vielleicht darüber nachdenken, was ein Kenner jener Szene vor einiger Zeit auf einem Kongress des Berufsverbandes der Kinder- und Jugendärzte gesagt hat: Das Erfolgsgeheimnis der Anbieter nicht-konventioneller Methoden beruhe vor allem darauf, dass sie den Eltern das Gefühl vermittelten, „endlich einmal ernst genommen zu werden“.", "4": "Die eine liebt Flora und Fauna, die andere hat ein Händchen für Kommunikation und Marketing: Zusammen betreiben die Schwestern Henrike Rodemeier und Gesine Wischmann „Deutschlands einzige Ginseng-Farm im niedersächsischen Bockhorn“.\nAls studierte Agraringenieurin ist die 38-jährige Rodemeier für den Anbau zuständig. Die vier Jahre ältere Schwester vertreibt über ihre Firma Florafarm die aus den Wurzeln gewonnenen Arzneimittel. Zudem entwickelte die gelernte Pharmareferentin eine eigene Ginseng-Kosmetiklinie.\nDen Anfang hatte ihr Vater Heinrich Wischmann bereits vor 24 Jahren gemacht: Er gab die unrentable traditionelle Landwirtschaft auf und konzentrierte sich auf den Anbau von Ginsengwurzeln, die unter anderem das Immunsystem stärken und den Blutdruck regulieren.\nTrotz Ruhestand ist auch er noch auf der Farm aktiv. Doch die Zukunft gehört den Töchtern – die planen bereits eine Dependance.", "5": "Kinder essen zu viel Fast Food, aber zu wenig Obst und Gemüse, so eine Expertin vom Deutschen Institut für Ernährungsmedizin und Diätetik (D.I.E.T.) in Bad Aachen.\nNach Angabe der Deutschen Gesellschaft für Ernährung sind 10 bis 20 Prozent aller Schulkinder und Jugendlichen übergewichtig, Tendenz steigend. Übergewicht kann schon im frühen Alter zu Folgeerkrankungen wie Hypertonie, Fettstoffwechselstörungen, Diabetes oder Gallensteinleiden führen.\nZu den Ursachen gehören eine oftmals zu hohe tägliche Energie- und Fettzufuhr und mangelnde Bewegung. Gerade bei einer genetischen Vorbelastung führt das zu einer Zunahme der Fettmasse des Körpers.\nDas D.I.E.T. rät daher allen Eltern, ihren Kindern von klein auf eine gesunde Kost zu bieten. Durch einen regelmäßigen Mahlzeitenrhythmus im Tagesablauf kann außerdem unkontrolliertes „Zwischendurchessen“ vermieden werden.\nEin kompletter Verzicht auf Süßes ist aus psychologischen Gründen nicht empfehlenswert, ein vernünftiger Umgang mit Süßigkeiten muss erlernt werden. Durch vermehrte körperliche Aktivität wird der Energieverbrauch erhöht.\nEltern sollten versuchen, bei ihren Kindern sportliche Interessen zu wecken und Hobbys zu fördern."}, "answers": {"1": "H", "2": "A", "3": "D", "4": "E", "5": "I"}, "options": {"1": ["A", "G", "B", "J", "F", "I", "H"], "2": ["B", "F", "J", "E", "A", "D", "I"], "3": ["C", "I", "G", "B", "D", "F", "E"], "4": ["H", "J", "I", "D", "E", "B", "G"], "5": ["E", "D", "C", "B", "G", "J", "I"]}}, "1.32": {"headings": {"A": "Am Strand im Dienst – mehr Sicherheit für Urlauber", "B": "Bäder, Seen und Natur – im hessischen Paradies", "C": "Freiheit und Natur – nach sechs Wochen harter Arbeit", "D": "Jugendliche arbeiten für Jugendliche", "E": "Kinderarbeit in Deutschland: Jugendliche werden zur Arbeit gezwungen", "F": "Nach harter Arbeit durch nordische Gewässer", "G": "Schaden an Kreuzfahrtschiff verhindert Weiterfahrt", "H": "Urlaub an deutschen Seen immer gefährlicher", "I": "Wegen Niedrigwasser: vom Fluss auf die Straße", "J": "Zu Gast bei den Fürsten"}, "texts": {"1": "Entdecken Sie interessante Städte und Regionen. Im Herze
