n Deutschlands liegen wunderbare Landschaften, mit einem für deutsche Verhältnisse sehr milden Klima – und keine typischen Touristenziele. Von der Stadt Gießen ausgehend kann man in den hessischen Kreisen Bergstraße und Waldeck-Frankenberg viele Orte entdecken, die noch ein Geheimtipp sind. Vor allem gilt dies für den Kreis Waldeck-Frankenberg. Wer nicht gerade in Hessen wohnt, wird kaum wissen, wo diese Region eigentlich liegt. Es ist ein herrliches Stück Deutschland ohne besonders große Städte, eine Gegend, die Natur pur bietet.\nDa wundert es nicht, dass man hier einige Kurorte findet wie Bad Arolsen oder Bad Wildungen oder den Luftkurort Edertal-Kleinern. Apropos Edertal: Der zwölf Quadratkilometer große Edersee gehört zu den vier schönen blauen „Augen“ des Kreises. Der Landkreis Waldeck-Frankenberg ist Hessens attraktivstes Umland. In der Region der Berge und Seen spürt man auch heute noch einen Hauch von Fürstlichkeit. Majestätisch erhebt sich über dem Edersee das Schloss Waldeck. Auch in Bad Arolsen, einer ehemals Residenzstadt, ist vieles noch vom früheren Adel geprägt. Unbedingt besuchen sollte man darüber hinaus das über 1000 Jahre alte Korbach wie auch die Fachwerkstadt Frankenberg.", "2": "Pferde waren schon immer Melanie Schilles Leidenschaft. „Und jetzt kann ich Hobby und Beruf miteinander verbinden“, freut sich die Beamtin aus Hannover. In diesem Jahr verstärkt sie die Strandwache an der Nordseeküste.\nIhr Arbeitsplatz ist der Strand: Mit „Magnus“, einem 11-jährigen Pferd, patrouilliert sie dort, wo die kleinen Sandburgen bauen, Urlauber bei einem Buch entspannen oder sich in die kühlen Fluten stürzen.\nMelanie Schille und ihr Hannoveraner sind eine Attraktion in dem Ferienort. Immer wieder wollen Gäste das Tier streicheln, von der Polizistin wissen, was sie hier macht. „Wir sorgen für mehr Sicherheit am Strand“, erklärt Melanie Schille und Rüdiger Teichmann (42). Sie suchen im Watt nach Vermissten, klären über Gefahren auf, verhindern Diebstähle und Sachbeschädigungen.\nNachweislich gingen die Delikte zurück, seit es die Streife hoch zu Ross gibt. Die Polizistin: „Wir sind in dem unwegsamen Gelände oft schneller am Einsatzort als die Kollegen per Fahrrad oder mit dem Auto.“\nAußerdem schone wir die Natur. Für sich persönlich sieht Melanie Schille noch einen großen Vorteil: Es ist schön, mal keine Demonstration sichern zu müssen, stattdessen genieße ich die frische Luft mit fröhlichen Urlaubern.\nNur eins vermisst die 22-Jährige, die mit Polizeipferd „Magnus“ auf einem Bauernhof Quartier bezogen hat, während ihres sechswöchigen Einsatzes: Freund Robert (23). Er fährt als Polizist in Hannover Streife und wartet auf sie.", "3": "Ein neuer Urlaubstrend setzt sich durch: Statt faul am Strand zu liegen, wird man aktiv. Ein besonders beliebtes Ziel ist Schweden: So kann man am Ufer des Flusses Klarälven in der Provinz Värmland selbst ein Floß bauen. Das dauert drei bis sechs Stunden, anschließend macht man darauf Urlaub.\nDas ist Abenteuerurlaub pur“, schwärmt Johan Bengtson, der mit seiner Frau und den drei Kindern zum zweiten Mal Floßferien macht. Sich auf dem Fluss treiben lassen und in der Wildnis leben – dieses Gefühl ist super!\nSeit zehn Jahren veranstaltet Marie Junler von der Agentur Vildmark i Värmland die Holzfloßtrips. Wir haben die Bengtsons an ihrem ersten Urlaubstag begleitet. Mit dabei ist auch Veranstalterin Marie Junler, die der Familie hilft, das Floß zu bauen.\nEs ist ein herrlicher Sonnentag.\nIn einer sanften Kurve des Flusses Klarälven steht Marie bis zu den Hüften im tiefblauen Wasser. Mit dicken grünen Seilen schnürt sie Holzstämme zusammen und gibt Kommandos: Einer hält den Stamm, der andere knotet den Seemannsknoten, wie wir ihn vorhin an Land geübt haben.\nOhne einen Nagel werden 96 Baumstämme verzurrt im Wasser, sonst wäre das Holz zu schwer. Mindestens zwei Erwachsene sind nötig, um ein Floß zu bauen, einer allein packt das nicht.\nNach drei Stunden ist es geschafft: Das Urlaubsparadies der Bengtsons es misst übrigens 6 mal 3 Meter und wiegt 2 Tonnen – treibt am Ufer. Noch schnell das Sonnensegel befestigen, darunter Vorratskasten, Frischwassertank, Chemie-Klo, Küchenausrüstung, Zelt, Rettungsring, Schwimmwesten und das Paddel zum Steuern und Manövrieren verstauen und ab geht’s.", "4": "Von 9 bis 15 Uhr arbeitet Sebastian Keller (18) in einem Altenwohnheim in Hamburg-Altona: Er kümmert sich um die Essensausgabe, putzt die Küche und dann ist noch Zeit, um den Senioren vorzulesen oder mit ihnen Karten zu spielen.\nZur selben Zeit putzen Rebecca (12) und Christiane (13) den Eingang des Hamburger Michels, der wohl bekanntesten Kirche der Stadt, und Friederike (17) füttert schon frühmorgens Kühe, Schweine und Hühner auf einem Bio-Bauernhof bei Wedel.\n„Endlich mal ein sinnvoller Job“, sagen die fünf übereinstimmend. Sie stehen stellvertretend für etwa 100.000 Jugendliche, die beim „Sozialen Tag“ mitgemacht haben. Hut ab! Und was mindestens ebenso beeindruckend ist: Der Verein Hamburgs Schüler Helfen (HSH) wurde von Jugendlichen im Jahr 2004 gegründet und seitdem findet jedes Jahr im August der Soziale Tag statt.\nMit Behörden und Firmen sind Schüler aus Hamburg für einen Tag abgeschlossen. Die Schülerinnen und Schüler verdienen dann am „Sozialen Tag“ zwischen 6 und 8 Euro pro Stunde – aber nicht für sich selbst, sondern für andere. Denn der Verdienst wird gespendet.\nDie Jugendlichen wählen selbst ein Projekt aus, an das sie die Gelder spenden wollen. Einzige Bedingung: Es muss ein Projekt sein, von dem Jugendliche profitieren.\nIm letzten Jahr zum Beispiel wurde die Gesamtsumme von 1,2 Millionen Euro an das Projekt Frieden für alle gespendet. Dessen Ziel ist es, Jugendliche in Kriegsregionen zu unterstützen, den Dialog unter Jugendlichen aus verschiedenen Ländern zu fördern und auch das Kennenlernen anderer Kulturen zu ermöglichen.\nFür Ralf Waldner (20) vom HSH steht fest: Wir können und werden anderen auch in Zukunft helfen, das Engagement der Schülerinnen und Schüler in Hamburg ist in den letzten Jahren schließlich immer weiter gestiegen.", "5": "Die Windjacken waren schon eingepackt, die Koffer geschlossen. Thomas Meurer (64) und Wiebke Fuchs (62) aus Hannover freuten sich auf ihre Flusskreuzfahrt mit der MS Eurostar von Potsdam nach Prag.\nStattliche 2500 Euro kostete die Reise pro Person, und beide hatten lange gespart, um sich das leisten zu können. Doch aus der Kreuzfahrt wurde eine Bustour.\nMeurer berichtet, was er erlebt hat: „Wir waren am Abend auf das Schiff gegangen und hatten unsere Kabinen bezogen. Am nächsten Morgen ging es los. Aber schon bald machte das Schiff wieder fest und alle Gäste mussten von Bord.“\nWiebke Fuchs ergänzt: „Der Fluss hatte einfach zu wenig Wasser, da konnten wir mit dem großen Kreuzfahrtschiff nicht weiterfahren!“\nPer Bus ging es nach Prag. Beide wollen nun einen Teil des Reisepreises zurück, aber der Veranstalter Hapag-Lloyd wehrt ab: „Das war höhere Gewalt, da kann man nichts machen.“"}, "answers": {"1": "B", "2": "A", "3": "F", "4": "D", "5": "I"}, "options": {"1": ["D", "J", "B", "A", "I", "F", "C"], "2": ["H", "F", "D", "C", "A", "G", "E"], "3": ["I", "A", "J", "F", "G", "D", "C"], "4": ["F", "A", "C", "G", "H", "B", "D"], "5": ["F", "B", "G", "H", "C", "I", "E"]}}, "1.33": {"headings": {"A": "Schlechtere Chancen für Frauen am Arbeitsmarkt", "B": "Schnell essen macht dick", "C": "Neue Broschüre: Studieren im Ausland", "D": "Was tun nach der Schule? Neue Ausbildungsmöglichkeiten", "E": "Initiative: Frauen für Männerberufe begeistern", "F": "Immer mehr Frauen machen Karriere im technischen Bereich", "G": "Experiment in Florida: Schlank in zwölf Stunden", "H": "Ernährungstipps kostenlos am Telefon", "I": "Schweizer Frauen kämpfen für mehr Rechte im Beruf", "J": "Wissenschaftler warnen: Immer mehr dicke Mädchen in Österreich!"}, "texts": {"1": "Ein hochwertiger Schulabschluss gilt gemeinhin als Schlüssel zum Berufsein- und -aufstieg. Das ist aber nur bedingt richtig, denn sonst hätten die Frauen auf dem Arbeitsmarkt längst die Nase vorn. Mehr als die Hälfte aller Absolventen an höheren Schulen ist weiblich. Trotz besserer Qualifikation haben Frauen aber das Nachsehen.\nZu diesem Schluss kommt eine Untersuchung des städtischen Frauenreferats zur Ausbildungssituation von Frauen und Mädchen in Frankfurt. Eine Erklärung für die schlechte Lage von weiblichen Arbeitskräften ist aber auch die Tatsache, dass Frauen nach wie vor für Familie und Kindererziehung auf Karriere verzichten.", "2": "Übergewicht könnte erblich, durch Krankheiten, aber auch durch falsche Essgewohnheiten bedingt sein. Psychiater der Universität Florida haben jetzt das schnelle Essen als mögliche Ursache für Fettleibigkeit entdeckt.\nDie Wissenschaftler untersuchten, was genau im Hirn bei der Nahrungsaufnahme passiert. Zu diesem Zweck bekamen Testpersonen nach einer zwölfstündigen Fastenzeit eine Zuckerlösung zu trinken.\nZuerst zeigte sich verstärkte Gehirntätigkeit, ausgelöst durch Schlucken, Geruch und Geschmack. Dann, zehn Minuten später, signalisierte das Gehirn, dass der Körper genug habe.\nBei Menschen, die zu schnell essen, ist dieses Signal stark verzögert. Daher dürfte das Sprichwort „Iss langsam, Kind!“ tatsächlich eine Weisheit sein.", "3": "Wenn Sie mehr über richtige Ernährung und das ideale Gewicht wissen wollen, informieren Sie der „Fonds Gesundes Österreich“ und der Verein für Konsumenteninformation.\nUnter 0 810 810 27 werden gratis firmenunabhängige, wissenschaftlich fundierte Informationen über ausgewogene und gesunde Ernährung angeboten.\nDie Verantwortlichen reagieren damit auf den erschreckenden Trend, dass die Zahl der dicken Menschen, darunter vor allem Kinder, immer mehr zunimmt.\nIn den vergangenen 15 Jahren habe sich die Zahl übergewichtiger Kinder und Jugendlichen mehr als verdoppelt. Bewegungsmangel und fettes Essen seien die Hauptgründe dafür.", "4": "Das Arbeitsamt Berlin hat seine beiden Informationshefte „Alternative zum Studium“ neu aufgelegt. Auf 200 Seiten zeigt die Behörde neue Ausbildungsmöglichkeiten für junge Frauen und Männer nach der Schule außerhalb der Universitäten.\nEin Heft befasst sich mit betriebswirtschaftlichen Ausbildungen bzw. fremdsprachlichen Angeboten im sozialen Bereich, das andere mit dem technisch-naturwissenschaftlichen Bereich.\nMit diesen Broschüren geht auch eine Informationsoffensive einher, die die hohe Zahl an Studienbewerbern in Deutschland reduzieren helfen und andere Wege einer guten Berufsausbildung für junge Leute aufzeigen soll.", "5": "Junge Frauen in der Schweiz sollen nun mehr Chancen für eine offene Berufswahl haben. Mit einer Motivationskampagne wollen die Fachleute zum Umdenken anregen und neue Horizonte öffnen.\n„Von wem würden Sie lieber Ihr Auto reparieren lassen?“ oder „Wem vertrauen Sie eher eine Herzoperation an?“, heißt es unter jeweils zwei Porträts einer Frau und eines Mannes. Die Plakate sollen für den „kleinen Unterschied“ im Kopf sensibilisieren, wonach Frauen nicht dasselbe zugetraut wird wie Männern.\nImmer noch ergreifen junge Frauen typische Frauenberufe wie Textilverkäuferin oder Sekretärin. Mit einem Internetwettbewerb soll das Thema „Frauen und Technik“ fokussiert werden, im Speziellen der Informationssektor, der in der Schweiz noch ganz in Männerhand ist."}, "answers": {"1": "A", "2": "B", "3": "H", "4": "D", "5": "E"}, "options": {"1": ["J", "A", "G", "B", "C", "D", "F"], "2": ["D", "F", "E", "J", "C", "B", "G"], "3": ["H", "D", "C", "F", "B", "J", "A"], "4": ["J", "D", "F", "I", "H", "G", "E"], "5": ["D", "H", "G", "B", "C", "E", "I"]}}, "1.34": {"headings": {"A": "Eine ungewöhnliche Geschenkidee", "B": "Gut informiert mit neuer Wetter-App", "C": "Heftiger Sturm sorgt für Verkehrschaos in Deutschland", "D": "Junge Erfinder zeigen ihr Können", "E": "Kostenlose Wetter-Apps sind nicht empfehlenswert", "F": "Präzise Vorhersage von Stürmen durch neue Messinstrumente", "G": "Schüler erfinden App und gewinnen Wettbewerb", "H": "Sturm richtet schwere Schäden an Flughäfen an", "I": "Vorhersage von Stürmen ist schwierig", "J": "Warum Tiefs immer weibliche Namen haben"}, "texts": {"1": "Kyrill, Friederike, Lothar oder Xaver – all dies sind Namen von Stürmen, die in Deutschland und Europa in den vergangenen Jahrzehnten für Schlagzeilen gesorgt haben. Aber wie kommen Stürme eigentlich zu ihren Namen?\nDie Antwort auf diese Frage findet man beim Institut für Meteorologie in Berlin. Hier werden bereits seit 1954 Namen für alle Hoch- und Tiefdruckgebiete vergeben, die das Wetter in Deutschland mitbestimmen. Zunächst hatten alle Tiefs weibliche Namen und alle Hochs männliche. Seit Ende der 90er-Jahre wird abgewechselt: In einigen Jahren tragen die Tiefs männliche Namen, in anderen weibliche.\nSeit 2002 haben alle Bürgerinnen und Bürger außerdem eine ganz besondere Möglichkeit: Sie können ein Hoch oder ein Tief „kaufen“, ihm einen Namen geben oder es sogar verschenken. Der Deutsche Wetterdienst und die Medien übernehmen diesen Namen dann und verwenden ihn in den Wetterberichten. So können sie einem lieben Menschen eine originelle Überraschung bereiten oder sich selbst eine Freude machen.", "2": "Der Jugendwettbewerb „Naturwissenschaft & Technik“ geht in die nächste Runde. Auch in diesem Jahr haben Schülerinnen und Schüler wieder die Möglichkeit, ihre Erfindungen der Öffentlichkeit zu präsentieren.\nEine Jury bewertet die Wettbewerbsbeiträge und wählt die fünf besten aus. Auch das Publikum vor Ort darf abstimmen und einen „Publikumsliebling“ wählen. Insgesamt sind Sachpreise im Wert von 3000 Euro zu gewinnen, gesponsert von Unternehmen aus der Region.\nTeilnehmen können Schülerteams aller Schularten ab der fünften Klasse. Mit dabei ist diesmal auch ein Team des Thomas-Mann-Gymnasiums in Neustadt. Die Oberstufe hat eine neue Wetter-App entwickelt, mit der sie in diesem Jahr die Jury und das Publikum überzeugen möchte.\nDer Schulleiter des Thomas-Mann-Gymnasiums, Bernd Giesinger, ist stolz auf die Schülerinnen und Schüler: „Ich freue mich sehr über das Engagement dieser jungen Menschen, die ihre Zeit und Kreativität nutzen, um unsere gemeinsame Zukunft zu gestalten.“", "3": "Am gestrigen Abend fegte Sturmtief Charlotte über Deutschland hinweg und legte große Teile des Landes lahm. Mit Spitzengeschwindigkeiten von 140 Kilometern pro Stunde sei Charlotte einer der stärksten Stürme der vergangenen Jahre, sagte Meteorologe Andreas Fischer.\nInsbesondere in Hessen, Nordrhein-Westfalen und im Saarland sind wegen umgestürzter Bäume unzählige Straßen und Bahnstrecken blockiert. Viele Züge konnten gestern nicht mehr weiterfahren und Hunderte Bahnreisende saßen zum Teil bis spät in die Nacht auf freier Strecke fest.\nIn Hessen wurde der Bahnverkehr zeitweise komplett eingestellt. An den Flughäfen Frankfurt, Düsseldorf und Köln/Bonn kam es zu zahlreichen Verspätungen und Flugausfällen. Ankommende Maschinen wurden teilweise zu anderen Flughäfen umgeleitet.\nVon dort gestaltete sich die Weiterfahrt für viele Reisende allerdings ebenfalls sehr schwierig. Die Aufräumarbeiten laufen derzeit auf Hochtouren und werden noch einige Zeit in Anspruch nehmen. Im Moment ist es noch nicht absehbar, wie lange es dauern wird, bis alle Strecken wieder frei sind.", "4": "Soll ich einen Pullover anziehen oder reicht ein T-Shirt? Muss man einen Schirm mitnehmen oder braucht man eine Sonnenbrille? Jedes Smartphone hat heutzutage eine vorinstallierte Wetter-App, aber genaue Wettervorhersagen liefern die meisten nicht.\nEs gibt aber gute Alternativen. Wer einen zuverlässigen Wetterdienst für sein Smartphone oder Tablet sucht, ist mit der neuen App Wetterwissen bestens beraten.\nSchon in der kostenlosen Version bietet die App umfangreiche Daten zur aktuellen Wetterlage, leicht verständliche Prognosen und Unwetterwarnungen. Der Regenradar zeigt Ihnen genau, wo sich Regenwolken bilden und ob diese in Ihre Richtung ziehen oder nicht.\nFür 1,99 Euro gibt es ein Premium-Abo mit zusätzlichen Wetter-Videos und Informationen zu Wintersport und Badewetter. Die App ist in der Premium-Version werbefrei, in der kostenlosen Version wird am unteren Rand Werbung eingeblendet, die viele Nutzer aber nicht als störend wahrnehmen.\nDie App punktet außerdem mit einem modernen Design und schafft es damit ganz klar in die Top 10 der Wetter-Apps.", "5": "Zehn Jahre ist es her, dass sich aus einem scheinbar harmlosen Tiefdruckgebiet schnell und überraschend der gefährliche Sturm Tinka entwickelte, der in Norddeutschland immense Schäden anrichtete und als einer der teuersten Stürme in die Geschichte einging.\nDen Wetterdiensten wurde damals vorgeworfen, die Entwicklung des Tiefdruckgebietes nicht richtig berechnet und die Bevölkerung nicht rechtzeitig gewarnt zu haben.\nObwohl die Messinstrumente immer präziser geworden sind, lassen sich manche Wetterereignisse wie zum Beispiel Gewitter und Stürme nur schwer vorhersagen. Ein Sturm kann von vielen Faktoren abhängig sein und entwickelt sich oft kurzfristig. Daher kann es passieren, dass die Prognosen völlig verschieden ausfallen, manchmal sogar auch ganz falsch sind.\nUm dies zu vermeiden, vergleichen Meteorologen möglichst viele Wetterlagen. Je mehr Übereinstimmungen es gibt, desto wahrscheinlicher ist es, dass ihre Prognose zutrifft.\nMit einer Trefferquote von etwa 80 Prozent kann die Entwicklung eines Sturms inzwischen auch recht gut eingeschätzt werden – aber eben nicht zu 100 Prozent."}, "answers": {"1": "A", "2": "D", "3": "C", "4": "B", "5": "I"}, "options": {"1": ["B", "F", "E", "C", "G", "H", "A"], "2": ["C", "D", "G", "A", "H", "E", "I"], "3": ["F", "E", "C", "J", "D", "B", "G"], "4": ["D", "G", "J", "C", "I", "A", "B"], "5": ["C", "B", "F", "A", "I", "E", "G"]}}, "1.35": {"headings": {"A": "Jeder kann Netzreporter werden", "B": "Historisches Wissen ohne Mühe", "C": "Hotels online vermarkten", "D": "Sprachen lernen per Computer", "E": "Neues Hotelangebot spart Geschäftsleuten Zeit", "F": "Verschenken Sie Ihr Geld nicht an den Staat!", "G": "Neuer Computerkurs an der Volkshochschule", "H": "Elektronischer Weg aus dem Steuerlabyrinth", "I": "Onlinebibliothek für Referate und Kurznachrichten", "J": "Pädagogen gegen Internetdienste"}, "texts": {"1": "„Auf meinen elektronischen Steuerberater kann ich mich hundertprozentig verlassen“, erklärt Rainer Wüst, Inhaber einer kleinen Elektronikfirma in Hamburg. Die Steuererstattung, die er für das vergangene Jahr vom Finanzamt erhielt, stimmte völlig mit dem überein, was sein Steuersparprogramm ausgerechnet hatte.\nImmer mehr Deutsche sparen sich den teuren Gang zum Steuerberater und setzen auf Computerprogramme. Die Vorteile liegen auf der Hand: Am heimischen Rechner lassen sich alle steuerrelevanten Daten bequem in die richtigen Formulare eingeben und per Internet an das Finanzamt schicken.\nDas Programm fragt nach wichtigen Zahlen, kennt Steuerspartipps und hilft zuverlässig durch den Steuerdschungel – ohne Terminabsprachen und langwierige Sitzungen beim Steuerberater, wie das früher üblich war.\nIn einigen Fällen muss man aber trotzdem noch Belege und andere Unterlagen beim Finanzamt einreichen – und zwar per herkömmlicher Post.", "2": "Kundenberaterin Sabine E. ist ständig auf Achse. Als Repräsentantin einer großen Plastikgeschirrfirma für Süddeutschland besucht sie Messen, Ausstellungen und Kunden, um den Verkauf anzukurbeln. Heute München, morgen Stuttgart, übermorgen Mainz – Sabine E. ist an das Leben einer modernen Geschäftsfrau gewöhnt.\nUmso mehr schätzt sie den Service, den eine immer größere Zahl an Hotels Geschäftsreisenden wie ihr anbieten: das Hotelzimmer mit komplettem Büroservice. Dem Hotelgast stehen nicht nur Internetzugang und Telefon kostenlos zur Verfügung, er kann auch Kopien in Auftrag geben, Dokumente ausdrucken lassen oder schnell noch vom Zimmer aus ein Fax verschicken.\n„Für mich hat das viele Vorteile“, sagt Frau E. „Meine Aufträge und Abrechnungen kann ich jetzt oft schon während meiner Kundentermine in mein Notebook eintippen und dann am Abend per E-Mail versenden. Unterlagen kann ich auch zwischendurch ausdrucken und Verträge unterschreiben und verschicken. Das spart mir viel Zeit, die ich jetzt dafür nutze, um auch mal abends auszugehen und die Gastronomie der Stadt, in der ich mich gerade befinde, kennenzulernen.“", "3": "Ein Referat für den Geschichtsunterricht über Karl den Großen zur nächsten Woche – kein Problem. Mussten sich Schüler früher durch Berge von Sachbüchern kämpfen, Lexika wälzen und die Nachmittage in den Lesesälen der Bibliotheken verbringen, genügt heute ein Mausklick auf die Webseite eines Onlinediensts, der kostenlos oder für wenig Geld für Schüler fertige Referate zu fast jedem Thema liefert.\nStatt im staubigen Bibliothekssaal zu sitzen, entspannt sich der Schüler von heute im Schwimmbad vom Schulstress. Und trägt im Unterricht ein Referat vor, von dem er oft nicht einmal das Thema geschweige denn Details kennt, was spätestens bei Nachfragen der Lehrer schließlich auffällt.\nDie Praxis, fertige Referate per Internet anzubieten, stößt bei Lehrern und Schulpolitikern auf Kritik. Sie fordern deshalb einhellig Maßnahmen gegen die Anbieter, die zwar Schülern die Arbeit abnehmen, aber nichts zur Wissensvermittlung beitragen.", "4": "Wer könnte interessantere Meldungen aus allen Ecken des World Wide Web liefern als die Internetnutzer selbst? Deshalb sind auf vielen Nachrichtenportalen keine Nachrichtenprofis am Werk, sondern ganz normale Surfer, die selbst zu Onlinereportern werden.\nDas Prinzip solcher Seiten ist genial einfach: Wer irgendwo im Netz eine Meldung aufspürt, die auch andere Surfer interessieren könnte, schreibt eine kurze Zusammenfassung und reicht diese einfach ein. Dort wird dann vom Betreiber nur geprüft, ob der angegebene Link, also die Fundstelle im Netz, auch funktioniert und die Quelle seriös ist.\nAuf diese Weise können Falschmeldungen aussortiert werden. Nach erfolgreicher Prüfung wird aus dem Internetfundstück auch schon eine Nachricht. Wer die Meldungen liest, kann dann selbst an der Quelle überprüfen, ob er den Informationen vertraut.", "5": "Zu Beginn des Englischkurses fragt Verena Baum ihre Mitlernenden nach ihren Namen, wie es in einem Sprachkurs eben üblich ist. Doch stellt auf einem harten Schulstuhl sitzt sie ganz bequem auf ihrem körpergerechten Schreibtischstuhl zu Hause vor ihrem PC.\nVor zwei Jahren startete eine Sprachenschule vor den Toren Frankfurts am Main auf Initiative einer pfiffigen Kursleiterin ein Pilotprojekt: „Überall Englisch“.\nDie Lernenden eignen sich ihre Sprachkenntnisse über ein Computerprogramm an, das extra für dieses Projekt entwickelt wurde. Per Internet treten sie in Dialog mit den anderen Kursteilnehmern und üben und kommunizieren gemeinsam auf Englisch.\nAlle sechs bis acht Wochen trifft man sich aber nach Möglichkeit an der Schule zum Austausch, zur Lernkontrolle und natürlich, um die Fragen zu beantworten, auf die der PC keine persönliche Antwort wusste.\nFür Verena Baum und die meisten anderen Teilnehmer an „Überall Englisch“ war es zuerst ungewohnt, sich nicht in einem Kursraum zu treffen. Aber: „Das war eine tolle Erfahrung, und das Lernen hat großen Spaß gemacht.“"}, "answers": {"1": "H", "2": "E", "3": "J", "4": "A", "5": "D"}, "options": {"1": ["A", "C", "D", "E", "B", "H", "G"], "2": ["E", "F", "H", "G", "C", "I", "B"], "3": ["G", "C", "H", "J", "E", "D", "I"], "4": ["D", "A", "F", "J", "G", "I", "C"], "5": ["H", "I", "A", "G", "C", "D", "B"]}}, "1.36": {"headings": {"A": "Beispiel Rhön: Das Land nutzen und die Natur erhalten", "B": "Unser Tipp: Goethes Kochbuch", "C": "Ältere Männer verlieren Kraft und Dynamik", "D": "Beispiel Nordsee: Immer mehr einsame Menschen im Urlaub", "E": "Rhön-Verein bildet Bauern aus", "F": "Andere Stimme ab 70?", "G": "Unser Gesundheits-Tipp: Nordsee!", "H": "Tennis für Anfänger", "I": "Sport-Empfehlung: Schwimmen, Gehen, Radfahren", "J": "Kochen und Reisen in Deutschland"}, "texts": {"1": "Wer sportlich aktiv sein möchte, fragt sich zu Beginn oft, welche Sportart und welches Trainingspensum wohl richtig sind. Hier eine Empfehlung von Sporttherapeuten:\nDas ideale Trainingspensum besteht aus drei sportlichen Aktivitäten pro Woche, zwei „trockenen“ (z. B. Radfahren) und einer „nassen“ (Schwimmen).\nFür die Wahl der Sportarten gilt folgendes: Verzichten Sie als Anfänger auf Tennis und Squash, denn die schnellen, abrupten Bewegungen belasten Gelenke und Bänder sehr.\nWalking (zügiges Gehen), Radfahren und Schwimmen hingegen sind sehr empfehlenswerte Sportarten.", "2": "Köstliches Deutschland (Südwest, 192 S., 19,50 Euro) – ein Buch, das zum Kochen und zum Reisen animieren will.\nDer Autor Udo Eckert hat sich Goethes Motto „Warum denn in die Ferne schweifen…“ zu eigen gemacht und sich auf einen kulinarischen Streifzug durch deutsche Regionen gemacht.\nDas Buch ist Bildband, solides Kochbuch und praktischer Gourmetführer gleichermaßen.", "3": "Behutsame Landnutzung im Einklang mit der Natur hat die einmalige Landschaft der Rhön geschaffen.\nWenn Sie mehr darüber wissen wollen, schreiben Sie uns oder schicken Sie uns diese Anzeige!\nNatur- und Lebensraum Rhön e.V.\nGeorg-Meilinger-Str. 3,\nD-36115 Ehrenberg-Wüstensachsen", "4": "Allein in Saltzfurt, Sonne und Seewind bekommen Körper und Seele Auftrieb. Nordsee – ein Klima, einzigartig und wie geschaffen für Gesundheit: mal sanft, mal rau.\nAuf jeden Fall belebend. Und eine Kur gibt zusätzlich Impulse. Mit den elementarsten Heilkräften der Natur.\nSternstunden der Gesundheit.", "5": "Dass die Stimme – vornehmlich von Männern – im Alter oft rauer klingt, liegt an altersbedingten Umbildungen des Stimmapparats im Kehlkopf.\nDie veränderte Stimme der Betroffenen verliert dadurch an Kraft und Dynamik und kann sich dann ungewohnt heiser oder rau anhören.\nDoch vor dem 70. Lebensjahr ist mit dieser natürlichen Stimmveränderung nicht zu rechnen.\nDas Internet macht’s möglich: Tauschplattformen für Dinge, Wohnungen oder private Autos ermöglichen es, schnell und unkompliziert denjenigen zu finden, der (oder die) das hat, was ich brauche.\nMit der Verbreitung digitaler Leih-, Miet- und Tauschmodelle entstehen neue Geschäftsformen, die sich auf einer neuen „Währung“ gründen: Vertrauen.\nDas heißt, dass der andere meine Dinge gut behandelt und mich nicht hinters Licht führt, obwohl ich den anderen noch nie gesehen habe.\n5\nWarum den teuren Zug oder Flieger nehmen, wenn es doch per Anhalter viel günstiger geht? Besonders junge Leute heben gerne den Daumen, um von A nach B zu kommen.\nBeim Autostoppen sollte man jedoch einige gesetzliche Regeln kennen. In Österreich ist Autostoppen auf Autobahnen oder Autostraßen generell und unabhängig vom Alter verboten.\nAuf Autobahn-Parkplätzen, Raststationen und an allen anderen Straßen ist an übersichtlichen Stellen das Autostoppen erlaubt.\nEs gilt jedoch, bundeslandspezifische Altersbestimmungen zu beachten. In Kärnten und Vorarlberg ist das Autostoppen unter 14, in der Steiermark unter 15 Jahren verboten.\nWer im Ausland autostoppen will, sollte sich vorab mit rechtlichen Bestimmungen und landesüblichen Gewohnheiten vertraut machen.\nBeispielsweise setzen Autofahrer in manchen Ländern wie Rumänien, Indien und Mexiko eine Bezahlung voraus. In den USA, Kanada oder Australien kommt es auf den jeweiligen Bundesstaat an, ob Autostoppen erlaubt ist.\nIn vielen afrikanischen Ländern wiederum ist Trampen selbstverständlich und ersetzt die oftmals fehlenden öffentlichen Verkehrsmittel.\nTELC B2 — LESEN, TEIL 1.37\nÜberschriften\na) Daumen hoch – aber gewusst wie!\nb) Durch die Städte Osteuropas. Viel zu sehen für wenig Geld!\nc) Was rastet, das rostet: Tipps für Stillstand und Bewegung.\nd) Vom eigenen Wagen zum Car-Sharing. Autofahren damals und heute.\ne) Tausch dich aus! Autos, Werkzeuge, Geräte & Co gemeinsam benützen.\nf) Mein rechter Platz ist frei… Wie berechenbar sind Mitfahrgelegenheiten?\ng) Die 5 Gefahren des Autostoppens.\nh) Preiswert durch die Welt – Reisearten im Vergleich.\ni) Urlaub zu Hause, Urlaub bei Fremden? Oder: Auf dem Sofa durch die Welt.\nj) Fast geschenkt: Autos, die man sich leisten kann.\n1\nWie wäre es, bei wildfremden Menschen einzuziehen und während der eigenen Reise dort zu übernachten? Wer nach unmittelbarer Bekanntschaft mit dem Reiseziel und seinen Gepflogenheiten lechzt, betreibt heute Couchsurfing.\nPrivate Gastgeber auf allen Kontinenten bieten im Internet eine Schlafgelegenheit an. Geben und Nehmen heißt das Prinzip des neuen Reisetrends: Wer bereits eine Couch in New York in Anspruch genommen hat, kann auch sein Sofa in St. Pölten für andere Touristen anbieten.\nSechs Millionen Menschen weltweit wissen, wie sich so etwas anfühlt, denn sie sind alle Mitglieder bei Couchsurfing.org, dem größten Online-Portal zur Vermittlung von kostenlosen Übernachtungsmöglichkeiten.\nHier suchen Abenteuerlustige nach privaten Übernachtungsmöglichkeiten aus aller Welt. In über 100.000 Städten sind Couchsurfer angemeldet und dementsprechend ist die Wahrscheinlichkeit recht hoch, im Urlaub als Gast bei Fremden einzuziehen.\nDoch genau diesen Begriff vermeidet man auf der Homepage galant, aber bestimmt. Von „Fremden“ ist hier nicht die Rede, vielmehr von „Freunden, die du noch nicht getroffen hast“.\n2\nDarauf, zu einem Wildfremden ins Auto zu steigen, basiert die Geschäftsidee von Mitfahrplattformen im Internet. Ihr Prinzip: Wer mit dem Auto von A nach B fahren will und noch Plätze frei hat, sucht online oder via App nach Mitfahrern, um sein Auto zu füllen und sich die Benzinkosten zu teilen.\nDas dürfte funktionieren, denn solche Websites gibt es mittlerweile zuhauf.\nNeu sind Mitfahrbörsen nicht: Schon in den 1950ern wurde in Frankfurt am Main – ganz und gar offline – eine Mitfahrzentrale gegründet. Eigentlich wie Autostoppen, nur besser planbar.\nMit dem Internet wurde die Organisation dann noch leichter. Heute weiß man vorab schon eine ganze Menge über die potenziellen Chauffeure: Sie haben Profile, auf denen sie nicht nur sich selbst, sondern auch ihr Auto präsentieren. Auch eine Ausweiskopie kann dem Profil beigefügt werden.\n3\nLanges Stehen tut selten gut, das gilt auch für Autos. Bei wenig genutzten Fahrzeugen kann unter anderem Rost an Blech und Bremsen entstehen.\nDamit der Wagen nach längerer Standzeit nicht nur anspringt, sondern auch verlässlich läuft, ist Vorsorge nötig. Früher wurde empfohlen, das Auto vollzutanken, damit kein Rost im Tank entsteht. Dieser Ratschlag erübrigt sich schon seit längerer Zeit, denn seit Mitte der 80er Jahre haben Autos meist einen Kunststofftank.\nWährend es bei älteren Autos empfehlenswert sein kann, die Batterie auszubauen, verursache dies bei neueren Modellen häufig Probleme mit der Elektronik.\nBesonders wichtig ist eine geeignete Unterstellmöglichkeit. Wenn es ein teures Fahrzeug ist, sollten Sie überlegen, einen Stellplatz zu mieten.\nDie Fachleute raten außerdem dazu, etwas mehr Luft in die Reifen zu pumpen, weil schon die Temperaturunterschiede den Druck deutlich sinken lassen können.\nDamit der Wagen in Form bleibt, gilt aber eigentlich das Motto „Fahren, fahren, fahren“.\n4\nEs gibt einen neuen Trend, der nicht nur in Deutschland, sondern weltweit Einzug hält: „Nutzen statt Besitzen“ lautet er und umfasst so unterschiedliche Praktiken wie Wohnungstausch, Kleidertauschpartys, Autogemeinschaften, Gemeinschaftsgärten, Tauschringe für Werkzeuge, Drucker oder DVDs und vieles andere mehr.\nTELC B2 — LESEN, TEIL 1.38\nÜberschriften\na) Für unterwegs: Leckereien im Zugrestaurant\nb) In der Stadt der warmen Quellen\nc) Irrtum: Süßes macht doch nicht glücklich\nd) Mitmach-Museum: Bonbons selbst herstellen\ne) Naschen statt wegwerfen\nf) Neues Thermalbad in Rom\ng) Reisen: Die beliebtesten Thermalbäder\nh) Süßwaren mit langer Tradition\ni) Wasser, Wärme, Wellness – antike Badefreuden\nj) Zucker sorgt für Stimmungshoch\n1\nBonbons machen Kinder glücklich, und zwar nicht erst seit gestern: Denn diese beliebte Süßigkeit ist viel älter, als man allgemein vermuten würde. Schon vor über 1 000 Jahren gab es im antiken China, in Griechenland und im Römischen Reich Süßwaren aus Honig, Blüten und Früchten.\nWer noch mehr über Bonbons erfahren möchte, sollte einen Ausflug nach Vaihingen an der Enz unternehmen: Dort gibt es nicht nur seit 1828 die Bonbon- und Zuckerwarenfabrik Jung, sondern auch das einzige Bonbon-Museum Deutschlands.\nAuf 300 Quadratmetern Ausstellungsfläche findet sich Antwort auf viele bunte Fragen: Man erfährt dort etwa, woher Bonbons kommen, wie sie ihre heutige Form erhielten und wie sie überhaupt hergestellt werden. Gezeigt werden auch Bonbondosen, Bonbon-Maschinen und Werbemittel. Beim Rundgang durch das Museum übernehmen kleine und große Besucher echte Teile aus den frühen Herstellungsstätten und verfolgen die Entwicklung der Fabrikproduktion unserer Zeit.\n2\nAm Frankfurter Hauptbahnhof können Reisende beim Warten auf den Zug noch schnell einen besonderen Snack genießen. Denn am Bahnhof steht jetzt ein Ret-o-mat: ein Automat, an dem abgelaufene Schokoriegel, Chips, Nüsse und andere Lebensmittel verkauft werden.\nDas Mindesthaltbarkeitsdatum der Produkte ist in den meisten Fällen fast abgelaufen, daher werden sie günstiger angeboten als im Handel. Auch Getränke hält der Automat bereit.\nDie Produkte sind überschüssig beziehungsweise stehen kurz vor oder nach dem Ablauf des Mindesthaltbarkeitsdatums, sind aber trotzdem noch gut, erklärt ein Sprecher der Deutschen Bahn. Denn sie werden natürlich sorgfältig geprüft.\nMit dem neuen Service wolle der Konzern den Bahnhof noch attraktiver machen und so Ressourcen schützen. Fahrgäste sollen die Möglichkeit erhalten, sich mit Süßigkeiten und Knabbereien zu versorgen und gleichzeitig etwas gegen die Lebensmittelverschwendung zu tun.\nAußerdem können Vorbeigehende und Reisende bei einer kleinen Probiergabe, die darauf aufmerksam macht, dass viele Lebensmittel weggeworfen werden, aufgeklärt werden.\n3\nWo heißes Wasser aus der Erde sprudelt, hat sich vielerorts das Bäder- und Kurwesen gut entwickelt. Schon im alten Rom wusste man, dass ein Bad im warmen Wasser wohltuend ist und gegen Alltagsstress, Verspannungen und Ermüdung wirkt.\nBadeeinrichtungen gab es überall im Römischen Reich. Gegen eine geringe Eintrittsgebühr konnte jeder, egal welcher Erhebung seiner in der gesellschaftlichen Rangordnung, Anlagen genießen; diese boten Platz für bis zu 1000 Menschen.\nVon ähnlichen Bauten und der speziellen Architektur konnten viele europäische Städte profitieren und Badelux kopieren. Möglichst prachtvoll wurden sie gebaut, sollten eindrucksvoll sein, und wertvolle Mosaik- und Marmorböden, mehrere Badebecken sowie Räume für Schwitz- und Dampfbäder machten sie zu gesellschaftlichen Begegnungsorten.\nDoch die besonderen Freizeiteinrichtungen spielten auch im gesellschaftlichen Leben eine Rolle: Denn das Gesuchte für das Auge verbandet sich hier überall auch mit einer angenehmen Atmosphäre, wo die ein Besuch in einer Therme zu einem beliebten Freizeitziel in vielerlei Art.\nMit den veränderten demokratischen Bedürfnissen wurde die römische Bauweise erhalten, aber die Grenze etwas reduziert.\n4\nNicht nur in Hollywoodfilmen tröstet man sich bei Liebeskummer mit Pralinen: Der Griff zu Süßigkeiten ist überall weit verbreitet. Viele glauben, dass sie die Stimmung aufhellen, die Konzentration verbessern oder gegen „Nachmittagstiefs“ im Büro helfen.\nDoch damit liegen sie womöglich falsch. Denn Wissenschaftler haben nun genauer erforscht, wie Zucker auf unser Gemüt wirkt.\nIn ihrer Studie stellten sie praktisch keinen positiven Einfluss des Zuckerkonsums auf die Laune fest – im Gegenteil.\nDie Idee, dass Zucker die Stimmung heben kann, ist auf der ganzen Welt verbreitet, sagt Konstantin Grü-ßer von der Humboldt-Universität in Berlin. „Unser Ergebnis bietet jedoch eigentlich keinen Anhaltspunkt dafür.“\nViele wissen überhaupt, „denn sorgt Zucker dafür, dass wir uns schlechter fühlen“. Die Auswertung deutet darauf hin, dass Probanden nach Zuckerkonsum müder und unkonzentrierter waren als jene, die nur ein Placebo bekommen hatten.\n5\nWellness und der Besuch von Kurorten und Thermalbädern haben seit Jahrhunderten Tradition in Ungarn. Das Land besitzt zwar keinen direkten Zugang zum Meer, aber dafür wimmelt es in diesem Binnenstaat nur so von Thermalquellen.\nDabei handelt es sich um Quellen, aus denen Grundwasser austritt, das über 20 Grad warm ist. Dieses Wasser enthält Mineralstoffe, denen eine positive Wirkung auf den Organismus zugeschrieben wird.\n123 Thermalquellen finden sich allein in Budapest, das berühmt für seine Bäder ist. Diese Stadt ist damit nicht nur das einzige Kurbad, das zugleich die Hauptstadt eines Landes ist, sondern auch die größte Kurstadt Europas.\nIn Budapest kann man zwischen über 20 Bädern wählen. Viele sind Bauten von beträchtlichem historischem und architektonischem Rang. Obwohl Budapest auch eine ausgeprägte Café-Kultur besitzt, sind die Bäder für die Stadtbewohner wichtige Treffpunkte – denn oft verabreden sich Freunde in einem Bad.\nTELC B2 — LESEN, TEIL 1.39\nÜberschriften\nA. Bewegung macht gute Laune\nB. Klug durch Schlaf\nC. Licht aus – Energiesparen im Klassenzimmer\nD. Professor fordert kürzere Arbeitszeiten\nE. Richtiges Licht fördert das Lernen\nF. Sind Frühaufsteher intelligenter?\nG. Tiere im Energiesparmodus\nH. Wandern im Dunkeln – Tipps für Nachtwanderungen\nI. Warum Menschen keinen Winterschlaf halten\nJ. Was hinter unserer Wintermüdigkeit steckt\n1\nIm Winter ziehen sich viele Tiere in den Winterschlaf zurück, um Energie zu sparen. Während dieser Zeit wird ihr Stoffwechsel langsamer, und ihre Körpertemperatur sinkt. Dies hilft ihnen, über einen längeren Zeitraum ohne Nahrung auszukommen. Beispiele für Tiere, die Winterschlaf halten, sind Igel, Fledermäuse und Murmeltiere.\n2\nLaut einer Studie der Universität Leipzig fördert natürliches Licht die Lernfähigkeit von Schülern. Klassenzimmer mit viel Tageslicht sorgen dafür, dass die Schüler aufmerksamer und konzentrierter sind. Die Forscher stellten außerdem fest, dass ausreichend Licht die Stimmung hebt und das Lernklima verbessert.\n3\nEin regelmäßiger Schlafrhythmus ist wichtig für die Gesundheit. Während des Schlafs produziert unser Körper das Hormon Melatonin, das den Schlaf-Wach-Rhythmus reguliert. Melatonin unterstützt den Körper dabei, sich zu entspannen, und sorgt für eine erholsame Nacht. Ein gestörter Schlafrhythmus kann jedoch zu Gesundheitsproblemen führen.\n4\nIn den letzten Jahren ist das nächtliche Wandern in der Natur zu einer beliebten Freizeitaktivität geworden. Gesundheitsexperten empfehlen, diese Praxis nicht zu verbieten, da sie positive Auswirkungen auf die körperliche und geistige Gesundheit hat.\nNachts zu wandern hilft, Stress abzubauen, die Sinne zu schärfen und die Verbindung zur Natur zu stärken. Zudem fördert es die Produktion von Melatonin, das den Schlaf-Wach-Rhythmus reguliert und bei Schlafproblemen hilft.\nExperten betonen, dass diese Bewegung besonders wohltuend ist, solange sie sicher und in geeigneten Bedingungen stattfindet.\n5\nProfessor Dr. Thoma Münch von der Universität Freiburg führte eine Studie durch, die den Zusammenhang zwischen Arbeitszeiten, Tageslicht und der Gesundheit von Arbeitnehmern untersuchte.\nDie Ergebnisse zeigten, dass Menschen, die ihre Arbeitszeiten besser an den natürlichen Sonnenrhythmus anpassen, weniger unter Schlafstörungen und chronischer Müdigkeit leiden. Außerdem trägt der tägliche Fußweg zur Arbeit, besonders bei Tageslicht, nicht nur zur körperlichen Gesundheit bei, sondern verbessert auch die psychische Verfassung.\nDer Kontakt mit natürlichem Licht reguliert den Hormonhaushalt, insbesondere die Produktion von Melatonin und Serotonin, was entscheidend für das Wohlbefinden ist.\nTELC B2 — LESEN, TEIL 1.40\nÜberschriften\nA. Anzahl und Rolle der Arten noch unklar\nB. Veränderte Wanderwege von Zugvögeln\nC. Wetterbedingungen könnten den Zerfall von Hochkulturen beschleunigt haben\nD. Klimawandel erschwerte die Evolution\nE. Optimistische Projekte, um das Artensterben aufzuhalten\nF. Störungen des biologischen Rhythmus von Zugvögeln\nG. Der Mensch ist am Aussterben von Tierarten schuld\nH. Keine neuen Erkenntnisse über den Niedergang der Hochkultur\nI. Evolution durch klimatische Veränderungen begünstigt\nJ. Neue Studie belegt Verwandtschaft zwischen Säugetieren\n1\nDie zunehmende Klimaveränderung macht sich bereits in der Tierwelt bemerkbar. So müssen Zugvögel ihre Eier früher legen, um sich an die wärmeren Frühjahrstemperaturen in ihren gewohnten Brutregionen anzupassen.\nBei bestimmten Arten ist das Zugverhalten aber nicht nur abhängig vom Klima, sondern auch von anderen Reizen, wie zum Beispiel der Länge des Tages. Diesen Vogelarten fällt es besonders schwer, die Eiablage an die geänderten klimatischen Bedingungen anzupassen.\nZugvögel, die eine besonders lange Strecke zwischen ihren Überwinterungsplätzen und den Brutstätten zurücklegen müssen, sind durch das Zusammenspiel von Temperaturänderung und anderen, unveränderten Außenbedingungen besonders leicht zu verwirren.\nDenn der Zeitpunkt für den Abflug aus den Überwinterungsregionen wird von Einflüssen bestimmt, die nichts mit der Temperatur zu tun haben. Einige Auslöser für die Wanderung sind auch genetisch bedingt. Die Tiere kehren in der Regel dann zurück, wenn es die meisten Insekten als Nahrung für ihren Nachwuchs gibt.\n2\nDas Klima hatte einen entscheidenden Einfluss auf die Entwicklung des Menschen, vermuten Wissenschaftler. Sie stellten einen Klimakalender des Menschen zusammen, demzufolge fünf dramatische Klimaänderungen zur Evolution des Menschen beigetragen haben.\nDie Klimawandlungen hätten diese drastisch beschleunigt. Die Notwendigkeit, sich an neue Umstände anzupassen, habe die Entwicklung des Gehirns beschleunigt und zum aufrechten Gang beigetragen.\nAuch die Entwicklung von verschiedenen Arbeitsgeräten sei teilweise durch den Klimawandel bedingt, denn die Veränderungen der Umweltbedingungen fielen zeitlich mit dem Erscheinen der ersten Vorfahren des Menschen in den betroffenen Gebieten zusammen.\nSucht man nach einem Merkmal, das den Menschen vom Tierreich abhebt, so ist das vermutlich eine außerordentliche Unabhängigkeit gegenüber den Launen der Natur. Einer Hypothese zufolge war es das stetig wechselnde Klima, das den Mensch zum Menschen machte.\nDie ungewöhnlich und sich ändernden Lebensbedingungen seien demnach während der letzten sechs Millionen Jahre der entscheidende Faktor in der Evolution des Menschen gewesen.\n3\nFast dreizehn Jahrhunderte lang blühte die Hochkultur der Maya, bis es zu ihrem Zusammenbruch kam. Fachleute diskutieren seit Jahrzehnten, was den plötzlichen Kollaps auslöste: Kriege, Hunger oder das Klima?\nEine neue Studie spricht für Letzteres: Anhaltende Trockenheit führte demnach zu Untergang – zumindest indirekt. Rund um Christi Geburt entwickelte sich im Süden und Südosten Mexikos sowie in Teilen von Guatemala, Belize und Honduras die Hochkultur der Maya.\nIn ihren Inschriften sind Kriege, Hochzeiten und Thronfolgen exakt festgehalten. Das Ende dieser Aufzeichnungen markiert auch den Beginn des Niedergangs: Zwischen dem 8. und dem 10. Jahrhundert wurden viele Städte aufgegeben und die Bevölkerung ging drastisch zurück.\nFür diesen Kollaps gibt es heute mehrere Erklärungen: Lange Zeit vermutete man vor allem blutige Auseinandersetzungen, Invasionen und soziale Konflikte dahinter, auch Epidemien und Naturkatastrophen standen als mögliche Auslöser zur Diskussion.\nErst in den letzten zwanzig Jahren mehren sich die Stimmen, dass eine Veränderung des Klimas die Triebfeder für den Untergang der Hochkultur gewesen sein könnte.\n4\nExperten nehmen an, dass Tag für Tag rund 100 Tierarten aussterben.\nSie gehen davon aus, dass innerhalb der nächsten 20 Jahre weltweit ein Viertel aller bislang bekannten Arten ausgestorben sein wird.\nDer Mensch treibt dieses Artensterben stark voran: Die Zerstörung von natürlichem Lebensraum, Umweltverschmutzung und Krankheiten gefährden Tiere und Pflanzen.\nOhne das Einwirken des Menschen auf die verschiedenen Ökosysteme der ganzen Welt würden pro Jahr höchstens 25 Arten aussterben. Neben dem eigentlichen Verlust der jeweiligen Art hat das Aussterben der Tiere Folgen für das gesamte Ökosystem: Sein natürliches Gleichgewicht wird gestört. Wenn eine Art stirbt, sterben auch andere abhängige Arten.\n5\nWie eng eine Art mit ihrem Lebensraum verbunden ist, zeigt sich oft erst, wenn sie nicht mehr da ist. War sie ein wichtiges Glied in der Nahrungskette, dann verschwinden plötzlich auch andere Lebewesen.\nDarüber, wie viele Arten es überhaupt gibt, gibt es unterschiedliche Schätzungen. Wissenschaftler gehen jedoch davon aus, dass der größte Teil noch gar nicht entdeckt ist.\nDas jetzige Tempo vorausgesetzt, würde es noch mehrere hundert Jahre dauern, bis alle Arten beschrieben sind. Wir kennen nur knapp zwei Millionen von geschätzten 30 Millionen Arten.\nVon sehr vielen Arten wissen wir nichts über ihre Rolle im Ökosystem – und schon gar nicht, in welcher Weise sie für den Menschen nützlich sein könnten. Aber immer mehr Lebensräume und damit Artenbestände werden ausgelöscht. Die Vereinten Nationen schätzen, dass täglich 130 Tier- und Pflanzenarten aussterben.\nTELC B2 — LESEN, TEIL 1.42\nÜberschriften\nA. Experte sagt Wohnungsnot in Städten voraus\nB. Selbstbestimmtes Leben im Alter für viele zu teuer\nC. Wie man zusätzlichen Wohnraum nutzen kann\nD. Hausbesitz schränkt in der Mobilität ein\nE. Wohnentwürfe so divers wie die Menschen\nF. Ansprüche an Wohnfläche altersabhängig\nG. Neuer Trend könnte für Steigerung der Einwohnerzahl sorgen\nH. Für leistbares Wohnen werden lange Wartezeiten akzeptiert\nI. Landleben gibt neue Energie\nJ. Wohnbedürfnisse der Jugend bisher vernachlässigt\n1\nWer im Alter nicht mehr alleine ein eigenständiges und selbstbestimmtes Leben führen möchte, begibt sich in Österreich meist professionell auf die Suche nach einer entsprechenden Unterkunft. Konventionell geführte Einrichtungen und -residenzen haben allerdings den Nachteil, dass die dort geltenden Regeln Bewohner einschränken und diesen außerdem Gebote oder Verbote auferlegt werden.\nFür viele Ältere beziehungsweise deren unmittelbare Angehörige ist zudem finanzielle Leistbarkeit ein ausschlaggebendes Thema, denn die durchschnittliche Pension erlaubt allzu hohe Ausgaben nicht. Eine günstigere Alternative bietet nun ein neues, aus einer Kooperation entstandenes Modell.\n2\nAls junger Mensch in Wien auf Wohnungssuche zu sein, ist allenfalls eine große Herausforderung. Wer ein Studium an der Universität oder Fachhochschule aufnimmt oder gerade einen Ausbildungsplatz in der Hauptstadt Österreichs erhalten hat, dem fehlen allzu oft die finanziellen Mittel, um ein halbwegs annehmbares Quartier zu finden.\nDie anfänglichen Kosten, die bereits vor dem Einzug in die neue Wohnung fällig sind, können durch die geforderte Kaution von meist drei Bruttomonatsmieten sowie die Vermittlungsgebühren für Maklerbüros enorm hoch werden.\nUm eine günstige Gemeindewohnung beantragen zu können, muss man bereits mehrere Jahre in Wien hauptgemeldet sein, und auch dann ist Geduld ungebracht. Bei einer Anmeldung sind zudem gleich alle Suchkriterien festzulegen, also etwa Wunschbezirk und Quadratmeteranzahl.\nFür jene, die gerade die ersten selbstständigen Schritte tun, lässt sich allerdings die Zukunft kaum so genau vorausplanen, Gemeindewohnungen sind daher meist keine Option. Die Stadt Wien will nun in den kommenden Jahren zunehmend Wohnprojekte mit flexiblen Vertragsbedingungen und kurzen Kündigungsfristen fördern und sich damit stärker an der Situation junger Leute orientieren.\n3\nWohnen wie immer? Laut Ansicht des renommierten Zukunftsforschers Adrian Gregorius wird sich innerhalb der nächsten paar Jahrzehnte ein Wandel in unserer Wohnkultur vollziehen, der durch die Bevölkerungszunahme in den Städten bedingt wird.\nDie Konzentration eines großen Anteils der Bevölkerung im Stadtgebiet sieht Gregorius – im deutlich wahrnehmbaren Gegensatz zum ungebremsten Landschaftsverbrauch in den umliegenden Regionen – jedoch keineswegs grundsätzlich als Problem.\nVielmehr sei das Leben in der Stadt, wenn es richtig geplant und umgesetzt werde, sowohl ressourcen- als auch energieschonend. Des Weiteren entfalle der klimaschädliche und stressige Berufsverkehr und eine private Autonutzung werde weitgehend überflüssig, da die gesamte städtische Infrastruktur vor Ort zur Verfügung stehe.\nNicht nur die Dichte, sondern auch die veränderten Gesellschaftsstrukturen werden es daher erforderlich machen, das Konzept des Wohnens in privaten und flexibel gemeinschaftlich nutzbaren Räumen adäquat anzupassen und Naturflächen im Nahbereich neu zu gestalten.\nEinheitslösungen könne es dabei nicht geben, so der Zukunftsforscher. Unterschiedliche Lebens-, Bau- und Wohnformen müssten der Vielfalt der Stadtbewohner Rechnung tragen.\n4\nDass sich die Menschen einmal danach sehnen würden, möglichst wenig Wohnfläche zur Verfügung zu haben, hätte wohl niemand vermutet. Eine neue, von den Vereinigten Staaten ausgehende Bewegung zielt nun darauf ab, sich von überflüssigen Materialien und Dingen zu trennen und nur mehr das zu behalten, was auf einer Fläche von 15 bis 20 Quadratmetern Platz findet.\nDie sogenannten Tiny Houses, also kleinen Häuser, erfreuen sich auch in Österreich immer größerer Beliebtheit, da ihre Anschaffungskosten gering sind und sie bei Bedarf auch per LKW an einen anderen Standort gebracht werden können.\nDadurch ist man als Besitzer eines solchen Eigenheims sehr flexibel, was die Wahl des Wohnorts anbelangt. Es bedarf nur eines kleinen Stellplatzes, der für eine bestimmte Zeit gemietet oder gepachtet wird.\nBesonders vonseiten ländlicher Gemeinden, die stark vom Abzug Einheimischer betroffen sind, besteht großes Interesse daran, dass auf diese Art Personen in entlegeneren Ortschaften wieder ansässig werden. Deswegen wurden mancherorts oftmals auf Initiative der Bürgermeister bereits Vermittlungsbörsen für Interessierte eingerichtet.\n5\nWer hat insgeheim nicht jenen Tag herbeigesehnt, an dem die Kinder endlich selbstständig werden, eigenes Geld verdienen, das gemeinsame Zuhause verlassen und man das eigene Leben wieder in die Hand nehmen kann?\nFür viele Eltern ist jedoch das Fehlen des Nachwuchses in den heimischen vier Wänden letztendlich ein richtiger Schlag, der das Ende eines Lebensabschnitts signalisiert, in welchem man als Versorger gebraucht wurde.\nZu alledem gesellt sich der Umstand, dass man sich des eigenen Älterwerdens zunehmend bewusst wird. Tatsächlich kommt nun also eine schwierige, oftmals zu Depressionen führende Phase der Umorientierung auf die Eltern zu.\nUm das Gefühl von Einsamkeit und Leere zu überwinden, entschließt sich so manches Paar zu dem durchaus radikalen Schritt, das nun für zwei ältere Personen viel zu große Heim zu veräußern und sich etwas Kleineres und Günstigeres zu suchen, das besser zu den neuen Gegebenheiten passt, anstatt die vorhandenen, nun freistehenden Räumlichkeiten im Familienheim umzugestalten oder für einen eventuellen Besuch der Kinder freizuhalten."}, "answers": {"1": "I", "2": "J", "3": "A", "4": "G", "5": "F"}, "options": {"1": ["H", "A", "J", "C", "F", "E", "I"], "2": ["C", "J", "H", "G", "D", "E", "A"], "3": ["G", "J", "D", "A", "I", "F", "E"], "4": ["A", "J", "H", "F", "G", "E", "I"], "5": ["F", "A", "I", "E", "H", "B", "J"]}}};
let currentTest=null, q=1, selected={}, score=0;

function naturalId(id){
  return id.replace('A','a');
}
function sortIds(a,b){
  const pa=a.match(/^1\.(\d+)(A)?$/i), pb=b.match(/^1\.(\d+)(A)?$/i);
  const na=+pa[1], nb=+pb[1];
  if(na!==nb) return na-nb;
  return (pa[2]?1:0)-(pb[2]?1:0);
}
function renderList(){
  const list=document.getElementById('list');
  list.innerHTML='';
  Object.keys(TESTS).sort(sortIds).forEach(id=>{
    const b=document.createElement('button');
    b.className='testbtn';
    b.textContent=naturalId(id);
    b.onclick=()=>startTest(id);
    list.appendChild(b);
  });
}
function startTest(id){
  currentTest=id; q=1; selected={}; score=0;
  document.getElementById('list').classList.add('hidden');
  document.querySelector('.sub').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderQuestion(){
  const t=TESTS[currentTest];
  document.getElementById('testName').textContent=naturalId(currentTest);
  document.getElementById('progress').textContent=q+' / 5';
  document.getElementById('text').textContent=t.texts[q];
  const box=document.getElementById('options'); box.innerHTML='';
  t.options[q].forEach(letter=>{
    const b=document.createElement('button');
    b.className='option'+(selected[q]===letter?' selected':'');
    b.textContent=letter+') '+t.headings[letter];
    b.onclick=()=>{selected[q]=letter; renderQuestion();};
    box.appendChild(b);
  });
  document.getElementById('nextBtn').textContent=q===5?'Natija ✓':'Keyingi →';
}
function nextQuestion(){
  if(!selected[q]){ alert('Avval javobni tanlang.'); return; }
  if(selected[q]===TESTS[currentTest].answers[q]) score++;
  if(q<5){q++; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'});}
  else showResult();
}
function showResult(){
  document.getElementById('quiz').classList.add('hidden');
  const r=document.getElementById('result');
  r.classList.remove('hidden');
  const pct=score*20;
  r.innerHTML='<h2>'+naturalId(currentTest)+' — Natija</h2>'+
    '<p><b>'+score+'/5</b> ('+pct+'%)</p>'+
    '<p class="small">To‘g‘ri javoblar test tugagandan keyin hisoblandi.</p>'+
    '<div class="actions"><button class="mainbtn" onclick="startTest(currentTest)">Qayta ishlash</button>'+
    '<button class="mainbtn primary" onclick="backToList()">Testlar</button></div>';
}
function backToList(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('list').classList.remove('hidden');
  document.querySelector('.sub').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
renderList();
</script>
