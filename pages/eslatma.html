<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kunlik eslatma — Jurabek TELC B2</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:#f7f8ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:
 radial-gradient(circle at 10% 5%,rgba(74,144,226,.35),transparent 28%),
 radial-gradient(circle at 90% 18%,rgba(151,93,255,.28),transparent 30%),
 linear-gradient(160deg,#10182d,#18284a 55%,#17172c)
}
.app{max-width:720px;margin:auto;padding:20px 18px 115px}
.top{display:flex;align-items:center;justify-content:space-between}
.top a{color:white;text-decoration:none;font-size:28px}.top h1{font-size:21px}
.hero,.card{
 border:1px solid rgba(255,255,255,.12);border-radius:24px;
 background:rgba(255,255,255,.075);padding:21px;margin-top:16px
}
.hero{background:linear-gradient(135deg,rgba(190,102,48,.22),rgba(128,76,205,.22))}
.hero .ico{font-size:45px}.hero p,.muted{color:#bec8df;line-height:1.5}
.task{display:flex;gap:14px;align-items:flex-start}.task .ico{font-size:31px}
.task b{display:block;font-size:18px;margin-bottom:5px}.task span{color:#b8c1d9}
.check{
 width:100%;border:0;border-radius:15px;padding:14px;margin-top:17px;
 background:linear-gradient(135deg,#3e82d8,#7655cc);color:white;font-size:16px;font-weight:700
}
.done{background:linear-gradient(135deg,#168a78,#277f9d)}
.bottom{
 position:fixed;left:50%;bottom:0;transform:translateX(-50%);
 width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);
 background:rgba(12,18,34,.94);backdrop-filter:blur(18px);
 border-top:1px solid rgba(255,255,255,.12);
 padding:9px 8px calc(9px + env(safe-area-inset-bottom))
}
.nav{color:#8f9ab5;text-decoration:none;text-align:center;font-size:12px;padding:7px}
.nav i{font-style:normal;display:block;font-size:25px}.nav.active{color:white}

/* Shared responsive shell: phone/tablet/desktop */
html,body{max-width:100%;overflow-x:hidden}
@media(min-width:760px){
  body>main,body>.wrap,body>.container{max-width:1040px;margin-left:auto!important;margin-right:auto!important}
}
@media(min-width:1100px){
  body>main,body>.wrap,body>.container{max-width:1100px}
}

</style>
<script src="../app.js"></script>
</head>
<body>
<main class="app">
 <div class="top"><a href="../index.html">‹</a><h1>Kunlik eslatma</h1><span></span></div>

 <section class="hero">
  <div class="ico">🔔</div>
  <h2>Bugungi vazifa</h2>
  <p>Xatolaringizni takrorlang. B2 sertifikatini tezroq oling — kelajagingiz uchun harakat qiling! 💪🇩🇪</p>
 </section>

 <section class="card">
  <div class="task">
   <div class="ico">📚</div>
   <div><b>Bugungi mashg‘ulot</b><span>Kamida bitta TELC B2 testini bajaring.</span></div>
  </div>
  <button id="doneBtn" class="check" onclick="completeTask()">✓ Bugungi vazifani bajardim</button>
 </section>

 <section class="card">
  <div class="task">
   <div class="ico">🔥</div>
   <div><b>Kunlik seriya</b><span><strong id="streak">0</strong> kun ketma-ket mashg‘ulot.</span></div>
  </div>
 </section>
</main>

<nav class="bottom">
 <a class="nav active" href="../index.html"><i>🏠</i>Bosh</a>
 <a class="nav" href="reyting.html"><i>🏆</i>Reyting</a>
 <a class="nav" href="profil.html"><i>👤</i>Profil</a>
</nav>

<script>
const today=new Date().toISOString().slice(0,10);
let p=JSON.parse(localStorage.getItem("jurabekB2Profile")||"{}");
document.getElementById("streak").textContent=p.streak||0;

if(localStorage.getItem("jurabekB2Daily")==today){
 const b=document.getElementById("doneBtn");
 b.textContent="✅ Bugungi vazifa bajarildi"; b.classList.add("done");
}
function completeTask(){
 if(localStorage.getItem("jurabekB2Daily")!==today){
   p.streak=(p.streak||0)+1;
   p.xp=(p.xp||0)+20;
   localStorage.setItem("jurabekB2Profile",JSON.stringify(p));
   localStorage.setItem("jurabekB2Daily",today);
 }
 document.getElementById("streak").textContent=p.streak||0;
 const b=document.getElementById("doneBtn");
 b.textContent="✅ Bugungi vazifa bajarildi";b.classList.add("done");
}
</script>
</body></html>
