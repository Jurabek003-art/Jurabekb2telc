<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B2 tayyorlik</title><script src="../app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#10182d,#18284a,#17172c);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:20px}.top{display:flex;gap:15px;align-items:center}.top a{color:#fff;text-decoration:none;font-size:28px}.card{background:#ffffff12;border:1px solid #ffffff1f;border-radius:22px;padding:20px;margin:14px 0}.big{text-align:center;font-size:52px;font-weight:900}.bar{height:12px;background:#ffffff1a;border-radius:12px;overflow:hidden}.bar div{height:100%;background:#5fd38d}.row{display:flex;justify-content:space-between;padding:9px 0}.muted{color:#b8c1d9}input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff12;color:#fff}button{width:100%;padding:13px;border:0;border-radius:13px;background:#526fce;color:#fff;font-weight:700;margin-top:10px}</style></head><body><main class="app"><div class="top"><a href="../index.html">‹</a><h1>🎯 B2 tayyorligim</h1></div><section class="card"><div class="big" id="ready">0%</div><div class="bar"><div id="readybar"></div></div><p class="muted" id="advice"></p></section><section class="card"><h3>📊 Bo‘limlar</h3><div id="sections"></div></section><section class="card"><h3>📅 Imtihon sanasi</h3><input type="date" id="exam"><button onclick="saveExam()">Sanani saqlash</button><h2 id="days"></h2><p class="muted" id="plan"></p></section></main><script>const r=JB2.results(),groups={};Object.values(r).forEach(x=>{const n=x.sectionName||x.section||"Boshqa";(groups[n]??=[]).push(+x.percent||0)});const av=o=>o.length?Math.round(o.reduce((a,b)=>a+b,0)/o.length):0,ready=JB2.readiness();document.getElementById("ready").textContent=ready+"%";document.getElementById("readybar").style.width=ready+"%";document.getElementById("advice").textContent=ready>=80?"Juda yaxshi. Mock natijalarini barqaror saqlang.":ready>=60?"Yaxshi ketmoqda. Zaif bo‘limlarni ko‘proq qaytaring.":"Asosiy e’tiborni xatolar va kundalik mashqqa qarating.";document.getElementById("sections").innerHTML=Object.keys(groups).length?Object.entries(groups).map(([k,v])=>`<div class="row"><span>${k}</span><b>${av(v)}%</b></div>`).join(""):'<p class="muted">Natijalar yig‘ilgach bo‘limlar tahlili chiqadi.</p>';let p=JB2.profile();exam.value=p.examDate||"";function update(){if(!exam.value){days.textContent="";plan.textContent="Imtihon sanasini kiriting — kunlik reja shunga moslashadi.";return}let d=Math.ceil((new Date(exam.value+"T12:00:00")-new Date())/86400000);days.textContent=d>=0?`Imtihongacha ${d} kun`:"Imtihon sanasi o‘tgan";let weak=Object.entries(groups).sort((a,b)=>av(a[1])-av(b[1]))[0]?.[0]||"Xatolarim";plan.textContent=d>0?`Bugun: ${weak} bo‘limidan kamida 1 test + Xatolarimdan 10 savol + 20 daqiqa B2 mashq.`:""}function saveExam(){p=JB2.profile();p.examDate=exam.value;JB2.saveProfile(p);update()}update()</script></body></html>
