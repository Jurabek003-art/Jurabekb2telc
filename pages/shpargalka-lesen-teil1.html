// ==========================================
// O'ZLASHTIRILMAGANLARGA SAQLASH
// ==========================================

function saveWrong(question, answer, testName){

  let wrongs = JSON.parse(
    localStorage.getItem("wrongQuestions") || "[]"
  );

  const id =
    "lesen-teil1-" +
    testName + "-" +
    question;

  let found = wrongs.find(item => item.id === id);

  if(!found){

    wrongs.push({
      id:id,
      section:"lesen",
      sectionName:"Lesen",
      teil:"1",
      test:testName,
      question:question,
      answer:answer,
      correctCount:0
    });

  }else{

    // Shpargalkada yana xato qilinsa 0/3 ga qaytadi
    found.correctCount = 0;

  }

  localStorage.setItem(
    "wrongQuestions",
    JSON.stringify(wrongs)
  );
}


// ==========================================
// TEST NATIJASINI SAQLASH
// ==========================================

function saveTestResult(testName, score, total){

  let results = JSON.parse(
    localStorage.getItem("testResults") || "{}"
  );

  const key = "lesen-teil1-" + testName;

  const percent =
    Math.round((score / total) * 100);

  // Eng yaxshi natijani saqlaydi
  if(
    !results[key] ||
    percent > results[key].percent
  ){

    results[key] = {
      section:"lesen",
      sectionName:"Lesen",
      teil:"1",
      test:testName,
      score:score,
      total:total,
      percent:percent
    };

  }

  localStorage.setItem(
    "testResults",
    JSON.stringify(results)
  );
}


// ==========================================
// TEST TIZIMI
// ==========================================

let currentTest="";
let questions=[];
let current=0;
let score=0;

const menu=document.getElementById("menu");
const quiz=document.getElementById("quiz");


function shuffle(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){

    const j=
      Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;
}


// ==========================================
// TESTLAR RO'YXATI
// ==========================================

Object.keys(tests).forEach(name=>{

  const div=document.createElement("div");

  div.className="test";

  div.innerHTML=`
    <h3>Test ${name}</h3>
    <p>${tests[name].length} ta savol</p>
  `;

  div.onclick=()=>startTest(name);

  menu.appendChild(div);

});


// ==========================================
// TESTNI BOSHLASH
// ==========================================

function startTest(name){

  currentTest=name;

  questions=shuffle(tests[name]);

  current=0;
  score=0;

  menu.classList.add("hidden");
  quiz.classList.remove("hidden");

  showQuestion();

}


// ==========================================
// SAVOLNI KO'RSATISH
// ==========================================

function showQuestion(){

  if(current>=questions.length){

    showResult();
    return;

  }

  const [question,correctAnswer]
    =questions[current];


  // Shu test ichidagi barcha javoblar
  let answers=[
    ...new Set(
      tests[currentTest]
        .map(item=>item[1])
    )
  ];

  answers=shuffle(answers);


  quiz.innerHTML=`

    <div class="question">

      <div class="progress">
        Test ${currentTest}
        · Savol ${current+1}/${questions.length}
      </div>

      <h2>${question}</h2>

      <div id="options"></div>

      <button
        id="next"
        class="next hidden">
        Keyingi →
      </button>

    </div>

  `;


  const options=
    document.getElementById("options");


  answers.forEach(answer=>{

    const button=
      document.createElement("button");

    button.className="option";
    button.textContent=answer;


    button.onclick=()=>{

      const all=
        document.querySelectorAll(".option");

      all.forEach(b=>b.disabled=true);


      // TO'G'RI JAVOB
      if(answer===correctAnswer){

        button.classList.add("correct");

        score++;

      }


      // XATO JAVOB
      else{

        button.classList.add("wrong");


        // O'zlashtirilmaganlarga saqlaydi
        saveWrong(
          question,
          correctAnswer,
          currentTest
        );


        // To'g'ri javobni yashil ko'rsatadi
        all.forEach(b=>{

          if(b.textContent===correctAnswer){

            b.classList.add("correct");

          }

        });

      }


      document
        .getElementById("next")
        .classList.remove("hidden");

    };


    options.appendChild(button);

  });


  document
    .getElementById("next")
    .onclick=()=>{

      current++;

      showQuestion();

    };

}


// ==========================================
// NATIJA
// ==========================================

function showResult(){

  const total=questions.length;

  const percent=
    Math.round((score/total)*100);


  // Natijani saqlaydi
  saveTestResult(
    currentTest,
    score,
    total
  );


  quiz.innerHTML=`

    <div class="result">

      <h1>🏆 Natija</h1>

      <h2>${score}/${total}</h2>

      <h1>${percent}%</h1>

      <p>
        Lesen Teil 1
        · Test ${currentTest}
      </p>

      <button
        class="next"
        onclick="startTest('${currentTest}')">

        🔄 Qayta ishlash

      </button>

      <button
        class="next"
        onclick="backMenu()">

        ← Barcha testlar

      </button>

    </div>

  `;

}


// ==========================================
// TESTLAR RO'YXATIGA QAYTISH
// ==========================================

function backMenu(){

  quiz.classList.add("hidden");

  menu.classList.remove("hidden");

  window.scrollTo(0,0);

}
