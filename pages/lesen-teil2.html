e leistungsfähig man sich fühlt. Doch hier möchte Isabelle Keller mit einem Vorurteil aufräumen: Leider lässt eine Tüte Studentenfutter die Konzentration nicht sofort in die Höhe schnellen, stattdessen muss auf eine anhaltend ausgewogene Ernährung geachtet werden. Die beinhaltet möglichst viele Vollkornprodukte, fettarme Milchprodukte, viel Gemüse und Obst sowie möglichst wenig Fleisch. Genauso langfristig sollte man die Sache mit dem Sport angehen. Durch regelmäßige Bewegung kann das Alltagsniveau von Kreislauf- und Nervensystem gesteigert werden – dadurch verbessert man auch seine Aufmerksamkeit und Konzentrationsfähigkeit.","questions":{"6":{"prompt":"Das im Kaffee enthaltene Koffein","options":{"A":"schädigt den Kreislauf und die inneren Organe.","B":"regt Herz und Kreislauf an und hilft gegen Müdigkeit.","C":"hat keine besondere Wirkung."},"answer":"B"},"7":{"prompt":"Wer regelmäßig Kaffee trinkt","options":{"A":"gewöhnt sich daran.","B":"verträgt immer weniger.","C":"leidet unter den negativen Effekten."},"answer":"A"},"8":{"prompt":"Nervosität und Muskelzittern sind","options":{"A":"die Folge von Koffeintabletten.","B":"die Folge einer Überdosierung von Koffein.","C":"die Folge einer Magen-Darm-Erkrankung."},"answer":"B"},"9":{"prompt":"Am wichtigsten ist für die Konzentration, dass","options":{"A":"man genügend Kaffee trinkt.","B":"man bei starker Hitze nicht viel körperliche Betätigung ausübt.","C":"man ausreichend Flüssigkeit zu sich nimmt."},"answer":"C"},"10":{"prompt":"Bei der Ernährung und beim Sport","options":{"A":"kommt es auf die Regelmäßigkeit an.","B":"zeigen sich keine positiven Effekte auf die Leistungsfähigkeit.","C":"sollte man nicht übertreiben."},"answer":"A"}}},"2.33":{"title":"LESEN, TEIL 2","text":"Im Nachtzug durch Europa\n\nNachtzüge wecken heute oft nostalgische Vorstellungen. Man denkt etwa an den Luxus des Orient Express, der seine meist gut betuchte Kundschaft innerhalb weniger Tage von Paris nach Istanbul brachte, an Landschaften, die an den Zugfenstern vorbeirauschen, und das sanfte Rattern eines Zuges, das einen in den Schlaf wiegt. Doch hält die Realität, was solche Bilder versprechen? „Teilweise“, meint die Studentin Sofia Osterhasen. Sie ist schon im Nachtzug von München nach Florenz, von Oslo nach Bergen und von Stockholm nach Kiruna gereist. Bei ihrer ersten Fahrt habe sie vor Aufregung nicht geschlafen, erzählt sie. Und auch sonst seien die Nächte im Zug oft unruhig, dafür sorgten etwa schnarchende Passagiere.\n\nNatürlich wäre Fliegen schneller und auf vielen Strecken sogar günstiger. Doch die lange Anreise gebe ihre Zeit, sich mit Mitreisenden zu unterhalten. „Die Leute erzählen während einer Zugfahrt viel aus ihrem Leben, man erfährt mehr als es bei Zufallsbekanntschaften oft der Fall ist. Das fasziniert mich“, erklärt sie.\n\nZutun und kamen völlig übermüdet am Zielort an! Doch als sein jüngster Sohn die Augen öffnete, rief er: Das war meine beste Reise! Ein fahrendes Bett! Ich will jetzt immer nur noch Nachtzug fahren. Vor allem der Kinder wegen haben die Schneiders auch für den diesjährigen Urlaub eine Fahrt im Nachtzug gebucht. Dass die Nachtzüge, die durch Europa fahren, nicht immer sonderlich bequem sind, darüber wird häufig geklagt. Fahrgäste bemängeln, dass die Waggons teilweise sehr in die Jahre gekommen sind und nur wenige Annehmlichkeiten bieten.\n\nIst vielleicht auch dies ein Grund, warum Geschäftsreisende diese Transportmöglichkeit nur selten in Betracht ziehen? „Das würde für mich keine große Rolle spielen“, meint Florian Kirsch, Vertriebsleiter eines mittelständischen Unternehmens. Viel wichtiger sei der Faktor Zeit: Wer will schon zwei Nächte im Zug verbringen, bloß weil er einen Termin in einer anderen Stadt hat? Wenn Nachtzüge konkurrenzfähig sein wollen, müssen sie mehr Schnelligkeit bieten, erklärt Florian Kirsch. Er selbst nimmt für längere Geschäftsreisen ausschließlich das Flugzeug.","questions":{"6":{"prompt":"Sofia Osterhasen fährt gerne mit dem Nachtzug","options":{"A":"weil sie im Vergleich zu Flügen günstiger ist.","B":"man dort leicht mit Fahrgästen ins Gespräch kommt.","C":"sie während der Fahrt meist gut schlafen kann."},"answer":"B"},"7":{"prompt":"Die Deutsche Bahn","options":{"A":"hat der österreichischen Bundesbahn einige Züge abgekauft.","B":"möchte mehrere Verbindungen über Nacht anbieten.","C":"verzichtete aus ökonomischen Gründen auf eigene Nachtzüge."},"answer":"C"},"8":{"prompt":"Die Reise mit dem Nachtzug","options":{"A":"empfand Tom Schneider insgesamt als erholsam.","B":"hat Tom Schneiders Sohn begeistert.","C":"möchte Tom Schneider nicht wiederholen."},"answer":"B"},"9":{"prompt":"Florian Kirsch verzichtet auf längere Zugreisen, weil","options":{"A":"er im Zug ungern arbeitet.","B":"er mit dem Flugzeug Zeit spart.","C":"es ihm an Bequemlichkeit fehlt."},"answer":"B"},"10":{"prompt":"Die Züge des französischen Start-ups sollen","options":{"A":"den Fahrgästen viel Privatsphäre bieten.","B":"vor allem eine finanzkräftige Zielgruppe ansprechen.","C":"zunächst Zielorte nördlich von Frankreich anfahren."},"answer":"A"}}},"2.34":{"title":"LESEN, TEIL 2","text":"Wann geht es den Österreichern gut?\n\nIhre Liebsten gehen den Österreichern über alles, tige und über 50-Jährige am meisten Raum finden für Dies ergab eine jüngst veröffentlichte Umfrage Muße, so scheint es ihnen ihre Gesundheit nicht eines Marktforschungsinstituts. Demnach fühlen zu danken: Fast 30 Prozent von ihnen haben einige sich 83 Prozent der Befragten besonders wohl in oder ernsthafte gesundheitliche Probleme. ihrer Haut, wenn in der Familie und in der Partner- schaft alles in Ordnung ist. Einen fast ebenso Im Gegenzug stellte das Forschungsinstitut fest, großen Stellenwert nimmt die eigene Gesundheit dass die Gesunden sich leichter Zeit nehmen zum ein: Für 80 Prozent ist diese eine wichtige Voraus- Genießen. 57 Prozent jener, die sich bester Ge- setzung, damit sie sich wohl fühlen. In diesen bei- sundheit erfreuen, gönnen sich auch ausreichend Punkten sind sich Mann und Frau einig; sie stehen Annehmlichkeiten, während das nur 39 Prozent bei beiden Geschlechtern und quer durch alle der Befragten mit einem weniger erfreulichen Ge- Alters- und Bildungsschichten ganz oben auf der sundheitszustand tun. Liste der Wohlfühlzutaten. Zeit für die Familie ist für 65 Prozent ein Kriterium für das eigene Wohlgefühl. Erst danach kommt ein materieller Wert, Geld. Genügend Geld zur Verfügung und keine Schulden zu haben, nannten 62 Prozent als ein Kriterium für das eigene Wohlergehen.\n\nZeit für Hobbys und Freizeitaktivitäten sowie die eigene Bestätigung sind jeweils für 59 Prozent der Befragten wichtig, um sich im Alltag wohl zu fühlen. Auch Zeit für Freunde und Bekannte gehört für mehr als die Hälfte, nämlich für 53 Prozent, dazu, wobei die jüngste Gruppe bis 29 Jahre mit 67 Prozent am meisten Wert darauf legt. Die Befragten in dieser Gruppe schlafen auch am liebsten aus und brauchen Sport, um sich gut zu fühlen. Über die Hälfte der Befragten geben an, dass Schmerzfreiheit und uneingeschränkte Bewegungsfreiheit ein Maßstab für Wohlbefinden ist – wobei dieses Kriterium bei Personen über 50 Jahre mehr zählt, nämlich zu über 62 Prozent, als bei den jüngeren Befragten. Aber auch bei diesen empfinden etwa die Hälfte Schmerz- und körperliche Bewegungsfreiheit als eine Bedingung, damit sie sich wohl fühlen.\n\nDie Studie ging daher näher auf diesen Punkt ein und fragte nach dem allgemeinen Gesundheitszustand der Österreicher. Eine breite Mehrheit (64 %) bezeichnet diesen als gut mit gelegentlichen kleinen Beschwerden, während 16 Prozent ihren Zustand als ausgezeichnet und 18 Prozent ihn als weniger gut mit einigen gesundheitlichen Problemen bezeichnen. Drei Prozent geben an, mit ernsten Gesundheitsproblemen zu kämpfen.\n\nDas Institut untersuchte auch den Zusammenhang zwischen Mußestunden und Gesundheit. Die Gruppen, die angeben, genug beziehungsweise zu wenige Stunden für Nichtstun und Genuss erübrigen zu können, sind mit jeweils 48 Prozent gleich groß.\n\nEine zweite, zeitgleich veröffentlichte Umfrage liefert weitere Hinweise, was die Österreicher zum Wohlergehen brauchen. Sie verrät nämlich, in welcher Gesellschaft sie sich am wohlsten fühlen: Diese Umfrage erhob Eigenschaften, welche die Österreicher an ihren Mitbürgern am meisten schätzen. Daraus ergibt sich das Bild des beliebtesten Österreichers: Er oder sie ist verlässlich, verantwortungsbewusst, lebensfroh, humorvoll und dazu intelligent. Ob die Personen, die so am meisten geschätzt werden, sportlich oder gut aussehend sind, ist den meisten Landsleuten herzlich egal.\n\nAn erster Stelle unter den beliebtesten Eigenschaften steht mit fast 80 Prozent die Verlässlichkeit. 60 Prozent der Befragten beschreiben Personen, die sie besonders schätzen, als lebensfroh. Wie der Vergleich mit einer früher durchgeführten Umfrage zeigt, haben diese beiden Attribute in den vergangenen 20 Jahren deutlich an Wert gewonnen. Der Begriff humorvoll fiel 59 Prozent zu ihren liebsten Mitmenschen ein, verantwortungsbewusst 58 Prozent. Weitere Eigenschaften, die bei Menschen besonders geschätzt werden, sind Intelligenz, Toleranz, Gewissenhaftigkeit und Geselligkeit.\n\nDie Eigenschaften fantasievoll und kreativ haben über die Jahre hinweg an Attraktivität verloren: Rund ein Drittel der Befragten halten diese Charakterzüge für unwichtig. Am wenigsten Wert legen die Befragten aber eindeutig auf das Attribut sportlich – fast die Hälfte der Befragten reiht es unter die drei unwichtigsten Eigenschaften, gefolgt von gut aussehend.","questions":{"6":{"prompt":"Die Mehrheit der Befragten mag Personen am meisten,","options":{"A":"die Freude am Leben haben.","B":"die stets zum Ausgehen aufgelegt sind.","C":"die über die Jahre an denselben Werten festhalten."},"answer":"A"},"7":{"prompt":"In Bezug auf Wohlfühlen wird die Gesundheit","options":{"A":"abhängig vom Bildungsgrad bewertet.","B":"bei beiden Geschlechtern gleich hoch bewertet.","C":"von kranken Menschen besonders betont."},"answer":"B"},"8":{"prompt":"Die Umfrage ergab, dass gesunde Menschen","options":{"A":"besonders viel Sport treiben.","B":"sich genug Zeit für angenehme Dinge nehmen.","C":"weniger Genussmittel konsumieren."},"answer":"B"},"9":{"prompt":"Die meisten Teilnehmenden an der Umfrage","options":{"A":"ärgern sich über immer wieder auftretende Gesundheitsprobleme.","B":"finden, dass sie bei guter Gesundheit sind.","C":"können ihre eigene Gesundheit nicht beurteilen."},"answer":"B"},"10":{"prompt":"Für die Gruppe der Befragten unter 30 Jahren","options":{"A":"hat Sport einen hohen Stellenwert.","B":"ist Ausschlafen etwas für ältere Leute.","C":"ist Zeit für Freunde und Bekannte noch nicht so wichtig."},"answer":"A"}}},"2.35":{"title":"LESEN, TEIL 2","text":"Thema Beziehungsangst: Die Angstsignale richtig deuten\n\nDauerhafte Beziehungsangst hat viele Gründe und erfordert Ursachenforschung. Viele Menschen mit solch einer Angst erkennen ihre eigenen Angstsignale nicht und laufen Gefahr, ihren Traumpartner für immer zu verlieren.\n\nNicht wenige Partnerschaften scheitern an Beziehungsangst. Diese Form von Angst wird von Betroffenen meist gar nicht selbst wahrgenommen und lässt eine Beziehung nach der anderen zerbrechen. Wer Beziehungsangst hat, fürchtet sich vor einer festen Beziehung, lässt innige Gefühle nicht zu und stößt seinen Partner schließlich von sich.\n\nMenschen mit Angst vor einer Beziehung sehen eine feste partnerschaftliche Bindung als Gefahr. Die Angst vermindert den Spaß an intimer Zweisamkeit und innigen Gefühlen. Solche Menschen konzentrieren sich anstatt auf das Glück mit dem Partner einzig auf die von ihnen als negativ aufgenommenen Folgen der Partnerschaft: Freiheitsverlust, partnerschaftliche Einengung, (zu) viel Verantwortung, Vertrauensmissbrauch, Angst davor, ein Stück von sich selbst aufgeben zu müssen.\n\nEs gibt auch eine gute Nachricht: Keine Beziehungsangst ist grundlos. Die Ursachenforschung beginnt oft in der Kindheit. Wenn die Eltern früh geschieden wurden oder Kinder in unglücklichen Familien aufgewachsen sind, äußert sich dieses Trauma aus der Kindheit nicht selten in Form von Angst vor festen Bindungen. Häufig zeigt sich auch eine frühere Partnerschaft verantwortlich: Hier wurde ein Partner schwer enttäuscht, verlassen oder tief verletzt und möchte sich partout nicht mehr auf Intimität einlassen.\n\nMenschen mit Beziehungsangst suchen sich oft Partner, mit denen keine gemeinsame Zukunft möglich ist. Mit professioneller Beratung kann eine Beziehungskrise wieder aus der Welt geschafft werden.\n\nAls junger und manchmal noch recht unerfahrener Mensch lernen viele ihren Partner fürs Leben kennen und gehen mitunter recht schnell eine Bindung ein.\n\nWas in früheren Jahren besiegelt wurde, reift aber im Laufe der Zeit. Beide Partner verändern sich und das vielleicht unabhängig voneinander. Manchmal kommt es dann zu einer mehr oder weniger schweren Beziehungskrise, aus der die Partner scheinbar aus eigener Kraft nicht mehr herausfinden. Ist das heiße Feuer der Leidenschaft erst mal erloschen und der Alltag mit Beruf und Kindern hat die beiden Partner eingeholt, sehen viele Paare keinen Sinn mehr darin, die Partnerschaft fortzuführen. Nicht wenige dieser Paare trennen sich sehr schnell. Viele möchten aber gar nicht so schnell aufgeben und sich von der Beziehungskrise wirklich beeindrucken lassen.\n\nIn diesen Fällen sollten die Partner über eine Beratung bei einer professionellen Person nachdenken. Voraussetzung für einen Erfolg solcher Gespräche ist jedoch, dass beide Partner auch wirklich ein echtes Interesse an der Klärung des Sachverhaltes haben. Hat einer bereits im Stillen das Handtuch geworfen, hat auch eine Paartherapie oft keinen Sinn mehr. Dann kann eine Krise wohl kaum mehr überwunden werden.","questions":{"6":{"prompt":"Viele Partnerschaften scheitern","options":{"A":"an den Beziehungsängsten eines Partners.","B":"weil ein Partner weit weg wohnt.","C":"aufgrund unterschiedlicher Arbeitszeiten."},"answer":"A"},"7":{"prompt":"Menschen mit Beziehungsangst konzentrieren sich nur auf","options":{"A":"das Glück mit dem Partner.","B":"die unangenehmen Eigenschaften einer Beziehung, wie z. B. mehr Verantwortung.","C":"ihre eigene Person."},"answer":"B"},"8":{"prompt":"Die Ursachen der Beziehungsangst liegen oft","options":{"A":"an ungelösten Konflikten in der Partnerschaft.","B":"in der frühen Kindheit oder in einer früheren Partnerschaft.","C":"am anderen Partner."},"answer":"B"},"9":{"prompt":"Viele Paare trennen sich","options":{"A":"wenn Alltag mit Beruf und Kindern in die Partnerschaft eingekehrt ist.","B":"wegen gesundheitlicher Probleme.","C":"wenn sie Haustiere haben."},"answer":"A"},"10":{"prompt":"Voraussetzung für ein erfolgreiches therapeutisches Gespräch ist, dass","options":{"A":"beide Partner dazu bereit sind.","B":"mindestens ein Partner ein klärendes Gespräch sucht.","C":"beide Partner sich in einer Beziehungspause befinden."},"answer":"A"}}},"2.36":{"title":"LESEN, TEIL 2","text":"Wie wichtig ist Nachhaltigkeit in österreichischen Unternehmen?\n\nIn den letzten Jahren setzen immer mehr österreichische Unternehmen auf gesellschaftliche Verantwortung. Zog man anfangs dazu eher Experten von außen heran, so gründet man jetzt lieber eine eigene Abteilung, die sich mit dem Fachgebiet der Nachhaltigkeit befasst. Ausgewählte Personen, die zuerst in entsprechende Fortbildungsprogramme eingebunden werden, sind im Anschluss für nachhaltige Projekte zuständig und werden ausdrücklich dazu aufgefordert, ihr Wissen an die Kollegen weiterzugeben. Da es sich bei dieser Kursänderung also nicht nur um eine Strategie der Führungsspitze handelt, sondern jeder Einzelne im Team eigenverantwortlich seinen Beitrag dazu leistet, werden soziales Engagement, das Nutzen regionaler Ressourcen sowie Umweltbewusstsein systematisch in den Betrieb integriert.\n\nNachhaltiges Handeln hat zunächst unmittelbare Auswirkungen auf die Mobilität. War es vor einigen Jahren noch übliche Praxis, bedenkenlos einen Flug zu buchen, um beruflich motivierte Termine wahrzunehmen, so ändert sich das gerade grundlegend.\n\nImmer mehr Unternehmen setzen auf Videokonferenzen und virtuelle Treffen. Ist eine körperliche Anwesenheit tatsächlich nötig, entsenden sie ihre Mitarbeiter bei überschaubaren Strecken mit der Bahn. Zudem arbeiten Unternehmen auch an Konzepten für den täglichen Arbeitsweg ihrer Mitarbeiter. Beispielsweise wird durch die Erstellung von Mitfahrplänen, die anzeigen, welcher Kollege zu einem bestimmten Zeitpunkt eine definierte Strecke fährt, die Bildung von Fahrgemeinschaften erleichtert. Schließlich gelingt es auch, das Personal durch die Bereitstellung von Dienstfahrrädern oder Tickets für öffentliche Verkehrsmittel hin zu umweltfreundlichen Mobilitätsentscheidungen zu lenken.\n\nMit dem Fortschreiten der Technik zeichnet sich ein Wandel zum papierlosen Büro ab. Selbst Verträge können bereits rechtsgültig digital unterschrieben werden. Allerdings ist es ein Irrglaube, dass durch E-Mails keine Schadstoffe freigesetzt werden. Auf den Arbeitsplätzen nachhaltiger Unternehmen greift man deshalb öfter zum Telefon oder geht einfach ins Büro nebenan, um dienstliche Angelegenheiten persönlich zu besprechen.\n\nTrotz des Umstiegs auf elektronische Dokumente verzeichnet Österreich in puncto Papierverbrauch eine leichte Tendenz nach oben. Derzeit liegt dieser bei etwa 250 Kilogramm pro Kopf und Jahr – was aus ökologischer Sicht bedenklich ist. Sieht umso bedenklicher aus, wenn man überlegt, wie viele enorme Mengen an Ressourcen bei der Erzeugung verbraucht werden. Der wichtigste Faktor, mit dem der Einsatz von Papier reguliert und verringert werden kann, ist immer noch die Verwendung von Altpapier. Dieses System funktioniert in Österreich relativ gut: Dank eines Sammelbewusstseins wird eine Altpapier-Rücklaufquote von rund 50 % erreicht.\n\nDas Nachhaltigkeitsprinzip kann man problemlos auch auf den Einkauf von Büromaterialien anwenden. Dieser Bereich wird von Unternehmen noch vernachlässigt, zu wenig Bedeutung misst man ihm bislang bei. Dabei sollte gerade bei solchen stets im Einsatz befindlichen Produkten genau darauf geachtet werden, aus welchen Materialien sie gefertigt bzw. welcher Art die Inhaltsstoffe sind. Durch die Bereitstellung umweltgerechter Schreibutensilien können Dienstgeber vermeiden, dass ihre Angestellten bei der Arbeit mit gefährlichen und teilweise sogar giftigen Schadstoffen in Berührung kommen. Nachhaltige Alternativen zu herkömmlichen Produkten gibt es etwa für Kugelschreiber, Textmarker oder Filzstifte. Diese werden immer häufiger mit Tinte auf wasserlöslicher Basis befüllt und belasten somit die Umwelt wesentlich weniger. Auch die Stifte selbst sind bereits zum Teil aus biologisch abbaubarem Material gefertigt, womit sich die Abfallmengen reduzieren lassen. Diese Produkte sind zudem deutlich langlebiger als herkömmliche Schreibwaren, wodurch das häufig angeführte Gegenargument – der großzügig bemessene Preis – eindeutig widerlegt wird.\n\nDer Gedanke der Nachhaltigkeit darf sich jedoch nicht nur auf Umweltfragen beschränken. Allzu lange blieb die soziale Komponente völlig unterbewertet, ein Randthema, worüber man gelegentlich diskutierte. In Wirklichkeit handelt es sich dabei um einen Aspekt, der in jeden Bereich der Ökologie und Ökonomie hineinwirkt. Für Arbeitgeber rückt die Thematik der sozialen Nachhaltigkeit oftmals nur dann stärker in den Blickpunkt, wenn es einen Fachkräftemangel zu beklagen gibt und Anreize geschaffen werden müssen, um die Attraktivität der ausgeschriebenen Stellen zu erhöhen. Unternehmen, die ihre Verantwortung ernst nehmen, pflegen aber jederzeit einen besonders achtsamen Umgang mit ihren Mitarbeitern und gewährleisten sowohl zwischen Geschlechtern als auch Generationen Einkommensgerechtigkeit und Fairness sowie Arbeitsplatzsicherheit und Transparenz.","questions":{"6":{"prompt":"Nachhaltigkeit im Unternehmen soll erreicht werden, indem","options":{"A":"der Austausch zur Thematik unter den Mitarbeitern gefördert wird.","B":"die Chefetage die Einhaltung gewisser Zielvorgaben anordnet.","C":"vermehrt externe Berater mit der Umsetzung beauftragt werden."},"answer":"A"},"7":{"prompt":"Im Bereich der nachhaltigen Mobilität","options":{"A":"fördern Betriebe die Bereitschaft zur gemeinsamen Nutzung von Privat-PKWs.","B":"haben Betriebe kaum Einfluss auf die Nutzung öffentlicher Verkehrsmittel.","C":"machen zweckmäßige digitale Lösungen Dienstreisen komplett überflüssig."},"answer":"A"},"8":{"prompt":"Nachhaltige Büroartikel","options":{"A":"gehören schon lange auf die Bestellliste bewusst handelnder Betriebe.","B":"können einen Beitrag zum Erhalt der Mitarbeitergesundheit leisten.","C":"sind bei genauer Durchrechnung für die Betriebe zu kostenintensiv."},"answer":"B"},"9":{"prompt":"In Österreich","options":{"A":"ist für die industrielle Herstellung von Papier viel Energie erforderlich.","B":"lässt die Wiederverwertung von gebrauchtem Papier zu wünschen übrig.","C":"verzeichnet man seit einigen Jahren einen Rückgang des Papierbedarfs."},"answer":"A"},"10":{"prompt":"Soziale Nachhaltigkeit","options":{"A":"ist aufgrund ihrer Komplexität als eigene Disziplin zu betrachten.","B":"setzen sich Betriebe bei hohen Arbeitslosenzahlen zum Ziel.","C":"umfasst auch die Gleichbehandlung von Frauen und Männern."},"answer":"C"}}}}; const IDS=Object.keys(TESTS); const menu=document.getElementById('menu'),quiz=document.getElementById('quiz'); let currentTest='',q=6,score=0,answered={};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function saveWrong(n,correct,qq){let w=JSON.parse(localStorage.getItem('wrongQuestions')||'[]'),id='lesen-teil2-'+currentTest+'-'+n;w=w.filter(x=>x.id!==id);w.push({id,section:'lesen',sectionName:'Lesen',teil:'2',test:currentTest,question:qq.prompt,sourceText:TESTS[currentTest].text,answer:correct,options:Object.values(qq.options),correctCount:0});localStorage.setItem('wrongQuestions',JSON.stringify(w))}
function saveResult(){let r=JSON.parse(localStorage.getItem('testResults')||'{}'),k='lesen-teil2-'+currentTest,p=score*20;if(!r[k]||p>r[k].percent)r[k]={section:'lesen',sectionName:'Lesen',teil:'2',test:currentTest,score,total:5,percent:p};localStorage.setItem('testResults',JSON.stringify(r))}
function sound(ok){try{const C=window.AudioContext||window.webkitAudioContext,c=window.__a||(window.__a=new C());if(c.state==='suspended')c.resume();const now=c.currentTime,tones=ok?[[523,0,.08],[659,.08,.08],[784,.16,.14]]:[[220,0,.10],[185,.10,.15]];tones.forEach(([f,d,u])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(.1,now+d+.012);g.gain.exponentialRampToValueAtTime(.0001,now+d+u);o.connect(g);g.connect(c.destination);o.start(now+d);o.stop(now+d+u+.02)})}catch(e){}}
IDS.forEach(id=>{const d=document.createElement('div');d.className='test';d.innerHTML=`<h3>Test ${id}</h3><p>${esc(TESTS[id].title)} · 5 ta savol</p>`;d.onclick=()=>start(id);menu.appendChild(d)});
function start(id){currentTest=id;q=6;score=0;answered={};menu.classList.add('hidden');quiz.classList.remove('hidden');show()}
function show(){const t=TESTS[currentTest],qq=t.questions[String(q)],state=answered[q];if(!qq)return;const mid='lesen-teil2-'+currentTest+'-'+q,m=JB2.mastery(mid);quiz.innerHTML=`<div class="question"><div class="progress">Test ${currentTest} · Savol ${q-5}/5</div><div class="master">O‘zlashtirish: ${m.correctCount}/15${m.mastered?' ✅':''}</div><div class="source">${esc(t.text)}</div><div class="qtext"><b>${q}.</b> ${esc(qq.prompt)}</div><div id="opts"></div><div class="navrow" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><button class="next" id="prev" ${q===6?'disabled':''}>← Oldingi</button><button class="next" id="exit" type="button">✕ Chiqish</button><button class="next" id="next">${q===10?'Natija':'Keyingi →'}</button></div></div>`;const box=document.getElementById('opts');Object.entries(qq.options).forEach(([L,txt])=>{const b=document.createElement('button');b.className='option';b.textContent=L+') '+txt;if(state){b.disabled=true;if(L===qq.answer)b.classList.add('correct');if(L===state.choice&&state.choice!==qq.answer)b.classList.add('wrong')}else b.onclick=()=>answer(L,b,qq);box.appendChild(b)});document.getElementById('prev').onclick=()=>{if(q>6){q--;show();scrollTo(0,0)}};document.getElementById('exit').onclick=backMenu;document.getElementById('next').onclick=()=>{if(q<10){q++;show();scrollTo(0,0)}else result()}}
function answer(L,b,qq){if(answered[q])return;const ok=L===qq.answer;answered[q]={choice:L,ok};if(ok){score++;b.classList.add('correct');sound(true)}else{b.classList.add('wrong');[...document.querySelectorAll('.option')].forEach(x=>{if(x.textContent.startsWith(qq.answer+')'))x.classList.add('correct')});saveWrong(q,qq.answer,qq);sound(false)}[...document.querySelectorAll('.option')].forEach(x=>x.disabled=true);JB2.recordAnswer('lesen-teil2-'+currentTest+'-'+q,ok)}
function result(){saveResult();quiz.innerHTML=`<div class="result"><h1>🏆 Natija</h1><h2>${score}/5</h2><h1>${score*20}%</h1><p>Lesen Teil 2 · Test ${currentTest}</p><button class="next" onclick="start('${currentTest}')">🔄 Qayta ishlash</button><button class="next" style="margin-top:10px" onclick="backMenu()">← Barcha testlar</button></div>`}
function backMenu(){quiz.classList.add('hidden');menu.classList.remove('hidden');scrollTo(0,0)}
document.getElementById('topBack').onclick=(e)=>{if(!quiz.classList.contains('hidden')){e.preventDefault();backMenu()}};
</script></body></html>
