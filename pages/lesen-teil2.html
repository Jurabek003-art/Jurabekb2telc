<script>
const TESTS={"2.1":{"title":"parking","text":"Es geschah am 1. Januar 1954. In Duisburg, einer Großstadt am Rhein zwischen Köln und der niederländischen Grenze am Rande des Ruhrgebiets, gab es für die Autofahrer, die in der Straße „Am Buchenbaum“ ihre Autos parken wollten, eine Überraschung. 20 etwa 1,5 Meter hohe Metallstangen mit uhrenförmigen Aufsätzen standen am Straßenrand mit der unmissverständlichen Aufschrift: „Einwurf 10 Pfennig für eine Stunde“. Die ersten Parkuhren in Deutschland waren aufgestellt. Nur Basel in der Schweiz und Stockholm in Schweden hatten vor Duisburg Parkuhren installiert.\n\nUm Dauerparker aus den Stadtzentren zu vertreiben. Das eingenommene Geld wurde in Duisburg anfangs für gemeinnützige Zwecke ausgegeben: für Alte, Kranke, Kriegsversehrte, für elternlose Kinder. Und die Stadtverwaltung war sich sicher, dass die Autofahrer Verständnis für die Parkuhren aufbringen würden, dienten sie doch einem guten Zweck.\n\nDoch bei den Autofahrern war man nicht so erfreut über diese neuen Apparate. „Groschengrab“ wurden sie dann auch bald überall genannt: ein Apparat, in den man Groschen – wie die 10-Pfennig-Stücke damals genannt wurden – hineinwarf. Dieser schluckte zwar gnadenlos Zehner, gab aber zum Verdruss vieler trotzdem oft keinen Parkzettel frei. Tat er dies, dann aber in der Regel nur für höchstens 60 Minuten. Viele Autofahrer waren außerdem verärgert, weil sie immer passendes Kleingeld dabei haben mussten. Die ersten Parkuhren konnten nämlich nicht wechseln. Wer parkte, ohne zu zahlen, riskierte damals wie heute einen Strafbescheid, liebevoll „Knöllchen“ genannt.\n\nIn allen anderen deutschen Städten erschienen nach und nach auch Parkuhren. Bald gehörten sie zu den Innenstädten wie das Rad zum Auto. Und das blieb so bis zum Ende der 1980er Jahre. Dann geschah so etwas wie eine Parkuhren-Revolution. Die guten, alten Parkuhren, die ein im Vergleich zu heute immer noch billiges Parken erlaubten, weil sie nicht beliebig oft auf neue Beträge umgestellt werden konnten, wurden mehr und mehr ersetzt durch die gerade neu entwickelten Parkscheinautomaten.\n\nMit Solarenergie angetrieben, computergesteuert und beliebig programmierbar machten sie nun möglich, ohne technische Beschränkungen die Preise und Zeiten für das Parken flexibel zu gestalten. Von Vorteil ist auch ihre Kundenfreundlichkeit: Die Zeiten, in denen nur Münzen als Zahlungsmittel akzeptiert wurden, sind passé; jetzt schlucken sie auch problemlos Papier- und Plastikgeld – und Wechselgeld wird ausgespuckt.\n\nDas Parken wurde immer teurer. Und längst dienten die eingenommenen Beträge nicht mehr gemeinnützigen Zwecken. Sie wurden vielmehr als Einnahmequelle entdeckt für die leeren Stadtkassen, die nach immer mehr Geld verlangten. Gut 2 Millionen Euro verdient zum Beispiel Duisburg in einem Jahr an den Parkgebühren. In Köln kommen etwa 10 Millionen Euro im Jahr zusammen. Noch einmal so viel Geld verdienen die Städte an den „Knöllchen“ für falsches Parken. Aus 10 Pfennig für eine Stunde im Jahr 1954 – das wären heute etwa 5 Cents – sind inzwischen weit höhere Beträge geworden. Spitzenreiter in Deutschland sind Düsseldorf und Berlin mit mehreren Euro pro Stunde. Tendenz steigend. Doch aus dem Kölner Rathaus heißt es an alle sich beschwerenden Autofahrer, das Geld werde selbstverständlich zweckgebunden verwendet: für den Bau neuer Straßen. An denen neue Parkscheinautomaten stehen?","questions":{"6":{"prompt":"Die ersten Parkuhren Europas standen","options":{"A":"in der Schweiz und in Deutschland.","B":"in der Schweiz und in Schweden.","C":"in Deutschland und in Schweden."},"answer":"B"},"7":{"prompt":"Früher wurden in Duisburg die Parkgebühren verwendet, um","options":{"A":"Bedürftige zu unterstützen.","B":"Dauerparker aus den Stadtzentren zu vertreiben.","C":"Löcher im städtischen Haushalt zu stopfen."},"answer":"A"},"8":{"prompt":"Die ersten Parkuhren","options":{"A":"funktionierten problemlos.","B":"gaben nur Groschen zurück.","C":"konnten nur Münzen annehmen."},"answer":"C"},"9":{"prompt":"Die neuen Parkscheinautomaten","options":{"A":"funktionieren nur bargeldlos.","B":"geben kein Wechselgeld zurück.","C":"sind flexibel im Hinblick auf die Art der Bezahlung."},"answer":"C"},"10":{"prompt":"In Berlin und in Düsseldorf","options":{"A":"fließen die Parkgebühren nur in den Straßenbau.","B":"nimmt die Zahl der Parkscheinautomaten zu.","C":"werden die höchsten Parkgebühren verlangt."},"answer":"C"}}},"2.2":{"title":"Traumfrau und Traummann gesucht","text":"Den Partner für das Leben finden – für immer mehr Menschen wird dies offenbar immer schwieriger. Rund 31 Millionen Männer und Frauen in Deutschland, also mehr als ein Drittel der gesamten Bevölkerung, sind alleinstehend. Nicht dass Mann oder Frau wählerischer als in früheren Zeiten geworden wäre, es gibt scheinbar ganz einfach immer weniger Gelegenheiten, das Ziel einer Partnerschaft oder Ehe zu erreichen.\n\nDie Menschen haben einfach immer weniger Zeit, sich um ihre ganz natürlichen Wünsche zu kümmern. Viele arbeiten weit entfernt von ihrem Wohnort, wechseln die Arbeitsstätte in relativ kurzen Abständen, haben für das Privatleben ungünstige Arbeitszeiten mit wenig Freizeit – abgesehen vom alljährlichen Urlaub. Dazu kommt, dass eine beträchtliche Minderheit der Deutschen nicht bereit ist, sich längerfristig oder gar „lebenslänglich“ an einen bestimmten Partner zu binden. Immer mehr Menschen leben lieber mit ihren Lebensabschnittgefährten zusammen oder sie bevorzugen saisonale Kurzbeziehungen nach dem Muster „öfter mal ’ne(n) Neue(n)“.\n\nUnd immer mehr von denen, die eine Partnerschaft anstreben, versuchen ihren Liebsten oder ihre Liebste nicht auf Partys, Kirmesfesten oder in Cafés und Kneipen zu finden, wie das bei ihren Großeltern noch üblich war, sondern sie schauen ins Internet oder in Zeitungen, um über Partnerschafts- oder Heiratsannoncen fündig zu werden. In Deutschland gibt es viele Radioprogramme, in denen täglich Dutzende ihre Heiratsabsichten kundtun. An Wochenenden gibt es sogar Fernsehsendungen, in denen Partnersuchende mit anderen Partnersuchenden quasi verkuppelt werden.\n\nDoch wie muss solch eine Kontaktanzeige aussehen, damit sie auch von Erfolg gekrönt ist? Denn nicht wenige Anzeigen bringen gar keinen oder nicht den erwünschten Erfolg. Dieser Frage hat sich nun der Kommunikationsexperte Jörg Stimpfling an der Universität Stuttgart gewidmet und seit mehr als zehn Jahren Kontaktanzeigen in den verschiedensten Medien gesammelt und analysiert.\n\nDas Ergebnis der umfangreichen Forschung: Viele Anzeigen sind zu oberflächlich formuliert oder bedienen sich althergebrachter Stereotypen. So beschreiben sich Frauen mit Synonymen für Schönheit oder Attraktivität, Männer bieten Sicherheit oder Status an, überholt geglaubte Klischees finden sich in den meisten Fällen. Ebenso fällt die Neigung auf, sich schöner, besser zu präsentieren, als man wirklich ist, so als biete man ein Produkt in der Konsumwerbung an. Man könnte fast meinen, viele suchen sich selbst wie ihr eigenes Zwillingsbild.\n\nJörg Stimpfling und seine Kollegen empfehlen Partner suchenden Singles daher, sich erst einmal selbst kennen zu lernen, bevor sie sich an zukünftige Partnerinnen oder Partner wenden. Nur wer über sich selbst Bescheid weiß, kann den Partner finden, der zu ihm passt. Und das Zwillingsbild im Spiegel ist leider kaum als idealer Partner geeignet.","questions":{"6":{"prompt":"Viele Menschen in Deutschland sind unverheiratet, weil","options":{"A":"die Ansprüche bei der Partnerwahl immer weiter steigen.","B":"die Lebensumstände es erschweren, den Partner oder die Partnerin fürs Leben zu finden.","C":"eine Mehrheit ohnehin lieber in zeitlich begrenzten Beziehungen lebt."},"answer":"B"},"7":{"prompt":"Viele Singles suchen sich heute ihre Partner oder Partnerinnen","options":{"A":"am Arbeitsplatz.","B":"auf Festen.","C":"in den Medien."},"answer":"C"},"8":{"prompt":"Im Radio werden","options":{"A":"an Samstagen und Sonntagen Partner vermittelt.","B":"jeden Tag Heiratswünsche gesendet.","C":"täglich Hochzeitsglückwünsche gesendet."},"answer":"B"},"9":{"prompt":"In Kontaktanzeigen","options":{"A":"beschreiben sich Partnersuchende oft im Rahmen konventioneller Rollenerwartungen.","B":"suchen die meisten Männer moderne, attraktive Frauen.","C":"werden recht häufig die passenden Partner fürs Leben gefunden."},"answer":"A"},"10":{"prompt":"Wer eine Kontaktanzeige aufgibt, sollte","options":{"A":"jemanden suchen mit möglichst ähnlichen Eigenschaften.","B":"sich werbewirksam präsentieren können.","C":"zunächst eine Selbstanalyse vornehmen."},"answer":"C"}}},"2.3":{"title":"Der Fluch der Informationszeitalters oder „Alles schon vergessen?“ oder Der Kampf mit der Informationsflut","text":"Melanie Hoffmann ist Gedächtnistrainerin. Seit fast zehn Jahren bietet sie nun schon Seminare an Volkshochschulen, in Altenheimen, in Banken und Industriebetrieben an, in denen die Seminarteilnehmer lernen sollen, wie sie Informationen besser im Gedächtnis behalten. Suma Hartmann ist 30 Jahre alt, Bürokauffrau und eine von Melanie Hoffmanns Seminarteilnehmerinnen: „An meinem Arbeitsplatz bekomme ich ständig Massen von neuen Informationen: Texte, die zu lesen sind, Termine, Anrufe, Anfragen von Kunden, Kurzinfos von Kollegen: Diese Informationsflut zu bewältigen und möglichst nichts zu vergessen, ist fast ausgeschlossen“, so Hartmann. Wie ihr geht es vielen Menschen in unserer Informationsgesellschaft – und das quer durch alle Altersstufen: vom Schüler bis zum Rentner. Sie fühlen sich den Anforderungen in ihrem Gedächtnis nicht mehr gewachsen, und unter daher besuchen sie Trainingskurse wie die von Melanie Hoffmann.\n\nWährend jeder Sekunde, die Suma Hartmann im Trainingsseminar, am Arbeitsplatz oder zu Hause verbringt, nimmt sie über ihre „Eingangskanäle“ – die Augen, die Ohren, die Nase, den Mund, die Haut – um die zwei Millionen kleinste Informationen unbewusst auf. Jede kleinste Schwankung in der Licht- oder Farbintensität, Formen und Farben, Licht und Schatten, alle nur erdenklichen Geräusche von Stimme der Seminarleiterin oder Kollegen bis zum draußen vorbeifahrenden Motorrad, verschiedenste Gerüche vom Schweiß bis zum teuren Parfüm, das Kratzen des Pullovers auf der Haut: All dies nimmt sie unbewusst wahr. Würde sie sich all diese Informationen bewusst merken wollen, wäre – wenn man die Sprache der Computerwelt zu Hilfe nimmt – innerhalb kürzester Zeit vor Speicher voll.\n\nDamit dies nicht passiert, vergisst man fast alle Informationseinheiten innerhalb der nächsten 20 Sekunden wieder – und schafft damit Platz für neue Informationen. Erst nach etwa 20 Minuten behalten wir etwas auf lange Zeit. Dann haben die Nervenzellen im Gehirn eine neue Verbindung hergestellt, eine Synapse gebildet – und wir behalten etwas, statt es gleich wieder zu vergessen. Die Trainerin Melanie Hoffmann sagt: „Starke Sinneseindrücke, die mit Emotionen behaftet sind, behält man ebenso wie das, was interessant ist oder lebensnotwendig. Ein Kind, das einmal eine heiße Herdplatte angefasst hat, vergisst nie mehr, was ‚heiß‘ bedeutet. Ein Hobbyastronom, dem seine Freizeitbeschäftigung großen Spaß bereitet, kennt im Nu alle möglichen Namen von Sternen. Und ich habe noch keine Seminarteilnehmerin gehabt, der sich nicht mehr daran erinnern könnte, was am 11. September 2001 in New York passiert ist.“\n\nIn unserer heutigen Informationsgesellschaft ist es wichtig, die auf uns einströmende Informationsflut zu bündeln. Daten und Begriffe zu gruppieren oder an Bildern oder Gegenständen festzumachen und sich so „Eselsbrücken“ zu bauen, die dabei helfen, mehr im Gedächtnis zu behalten. Suma Hartmann „sortiert“ jetzt im Geiste alle wichtigen Informationen in bestimmte Schubladen ihres Aktenschranks in ihrem Büro: „Ich habe mir Zahlensymbole ausgedacht, mit denen ich die neuen Informationen bildlich verknüpfe: Die Eins wird zur Kerze, die Zwei zum Schwan usw. Wenn ich nun nicht vergessen möchte, um zwei Uhr eine bestimmte Konferenz vorzubereiten, denke ich meine Konferenzmappe im Schnabel des Schwans. Und es funktioniert: Ich vergesse viel weniger.“","questions":{"6":{"prompt":"Melanie Hoffmanns Seminare besuchen","options":{"A":"ausschließlich Frauen, die im Büro arbeiten","B":"junge und alte Menschen gleichermaßen","C":"überwiegend alte Menschen"},"answer":"B"},"7":{"prompt":"Die Teilnehmer besuchen Frau Hoffmanns Seminar, weil sie","options":{"A":"das Gefühl haben, dass ihr Gedächtnis schlechter wird","B":"immer mehr vergessen","C":"sich von den vielen Informationen überfordert fühlen"},"answer":"C"},"8":{"prompt":"Jeder Mensch","options":{"A":"kann sich alle erdenklichen Geräusche und Gerüche merken","B":"kann über einen Zeitraum von 20 Minuten alles behalten","C":"vergisst die meisten Informationen innerhalb kürzester Zeit"},"answer":"C"},"9":{"prompt":"Besonders gut kann man sich","options":{"A":"als Kind etwas merken","B":"an Daten und Begriffe erinnern","C":"emotional aufgeladene Situationen merken"},"answer":"C"},"10":{"prompt":"Suma Hartmann","options":{"A":"lehrt andere, wie man sich „Eselsbrücken“ ausdenkt.","B":"verbindet Informationen mit Bildern.","C":"verwendet für ihre Aktenablage nur Tiersymbole"},"answer":"B"}}},"2.3a":{"title":"Der Fluch der Informationszeitalters","text":"oder Alles schon vergessen_?oder Der Kampf mit der Informationsflut\n\nSusana Winkler ist Gedächtnistrainerin. Seit fast zehn Jahren bietet sie nun schon Seminare an Volkshochschulen, in Altenheimen, in Banken und Industriebetrieben an, in denen die Seminarteilnehmer lernen sollen, wie sie Informationen besser im Gedächtnis behalten. Jenny Helfer ist 30 Jahre alt, Bürokauffrau und eine von Susana Winkler Seminarteilnehmerinnen. „An meinem Arbeitsplatz bekomme ich ständig Massen von neuen Informationen: Texte, die zu lesen sind, Termine, Anrufe, Anfragen von Kunden, Kurzinfos von Kollegen: Diese Informationsflut zu bewältigen und möglichst nichts zu vergessen, ist fast ausgeschlossen“, so Hart  ist Gedächtnistrainerin. Seit fast zehn Jahren bietet sie nun schon Seminare an Volkshochschulen, in Altenheimen, in Banken und Industriebetrieben an, in denen die Seminarteilnehmer lernen sollen, wie sie Informationen besser im Gedächtnis behalten. Jenny Helfer ist 30 Jahre alt, Bürokauffrau und eine von Susana Winkler Seminarteilnehmerinnen. „An meinem Arbeitsplatz bekomme ich ständig Massen von neuen Informationen: Texte, die zu lesen sind, Termine, Anrufe, Anfragen von Kunden, Kurzinfos von Kollegen: Diese Informationsflut zu bewältigen und möglichst nichts zu vergessen, ist fast ausgeschlossen“, so Hartmann. Wie ihr geht es vielen Menschen in unserer Informationsgesellschaft – und das quer durch alle Altersstufen: vom Schüler bis zum Rentner. Sie fühlen sich den Anforderungen an ihr Gedächtnis nicht mehr gewachsen, und unter daher besuchen sie Trainingskurse wie die von Susana Winkler.\n\nWährend jeder Sekunde, die Jenny Helfer im Trainingsseminar, am Arbeitsplatz oder zu Hause verbringt, nimmt sie über ihre „Eingangskanäle“ – die Augen, die Ohren, die Nase, den Mund, die Haut – um die zwei Millionen kleinste Informationen unbewusst auf. Jede kleinste Schwankung in der Licht- oder Farbintensität, Formen und Farben, Licht und Schatten, alle nur erdenklichen Geräusche von der Stimme der Seminarleiterin oder Kollegen bis zum draußen vorbeifahrenden Motorrad, verschiedenste Gerüche vom Schweiß bis zum teuren Parfüm, das Kratzen des Pullovers auf der Haut: All dies nimmt sie unbewusst wahr. Würde sie sich all diese Informationen bewusst merken wollen, wäre – wenn man die Sprache der Computerwelt zu Hilfe nimmt – innerhalb kürzester Zeit vor Speicher voll.\n\nDamit dies nicht passiert, vergisst man fast alle Informationseinheiten innerhalb der nächsten 20 Sekunden wieder – und schafft damit Platz für neue Informationen. Erst nach etwa 20 Minuten behalten wir etwas auf lange Zeit. Dann haben die Nervenzellen im Gehirn eine neue Verbindung hergestellt, eine Synapse gebildet – und wir behalten etwas, statt es gleich wieder zu vergessen. Die Trainerin Susana Winkler sagt: „Starke Sinneseindrücke, die mit Emotionen behaftet sind, behält man ebenso wie das, was interessant ist oder lebensnotwendig. Ein Kind, das einmal eine heiße Herdplatte angefasst hat, vergisst nie mehr, was ‚heiß‘ bedeutet. Ein Hobbyastronom, dem seine Freizeitbeschäftigung großen Spaß bereitet, kennt im Nu alle möglichen Namen von Sternen. Und ich habe noch keinen Seminarteilnehmer gehabt, der sich nicht mehr daran erinnern könnte, was am 11. September 2001 in New York passiert ist.“\n\nIn unserer heutigen Informationsgesellschaft ist es wichtig, die auf uns einströmende Informationsflut zu bündeln. Daten und Begriffe zu gruppieren oder an Bildern oder Gegenständen festzumachen und sich so „Eselsbrücken“ zu bauen, die dabei helfen, mehr im Gedächtnis zu behalten. Jenny Helfer „sortiert“ jetzt im Geiste alle wichtigen Informationen in bestimmte Schubladen ihres Aktenschrankes in ihrem Büro: „Ich habe mir Zahlensymbole ausgedacht, mit denen ich die neuen Informationen bildlich verknüpfe: Die Eins wird zur Kerze, die Zwei zum Schwan usw. Wenn ich nun nicht vergessen möchte, um zwei Uhr eine bestimmte Konferenz vorzubereiten, denke ich mir meine Konferenzmappe im Schnabel des Schwans. Und es funktioniert: Ich vergesse viel weniger.“","questions":{"6":{"prompt":"Die Zielgruppen von Frau Winklers Seminaren besteht","options":{"A":"hauptsächlich aus berufstätigen Frauen.","B":"sowohl aus jungen als auf alten Menschen.","C":"überwiegend aus Senioren."},"answer":"B"},"7":{"prompt":"Die Teilnehmer besuchen Frau Winklers Seminar, will sie","options":{"A":"das Gefühl haben, dass ihr Gedächtnis nachlässt.","B":"sich alles bewusst merken wollen.","C":"sich von den vielen Informationen überfordert fühlen."},"answer":"C"},"8":{"prompt":"Jeder Mensch","options":{"A":"kann sich alle erdenklichen Geräusche und Gerüche merken.","B":"kann über einen Zeitraum von 20 Minuten alles behalten.","C":"vergisst die meisten Informationen innerhalb kürzester Zeit."},"answer":"C"},"9":{"prompt":"Besonders gut kann man sich","options":{"A":"als Kind etwas merken.","B":"an Daten und Begriffe erinnern.","C":"intensive Gefühle merken."},"answer":"C"},"10":{"prompt":"Jenny Helfer","options":{"A":"lehrt andere, wie man sich „Eselsbrücken“ ausdenkt.","B":"verbindet Informationen mit Bildern.","C":"verwendet für ihre Aktenablage nur Tiersymbole."},"answer":"B"}}},"2.4":{"title":"Verpackungen im Supermarkt: Geht’s auch ohne?","text":"Auf dem Weg zum Supermarkt klappern bei manchen Kunden im Ruhrpott und in Baden-Württemberg seit kurzem die Plastikdosen in den Einkaufstaschen. Noch sind sie leer, denn die Kunden können sich nun an der Frischetheke Wurst und Käse in die mitgebrachte Dose packen lassen. Dieser Trend, der inzwischen auch von konventionellen Supermärkten aufgegriffen wird, wurde von den sogenannten „Unverpackt-Läden“ angestoßen, in denen man Lebensmittel in eigene Behälter füllen kann. Mittlerweile gibt es mehr als 50 dieser vollständig verpackungsfreien Geschäfte, in Deutschland meist in den Großstädten. Doch noch ist der Einkauf in diesen Läden oft teurer, da die Händler nicht zu den gleichen günstigen Konditionen einkaufen können wie die Großmärkte. Der Vorteil: Die Waren sind meist bio und tragen unverpackt zur Reduzierung des Plastikmülls bei. Außerdem nimmt man nur gewöhnlich nur so viel mit, wie man tatsächlich braucht, und verschwendet weniger Lebensmittel. Dieses Konzept interessiert zwar immer mehr Leute, die gerne ihren täglichen Müll verringern würden. Für viele sind Aufwand und Kosten aber bisher noch zu hoch.\n\nAlso beginnt der Verzicht auf Plastik im Kleinen. Von einer Dokumentation über einen Unverpackt-Laden in Berlin hat sich auch Kaufmann Dieter Hieber inspirieren lassen. Er ist Inhaber von zwölf Supermärkten in Baden-Württemberg. Im vorigen Jahr hat er sich vorgenommen, in seinen Supermärkten Alternativen zu Plastikverpackungen anzubieten. In der Obst- und Gemüseecke sollen die Kunden ihre Einkäufe künftig in recycelten Netzen verstauen können und das Brot darf man in den eigenen Jutebeutel packen. Ware von der Frischetheke kann der Kunde in seine eigene mitgebrachte Dose einpacken lassen. „Ich habe noch nicht für alles eine Patentlösung“, sagt Hieber, „Aber ich möchte unbedingt in verschiedenen Bereichen plastikfreie Mehrweg-Verpackungen anbieten.“\n\nDer Weg ist jedoch weit, wenn Lebensmittel wieder in ihrer ursprünglichen Form angeboten werden sollen. Als Hieber die Ideen seinen Mitarbeitern vorstellte, waren diese zunächst schwer davon zu überzeugen: Das erlauben die Hygienebestimmungen nicht, wandten sie ein. Tatsächlich gibt es bundesweit aber gar keine einheitliche Empfehlung dazu, ob und in welcher Form die Dosen der Kunden angenommen werden dürfen. Ideen müssen individuell mit der örtlich zuständigen Lebensmittelüberwachung besprochen werden. „Die Lebensmittelunternehmen sind selbst verantwortlich für die Hygiene in ihren Märkten“, sagt eine Mitarbeiterin der Lebensmittelüberwachung im Kreis Wesel. Wie gut das Verfahren in der Praxis funktioniert, muss die Erfahrung zeigen. Ob Mitarbeiter zum Beispiel auch unsaubere Boxen annehmen, wie viele Kunden das Angebot überhaupt wahrnehmen und ob es nicht doch zu umständlich ist.\n\nFür Hieber ist der Verzicht auf Plastikmüll eher eine Frage der Überzeugung als des Gewinns. Obwohl die Reaktionen auf seine Vorhaben fast ausschließlich positiv waren, wird das Angebot noch kaum genutzt. Es ist nicht nur ein Kampf gegen Plastik, sondern auch ein Kampf gegen die Bequemlichkeit der Kunden. „Viele lassen sich erst im Geschäft inspirieren, was sie kaufen wollen und haben dann keine eigene Box dabei“. Von mehreren Tausend Kunden reichen am Tag nur fünf bis zehn ihre Plastikbox über die Theke. Auch Rabattaktionen oder Belohnungssysteme wie Stempelkarten mit Vorteilen haben nur sehr kurzfristig etwas gebracht. Deshalb sagt Hieber: „Man muss es den Leuten so einfach wie möglich machen“. Er überlegt, künftig zusätzlich Mehrwegbehälter im Pfandsystem anzubieten. Bei einem spontanen Einkauf können die Kunden eine Dose leihen und beim nächsten Mal wieder zurückgeben. Der Markt reinigt und spült die Dosen dann – dafür müsste Hieber jedoch nicht nur in Dosen, sondern auch in eine Spülstraße investieren.\n\nDer Einkauf ohne Verpackung wird also doch nicht flächendeckend möglich sein, da er auch längerfristig nicht leicht umzusetzen ist. Der Kompromiss heißt zumeist: Verpackungen reduzieren. Für die reinen Unverpackt-Läden sind die großen Supermarkt-Ketten noch keine Konkurrenz. Allerdings verlieren auch die Supermärkte noch keine Kunden durch das Unverpackt-Konzept. Und es bleibt festzustellen: Ob unverpackt einkaufen wird, hängt vor allem von der Kundschaft ab. Und da ist auch jeder einzelne gefragt. Bereits jetzt könnten viele Verpackungen vermieden werden. Der Kunde muss das aber auch wollen.","questions":{"6":{"prompt":"Unverpackte Waren werden","options":{"A":"in Großmärkten zu günstigen Bedingungen verkauft.","B":"nur in speziellen Läden verkauft.","C":"von den Kunden meist vollständig verbraucht."},"answer":"C"},"7":{"prompt":"Supermarktinhaber Dieter Hieber","options":{"A":"konnte seine Angestellten sofort mit seinen Ideen begeistern.","B":"möchte mehr umweltfreundliche Verpackungen verwenden.","C":"will in seinen Supermärkten auf Einwegverpackungen ganz verzichten."},"answer":"B"},"8":{"prompt":"Die Verwendung von Frischhaltedosen in Supermärkten","options":{"A":"ist eigentlich aus hygienischen Gründen verboten.","B":"könnte eine praktikable Möglichkeit sein, Müll zu vermeiden.","C":"wird genau durch gesetzliche Vorgaben geregelt."},"answer":"B"},"9":{"prompt":"Hiebers Angebot, Mehrwegbehälter zu nutzen,","options":{"A":"ist nun dank eines Bonussystems erfolgreicher.","B":"nehmen Kunden auch bei spontanen Einkäufen an.","C":"rief allgemeine Zustimmung hervor."},"answer":"C"},"10":{"prompt":"Das verpackungsfreie Einkaufen wird","options":{"A":"bald in allen Supermärkten Realität sein.","B":"künftig von allen Verbrauchern genutzt werden.","C":"sich nur langsam durchsetzen."},"answer":"C"}}},"2.5":{"title":"Die Deutschen und ihre Ernährung","text":"Bei den Deutschen wächst das Bewusstsein für ihre gesunde Ernährung. Das geht aus einer kürzlich veröffentlichten Studie hervor, bei der 1000 Erwachsene in Deutschland zu ihrem Essverhalten befragt wurden. In dieser Untersuchung antworteten 45% der Befragten auf die Frage, worauf es ihnen bei ihrer Ernährung ankommt, dass sie vor allem gesund essen möchten. Damit steht laut der Studie erstmal das Kriterium gesund vor lecker, in der vorhergehenden Umfrage war das Kriterium lecker dem Befragten noch am wichtigsten. Dennoch bleibt der Geschmack ein wichtiges Kriterium: für immerhin 41% aller Befragten kommt es beim Essen auf den Genuss an. Im Vergleich zur Voruntersuchung sind die beiden Kriterien „Hauptsache schnell“ und die Hauptsache günstig“ weniger wichtig geworden: Die Deutschen nehmen sich demnach etwas mehr Zeit für ihre Ernährung und sind auch eher bereit, mehr Geld für gute Lebensmittel auszugeben. Allerdings hat auch das Kriterium Kalorienarm an Bedeutung verloren. Nur mehr 5% gegenüber 9% in der Voruntersuchung denken bei der Wahl von Lebensmitteln an die schlanke Linie. Dazu passt, dass knapp die Hälfte der Befragten selbst angibt, Übergewicht zu haben, bezeichnen sich sogar als stark Übergewicht. Gesundheitspsychologen führen das darauf zurück, dass häufig die Zahl für den Einkauf und die Zubereitung von frischen Lebensmitteln fehlt die Menschen griffen dann aus Bequemlichkeit zu Fertiggerichten oder Snacks die häufig zu viel Fett, Salz oder Zucker enthalten. Dabei ließen sich durch die Ernährung viele Risikofaktoren reduzieren, betonten die Experten.\n\nAn mangelndem Wissen scheint das nicht zu liegen nur ein Viertel der Befragten gab an nicht genug über gesunde Ernährung zu wissen. Dennoch forderte einige Fachleute bessere Verbraucherinformationen. Sie warfen der Bundesregierung vor, es fehle offensichtlich an dem politischen Willen, sich mit der Branche anzulegen. Gesunde Wahl werden unnötig schwer gemacht. Ein Großteil der Erfrischungsgetränke sei überzuckert die Kennzeichnung von Fett Zucker und Salz sei eine Zumutung und selbst Süßigkeiten würden, wie gesunde Produkte beworben „Das ist kein Bildungsproblem sondern ein Problem des Angebotes das die Lebensmittelwirtschaft uns vorgesetzt wird. Deshalb sehen diese Fachleute die Industrie und Politik in der Pflicht“ wenn ich Licht und Lupe brauche um diese Liste lesen zu können läuft etwas falsch bringt einer von ihnen die Kritik auf den Punkt. Ihr Argument lautet das Problem ist nicht ob vegetarische Produkte Wurst oder Frikadelle heißen dürfen sondern ob der Verbraucher weiß, was an Zutaten Stoffen in seiner vermeintlich gesunden Alternative steckt.\n\nDie Studienergebnisse zeigen, dass es im Umgang mit Lebensmitteln erhebliche unterschiedliche zwischen den Altersgruppen gibt. So herrscht bei jüngeren eine vergleichsweise starke Wegwerfmentalität. Bei 14% der 18 bis 25 Jährigen landet häufig oder sogar sehr häufig Essen im Müll. Nur jeden zweiten aus dieser Altersgruppe passiert das selten oder nie. Bei den älteren ab Mitte 60 entsorgen dagegen 86% selten oder nie Lebensmittel in den Müll. Insgesamt wirft mehr als jeder dritte Deutsche regelmäßig Lebensmittel weg, auch der Fleischkonsum unterscheidet sich je nach Altersgruppe: Unter den 18 bis 39 jährigen ist der Anteil Jener die auf Fleisch verzichten höher als in der Gesamtbevölkerung. 3% und 1% bezeichnen sich als Vegetarier und 2% als Veganer. In Deutschland bezeichnen sich 13% der Menschen Angst flexitarier. Flexitarier kaufen meist selbst weder Fleisch noch Wurst, lehnen es aber auch nicht vollständig auf wenn es ihnen angeboten wird. Bioprodukte spielen mittlerweile eine große Rolle. Von den Befragten gaben 40% an bevorzugt Lebensmittel mit Bio-Siegel zu kaufen vor einigen Jahren gab nur ein Drittel der Befragten an, im Geschäft zu biologisch hergestellten Lebensmitteln zu greifen.","questions":{"6":{"prompt":"Die meisten Befragten finden, dass das Essen","options":{"A":"früher besser war.","B":"gesund sein sollte.","C":"vor allem gut schmecken muss."},"answer":"B"},"7":{"prompt":"Das Kriterium kalorienarm","options":{"A":"ist für die Hälfte der Befragten wichtig.","B":"steht bei Übergewichtigen an erster Stelle.","C":"war früher wichtiger."},"answer":"C"},"8":{"prompt":"Experten glauben, dass Menschen ungesund essen, weil","options":{"A":"ihnen Fett und Zucker gut schmecken.","B":"sie sich nicht genug informieren.","C":"zu viele ungesunde Lebensmittel auf dem Markt sind."},"answer":"C"},"9":{"prompt":"Das Wegwerfen von Lebensmitteln","options":{"A":"findet ein Drittel der Befragten in Ordnung.","B":"lehnen jüngere Menschen vollkommen ab.","C":"passiert bei älteren Menschen fast nie."},"answer":"C"},"10":{"prompt":"Der Fleischkonsum","options":{"A":"ist nicht in allen Altersgruppen gleich.","B":"kommt für dreizehn Prozent der Jugendlichen nicht in Frage.","C":"nimmt mit dem Alter zu."},"answer":"A"}}},"2.6":{"title":"2.6","text":"Wie unsere Kaufentscheidungen beeinflusst werdenoder Interessante Fakten über das Verhalten von Konsumenten\n\nHaben Sie schon einmal darüber nachgedacht, warum Sie manche Dinge kaufen und andere nicht? Warum Sie etwas einkaufen, das Sie gar nicht brauchen, obwohl Sie eigentlich aus einem ganz anderen Grund ins Geschäft gegangen sind? Die Ursache dafür liegt in unserem Körper. Er steuert unsere Entscheidungen viel stärker als bisher gedacht. Neue Forschungen setzen sich mit diesem Zusammenhang zwischen Körper, Kaufverhalten und Umweltbedingungen auseinander.\n\nNachdem Forscher Studenten über Filme und ihr Fernsehverhalten befragt hatten, fanden Sie Beweise dafür, dass gefühlte Kälte (zum Beispiel im Winter) ein Bedürfnis nach psychologischer Wärme hervorruft. Vorangegangene Studien hatten sich mit der Psychologie der Liebe beschäftigt. Dabei konnte gezeigt werden, dass verliebte Menschen sehr häufig das Gefühl feuchter Hände, gesteigertes Herzklopfen und beschleunigte Atmung wahrnehmen. Das alles sind Anzeichen, die auch mit körperlicher Wärme zusammenhängen. Wenn uns kalt ist, beeinflusst daher unser Bedürfnis nach Wärme zum Beispiel den Kauf von romantischen Filmen auf DVD.\n\nUm diesen Zusammenhang zu belegen, manipulierten Forscher in einer Reihe von Experimenten entweder die Temperatur von Tee oder die Raumtemperatur. Kalter Tee oder eine niedrige Raumtemperatur sorgt dafür, dass die Teilnehmer Romantikfilme reizvoller fanden. Dieser Effekt trat unabhängig von Geschlecht und Alter bei allen Menschen auf.\n\nWenn Hersteller also romantische DVDs herausgeben oder Reiseveranstalter „kuschelige Angebote für Zwei“ verkaufen wollen, sollten sie damit bis zum Herbst oder Winter warten. Das Bedürfnis der Käufer nach diesen Waren ist dann ungleich größer. Aber wenn die Verkaufsräume eines Kaufhauses kühl klimatisiert sind, werden „wärmende“ Angebote wie zum Beispiel Tee auch im Sommer mehr gekauft.\n\nAndere Forschungen befassen sich mit dem Zusammenhang von Menge und Preis. Beim Erstellen von attraktiven Angeboten und Werbeveranstaltungen machen sich regelmäßig Menschen aus unterschiedlichen Bereichen, wie Marketing und Vertrieb, Gedanken über den richtigen Preis und die passenden Werbe-Botschaften. Bisher wenig beachtet wurde die Reihenfolge der Angabe von Preis und Menge. Neue Studien zeigen, dass Konsumenten auf Angebote extrem unterschiedlich reagieren, je nachdem, ob ihnen bei Sonderangeboten zuerst der Preis oder zuerst die Menge genannt wird.\n\nEine neue Studie untersuchte nun die Reaktionen der Konsumenten auf genau diese Reihenfolge. Die Information über eine große Menge vor die Preisinformation zu setzen scheint deutliche reizvoller auf Konsumenten zu wirken als den Preis vor der Menge zu nennen. Außerdem wurde untersucht, was passiert, wenn die Packungen groß oder klein sind und wenn die Preise pro Stück leicht auszurechnen sind. Wenn die Packung groß und der Stückpreis schwierig auszurechnen ist, zeigen sich die Konsumenten eher bereit, die Packung zu kaufen, wenn zuerst die Menge genannt wird. Außerdem sind sie dann der Meinung, dass es sich um ein gutes Angebot handelt.\n\nWenn allerdings der Preis zuerst dargestellt wird oder ein Vielfaches der Stückzahl ausmacht und somit leicht auszurechnen ist (z. B. 5 DVDs für 50 €), tritt das genaue Gegenteil ein. Dies liegt unter anderem daran, dass das menschliche Gehirn Schwierigkeiten hat, große Zahlen zu verarbeiten. Unter Zeitdruck erscheinen uns dann sogar vermeintlich einfache Berechnungen als schwierig. Dann nutzen wir hauptsächlich die erste Information, die wir wahrnehmen, um so den Kauf und seine Vorteile oder Nachteile für uns zu bewerten.\n\nAls Kunde begegnen wir also großen Packungen, bei denen zuerst die Menge mitgeteilt wird, und glauben, dass dies ein günstiges Angebot ist. Mit dem neuen Wissen über die Forschungsergebnisse sollten wir aber zumindest ab und zu beim Kauf von größeren Packungen innehalten und noch einmal überlegen, ob es sich wirklich um ein gutes Angebot handelt. Aus der Perspektive der Geschäfte muss die Schlussfolgerung allerdings wie folgt lauten: Große Angebote zusammenstellen und erst mit der Menge und dann mit dem Preis werben. Dass diese Strategie funktioniert, lässt sich Tag für Tag im Supermarkt beobachten.","questions":{"6":{"prompt":"Es liegen Untersuchungen darüber vor,","options":{"A":"wie stark die Entscheidungen den Körper steuern.","B":"welche Einflüsse bestimmte Faktoren auf das Kaufverhalten haben.","C":"warum Menschen so viel über das eigene Einkaufsverhalten nachdenken."},"answer":"B"},"7":{"prompt":"Es gibt Hinweise darauf, dass","options":{"A":"man sich im Winter häufiger verliebt als im Sommer.","B":"Forscher bei ihren Experimenten die Konsumenten manipulierten.","C":"das Empfinden von Kälte zum Kauf romantischer Filme animiert."},"answer":"C"},"8":{"prompt":"Forscher haben untersucht,","options":{"A":"wie extrem günstige Angebote Konsumenten beeinflussen.","B":"welche Kunden bei Sonderangeboten größere Mengen kaufen.","C":"ob die Reihenfolge von Produktinformationen das Kaufverhalten beeinflusst."},"answer":"C"},"9":{"prompt":"Unser Gehirn","options":{"A":"verarbeitet beim Einkaufen hauptsächlich Preisangaben.","B":"nutzt unter Zeitdruck vor allem die erste Information einer Botschaft.","C":"kann unter Zeitdruck mathematische Aufgaben schneller lösen."},"answer":"B"},"10":{"prompt":"Großpackungen können besser verkauft werden, wenn die","options":{"A":"enthaltene Stückzahl möglichst hoch ist.","B":"Produkte täglich beworben werden.","C":"Mengenangabe vor dem Preis genannt wird."},"answer":"C"}}},"2.7":{"title":"2.7","text":"Ein Leben für den Kaffee\n\nBremer Kaffeerösterei Münchhausen eine der letzten traditionellen Röstereien\n\nVor 50 Jahren gab es in der Hansestadt Bremen ungefähr 300 traditionelle Kaffeeröstereien. Diese importierten die Kaffeebohnen selbst, stellten den Kaffee tagesfrisch her und verkauften ihn im eigenen Geschäft. Heute, da der Kaffee zumeist von internationalen Kaffeegesellschaften produziert und in Supermärkten verkauft wird, sind in Deutschland nur noch eine Handvoll Kleinröstereien übrig geblieben. Eine davon ist die Kaffeerösterei Münchhausen.\n\nMünchhausen importiert seinen Kaffee direkt von Kleinbauern in Lateinamerika. Dabei wird streng auf fairen Handel geachtet, das heißt, die Kaffeebauern werden für ihre anstrengende Arbeit angemessen entlohnt. Damit unterstützt der Importeur zugleich den Kaffeeanbau nach ökologischen Gesichtspunkten. Kaffee aus Großplantagen, oft mit Pestiziden und Insektiziden belastet, ist zwar billiger, aber Qualität und Reinheit des Kaffees werden bei der Kaffeerösterei Münchhausen ganz großgeschrieben.\n\nDer Kaffee wird nach alter Familientradition hergestellt. Die Rezeptur ist die gleiche wie vor einem halben Jahrhundert: Täglich werden die Kaffeebohnen in kleinen Mengen frisch geröstet, gerade so viele, wie an einem Tag verkauft werden. Denn nur so behalten sie ihr Aroma und der Kaffee verliert nicht an Geschmack.\n\nZuerst werden die Kaffeebohnen in der in den 50er Jahren angeschafften Rösttrommel ungefähr zehn Minuten lang bei Temperaturen von über 200 Grad Celsius geröstet. Dabei verlieren die Kaffeebohnen zwar ein Sechstel ihres Gewichts, ihr Volumen vergrößert sich aber gleichzeitig um etwa ein Drittel.\n\nSind die Bohnen dunkel genug – sie dürfen genauso wenig zu dunkel sein –, werden sie auf den Verlesetisch geschüttet, wo von Hand die guten von den schlechten Kaffeebohnen getrennt werden. Danach erst werden aus den gerösteten Kaffeebohnen verschiedene Mischungen hergestellt, die dann im Kontor, dem Geschäftsraum der Rösterei, fast ausschließlich an langjährige Stammkunden verkauft werden.\n\nAber auch über das Internet vertreibt die Kaffeerösterei Münchhausen ihr Kaffeeangebot deutschlandweit. Bis zu seinem Tod kurz vor seinem dreiundneunzigsten Geburtstag führte August Münchhausen seinen Familienbetrieb, dann übernahm seine Tochter die Firma, inzwischen ist auch die Enkelin beteiligt.\n\nDie Frauen planen, aus der Kaffeerösterei ein Museum zu machen, um der Nachwelt die traditionelle Kunst des Kaffeeröstens zeigen zu können. Dann hätte diese Institution eine reelle Chance, in Zukunft fortzubestehen und zukünftigen Generationen den Charme und die Technik der traditionellen Kaffeeherstellung zu erhalten. Selbstverständlich wird es auch in Zukunft möglich sein, im Museums-Bistro den Kaffee zu genießen oder für den häuslichen Bedarf zu erwerben.","questions":{"6":{"prompt":"In Deutschland","options":{"A":"existiert eine Vielzahl von Kaffeeröstereien.","B":"gibt es nur noch wenige traditionelle Kaffeeröstereien.","C":"handeln nur noch internationale Gesellschaften mit Kaffee."},"answer":"B"},"7":{"prompt":"Für die Kaffeerösterei Münchhausen","options":{"A":"ist es nicht von Bedeutung, ob der Kaffee von Kleinbauern oder Großplantagen kommt.","B":"spielt der günstige Einkaufspreis eine wichtige Rolle.","C":"steht eher die Qualität des Kaffees als der Preis im Vordergrund."},"answer":"C"},"8":{"prompt":"Kaffeebohnen","options":{"A":"dürfen nach dem Rösten zwar zu dunkel sein, aber nicht zu hell.","B":"können nach der Röstung ohne Geschmacksverlust lange Zeit gelagert werden.","C":"müssen nach dem Rösten handverlesen werden, um eine gleichbleibend hohe Qualität zu gewährleisten."},"answer":"C"},"9":{"prompt":"Die gerösteten Kaffeebohnen werden","options":{"A":"im Kontor nur an Stammkunden abgegeben.","B":"in Handarbeit gemischt.","C":"zusätzlich online vermarktet."},"answer":"C"},"10":{"prompt":"In Zukunft wollen die Besitzer","options":{"A":"die Kaffeerösterei in ein Museum umwandeln.","B":"ein Museum über den Kaffeeanbau eröffnen.","C":"keinen Röstkaffee mehr verkaufen."},"answer":"A"}}},"2.8":{"title":"2.8","text":"Müdigkeit und juckende Augen – Arbeit in Großraumbüros\n\nDie deutsche Sehnsucht nach dem Einzelbüro. Dieser Artikel entsteht unter katastrophalen Bedingungen. Links vom Autor, keinen halben Meter entfernt, diskutieren die Onlineredakteure gerade über portugiesische Bankgeschäfte. Von rechts eilt aus der befreundete Kollege heran: „Sag mal, hast du eine Ahnung, ob das Bayern-Spiel heute Abend live im Fernsehen übertragen wird?“ Und da, die Chefin, ganz aufgeregt winkt sie herüber: „Wann wir denn die Geschichte endlich fertig? Die hätte vor einer halben Stunde ins Korrektorat gemusst. Beeil dich bitte!“\n\nWas wir Arbeitenden im Großraumbüro immer schon ahnten, haben Schweizer Forscher nun erstmals auf breiter wissenschaftlicher Basis nachgewiesen: Großraum ist schlecht. Zumindest für diejenigen, die im Großraum arbeiten müssen. Mag sein, dass die Chefs in ihren Einzelbüros da anderer Meinung sind.\n\nGut 1200 Beschäftigte aus unterschiedlichsten Berufen hat die Hochschule in Luzern befragt. Die Ergebnisse der Erhebung sind eindeutig. Beispiel Lärm: In Büros mit mehr als 16 Mitarbeitern fühlen sich 80% der Befragten regelmäßig durch Gespräche oder Telefonate gestört, in Zweierbüros sind es nicht mal 20%.\n\nAuch was die alltäglichen Büroprobleme betrifft, ist der Großraum von Nachteil. Einerlei, wonach die Forscher nun fragten, ob nach Müdigkeit, Schwergefühl im Kopf, juckenden Augen oder verstopfte Nase – immer litten Mitarbeiter in Großraumbüro am stärksten. Wundert da, dass vier von zehn Großraumbeschäftigten mit ihrer „Bürosituation im Allgemeinen“ sehr oder gar außerordentlich unzufrieden sind?\n\nZum Vergleich: Acht von zehn Arbeitnehmern mit Einzelbüro geben an, sie seien ziemlich, sehr oder – fast 50% – außerordentlich zufrieden. „Einzelbüros für alle“ müsste die Lösung lauten, doch der Trend geht in die andere Richtung: Offene Raumstrukturen nehmen zu.\n\nKritiker der Entwicklung sehen dahinter vor allem einen Grund: Arbeitgeber wollen die Mieten und Heizkosten niedrig halten. Aber zumindest ein Argument dürfte auch die Arbeitgeber interessieren: Der Schweizer Studie zufolge ist die Zahl der Krankheitstage bei Beschäftigten in Großraumbüros deutlich höher als bei anderen.\n\nDie deutsche Sehnsucht nach dem Einzelbüro\n\nMein Schreibtisch. Mein Computer. Mein Büro. Das Einzelzimmer war fester Bestandteil der deutschen Bürokultur. Aber auch heute haben es noch viele und wer keines hat, träumt zumindest davon. Diese Sehnsucht ist typisch deutsch.\n\n„Verglichen mit den Beschäftigten in anderen Ländern, sitzen wir sehr bequem. Auch wenn alle Mitarbeiter die gleiche Möblierung haben, sitzen wir alle doch an unseren eigenen Schreibtischen, benutzen unsere eigenen Aktenschränke und möchten am liebsten die Tür zumachen können“, sagt Robert Menke von der Immobilienberatung Kuschmann & Wakefield.\n\nDie hat eine Studie veröffentlicht, wonach deutsche Angestellte im internationalen Vergleich den meisten Platz haben: durchschnittlich 30 Quadratmeter Mietfläche pro Kopf. Damit ist natürlich nicht nur das Schreibtisch-Areal gemeint, auch der Flur oder Küchenzeilen sind – falls vorhanden – eingerechnet.\n\nDoch umso erstaunlicher sind die Quadratmeterzahlen am anderen Ende der Statistik: In einigen osteuropäischen Ländern, aber auch in Schottland kommt jeder Beschäftigte gerade mal auf 10 Quadratmeter, selbst in Österreich sind es nur zwölf.\n\nIm angelsächsischen Raum gibt es viel mehr Großraumbüros als bei uns. In London, wo Büroraum weltweit mit am teuersten ist, ist etwa eine Zusammenarbeit auf eine Fläche von 600 Quadratmetern und mehr ganz normal. „Häufig teilen sich sogar mehrere Mitarbeiter einen Arbeitsplatz. Statt eines festen Schreibtisches verfügt dann jeder über einen Rollcontainer. Der wird immer dorthin mitgenommen, wo gerade ein Arbeitsplatz frei ist. Das geht in der Regel über alle Hierarchiestufen“, sagt Menke.\n\nRobert Menke erkennt auch in Deutschland „in einigen Bereichen eine Amerikanisierung des Büroraumes“. Banken und Unternehmer im Telekommunikationssektor wären da vorne dabei. Doch das sind noch Ausnahmen. Nach wie vor arbeiten die meisten Angestellten entweder in kleinen Gruppen in etwas größeren Büros oder in „Einzelzellen“ wie Büros für eine Person in der Sprache der Immobilienmakler heißen.\n\nLaut der Studie überlegen zwar 40% der befragten Unternehmer, ihre Großraumflächen zu erweitern oder die Arbeitsplätze flexibel zu gestalten, aber „richtige Großraumbüros gibt es eher selten“, sagt Menke.","questions":{"6":{"prompt":"Eine Studie aus der Schweiz ...","options":{"A":"belegt, dass die Mitarbeiter sich über Lärm im Großraumbüro beklagen.","B":"brachte keine eindeutigen Ergebnisse zur Zufriedenheit mit unterschiedlichen Büroformen.","C":"zeigt, dass Mitarbeiter in Großraumbüros seltener krank sind als andere."},"answer":"A"},"7":{"prompt":"Großraumbüros ...","options":{"A":"reduzieren den Krankenstand.","B":"sind kostengünstiger zu beheizen.","C":"werden immer seltener."},"answer":"B"},"8":{"prompt":"Die deutschen Angestellten ...","options":{"A":"bevorzugen Einzelbüros.","B":"genießen eine individuell ausgewählte Büromöblierung.","C":"leiden unter zu engen Einzelbüros."},"answer":"A"},"9":{"prompt":"Die Arbeitsplatzfläche ...","options":{"A":"ist in Londoner Großraumbüros für den Chef größer als für andere Mitarbeiter.","B":"schließt die gemeinsam genutzten Flächen aus.","C":"wird in London oft unter mehreren Mitarbeitern aufgeteilt."},"answer":"C"},"10":{"prompt":"Großraumbüros ...","options":{"A":"gibt es vor allem in Banken und Telekommunikationsunternehmen.","B":"werden bald in 40% der deutschen Firmen eingeführt.","C":"werden meist in Einzelzellen unterteilt."},"answer":"A"}}},"2.9":{"title":"2.9","text":"Familienglück oder Generationskonflikte?\n\nIn der öffentlichen Beschreibung kennt man die Familie oft als Problemzone. Bestsellerautoren suggerieren der Öffentlichkeit, Eltern seien zum Erziehen heute kaum noch in der Lage; Berichte über steigende Scheidungsraten, Verwahrlosung und Jugendkriminalität verstärken ebenfalls den Eindruck, um die Familien sei es nicht gut bestellt.\n\nTatsächlich hat sich Erziehung in den letzten Jahrzehnten grundlegend gewandelt. In vielerlei Hinsicht allerdings eher zum Guten als zum Schlechten. Wie lebt es sich heute in der Familie? Ausgesprochen gut, in den meisten Fällen sogar recht kuschelig. Das legen zumindest Umfragen und Statistiken über die Familienwirklichkeit nahe. Sie zeigen ein erfreulich positives Bild, nach dem sich die Familie in den vergangenen Jahrzehnten sehr gut entwickelt hat. Das gilt für die materiellen Bedingungen, in denen die meisten Eltern und Kinder heute leben, wie auch für das Ansehen, das die Familie in der Gesellschaft genießt.\n\nDen größten Fortschritt aber hat das gemeinsame Zusammenleben gemacht, sagen Experten: „Es gibt kaum noch wirkliche Konflikte zwischen den Generationen.“ Dass heute 67 Prozent der 16- bis 29-Jährigen angeben, sie hätten eine glückliche Kindheit, während es bei den über 60-Jährigen nur 50 Prozent sind, kann zwar sicher nicht nur auf den Wandel der Erziehung zurückgeführt werden. Schließlich war die Kindheit vieler von ihnen noch von Krieg und Not geprägt, während die Jüngeren in Wohlstand und Sicherheit aufwuchsen.\n\nAber fast alle Jugendlichen geben heute an, dass sie ein gutes Verhältnis zu den Eltern haben. Außerdem orientieren sie sich stark an ihrer Familie. Gestützt unter anderem auf den emotionalen Rückhalt der Eltern blicken die allermeisten Jugendlichen optimistisch nach vorn. Fast 75 Prozent der Befragten würden ihre eigenen Kinder genau so erziehen, wie sie selbst erzogen wurden.\n\nGenauso viele glauben, dass man eine Familie braucht, um wirklich glücklich leben zu können. Die Eltern sehen es übrigens kaum anders. Von ihnen berichten 74 Prozent von Harmonie, Wärme und Geborgenheit im Zusammenleben.\n\nVor 40 Jahren fanden viele Jugendliche ihre Eltern noch spießig, und Eltern konnten sich erregen über die Frisuren oder den Musikgeschmack des Nachwuchses. Heute gleichen sich die Lebensstile und die Wertvorstellungen. So entspannt ist der Umgang zwischen Jung und Alt geworden, dass man es schon wieder bedenklich finden kann. Ist es denn normal, dass Kinder als wichtigstes Vorbild die eigene Mutter nennen? Selbst Oma und Opa findet nur noch jeder fünfte Teenager altmodisch.\n\nGerade Großeltern haben noch nie zuvor für ihre Enkel eine so große Bedeutung. Dank besserer Gesundheit und steigender Lebenserwartung verbringen sie mehr Zeit als früher mit ihren Enkeln. Der Kontakt ist persönlicher und er hält länger an. Heute sieht rund ein Drittel der Jugendlichen Oma und Opa mindestens einmal pro Woche, ein weiteres Drittel telefoniert wenigstens mit ihnen.\n\nMit den Lebenseinstellungen wandelten sich die Erziehungsvorstellungen. Erwachsene nehmen mehr Rücksicht auf die Bedürfnisse von Kindern. Statt eines autoritären Umgangs mit den Kindern pflegen die meisten Familien den Verhandlungsstil, wie ihn Pädagogen nennen. Der ist nicht selten anstrengend und wird mitunter übertrieben, ist aber am Ende zielführender als die familiären Kleinkriege, die früher das Klima in vielen Familien bestimmten.\n\nBesonders Väter profitieren von der neuen Nähe zu ihren Kindern. Sie spielen heute häufiger mit ihnen als früher oder lesen ihnen vor – auch wenn weiterhin die Mütter den Großteil der Familienarbeit leisten.\n\nDas führt zu Stress, da Mütter mit Kindern heute doppelt so häufig berufstätig sind wie noch vor 40 Jahren. Trotzdem haben sie nicht weniger Zeit für ihre Kinder, weil sie den Haushalt dank moderner Technik schneller erledigen.\n\n1990 verbrachten Eltern mit ihren unter sechsjährigen Söhnen und Töchtern pro Tag vier Stunden und 52 Minuten. Heute ist es eine Dreiviertelstunde mehr. Auch der Eindruck, dass Familien sich nicht mehr täglich um den gedeckten Tisch versammeln, um sich untereinander auszutauschen, stimmt nicht, haben Ernährungsforscher ermittelt. Heute dauern die bewusst inszenierten Zusammenkünfte von Jung und Alt um Suppenschüssel oder Nudeltopf sogar länger als noch vor 20 Jahren.","questions":{"6":{"prompt":"Etwa die Hälfte der Senioren über 60 gibt an, dass sie","options":{"A":"ihre Kinder strenger erziehen würden.","B":"die geänderten Erziehungsmethoden begrüßen.","C":"als Kind glücklich waren."},"answer":"C"},"7":{"prompt":"Die meisten Jugendlichen","options":{"A":"verstehen sich mit ihren Eltern gut.","B":"haben keine Meinung zu Erziehungsfragen.","C":"denken, dass man auch ohne Familie glücklich sein kann."},"answer":"A"},"8":{"prompt":"Heute gibt es zwischen Eltern und Kindern","options":{"A":"Konflikte wegen unterschiedlicher Werte.","B":"kaum Unterschiede in der Lebensart.","C":"immer wieder Probleme wegen zu engen Wohnraums."},"answer":"B"},"9":{"prompt":"Mütter haben heute mehr Zeit für ihre Kinder, weil","options":{"A":"sie in der Arbeit weniger Stress haben.","B":"Geräte die Hausarbeit leichter machen.","C":"die Großeltern ihnen Arbeit abnehmen."},"answer":"B"},"10":{"prompt":"In der Öffentlichkeit","options":{"A":"wird der Wandel in der Erziehung nicht wahrgenommen.","B":"ist das Thema Familie nicht interessant.","C":"entsteht oft ein falsches Bild der Familie."},"answer":"C"}}},"2.10":{"title":"2.10","text":"Kreditkarten für Jugendliche\n\nWer kennt sie nicht: Kreditkarten, mit denen man in der heimischen Stadt oder während des Urlaubs einkaufen kann. Fast jeder hat eine, und alles scheint ganz einfach zu sein: Kein Wunder, dass auch immer mehr Kinder und Jugendliche eine eigene Kreditkarte haben wollen. Sie sehen, wie ihre Eltern damit bezahlen, um möchten auch das praktische „Plastikgeld“. Aber Eltern sorgen sich: Ist das nicht zu gefährlich? Um das Risiko einer Überschuldung zu vermeiden, bieten Banken und alle Sparkassen Jugendlichen eine besondere Art von Kreditkarten an: die sogenannte Prepaid-Kreditkarte. Eine Prepaid-Kreditkarte ist mit einem Prepaid-Handy vergleichbar. Man kann sie nur einsetzen, wenn man zuvor Geld auf die Karte geladen hat. Ist das Guthaben verbraucht, kann man mit der Karte nicht mehr bezahlen und am Automaten kein Geld mehr abheben. Der Vorteil liegt auf der Hand: „Man kann nicht mehr Geld ausgeben, als man hat“, sagt Andreas Gernt, Finanzexperte der Verbraucherzentrale Niedersachsen in Hannover. Mit einer Prepaid-Kreditkarte kann daher niemand in die Schuldenfalle tappen. „Für Kinder und Jugendliche auf Reisen ist die Prepaid-Kreditkarte eine überlegenswerte Option“, sagt Gernt. Die daheimgebliebenen Eltern können ihrem Kind von zu Hause aus Geld auf die Karte laden, wenn das Guthaben verbraucht ist. Zugleich können Sie die Kosten kontrollieren. „Die Prepaid-Kreditkarte ist eine Ausgangsschranke für den Verbraucher“, fasst Tanja Beller vom Bundesverband deutscher Banken in Berlin zusammen. So können Jugendliche den Umgang mit bargeldlosen Zahlungsverkehr lernen.\n\nVerluste bei Diebstahl überschaubar\n\nZugleich eignen sich die Karten aber auch für erwachsene Reisende mit einem größeren Sicherheitsbedürfnis. „Man ist mit einer Kreditkarte auf Reisen unabhängiger vom Bargeld“, erklärt Gernt. Die Prepaid-Karte bitte zwei Vorteile: Zum einen ist mit ihr das Reisebudget von Anfang an limitiert. Es kann nur das für Souvenirs ausgegeben werden, was vorher geladen wurde. Zum anderen sind damit auch die Verluste überschaubar, wenn die Karte gestohlen wird. Denn auch ein Dieb kann nur das Geld nutzen, das als Guthaben auf der Karte ist. Außerdem eignet sich die Prepaid Kreditkarte für Freiberufler und Selbständige – oder allgemeiner gefasst für Menschen mit einem unregelmäßigen oder geringen Einkommen, die dadurch keine gute Bonität haben. Denn die Prepaid-Kreditkarten sind im Gegensatz zur klassischen Kreditkarte nicht direkt an ein Gehaltskonto gebunden. Das ermöglicht auch Geringverdienern Einkäufe im Internet. Zugleich schützt die Guthabenkarte vor allzu großen Verlusten durch Missbrauch im Netz.\n\nDie Angebote sollte man vergleichen\n\n„Bevor man sich aber für eine Prepaid-Karte entscheidet, sollte man ihre Akzeptanz überprüfen“, rät Beller. Denn gerade Prepaid-Karten sind nicht in jedem Land als Zahlungsmittel gern gesehen. Grundsätzlich sollte man auch bei Lock-Angeboten skeptisch sein, die als Werbung in den Briefkasten flattern. „Vielleicht verbirgt sich da etwas im Kleingedruckten“, warnt Gernt. Außerdem sollte man die Gebühren genau vergleichen und auf versteckte Kosten achten. Die Stiftung Warentest hat für ihre Zeitschrift „Finanztest“ die Bedingungen und Kosten von 24 Prepaid-Kreditkarten für Erwachsene und Jugendliche getestet. Die Tester stellten fest: Die Karten sind nicht teurer als klassische Kreditkarten, und auch die Nutzungsgebühren unterscheiden sich kaum.\n\nAbheben ab fünf Euro\n\nErwachsene bezahlen für Prepaid-Karten zwischen 29 und 39 Euro im Jahr. Karten für Jugendliche kosten im Jahr höchstens 22 Euro. Bei vielen Banken sind sie bis zum 18. oder 21. Geburtstag kostenlos. Für das Geldabheben am Automaten berechnen die Banken meist einen Mindestbetrag zwischen 5,00 € und 7,50 Euro. Ansonsten fallen etwa zwei Prozent vom abgehobenen Betrag an. Zudem kostet das Abheben außerhalb des Euro-Raumes zwischen einem Prozent und 1,9 Prozent extra. Unter dem Strich kann die Prepaid Karte mit der klassischen Kreditkarte durchaus mithalten. Mit beiden Kartentypen kann man im Restaurant bezahlen, am Automaten Geld abheben oder im Internet shoppen.","questions":{"6":{"prompt":"Eine Prepaid-Kreditkarte","options":{"A":"gibt es für Jugendliche schon bei zahlreichen Geldinstituten.","B":"können Jugendliche zusammen mit einer Handy-Prepaidkarte bekommen.","C":"macht es möglich, mit dem Handy zu bezahlen."},"answer":"A"},"7":{"prompt":"Man hat Kontrolle über die Kosten,","options":{"A":"da nur der Karteninhaber seine Karte aufladen darf.","B":"denn die Eltern werden bei einer Aufladung benachrichtigt.","C":"weil die Ausgaben durch das Guthaben begrenzt sind."},"answer":"C"},"8":{"prompt":"Die Prepaid-Kreditkarte ist besonders geeignet für","options":{"A":"Angestellte mit einem guten Gehalt.","B":"Jugendliche ohne festes Einkommen.","C":"Menschen mit einem eigenen Bankkonto."},"answer":"B"},"9":{"prompt":"Prepaid-Karten","options":{"A":"kosten ähnlich viel wie klassische Kreditkarten.","B":"verursachen keine unerwarteten Kosten.","C":"werden als Zahlungsmittel ebenso akzeptiert wie klassische Kreditkarten."},"answer":"A"},"10":{"prompt":"Bei Prepaid-Karten zahlen","options":{"A":"Erwachsene ab 21 Jahren eine höhere Jahresgebühr als Jugendliche.","B":"Jugendliche unter 18 Jahren nur die Nutzungsgebühr am Geldautomaten.","C":"Kunden zwischen 18 und 21 Jahren noch nichts."},"answer":"A"}}},"2.11":{"title":"2.11","text":"Krista der tierische Star\n\nKrista ist die schönste Kuh Deutschlands. Und jetzt auch noch ein Kinostar. Am letzten Donnerstag kam ein Film über die schwarz-weiß gefleckte Kuh und ihre Besitzer in einige norddeutsche Kinos.\n\nWovon der Film handelt? Von Kristas Leben auf dem Hof der Familie Seeger in Bisse, einem kleinen Dorf in Norddeutschland. Antje Schneider und Carsten Waldbauer sind Filmemacher. Vor einigen Jahren hatten sie die Idee, eine Dokumentation über Kühe zu machen, genauer gesagt über Holstein-Rinder. Die Holstein-Rinder sind eine der wichtigsten Rinderrassen weltweit, kommen aber trotz des deutschen Namens aus Nordamerika. Diese Kühe werden überwiegend als Milchkühe gehalten. Die Holstein-Rinder sind so verbreitet, dass sie inzwischen andere Rassen fast vollständig verdrängt haben. Das gilt vor allem für die vielen Bauernhöfe in Deutschland, die ausschließlich Milch produzieren.\n\nAuf einem dieser Höfe wollten Antje Schneider und Carsten Waldbauer Aufnahmen für ihre Dokumentation machen, und die Wahl fiel auf den Hof der Familie Seeger. Doch als die beiden Filmemacher mit den Dreharbeiten beginnen wollten, sahen sie plötzlich – Krista. Krista änderte alles. Die Schönheit vom Lande beeindruckte Schneider und Waldbauer so sehr, dass sie den Plan für ihre Dokumentation gegen den Willen ihres Senders komplett änderten. Im Mittelpunkt sollte nun Krista stehen, die schönste Holstein-Kuh Deutschlands. Krista gehört zur Weltelite. Auf Veranstaltungen wird sie immer wieder ausgezeichnet. Bei einer Tierschau in Italien erhielt sie zwar nicht den ersten Preis, aber trotzdem war sie unter den schönsten Kühen Europas.\n\nKristas Besitzer Jörg Seeger ist begeistert von seinem Star im Stall. Jörg und Janine Seeger erlauben dem Kinozuschauer interessante Einblicke in ihren Alltag auf dem Bauernhof. Die Kamera verfolgt zwar immer den Weg von Kuh Krista, aber zu sehen ist dabei natürlich auch die Arbeit der gesamten Familie auf dem Hof. Manchmal ist das auch ein romantisches Leben, es ist aber vor allem immer sehr arbeitsreich. „Für mich sind Kühe nicht nur Nutztiere“, sagt die Bäuerin Janine Seeger. Schon als Kind hätten ihr die Tiere Geborgenheit, manchmal Trost gespendet. Aber sie weiß, dass die Kühe Geld bringen müssen, entweder durch möglichst viel Milch oder durch viel Nachwuchs.\n\nDie kleinen Kälber lassen sich zu recht guten Preisen verkaufen, das lohnt sich für die Seegers. Krista kann zunächst aus gesundheitlichen Gründen keine Kälber bekommen. Auch diese Problematik wird im Film gezeigt. Der Zuschauer merkt, dass Jörg Seeger enttäuscht ist: Seine beste Kuh kann kein Kalb bekommen. Aber es geht gut aus, denn Krista wird operiert und nach Ende der Dreharbeiten klappt es dann doch mit dem Nachwuchs für die Kuh.\n\nWährend der jahrelangen Dreharbeiten hat sich auch die Familie entwickelt. Mittlerweile haben die Seegers zwei Kinder. „Deshalb verändert sich im Film mein Gewicht etwas“, erzählt Janine Seeger und lacht. Und wie ist es so, vor der Kamera zu stehen? „Erst ungewohnt, dann irgendwie vertraut“, sagt die 32-Jährige. Zu den Filmemachern habe sich ein freundschaftliches Verhältnis entwickelt. „Wie schön, Carsten und Antje sind wieder da“, habe es dann nur noch geheißen, wenn das Team anrückte.\n\nDer Film zeigt aber auch, wie sich im Laufe der Jahre das Leben auf dem Hof der Seegers verändert hat und wie schwierig es auch hier geworden ist, mit Milchkühen Geld zu verdienen. Der Markt ist hart umkämpft und die Preise sinken immer weiter, denn die Verbraucher im Supermarkt greifen gerne zum günstigsten Produkt. Für viele ist es da nicht wichtig, wie die Milch produziert wurde. Auch das zeigt der Film, wenngleich eher nebenbei.\n\nFamilie Seeger ist stolz darauf, dass ein Film über ihren Hof und über die schöne Kuh Krista gedreht wurde. So heißt nun übrigens auch der Film: „Die schöne Krista“. Am vergangenen Wochenende haben die Seegers den Film bei einem Hoffest gezeigt. Familie und Freunde sowie Nachbarn waren zu Gast, und alle haben sich über den Film gefreut. „Die schöne Krista“ ist auch die in die Auswahl für den Deutschen Filmpreis gekommen, als einer der fünfzehn besten Dokumentarfilme. Die 500 Filmkritiker, die diese 15 Filme ausgewählt haben, waren begeistert. Schwieriger sei es, so die Produktionsfirma, die Kinobetreiber vom Film zu überzeugen. „Was sollen wir mit einer Kuh?“, sei eine häufige Reaktion. Vielleicht würden sie ihre Meinung ändern, wenn Sie Krista einmal auf dem Hof gesehen hätten.","questions":{"6":{"prompt":"Holstein-Rinder","options":{"A":"sind in der Milchproduktion beliebter als andere Rinderrassen.","B":"spielen in der Milchproduktion kaum eine Rolle.","C":"stammen aus Norddeutschland."},"answer":"A"},"7":{"prompt":"Die Kuh Krista","options":{"A":"hat bereits einige Preise gewonnen.","B":"war Siegerin bei einer Veranstaltung in Italien.","C":"wurde als schönste Kuh Europas ausgezeichnet."},"answer":"A"},"8":{"prompt":"Während der Filmaufnahmen","options":{"A":"bekam Krista ein Kalb.","B":"wäre Krista fast gestorben.","C":"wurde Krista operiert."},"answer":"C"},"9":{"prompt":"Die wirtschaftlichen Probleme von Milchbetrieben","options":{"A":"betreffen die Familie Seeger nicht.","B":"sind eine Folge des Verbraucherverhaltens.","C":"werden im Film ausführlich behandelt."},"answer":"B"},"10":{"prompt":"„Die schöne Krista“","options":{"A":"begeistert Kinobetreiber bislang nicht.","B":"könnte die Kritiker nicht überzeugen.","C":"wurde als beste Dokumentation ausgezeichnet."},"answer":"A"}}},"2.12":{"title":"2.12","text":"Wie Babys lernen\n\nBereits mit sechs Monaten können Babys zwischen möglichen und unmöglichen Ereignissen unterscheiden und denken über Ursache und Folge nach. Unglaubliche Ergebnisse sind das, bedenkt man, dass ein Säugling vor 50 Jahren noch als leeres Blatt gesehen wurde. Man glaubte, dass ein Säugling äußere Einflüsse nur bedingt wahrnehmen oder Empfindungen wie Schmerz nicht spüren kann. Inzwischen hat die Kleinstkindforschung eine ganz andere Meinung und weiß: Babys bedienen sich sehr vieler komplizierter Forschungsmethoden. Sie lernen nicht nur, indem sie tun, was sie bei ihren Eltern sehen, sondern sie lernen mit Versuchen die Welt kennen. Eine der Fragen, die Babyforscher dabei beschäftigt, lautet: Wie viel Klugheit ist angeboren, wie viel erlernt? Lässt sich die Intelligenz also entwickeln? Wenn ja, welche Umwelt macht Babys intelligent?\n\nWas die Forscher heute glauben\n\nRund 50 Prozent unseres geistigen Könnens wurde von unseren Eltern vererbt, das heißt, die Hälfte unserer Intelligenz ist uns schon bei der Geburt mitgegeben. Die andere Hälfte wird durch Schule, Ausbildung, Freunde, Mutter, Vater, Geschwister, Großeltern, kurz: die Umwelt bestimmt. Aber dieses Verhältnis von Erbgut auf der einen und Umwelt auf der anderen Seite verändert sich im Lauf des Lebens. Bei Kleinkindern sind die Umwelteinflüsse von größerer Bedeutung als im späteren Leben. Der US-Forscher Robert Plomin meint, dass die Umwelt in diesem Alter mit etwa 80 Prozent einen sehr hohen Stellenwert einnimmt. Mit zunehmendem Alter wird das Erbgut stärker sichtbar. Im Erwachsenenalter ist der Einfluss der Gene auf die Intelligenz mit etwa 60 Prozent deutlich größer als der der Umwelt. Um das Lernen zu lernen, brauchen kleine Kinder weder spezielle Programme noch intelligentes Spielzeug – sondern Menschen. Gut ist nach Meinung der Forscher zum Beispiel eine Familie, in der vorgelesen und gemeinsam gespielt wird.\n\nUnsere Kinder werden immer klüger\n\nDrei- bis Siebenjährige in Deutschland können heute mehr als noch vor 25 Jahren. Alle 10 Jahre nimmt die Intelligenz um rund 3 Prozent zu. Liegt das vielleicht daran, dass heute schon Kleinkinder vor Wissensvideos sitzen, dass Einjährige mit sprechenden Handys herumrennen und dass bei vielen noch vor dem Schuleingang ein Lerncomputer auf dem Geburtstagstisch steht? Die Wissenschaftler glauben das nicht: „Intelligenz ist nicht gleich Wissen“, sagt Professor Ralph Dawirs, Neurobiologe an der Uniklinik Erlangen. Es gehe nicht darum, Wissen anzusammeln. „Verstehen heißt Verbindungen herstellen und auswählen“. Im Gehirn macht das der Stirnlappen. Das Stirnhirn ist bei der Geburt zwar organisch da, hat seine volle Funktion aber noch nicht erreicht. „Es braucht geistige Nahrung, Futter“, sagte Dawirs. Deshalb geht es im Kleinkindalter erst einmal darum, dass möglichst viele dem jeweiligen Entwicklungsstand angemessene Impulse verarbeitet werden. Eine Spielzeugente, die man anfassen kann und über die die Mutter vielleicht sagt: „Ja, das ist eine Ente. Schau, sie kann in der Badewanne schwimmen“, ist also ungleich mehr wert als die Spielzeugente, die auf einem Bildschirm erscheint.\n\nSind Lerncomputer, Handy und Videos deshalb Teufelswerk? „Wenn man sie nur wenig benutzt, schaden sie nicht“, sagt Entwicklungsforscherin Pauen. „Die Frage ist nur, ob sie nützen“. Die beste Unterstützung der Entwicklung sei immer noch menschliche Begleitung: „Man tut einem Baby keinen Gefallen damit, wenn man es mit einem Spielzeug alleine lässt. Besser ist, es beim Lernen beobachten, so wenig wie möglich stören, aber zu Hilfe zu kommen, wenn etwas nicht klappt“, so ihr Tipp für Eltern. Es ist besser, Kinder im Dreck spielen zu lassen und mit ihnen in die Natur zu gehen. Dort lernen sie viel mehr als mit dem besten Computerspiel.","questions":{"6":{"prompt":"Man glaubte früher, dass Babys","options":{"A":"kaum auf ihre Umwelt reagieren.","B":"nur nachmachen, was ihre Eltern tun.","C":"sehr kompliziert denken."},"answer":"A"},"7":{"prompt":"Die Umwelt ist für die Entwicklung der Intelligenz","options":{"A":"im Erwachsenenalter besonders wichtig.","B":"im Kleinkindalter besonders wichtig.","C":"in jedem Alter gleich wichtig."},"answer":"B"},"8":{"prompt":"Bessere Entwicklungschancen haben Kinder, je","options":{"A":"früher sie den Umgang mit Computer erlernen.","B":"mehr altersgerechte Erfahrungen sie machen können.","C":"öfter sie beim Spielen auf sich gestellt sind."},"answer":"B"},"9":{"prompt":"Fernsehen und Computer sind","options":{"A":"für die geistige Entwicklung eher ungeeignet.","B":"geistige Nahrung für das Gehirn.","C":"sehr gute Hilfsmittel für das Lernen."},"answer":"A"},"10":{"prompt":"Kontakt mit Menschen","options":{"A":"fördert die Intelligenz des Babys am besten.","B":"ist weniger wichtig als Erfahrungen in der freien Natur.","C":"wird unwichtig, wenn es gutes Spielzeug gibt."},"answer":"A"}}},"2.13":{"title":"2.13","text":"Der Ein-Personen-Karneval von Unna\n\nAls Helmut Scherer vor genau 50 Jahren zum ersten Mal mit seinem Bollerwagen durch die westfälische Kleinstadt Unna zog, wurde er von den Leuten ausgelacht. Heute aber ist er eher eine städtische Berühmtheit und sogar weit über die Grenzen seiner Heimatstadt hinaus bekannt. Der 71-Jährige ist der einzige Teilnehmer des weltweit kleinsten Karnevalsumzugs. An Weiberfastnacht, dem letzten Donnerstag der Karnevalsperiode eines Jahres, zieht er mit seinem Handwagen los: Er selbst ist dann seine immer wieder neu erfundene Bühne. Auf den Figuren aufgebaut, die humoristisch ein aktuelles gesellschaftliches Thema – diesmal die Schulreform – aufgreifen. So macht er sich nach alter karnevalistischer Tradition über Missstände lustig.\n\nHelmut Scherer legt natürlich Wert darauf, dass er von Karnevalsmusik begleitet wird, die jedoch nicht von einer Musikgruppe, sondern von einem Radiorekorder gespielt wird. Dieses Jahr als blondes Schulmädchen verkleidet und auf vor 50 Jahren kam Helmut Scherer aus dem katholisch geprägten Paderborn, wo er seine Kindheit und Jugend verbracht hatte, nach Unna, dessen überwiegend evangelische Bevölkerung sich recht kühl und nüchtern gibt und deshalb anfangs auch wenig Verständnis für den katholischen Karnevalsbrauch zeigte.\n\n„Die Leute haben mir einen Vogel gezeigt und den Kopf geschüttelt“, beschreibt der „Narr aus Überzeugung“ die Anfänge. Auch bei der Stadtverwaltung, wo Scherer für Weiberfastnacht seinen Umzug ordnungsgemäß anmeldete, stieß er zunächst auf Unverständnis. Aber da sein Karnevalszug niemanden behinderte und auch nicht zu befürchten war, dass Unnas öffentliche Ordnung gestört würde, bekam er die Erlaubnis, mit seinem humoristischen Handwagen loszumarschieren.\n\nÜber 10 Jahre lang zog Scherer einsam, belächelt und verspottet durch Unna, weder eisige Kälte noch Schnee konnten ihn davon abhalten. Doch der Karneval blieb für lange Zeit sein Privatvergnügen. Als dann die lokale Presse anfing, ihn zu unterstützen, wandelte sich die Meinung der Öffentlichkeit. Der einst verspottete Karnevalist stieg langsam zum närrischen Wahrzeichen einer Stadt ohne Karneval auf. Für die Stadtoberen ist heute die „Ein-Mann-Show“ die beste Werbung für Unna.\n\nScherers Beharrlichkeit hat sich also ausgezahlt. Anlässlich seines fünfzigsten Karnevalsjubiläums wurde er sogar offiziell im Rathaus empfangen, um ihm – so wie es auch in den Karnevalshochburgen Köln, Düsseldorf und Mainz üblich ist – den goldenen Schlüssel des Rathauses zu übergeben. Obwohl er keinem Karnevalsverein angehört, wurde ihm die Ehre zuteil, als Karnevalsprinz in den Bund Deutscher Karneval aufgenommen zu werden; somit wurde es ihm möglich, auch bei den Rosenmontagszügen in den närrischen Hochburgen im Rheinland mitzuwirken.\n\nWeit über hundert Fans des standhaften Narren haben sich zu einem Fan-Club zusammengeschlossen, und etliche stehen beim jährlichen Umzug in Unna am Straßenrand und rufen statt „Spinner“ den rheinischen Karnevalsgruß „Helau“. Bei allem Fortschrittlichkeit soll aber eines so bleiben, wie es immer war: einen weiteren Teilnehmer am Zug duldet der Karnevalsprinz nicht: „Die Tradition soll aufrechterhalten bleiben“, sagt er schmunzelnd. „Aber nur solange mich die Füße tragen.“","questions":{"6":{"prompt":"Helmut Scherer","options":{"A":"führt in Unna einen kleinen Karnevalsumzug durch.","B":"ist in Unna seit 50 Jahren eine gefeierte Persönlichkeit.","C":"veranstaltet den einzigen Karnevalsumzug der Welt."},"answer":"A"},"7":{"prompt":"Auf seinem Handwagen","options":{"A":"fährt traditionell ein blondes Schulmädchen mit.","B":"präsentiert er kleine Szenen, die auf den Alltag Bezug nehmen.","C":"stellt er sozialkritische Themen auf witzige Art und Weise dar."},"answer":"C"},"8":{"prompt":"Die Bevölkerung von Unna","options":{"A":"hatte zunächst wenig Verständnis für Helmut Scherer.","B":"hielt anfangs Helmut Scherer für kühl und nüchtern.","C":"verhinderte Helmut Scherers ersten Karnevalsumzug."},"answer":"A"},"9":{"prompt":"Der kleinste Karnevalsumzug der Welt","options":{"A":"hat Helmut Scherer sogar Geld eingebracht.","B":"ist heute eine gute Reklame für die Stadt Unna.","C":"wird in Zukunft von einer ganzen Gruppe von Leuten durchgeführt."},"answer":"B"},"10":{"prompt":"Helmut Scherer","options":{"A":"hat an Karnevalsumzügen in mehreren Städten teilgenommen.","B":"hat inzwischen in ganz Deutschland Fan-Clubs.","C":"sucht einen Nachfolger"},"answer":"A"}}},"2.14":{"title":"2.14","text":"Österreich, das Land der Poolbesitzer – Österreich schwimmt\n\nUnd das nicht nur in Seen, Teichen oder Freibädern. Ein Blick über die Gartenzäune des Landes macht deutlich: Die Österreicher schwimmen zunehmend gerne zu Hause. Die Poolbranche schätzt die Anzahl der Poolbesitzer in Österreich auf etwa 90.000 bis 150.000. Im Vergleich zu Deutschland ist Österreich wesentlich dichter mit Pools besiedelt.\n\nWarum Swimmingpools so beliebt sind, darüber herrscht Uneinigkeit. Manche Vertreter der Branche sehen darin eine Reaktion auf wirtschaftlich unsichere Zeiten. Da investierten die Leute gerne in die eigenen vier Wände und in den Garten inklusive Pools, meinen sie. Andere sehen darin einen Ausdruck des allgemeinen Wellness- und Gesundheitstrends. Auch die Sehnsucht nach dem Meer wird bisweilen als Argument für den ausgeprägten Wunsch nach einem Pool vorgebracht.\n\nDas allein kann es aber wohl nicht sein, denn als stärkster Poolmarkt in Europa gilt nach wie vor Frankreich. Branchenkenner führen den Boom aber auch auf finanzielle Gründe zurück. Dass der Umsatz in den vergangenen Jahren stetig angestiegen ist, sehen viele im Angebot an preisgünstigen Pools begründet. Vor 20 Jahren sei ein eigenes Schwimmbad noch ein absolutes Luxusgut gewesen. Jetzt gebe es immer mehr Alternativen, die einen Pool erschwinglich machen.\n\nWelche Gründe auch ausschlaggebend sein mögen: Die Branche besitzt durchaus noch Potenzial, da sind sich alle einig. Laut einer kürzlich durchgeführten Studie träumt nämlich beinahe jeder zweite Österreicher von einem Pool. An erster Stelle der Wohnungswünsche steht er zwar nicht: So hat für 97 Prozent der befragten Österreicher die Traumimmobilie einen Balkon, eine Loggia oder eine Terrasse, und 92 Prozent wünschen sich eine Garage. 82 Prozent sehnen sich nach einem Garten, und 46 Prozent nach einem Swimmingpool – und zehn Prozent besitzen auch einen solchen. Dabei gibt es regionale Unterschiede. In absoluten Zahlen gibt es die meisten Pools in Wien und Niederösterreich.\n\nPro Kopf gerechnet gibt es aber im Vorarlberg die meisten privaten Schwimmbäder. Einen eigenen Pool hat auch die 37-jährige Rija in ihrem neuen Zuhause. Die Wienerin ist mit ihrem Lebensgefährten vor kurzem nach Niederösterreich gezogen. Es war immer mein Traum einen Pool zu haben, sagt sie. Nun kann sie den Sommer im eigenen Pool genießen. Neben der Entspannung und Abkühlung hat der Pool für sie noch einen weiteren Wert. Der Pool hat Leben in den Garten gebracht. Es haben sich schon alle möglichen Bekannten zum Schwimmen angemeldet, sagt sie. Den Blick ich aber vorher einen Spaten in die Hand – ein Teil vom Garten ist ja noch Baustelle.\n\nTatsächlich schweißt so ein Pool nicht nur die Nachbarschaft zusammen. Es ist auch die beste Werbung für weitere Becken. Kaum hat einer in einer Siedlung einen Pool, hat der Nachbar spätestens nach zwei Jahren auch einen, meint ein Branchenvertreter.\n\nBesonders deutlich wird das in Kleingartensiedlungen, bei denen ein kleines Schwimmbecken schon beinahe zur Grundausstattung gehören. Doch manche Menschen bevorzugen naturnahe Schwimmteiche. Nach Schätzungen macht der Anteil der Schwimmteiche am Schwimmanlagenmarkt rund 15 Prozent aus. In den vergangenen Jahren ist die Nachfrage nach Schwimmteichen stark gestiegen. Das hat auch zur Entwicklung von Naturpools geführt. Optisch ein klassischer Swimmingpool, kommt der Naturpool gänzlich ohne Chemikalien aus. Hier wird das Wasser durch Pumpen und Filtersysteme sauber gehalten.\n\nBei der natürlichen Variante geht es übrigens bei 35.000 Euro los. Dafür spart man sich das jährliche Befüllen und Putzen. Das jährliche Befüllen von Pools aus den Wasserleitungen kann in manchen Regionen gelegentlich zu Wasserknappheit führen. Das betrifft aber meist nur jene Gemeinden, die von sehr kleinen Wassergenossenschaften versorgt werden, in Wien fällt die Befüllung der Pools kaum auf.\n\nWas den Leiter des Wiener Rohrnetzes eher stört, ist der Wasserdiebstahl über Hydranten, also über die Zapfstellen in den Straßen für Feuerwehr und Straßenreinigung. Denn wer es besonders eilig hat, kann seinen Pool auch über die Hydranten befüllen. Das geht schneller, muss aber angemeldet werden und kostet Geld. Generell gebe es aber keine Wasserknappheit in Wien. Das sei auch gut so, denn die Wasserversorger: Fürs Auffüllen von Pools, aber auch fürs Blumengießen, zum Duschen und auch zum Trinken. Wir verwenden in Österreich nur ein Prozent der vorhandenen Wasserressourcen.","questions":{"6":{"prompt":"Einige Vertreter der Poolbranche denken, dass","options":{"A":"es in Österreich bald mehr Pools gibt als in Frankreich.","B":"in unsicheren Zeiten weniger investiert wird.","C":"mehr Leute einen Pool bauen, weil Pools billiger geworden sind."},"answer":"C"},"7":{"prompt":"Laut einer Studie","options":{"A":"möchten die meisten Befragten ein Heim mit Garage.","B":"steht ein Pool nicht an erster Stelle auf der Wunschliste.","C":"wünschen sich 10 Prozent der Österreicher einen Pool."},"answer":"B"},"8":{"prompt":"Rija ist der Meinung, dass","options":{"A":"ein Pool die Nachbarn neidisch macht.","B":"ihr Pool ein Anziehungspunkt für Freunde geworden ist.","C":"ihre Freunde beim Poolbau helfen sollen."},"answer":"B"},"9":{"prompt":"Naturpools","options":{"A":"brauchen keine chemischen Reinigungsmittel.","B":"müssen häufig geputzt werden.","C":"sehen genauso aus wie Schwimmteiche."},"answer":"A"},"10":{"prompt":"In Wien","options":{"A":"darf man einen Pool nur mit Wasser aus der Leitung füllen.","B":"führt das Befüllen von Pools regelmäßig zu Wasserknappheit.","C":"wird manchmal Wasser zum Befüllen von Pools gestohlen."},"answer":"C"}}},"2.15":{"title":"Schaufensterpuppe","text":"Schaufensterpuppe\n\nDer Puppenmacher: Die Schaufensterpuppe ist eine Pariserin und hatte erstmals 1849 in der Hauptstadt der Mode ihren Auftritt. Der französische Schneider Alexis Lavigne gilt als ihr Erfinder, auch wenn er damals seine Kleiderkreationen noch auf einer Schneiderpuppe vorführte. Bald schon taten es ihm andere Pariser Kollegen gleich. Sie begannen ihre Modelle vor den Geschäften aufzustellen, um die Passanten in die Verkaufsräume zu locken. Als Anfang des 20. Jahrhunderts die ersten großen Kaufhäuser eröffneten, erlebte die Schaufensterpuppe ihren Durchbruch. Der Puppenmacher Lester Gaba entwickelte in den 1930er Jahren das erste lebensnahe wirkende Modell. Cnytha durfte sie sogar mit auf Veranstaltungen, was die beiden berühmt machte. Fortan spiegelte die Schaufensterpuppe Zeitgeist und Schönheitsideale.\n\nDer Linzer Puppenmacher Andre Bauernfeind hat als Sammler begonnen, mittlerweile sind Schaufensterpuppen sein Beruf. Der 37-Jährige hat mehr als 1000 Modelle besitzt in Österreichweit der Einzige bei dem man sie reparieren lassen aber auch mieten kann. Wer ihn an seinem Arbeitsplatz aufsucht muss in den Keller. Die Eisentür steht offen in sein großes Atelier voller Schaufensterpuppen Kinder, Frauen und Männer mit Perücke geschminkt oder farblos sitzend liegend. Dür oder mollig in Kisten verpackt oder in Einzelteilen von der Decke hängend.\n\nWährend sich die Puppen in der Welt draußen perfekt präsentieren wird hier in der Werkstatt mitunter ordentlich an ihrer Oberfläche gekratzt. Der 37 Jährige ist so etwas wie ein Schönheitschirurg für Schaufensterpuppen Er macht s
