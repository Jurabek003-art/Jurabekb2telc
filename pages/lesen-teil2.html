ie wieder heil, verpasst ihnen aber auch Ganzkörper Liftings wenn gewünscht. Die bestehende Farbe wird dann entfernt, anschließend eine Grundierung und Farbe aufgetragen. Er klebt ihnen falsche Wimpern an und trägt mit einem Pinsel Schminke auf. Die Kosmetikprodukte kommen meistens aus der Drogerie, tragen aber manchmal auch Luxusnamen wie Amani oder Dior. Nur herkömmlichen Nagellack kann Bauernfeind nicht verwenden, weil dieser die Ölfarbe auflöst.\n\nNicht selten fehlt den Puppen ein Finger, ein Ohr oder eine Nase. Dann greift der Linzer zur Modelliermasse deren Zusammensetzung streng geheim ist. Weniger geheim sind die Preise: Für 45 Euro fertigt er eine neue Nase, rekonstruiert ein Ohr oder auch ein Kinn. Wer allerdings einen Kopf modellieren lassen möchte, muss mit 2500 Euro und acht Wochen rechnen. Für einen gesamten Körper mit 15.000 Euro und Monaten.\n\nObgleich er als Kind am liebsten mit Autos spielte, faszinierten ihn schon früh diese Mannequins in den Schaufenstern. Heute kommt er an keinem Schaufenster vorbei, ohne einen Blick hineinzuwerfen. Ich erkenne schon an ihrem Standssockel um welchen Hersteller es sich handelt, sagt der gelernte Dekorateur. Sein erstes Exemplar kaufte er während seiner Ausbildung: 3500 Schilling wollte der Besitzer haben, man einigte sich auf Ratenzahlungen. Ein Jahr lang hat er sie abbezahlt. Die Puppe aus der Serie Ragazza mit der Nummer 9908 bekam bald Gesellschaft, die Sammlung vergrößerte sich sukzessive zählte schon bald mehr als 100 Exponate. Aus dem Hobby wurde später ein Beruf.\n\nBauernfeind verfeinerte sein Handwerk und unternahm schließlich ein altes Schaufensterpuppen-Unternehmen in Linz. Heute ist er Besitzer 1200 Puppen, vermietet und repariert sie, stellt Sonderanfertigungen her. Bauernfeind verkauft auch für andere Hersteller. Er besitzt exklusive die Handelsvertretung für eine belgische Schaufensterpuppen-Firma. Alle anderen renommierten Hersteller aus Europa haben irgendwann ihre Produktion nach Asien verlagert.\n\nQualität und Nachhaltigkeit sind ihm wichtig. Gemeinsam mit einem Farbenlieferanten hat er deshalb eine Farbe für Puppen entwickelt, die nicht nur ökologisch einwandfrei, sondern auch für den Menschen unbedenklich ist. Schließlich dringen die Farbstoffe in die Textilien ein. Meine Farbe könnte man sogar essen, und es würde nichts passieren.\n\nWeltweit gibt es etwa 100 Hersteller von Schaufensterpuppen, die zweimal im Jahr eine neue Kollektion herausbringen. Denn wie die Mode sind auch die Puppen Trends unterworfen: in Frankreich, England und den USA werden natürliche Modelle immer beliebter, während bei uns noch abstrakte Modelle dominieren. Es lässt aber beobachten, dass man von einer Einheit gut wegkommt und dass immer häufiger vielfarbige Figurtypen gewünscht werden, sagt der Puppenmacher.\n\nTest","questions":{"6":{"prompt":"Die erste Schaufensterpuppe wurde ...","options":{"A":"Anfang des 20. Jahrhunderts von einem Puppenmacher erschaffen.","B":"für die ersten großen Kaufhäuser produziert.","C":"von einem französischen Schneider erfunden."},"answer":"C"},"7":{"prompt":"Bei der Restaurierung der Schaufensterpuppen ...","options":{"A":"darf Herr Bauernfeind keinen normalen Nagellack auftragen.","B":"können keine Luxusmarken eingesetzt werden.","C":"verwendet er nur billige Produkte."},"answer":"A"},"8":{"prompt":"Der Puppenmacher ...","options":{"A":"hat schon als Kind gerne mit Puppen gespielt.","B":"konnte seine erste Schaufensterpuppe nicht auf einmal zahlen.","C":"organisierte eine Ausstellung mit Schaufensterpuppen."},"answer":"B"},"9":{"prompt":"Herr Bauernfeind ...","options":{"A":"eröffnete die erste Linzer Firma für Schaufensterpuppen.","B":"handelt mit Schaufensterpuppen anderer Produzenten.","C":"stellt heute keine Schaufensterpuppen mehr her."},"answer":"B"},"10":{"prompt":"Schaufensterpuppen ...","options":{"A":"können mit umweltfreundlichen Farben bemalt werden.","B":"sind nicht von Tendenzen der Mode abhängig.","C":"sollen immer die gleiche Kleidergröße haben."},"answer":"A"}}},"2.16":{"title":"Mehrsprachige Erziehung","text":"Mehrsprachige Erziehung\n\nFür viele Eltern sind Fremdsprachenkenntnisse die Basis einer ordentlichen Karriere für ihre Kinder. Aus entwicklungspsychologischer Sicht bringt die Mehrsprachigkeit im Kindesalter tatsächlich einige Vorteile mit sich: „Mehrsprachig erzogene Kinder lernen später auch andere Fremdsprachen leichter, weil sie schon früh ein Gefühl für die Systematik hinter einer Sprache entwickeln“, sagt Susanne Hilt, Psychologin für Sprachförderung in Neustadt. Außerdem falle es ihnen leichter, Dinge mit anderen Augen zu sehen und kreativ auf ihren Alltag zu reagieren. Auch die kommunikative Kompetenz ist laut Hilt bei mehrsprachig erzogenen Kindern meist ausgeprägter.\n\nDoch nicht jeder Sprachimpuls in der Kindheit ist positiv. Die gebürtige Schweizerin Hilt hat ihre eigenen Kinder dreisprachig erzogen. Sie ist sich sicher: „Die mehrsprachige Erziehung funktioniert nur dann, wenn das Kind eine emotionale Bindung zur jeweiligen Sprache aufbauen kann.“ Sie rät daher Eltern, sich ehrlich zu fragen, welche Sprache ihnen selbst am ehesten liegt. Denn wer sich in der Fremdsprache nicht wohlfühle, könne sie auch nicht authentisch vermitteln.\n\nDie Expertin Hilt ist daher skeptisch, wenn Eltern ihre Kinder aus rein intellektuellen Gründen mehrsprachig erziehen möchten. „Schulischer Erfolg sollte nicht der Hauptbeweggrund für die Multilingualität sein. Es ist viel wichtiger, dass die Sprache für das Kind emotional und sozial relevant ist“. So könnten zum Beispiel die Herkunft der Eltern, eine Tante in Frankreich oder eine fremdsprachige Erzieherin eine Basis bilden, durch die Kinder auch kulturell den Bezug zu einer weiteren Sprache finden.\n\nDer Kontakt mit einer zweiten oder dritten Sprache muss nach Auffassung von Hilt nicht unbedingt schon im Babyalter erfolgen. Man kann mit der mehrsprachigen Erziehung auch erst im Kindergartenalter beginnen. „Das Zeitfenster, in dem ein Kind eine Sprache noch durch zweisprachige Erziehung erlernen kann, ist nicht genau festlegbar. Aber ungefähr bis zum zehnten Lebensjahr sind die Chancen sehr gut“, sagt die Psychologin.\n\nAuch Sabine Füllgrabe-Amling, Leiterin einer deutsch-englischen Kindertagesstätte in Hamburg, sieht den Einstieg in die Multilingualität entspannt. In Hamburg gibt es in jeder Gruppe einen deutschen und einen englischen Muttersprachler unter den Erziehern, jeder wendet seine Sprache ganz selbstverständlich im Umgang mit den Kindern an. „Die meisten unserer Kinder nehmen die neue Sprache sehr gut an, weil sie eine starke emotionale Bindung zu den Erziehern haben“, sagt Füllgrabe-Amling. Sie rät Eltern, die mehrsprachige Erziehung ihrer Kinder ebenfalls wie selbstverständlich in den Alltag zu integrieren. „Es bringt nichts, wenn man zu Kindern sagt: ‚Wiederhol das mal‘ oder ‚Schau, Stuhl heißt auf Englisch chair‘. Auch der Erwerb der Muttersprache funktioniert ja nicht auf diese Art“, sagt Füllgrabe-Amling. Die neue Sprache sollte ganz locker immer wieder auftauchen, so dass das Kind sie langsam annehmen kann. „Am besten ist es, wenn eine bestimmte Bezugsperson sich immer nur in der anderen Sprache mit dem Kind unterhält“, sagt Füllgrabe-Amling.\n\nSusanne Hilt hält auch andere Methoden für sinnvoll. „Jeder muss da sein eigenes System entwickeln“, sagt die Psychologin. Es sei auch denkbar, dass beispielsweise die kroatische Mutter mit ihrem Kind zu Hause immer nur Kroatisch spreche, unterwegs aber Deutsch. „Wichtig ist, dass eine Regelmäßigkeit für das Kind und für die Eltern erkennbar ist“, sagt Hilt.\n\nEine Sprachverwirrung durch die Multilingualität oder gar eine Verzögerung in der Entwicklung des Kindes müssen Eltern nicht befürchten, meint Hilt. „Auch wenn der Kontakt mit der anderen Sprache nur alle paar Tage stattfindet, wird das Kind keinen Schaden nehmen. Auch diese kleinen Impulse können zumindest das Interesse für weitere Sprachen fördern“.\n\nTest","questions":{"6":{"prompt":"Mehrsprachig erzogene Kinder sind meist ...","options":{"A":"kommunikativer.","B":"ideenreicher.","C":"sensibler."},"answer":"A"},"7":{"prompt":"Mehrsprachige Erziehung gelingt, wenn ...","options":{"A":"das Kind einen emotionalen Bezug zur Sprache hat.","B":"die Eltern aus dem Zielsprachenland kommen.","C":"die Eltern die Bildungsziele konsequent verfolgen."},"answer":"A"},"8":{"prompt":"Damit ein Kind eine weitere Sprache zweisprachig erlernt, ...","options":{"A":"muss die Sprachvermittlung so früh wie möglich anfangen.","B":"reicht es, im Grundschulalter mit der Zweitsprache zu beginnen.","C":"sollte im Kindergarten mit der Sprachvermittlung begonnen werden."},"answer":"C"},"9":{"prompt":"Wechselt die Bezugsperson zwischen zwei Sprachen, lernt das Kind die Zweitsprache ...","options":{"A":"bei systematischer Vermittlung der Sprache.","B":"sofern es versteht, wann die Sprachen gewechselt werden.","C":"wahrscheinlich nicht."},"answer":"A"},"10":{"prompt":"Sollten Kinder nur alle paar Tage Kontakt zur Zweitsprache haben, ...","options":{"A":"ist eine Entwicklungsverzögerung möglich.","B":"kann das Interesse an anderen Sprachen verloren gehen.","C":"schadet dies der Entwicklung der Zweitsprache nicht."},"answer":"C"}}},"2.17":{"title":"Gesundes Essen für Schulkinder","text":"Gesundes Essen für Schulkinder\n\nFür Kinder sind regelmäßige Mahlzeiten wichtig, um volle Konzentrations- und Leistungsfähigkeit zu gewährleisten. Um gut in den Tag zu kommen, sollte jedes Schulkind mit einem ausgewogenen Frühstück starten.\n\nAber eine Umfrage kam zu erschreckenden Ergebnissen: Jedes siebte Kind isst morgens nichts, bevor es in die Schule geht. Die Gründe dafür sind vielfältig: Jeder vierte Befragte gab an, dass sein Kind morgens keinen Appetit habe. Und sogar jede dritte Mutter und jeder dritte Vater sagten, dass morgens keine Zeit für Frühstück sei. Für eine gesunde Morgenmahlzeit sollte man jedoch immer Zeit freischaufeln, rät Ernährungswissenschaftlerin Alexandra Krotz.\n\nMit leerem Magen können Körper und Geist keine Leistung erbringen. Die Folge: Die Kinder sind reizbar, nervös und können sich nicht richtig konzentrieren. Und das ist schon auf dem Schulweg wichtig: Kinder bewegen sich sicherer, wenn sie rechtzeitig aufgestanden und entspannt gefrühstückt haben.\n\nZu einem gesunden Frühstück eignen sich am besten Vollkornbrote mit fettarmer Wurst oder Käse, aber auch Müsli mit Milch oder Joghurt, Nüssen und frischem Obst. Wer morgens keinen Hunger hat, sollte wenigstens eine Kleinigkeit zu sich nehmen – etwa eine Banane essen und dazu einen Kakao trinken – und das ausgiebige Frühstück dann etwas später nachholen.\n\nIn einigen Schulen wird gemeinsam gefrühstückt. Hier gilt es, je nach Vereinbarung mit Erziehern und Lehrern, ein leckeres Frühstück zusammenzustellen. Wer seinem Kind ein zweites Frühstück einpackt, sollte auf Abwechslung und die geeignete Verpackung achten. Am besten eignet sich eine Brotdose – die spart Verpackungsmüll und vermeidet zerquetschte Brote. Zudem lassen sich darin auch Obst und Gemüse sicher transportieren.\n\nEine gute Ergänzung zu lecker belegten Vollkornbroten ist Rohkost. Dazu eignen sich besonders transportierbare feste Sorten wie Möhren, Kohlrabi, Cherrytomaten, Trauben oder Äpfel. Je nach Jahreszeit und Vorliebe der Kinder können Sie als Eltern hierbei für Abwechslung sorgen.\n\nHeutzutage wird Schulmilch leider nicht mehr in allen Schulen angeboten. Schade, denn Milch liefert wichtiges Calcium, Eiweiß und viele B-Vitamine. Wer als Kind die Möglichkeit hat, in der Schule Milch zu trinken, sollte darauf nicht verzichten. Um selbst Milchluffel dürften zufrieden sein: Da Milch in vielen Varianten angeboten wird – von Erdbeermilch über Kakaо zu Vanillemilch –, ist für jedes Kind das Richtige dabei.\n\nGenerell ist der Wasserbedarf von Kindern im Verhältnis zum Körpergewicht höher als bei Erwachsenen. Trinken Kinder zu wenig, beeinträchtigt dies schneller die körperliche und geistige Leistungsfähigkeit. Kinder sollten deshalb je nach Alter mindestens 0,7 Liter bis 1,2 Liter trinken – Milch nicht mitgerechnet. Wenn das Kind viel Sport treibt oder tobt und bei besonders warmen Tagen brauchen die Kinder entsprechend mehr Flüssigkeit.\n\nViele Kinder trinken zu wenig. Häufig vergessen sie ganz einfach zu trinken, wenn sie konzentriert spielen oder lernen. Ganz wichtig ist es daher, Kinder immer mal wieder zum Trinken aufzufordern und auch zwischen den Mahlzeiten den Durst zu löschen, auch während der Unterrichtsstunden. Am besten sind Wasser, Kräutertees und Saftschorlen geeignet.\n\nÜbrigens: Fast ein Viertel aller Schüler in Deutschland trinkt vormittags nichts oder fast nichts. Das hat eine Untersuchung der Universität Paderborn zum Trinkverhalten vor und während der Unterrichtszeit ergeben. Die unzureichende Flüssigkeitsaufnahme führte dabei nachweislich zu Einschränkungen der geistigen und körperlichen Leistungsfähigkeit.\n\nKinder mögen Süßes. Schokoriegel und Süßigkeiten sollten allerdings beim Pausenbrot nicht die Regel sein. Eine gute Alternative dazu sind Trockenfrüchte, Fruchtschnitten oder Studentenfutter. Sie liefern wichtige Vitamine und Mineralstoffe und sind als Energieschub zwischendurch geeignet. Aber Vorsicht: Sie enthalten auch viel Energie und sollten gerade von Kindern, die leichtes Übergewicht haben, nur in geringen Mengen gegessen werden.\n\nViele Eltern nehmen sich morgens nicht die Zeit, mit ihren Kindern zu frühstücken, und geben ihnen lieber Geld mit, damit sie sich auf dem Schulweg ein Frühstück kaufen können. Versuchen Sie, das zu vermeiden. Denn die meisten Kinder legen das Geld in Süßwaren oder Fast Food, Cola oder andere Süßgetränke an.\n\nDie Mittagsverpflegung in Schulen kann sehr unterschiedlich sein. Ein weiteres Pausenbrot wäre jedenfalls eine Zumutung für die Kinder. Deshalb gibt es verschiedene Systeme für die Versorgung am Mittag – Catering, kochende Eltern oder Profi-Küchen mit geschultem Personal. Klar ist: Für die Kinder sind Pausen und regelmäßige Mahlzeiten zur Aufrechterhaltung ihrer Leistungsfähigkeit wichtig. Daher sollte es im Interesse aller sein, den Kindern in der Schule eine geeignete Mittagsverpflegung zur Verfügung zu stellen.\n\nTest","questions":{"6":{"prompt":"Einige Eltern ...","options":{"A":"haben selbst keinen Appetit auf ein Frühstück, lassen das Frühstück aus Zeitmangel ausfallen, schaufeln das Frühstück einfach in sich hinein.","B":"lassen das Frühstück aus Zeitmangel ausfallen.","C":"schaufeln das Frühstück einfach in sich hinein."},"answer":"B"},"7":{"prompt":"Ein gesundes Frühstück ...","options":{"A":"erhöht auch die Sicherheit des Kindes auf dem Weg zur Schule.","B":"muss mindestens aus einem Glas Kakao oder Milch bestehen.","C":"sollte gemeinsam in der Schule eingenommen werden."},"answer":"A"},"8":{"prompt":"Milch ...","options":{"A":"deckt den täglichen Flüssigkeitsbedarf.","B":"gehört zum Angebot der Schulkantinen.","C":"wird in verschiedenen Geschmacksrichtungen angeboten."},"answer":"C"},"9":{"prompt":"Kinder ...","options":{"A":"denken von alleine nicht immer daran, genug zu trinken.","B":"dürfen während des Unterrichts nichts trinken.","C":"können sich auch noch gut konzentrieren, wenn sie nicht genug getrunken haben."},"answer":"A"},"10":{"prompt":"Mittagessen ...","options":{"A":"sollte in der Schule angeboten werden.","B":"sollten die Kinder von zu Hause mitbringen.","C":"sollten Kinder bei den Eltern zu Hause bekommen."},"answer":"A"}}},"2.18":{"title":"Noch ein Wasser, bitte!","text":"Noch ein Wasser, bitte!\n\nDie Semesterferien sind zu Ende und diese Woche beginnt an der Universität das Sommersemester. Aber nicht nur Vorlesungen und Seminare gehen wieder los. 73 Prozent der Berliner Studenten müssen neben dem Studium auch noch Geld verdienen.\n\nEin beliebter Studentenjob ist der des Kellners. Denn erstens arbeitet man meist am Abend, so dass es keine Terminkollisionen mit den Vorlesungs- und Seminarprogrammen gibt. Zweitens findet man leicht einen Job, da es in der Nähe von Universitäten häufig viele Cafés und Kneipen gibt, die sehr gut besucht sind. Und je mehr Gäste, desto höher natürlich die Chancen auf Trinkgelder. Das ist auch wichtig, denn nur so kommt man auf einen akzeptablen Stundenlohn. Allerdings ist es in manchen Restaurants auch üblich, dass die Trinkgelder gesammelt und am Ende eines Tages an alle Kellner gleichmäßig verteilt werden. Davon profitieren dann auch diejenigen, die nicht so engagiert und motiviert arbeiten.\n\nAls Kellner braucht man starke Nerven, denn der Gast hat immer recht. Manche Gäste machen es einem Kellner mit zahlreichen Beschwerden und Extrawünschen wirklich nicht leicht. Denn der Kellner ist die Person, die direkt mit den Gast in Kontakt kommt. Wenn das Essen nicht schmeckt, kalt ist oder nicht schnell genug zubereitet wird, bekommt der Kellner den Unmut der Gäste zu spüren, obwohl die „Schuld“ beim Koch liegt.\n\nWer ist für den Job als Kellner geeignet? Man sollte offen sein und den Kontakt mit Menschen mögen und auf jeden Fall geduldig sein. Natürlich ist es wichtig, immer freundlich und zuvorkommend zu bleiben. Denn wenn der Service stimmt und der Kellner kompetent und freundlich wirkt, dann sitzt auch das Trinkgeld lockerer.\n\nKellnern war gestern\n\nNeben den klassischen Studentenjobs wie Kellnern und Nachhilfe geben greifen manche aber auch zu eher ungewöhnlichen Jobs. Wie zum Beispiel Jan, der in Berlin als Fahrradkurier arbeitet, oder Stefanie, die Testkäuferin.\n\nJan fährt im Auftrag von Apotheken, Filmverleihfirmen oder Pizzadiensten im Schnitt zwischen 50 km und 200 km pro Tag. Um diesen Job machen zu können, braucht er eine sehr gute Kondition. Denn manche Strecken sind lang, und oft gibt es Gegenwind. Er arbeitet wie die meisten Fahrradkuriere auf selbstständiger Basis und kommt auf einen Stundenlohn von etwa 10 Euro. Jan meint: „Reich wird man damit zwar nicht, aber man kann sagen: Wer schnell ist und gut verdient als Fahrradkurier nicht schlecht.“ Am liebsten würde Jan von einem Kurierdienst in einem klassischen Arbeitsverhältnis angestellt werden. Das ist in der Branche aber eher die Ausnahme. Wäre er Angestellter, würde er vom Kurierdienst ein Grundgehalt bekommen und für die gefahrenen Aufträge eine kleine Provision.\n\nEinen der größten Vorteile seines Jobs sieht Jan darin, dass er sich den ganzen Tag im Freien bewegt und so die Beiträge für das Fitnessstudio spart. Außerdem lernt man so eine Stadt sehr gut kennen. Ein Nachteil ist, dass man auch bei Wind und Wetter oder bei dichtem Verkehr fahren muss. Aber das nimmt Jan in Kauf. Denn Kellnern oder ein Büro-Job wären nichts für ihn.\n\nDer Job von Stefanie ist ein wahrer Glückstreffer: Sie darf den ganzen Tag einkaufen und wird dafür auch noch bezahlt. Stefanie arbeitet als Testkäuferin, um Beratung und Service von Verkäufern in Geschäften zu testen. Ein typischer Arbeitseinsatz sieht bei ihr so aus: Nach der letzten Vorlesung an der Uni geht sie zum Beispiel in einen Modeladen. Dort überprüft sie als Erstes den Eingang auf Sauberkeit, schlendert dann zu den Ständen mit Hosen und Blusen und schaut, ob alles ordentlich sortiert und beschildert ist. Dann spricht sie eine Verkäuferin an und sagt, dass sie eine Bluse sucht. Damit testet sie, ob sie als Kundin von der Verkäuferin angemessen beraten wird. Die Verkäuferin sollte nachfragen, für welchen Anlass und in welcher Farbe die Kundin eine Bluse sucht.\n\nLeider läuft es nicht immer so, wie es sein sollte. In 90 Prozent der Fälle gibt es Grund zur Beschwerde, weil die Verkäuferin entweder unfreundlich oder uninteressiert ist. Bevor Stefanie die Läden wieder verlässt, kommt das Beste: Sie muss etwas kaufen, um die Kasse zu testen. 20 Euro bekommt sie dafür pro Test. Außerdem darf sie das, was sie kaufen sollte, auch noch behalten.\n\nTest","questions":{"6":{"prompt":"Der Nebenjob als Kellner ...","options":{"A":"hat an Attraktivität deutlich verloren.","B":"ist insgesamt sehr gut bezahlt.","C":"lässt sich gut mit dem Studium vereinbaren."},"answer":"C"},"7":{"prompt":"Wer als Kellner arbeitet, ...","options":{"A":"muss bei Beschwerden den Kontakt zwischen Koch und Gast herstellen.","B":"muss das Trinkgeld mit den Kollegen teilen.","C":"sollte nicht aus der Ruhe zu bringen sein."},"answer":"C"},"8":{"prompt":"Jan arbeitet gern als Fahrradkurier, ...","options":{"A":"weil er außer dem Grundgehalt noch eine Provision bekommt.","B":"weil er dann fest angestellt ist.","C":"weil er mit dem Verdienst ganz zufrieden ist."},"answer":"C"},"9":{"prompt":"Jan sagte, ...","options":{"A":"dass er durch seinen Job keine Ausgaben für ein Fitnessstudio hat.","B":"dass er lieber im Büro arbeiten würde.","C":"dass ihm schlechtes Wetter gar nicht stört."},"answer":"A"},"10":{"prompt":"Stefanie muss als Testkäuferin ...","options":{"A":"auch den Service in Cafés und Kneipen überprüfen.","B":"einige Waren selbst bezahlen.","C":"sich beim Einkauf an einen festen Ablauf halten."},"answer":"C"}}},"2.19":{"title":"Weniger Euro-„Blüten“ in Deutschland und Europa","text":"Weniger Euro-„Blüten“ in Deutschland und Europa\n\nFrankfurt/Main/Brüssel (dpa) – Jeder hat schon einmal von ihnen gehört: „Blüten“, ein Synonym für Falschgeld. Aber wie viel Falschgeld gibt es wirklich? Tatsächlich wurden im vergangenen Jahr weniger Euro-Scheine, aber mehr Falschmünzen in Umlauf gebracht als im vorletzten Jahr.\n\nDie Zahl des entdeckten gefälschten Papiergelds sank in Europa somit von 579.000 auf 565.000 Scheine. In Deutschland sank gegenüber der restlichen Euro-Zone die Zahl der „Blüten“ noch deutlicher. Grund dafür: Im vergangenen Jahr konnte die Polizei in mehreren europäischen Ländern Fälscherwerkstätten aufspüren und Verteilerringe zerschlagen. Dennoch ist der wirtschaftliche Schaden insgesamt gestiegen, teilte die Europäische Zentralbank in Frankfurt mit.\n\nIn Deutschland zog die Polizei im vergangenen Jahr rund 46.000 „Blüten“ aus dem Verkehr, die Schadenssumme belief sich laut Bundesbank auf 3,2 Millionen Euro.\n\nAm häufigsten werden nach wie vor 20-Euro-Scheine nachgemacht, gefolgt von 50-Euro-Scheinen. Während europaweit die 20-Euro-Note der beliebteste Schein der Fälscher ist (mit 36 Prozent am gesamten Falschgeldaufkommen), ist es in Deutschland die 50-Euro-Note (mit 41 Prozent). Einen deutlichen Anstieg verzeichneten die Fahnder derzeit bei 100-Euro-„Blüten“. „Die Fälscher versuchen, auf neue Werte auszuweichen“, sagte der Bundesbank-Sprecher.\n\nDie Notenbanken forderten die Bürger daher zur erhöhten Wachsamkeit auf. Die meisten Fälschungen seien mit einfachen Tests („Fühlen-Sehen-Kippen“) jedoch leicht von echten Banknoten zu unterscheiden.\n\nDagegen erreichte die Zahl falscher Münzen in Deutschland einen Rekordwert. Nach Angaben der EU-Kommission wurden im vergangenen Jahr 164.000 falsche Euro-Münzen entdeckt und aus dem Verkehr gezogen; das war ein Anstieg von 63 Prozent. Besonders beliebt waren bei den Fälschern 2-Euro-Stücke mit dem deutschen Adler. Angesichts der riesigen Anzahl von 69 Milliarden Euro-Münzen ist das Falschgeld aber unbedeutend, „es besteht daher kein Grund zur Beunruhigung“, teilte die EU-Behörde mit.\n\n86 Prozent aller entdeckten falschen Münzen waren 2-Euro-Stücke. Laut Kommission werden die nachgemachten Münzen qualitativ zwar immer besser, die höhere Zahl entdeckter Falschmünzen gehe vor allem auf die verstärkten Ermittlungen von Polizei und Behörden zurück.\n\n„Die Wahrscheinlichkeit, eine gefälschte Banknote in den Händen zu halten, ist für den Bürger auf der Straße sehr gering“, sagte ein Bundesbank-Sprecher. Da insgesamt 10,6 Milliarden Banknoten im Umlauf sind, handelt es sich nur bei 6 von 100.000 Scheinen um Fälschungen.\n\nDie Mehrzahl wurde außerdem nicht von Privatleuten, sondern von Kassenpersonal in Geldinstituten und Geschäften gefunden. Wer eine „Blüte“ findet, kann sie bei der Polizei oder den Bankfilialen abgeben. Einen Ersatz gibt es dafür allerdings nicht.\n\nLaut Europäischer Zentralbank wird es den Geldfälschern künftig noch schwerer haben. In den Laboren gibt es nahezu fälschungssichere Technologien – zum Beispiel einen Mikrochip, der beinahe unsichtbar in die Euro-Noten integriert werden kann. Er beinhaltet die Seriennummer und den Wert einer Banknote. Diese Daten könnten zukünftig an jeder Kasse ausgelesen und mit einer Datenbank verglichen werden.\n\nAus der Natur stammt ein Farbstoff mit verblüffenden Eigenschaften. Wenn dieser Farbstoff beim Scannen oder Kopieren hellem Licht ausgesetzt ist, wechselt er in Bruchteilen einer Sekunde seine Farbe von Rot zu Gelb. Die Kopie unterscheidet sich also gravierend vom Original und ist ohne Hilfsmittel leicht zu erkennen.\n\nTest","questions":{"6":{"prompt":"Die Anzahl der ...","options":{"A":"entdeckten Euromünzen hat sich im letzten Kalenderjahr verdoppelt.","B":"gefälschten 50-Euro-Scheine ist in Deutschland besonders hoch.","C":"gefälschten Banknoten hat zugenommen."},"answer":"B"},"7":{"prompt":"Es werden immer mehr Falschmünzen entdeckt, weil ...","options":{"A":"die Ermittler gründlicher suchen.","B":"die Qualität der Falschmünzen immer schlechter wird.","C":"es ein neues technisches Gerät dafür gibt."},"answer":"A"},"8":{"prompt":"Die meisten gefälschten Geldscheine werden ...","options":{"A":"bereits bei den Fälschern gefunden.","B":"von Kassierern in Banken und Läden entdeckt.","C":"von Privatleuten am Geldautomaten entdeckt."},"answer":"B"},"9":{"prompt":"Man bekommt Falschgeld nur selten zu sehen, da ...","options":{"A":"das Geld oft nur in Banktresoren liegt.","B":"die Fälscher mit Kassierern in Geschäften zusammenarbeiten.","C":"die Wahrscheinlichkeit sehr niedrig ist."},"answer":"C"},"10":{"prompt":"Künftig wird die Herstellung von Falschgeld noch schwieriger, weil ...","options":{"A":"an den Ladenkassen alle Scheine gescannt werden.","B":"beim Druck Farben verwendet werden, die man nicht kopieren kann.","C":"Münzen mit Mikrochips versehen werden."},"answer":"B"}}},"2.20":{"title":"Korbjagd zu Pferde","text":"Korbjagd zu Pferde\n\n„Basketball“ zu Pferde: Horse-Ball ist wohl eine der exotischsten – und jüngsten – Reitsportarten. Ein Zentrum des ungewöhnlichen Mannschaftssports: das Hofgut Adamstal in Wiesbaden.\n\nWer sich unter dem zweimal pro Woche stattfindenden Training auf dem Wiesbadener Hofgut Adamstal eine Art „Kuschelstunde“ vorgestellt hatte, der wird schnell eines Besseren belehrt, und der neugierige Betrachter fühlt sich eher auf einen Fußballplatz als in eine Reithalle versetzt. Die festliegenden Spielzüge, die einzustudieren gilt, sind Bestandteil einer Sportart, die hierzulande allenfalls eine Randerscheinung ist: Horse-Ball.\n\n„Es kommen immer mehr Aktive dazu“, versichert jedoch Hans-Jürgen Faust (59), Hausherr auf Hofgut Adamstal und Präsident des Deutschen Horse-Ball-Verbandes. Irgendwo in Hagen, Düsseldorf, München oder Heidelberg soll es noch ein paar vereinzelte Akteure geben, das eigentliche Geschehen aber spielt sich hier ab, wo einer der wohl kleinsten Sportverbände Deutschlands vor 15 Jahren aus der Taufe gehoben wurde und wo die erste Mannschaft der Reitergruppe Wiesbaden (RGW) identisch ist mit der National-Auswahl. Aber diesen Sport betreiben nicht nur Erwachsene: Die jüngsten Spieler sind nicht älter als acht. Horse-Ball ist – vereinfacht gesagt – eine Art Basketball zu Pferde.\n\nAn den beiden Enden des zirka 25 mal 70 Meter großen Spielfeldes sind die Korbringe nicht waagerecht, sondern senkrecht ausgerichtet und mit Fangnetzen versehen, in denen die Bälle nach einem gelungenen Spielzug landen. Keine leichte Aufgabe, wie die bereits erwähnten ersten Trainingseindrücke zeigen, aber Übung macht eben auch hier den Meister. Zumindest auf nationaler, sprich: Wiesbadener Ebene.\n\nDarüber hinaus gilt es, immer wieder Lehrgeld zu zahlen, vor allem bei Gastspielen im Heimatland Frankreich, wo Horse-Ball vor rund 25 Jahren erfunden wurde und einen viel höheren Stellenwert als hierzulande genießt. Sogar eine eigene Profiliga gibt es bei unseren südwestlichen Nachbarn, die bei den Mitte August anstehenden Europameisterschaften einmal mehr nicht nur Gastgeber, sondern auch wieder Anwärter auf den Titel sind.\n\nWer es übrigens selbst einmal ausprobieren möchte: Im kommenden Monat bieten die Wiesbaden Buffalos für maximal zwölf Teilnehmer einen Einstiegs-Lehrgang an. Dabei mitzubringen sind reiterliche Grundkenntnisse und ein so genannter Dreipunkt-Helm. Alles andere wird – inklusive Vierbeiner – bei Bedarf gestellt. „Natürlich können auch eigene Pferde mitgebracht werden“, sagt Faust.\n\nDie Tiere müssen „sozialverträglich“ sein, erläutert der 59-Jährige, und das nicht nur im Umgang mit dem Reiter, sondern vor allem untereinander. „Im richtigen Wettkampf kann es auch schon mal zu Zusammenstößen kommen“, weiß Faust, für den Horse-Ball zu einem ganz persönlichen „Steckenpferd“ geworden ist, das in der vielfältigen Angebotspalette des riesigen Hofguts eine Art Sonderstatus einnimmt.\n\nDamit es trotz unvermeidlichen Körperkontakts kaum einmal zu ernsthaften Verletzungen kommt, tragen nicht nur die Pferde vorgeschriebene Bandagen an den Beinen, sondern auch für die Reiter gibt es eine spezielle Vorrichtung: Ein Gurt, der unter dem Bauch der Tiere die beiden Steigbügel miteinander verbindet, gewährt selbst dann noch sicheren Halt, wenn sich der Spieler aus vollem Galopp heraus aus dem Sattel fallen lässt, um den Ball vom Boden aufnehmen zu können. Um die Handhabung dabei ein wenig zu vereinfachen, ist das runde Leder mit Fangriemen versehen, die ein sicheres Zugreifen auch mit einer Hand ermöglichen.\n\nAber noch eine Besonderheit weist Horse-Ball auf: Es ist die einzige Pferdesportart, bei der der Gebrauch einer Gerte – das ist ein kleiner Stock, mit dem das Pferd leicht geschlagen wird – ausdrücklich verboten ist, wie Faust betont. Damit tritt er auch etwaigen Befürchtungen entgegen, dass es zu Tierquälerei kommen könnte. Der Chef des Hofgut Adamstal: „Das Gegenteil ist der Fall. Die Tiere können beim Horse-Ball ihre natürlichen Verhaltensweisen ausleben und haben sogar Spaß dabei.“ Zumindest mehr als der eine oder andere Reiter, wie es angesichts des strengen Trainings den Eindruck macht.\n\nTest","questions":{"6":{"prompt":"Aktive der Wiesbadener Reitergruppe ...","options":{"A":"bilden die deutsche Nationalmannschaft.","B":"spielen schon als Achtjährige in der deutschen Nationalmannschaft mit.","C":"unterstützen die deutsche Nationalmannschaft."},"answer":"A"},"7":{"prompt":"Die Basketball-Körbe ...","options":{"A":"hängen wie beim normalen Basketball.","B":"sind mit dem Netz nach oben aufgehängt.","C":"sind so gedreht, dass ihre Öffnungen nach der Seite zeigen."},"answer":"C"},"8":{"prompt":"Wer an einem Horse-Ball-Lehrgang teilnimmt, ...","options":{"A":"braucht ein eigenes Pferd.","B":"kann sein eigenes Pferd einsetzen.","C":"muss sein Pferd jedes Mal mitbringen."},"answer":"B"},"9":{"prompt":"Beim Horse-Ball-Spiel ...","options":{"A":"wird ein Fußball verwendet.","B":"darf der Ball in die Hand genommen werden.","C":"darf der Ball nicht auf den Boden fallen."},"answer":"B"},"10":{"prompt":"Das Training ist so streng, dass ...","options":{"A":"die Reiter oft mehr Stress zu empfinden scheinen als die Tiere.","B":"die Tiere ihre naturgegebenen Anlagen nicht ausleben können.","C":"es Pferden und Reitern oft kein Vergnügen macht."},"answer":"A"}}},"2.21":{"title":"Geschichte des Hauspersonals","text":"Geschichte des Hauspersonals\n\nDienstmädchen war um 1900 der am weitesten verbreitete Beruf für Frauen. Aus heutiger Perspektive ist das verwunderlich, denn der Alltag eines Dienstmädchens war sehr hart. Was trieb also Frauen in diesen Beruf?\n\nEs waren vor allem Mädchen vom Land, die von ihren Eltern in die Stadt geschickt wurden, um dort zu arbeiten. Auf dem Land gab es kaum Stellen für Mädchen. Als Dienstmädchen, so hofften die Eltern, würden ihre Töchter wenigstens das Hauswirtschaften lernen – eine wichtige Fertigkeit als spätere Haus- und Ehefrau. Dabei war das enge Leben eines Dienstmädchens ohne viel Zeit genau das, was den Eltern gut an diesem Beruf erschien: da die Mädchen oft erst 14 oder 15 Jahre alt waren, waren sie in einer Familie behüteter als beispielsweise in der Fabrik. Allerdings kam es nicht selten vor, dass die Hoffnung auf eine Ausbildung enttäuscht wurde. Viele Mädchen wurden nicht eingearbeitet und angelernt, sondern mussten selber zusehen, wie sie das Arbeitspensum bewältigten.\n\nLeider verfügten die Eltern meist nicht über Kontakte in der Stadt. Die Mädchen fuhren mit dem Zug in die Fremde und mussten dann auf eigene Faust eine Stellung finden. Das machte sich auch dubiose Stellenvermittler an den Bahnhöfen zu Nutze und verschafften den Mädchen Stellen in Kneipen als Kellnerinnen – damals eine Arbeit mit sehr schlechtem Ruf. Um diesen Missstand zu beenden, gründeten sich übrigens die Bahnhofsmissionen, die damals konfessionsübergreifend von den katholischen, evangelischen und jüdischen Gemeinden den ankommenden Mädchen erst einmal ein Bett bieten sollten.\n\nWer etwas auf sich hielt, beschäftigte um 1900 ein Dienstmädchen: sowohl kleinbürgerliche Haushalte als auch großbürgerliche. Die unteren Schichten, also Handwerkerfamilien, ärgerten den gehobeneren nach. Nach außen durfte es an nichts fehlen, auch wenn das Budget dafür knapp war. Gespart wurde, wo es nicht sichtbar war: bei der Unterbringung und Ernährung der Dienstmädchen. In gehobeneren Schichten gab es gerne auch mehr Personal – ein Vorteil und Nachteil zugleich. Einerseits hatte das Dienstmädchen so mehr Gesellschaft und war weniger isoliert, andererseits gab es auch unter den Dienstboten eine Hierarchie und das Dienstmädchen war das unterste Glied.\n\nAnders als Fabrikarbeiter hatten Dienstboten keine geregelten Arbeitszeiten. Sie mussten, wenn nötig, ihren Dienstherren rund um die Uhr zur Verfügung stehen. Das Dienstmädchen stand als Erste auf, befeuerte den Ofen, machte das Wasser zum Waschen und fürs Frühstück warm, servierte die Mahlzeiten, räumte wieder ab, spülte und putzte. Das Einkaufen gehörte zu den beliebten Tätigkeiten, denn das erlaubte es den Mädchen, einmal ohne Aufsicht in der Stadt unterwegs zu sein, andere Dienstmädchen zu treffen und sich auszutauschen. Fließendes Wasser gehörte um die Jahrhundertwende nicht zum Standard, so musste das Dienstmädchen auch Wasser schleppen. Erst wenn alle Arbeit erledigt war, konnte das Dienstmädchen schlafen gehen. Die wenige freie Zeit am Abend reichte oft nur, um die eigene Kleidung auszubessern. Alle vierzehn Tage durften die Mädchen sonntags für zwei Stunden das Haus verlassen, das war der einzige Ausgang, den sie hatten.\n\nDer Lohn bestand im Wesentlichen aus Kost und Unterkunft. Etwas zurücklegen für später konnte kaum ein Mädchen. Auch die Unterbringung ließ zu wünschen übrig. Von Berliner Dienstmädchen weiß man, dass sie oft noch nicht einmal eine eigene Kammer hatten, sondern auf so genannten Hängeböden schliefen, eine kleine Fläche von vielleicht mal zwei Metern bei einer Raumhöhe von etwa 1,50 Meter. Wenig Schlaf, und dann auch noch schlechter Schlaf: Vielen Mädchen waren die Strapazen trotz ihres jungen Alters anzusehen. Für die meisten war es nur eine Zwischenstation. Heirateten sie, beendeten die jungen Mädchen dieses Arbeitsverhältnis und stattdessen war die junge Frau selber Hausfrau und Herrin eines eigenen Haushalts.\n\nTest","questions":{"6":{"prompt":"Die Eltern ließen ihre Töchter als Dienstmädchen arbeiten,","options":{"A":"damit sie die Jahre bis zur Arbeit in der Fabrik überbrücken konnten.","B":"damit sie lernten, einen Haushalt zu führen.","C":"damit sie besser beaufsichtigt waren als zu Hause."},"answer":"B"},"7":{"prompt":"Die Stellen fanden die Mädchen zumeist","options":{"A":"durch Vermittler, die ins Dorf kamen.","B":"alleine.","C":"mit Hilfe ihrer Eltern."},"answer":"B"},"8":{"prompt":"Dienstmädchen gab es","options":{"A":"fast nur bei reicheren Leuten.","B":"auch bei den weniger reichen Leuten.","C":"in jedem Haus in der Stadt."},"answer":"B"},"9":{"prompt":"Dienstmädchen","options":{"A":"mussten länger arbeiten als Fabrikarbeiter.","B":"konnten sich am Sonntag zwei Stunden mit anderen Dienstmädchen treffen.","C":"durften nicht alleine einkaufen gehen."},"answer":"A"},"10":{"prompt":"Dienstmädchen bekamen","options":{"A":"fast kein Geld.","B":"ein eigenes Zimmer.","C":"Geld, um für später zu sparen."},"answer":"A"}}},"2.22":{"title":"Die ganze Welt auf dem eigenen PC","text":"Die ganze Welt auf dem eigenen PC\n\n„Google Earth“, das digitale Abbild der Erde mit Satelliten- und Luftbildern, ist seit 2006 im Internet. Und es gibt auch eine deutsche Version. Ohne langes Training, gewissermaßen von einer Sekunde zur anderen, wird man mit „Google Earth“ zum Weltraumfahrer und Astronauten. Der Computer ersetzt das Weltraumschiff, die Computermouse das Steuerknüppel. Nutzer können sich auf einen Kontinent, eine Stadt, sogar aufs eigene Haus oder in die Fußballstadien des Landes zoomen: inzwischen gibt es „Google Earth“ in einer völlig neuen Version – mit viermal mehr Daten als bisher und erstmals auch in deutscher Sprache.\n\n„Deutschland ist unser wichtigster Standort“, sagte John Hanke, Leiter von Googles Keyhole-Gruppe. Keyhole, dessen Chef Hanke bis zur Übernahme durch Google im Oktober 2004 war, hat die Software für „Google Earth“ entwickelt. „Rund ein Fünftel der Erde – auf dieser Fläche wohnt fast die Hälfte der Weltbevölkerung – haben wir jetzt dargestellt. Viermal so viele Daten wie bisher.“ Deutschland sei weltweit das einzige Land, für das komplett hochauflösendes, also besonders genau abbildendes Material zur Verfügung stand, erklärt Hanke. Ein Bildpunkt (Pixel) entspricht dabei 15 Metern auf der Erde. Größere deutsche Städte beispielsweise werden in der höchstmöglichen Auflösung sogar mit zehn Zentimetern pro Pixel dargestellt. Kleinere Städte jedoch, wie etwa Hameln, sind nach wie vor sehr grob dargestellt.\n\nNeugierige Reporter, die über den Gartenzaun von Nachbarn oder bekannten Persönlichkeiten sehen wollen, haben Pech: „Google Earth“ bietet keine Livebilder. Die Daten stammen von Flugzeugen und drei Satelliten und können viele Monate alt sein. So kommt es, dass etwa ein Sportstadion in Hannover lange Zeit ohne Rasen zu sehen war – die Aufnahme stammt aus der Zeit der Renovierung.\n\nUrsprünglich waren es nur Kunden aus dem Bereich Militär und Immobilien, die sich für die verrückte Idee interessierten, die Erde im Internet nachzubilden. Doch aus Hankes „fixer Idee“ wurde ein Renner. Da es sich bei „Google Earth“ um einen offenen Standard handelt und nur die professionellen Produkte Geld kosten, entwickelt sich rundherum eine immer größer werdende Familie von Anwendern, die Möglichkeiten zur Nutzung der Bilder sehen. Künftig soll das Programm nach dem Prinzip der freien Enzyklopädie Wikipedia durch die Informationen und Beiträge aller Nutzer wachsen, sagt Hanke.\n\n„Google Earth“ zählt inzwischen zu den weltweit am häufigsten angeklickten Internetseiten. Wenn TV-Stationen in den USA ihre Nachrichten beginnen, fliegen sie mit „Google Earth“ zum Ort des Geschehens. Wegen des riesigen Erfolges sind auch die Mitstreiter Yahoo und Microsoft auf den Zug gesprungen und versuchen, mit der Idee von „Google Earth“ Geld zu verdienen.\n\nDas Spektrum neuer Anwendungen von „Google Earth“ reicht von nützlich bis negativ. So kann man sich die Standorte billiger Tankstellen oder Weltmeisterschafts-Stadien mit Zeitplan der Fußballspiele genauso auf einer Karte anzeigen lassen wie die Wohnorte aller in Florida erfassten Verbrecher, Name, Adresse und Polizeifoto inklusive. Von Datenschutz kann dort also nicht die Rede sein. Die Kaufhauskette „Kaufhof“ und das Internet-Reisebüro lastminute.de sind die ersten deutschen Unternehmen, die sich die neue Technik zunutze gemacht haben.\n\nMit der neuen Version von „Google Earth“ öffnet sich auch ein völlig neues Kapitel der Routenplanung bei Reisen. Je mehr Informationen gesammelt und dargestellt werden, desto besser werden die Ergebnisse bei der lokalen Suche. Einige Gebäude – vor allem in den USA – lassen sich ganz realistisch darstellen. In Deutschland dauert es jedoch noch etwas.\n\nTest","questions":{"6":{"prompt":"Das Besondere an der neuen Version von „Google Earth“ ist, dass es","options":{"A":"von der gesamten Erde ein genaues Abbild bietet.","B":"von einigen Ländern ein genaueres Abbild bietet als früher.","C":"zunächst nur in deutscher Sprache bedient werden kann."},"answer":"B"},"7":{"prompt":"Die Bilder von „Google Earth“","options":{"A":"sind aktuell, d. h., ich kann mich selbst im Garten sitzen sehen.","B":"sind alle nicht ganz neu.","C":"werden bald als aktuelle Bilder zur Verfügung stehen."},"answer":"B"},"8":{"prompt":"Für „Google Earth“ interessieren sich heute","options":{"A":"insbesondere Militärs und Immobilienhändler.","B":"Menschen aus vielen Berufsgruppen.","C":"vorwiegend die Nutzer der Enzyklopädie „Wikipedia“."},"answer":"B"},"9":{"prompt":"Negativ an „Google Earth“ ist laut Text, dass","options":{"A":"die Daten kommerziell genutzt werden.","B":"persönliche Daten öffentlich verfügbar sind.","C":"Verbrecher es nutzen."},"answer":"B"},"10":{"prompt":"Positiv an „Google Earth“ ist laut Text, dass","options":{"A":"Gebäude in Deutschland wirklichkeitsnah abgebildet werden.","B":"man damit Lokale suchen kann.","C":"man sich damit orientieren kann."},"answer":"C"}}},"2.23":{"title":"Volkskrankheit Rückenschmerzen – Ursache und Therapie","text":"Volkskrankheit Rückenschmerzen – Ursache und Therapie\n\nRückenschmerzen sind zu einer teuren Volkskrankheit geworden. In Deutschland sind sie der zweithäufigste Grund für Arztbesuche. Statistisch gesehen klagen etwa 27 Prozent der Männer und 40 Prozent der Frauen über Rückenschmerzen, etwa 70 Prozent geben an, mindestens einmal im Jahr darunter zu leiden.\n\nWie entstehen Rückenschmerzen überhaupt? Meist sind die Knochen der Wirbelsäule nicht ursächlich für den Schmerz verantwortlich. So kommt es häufig durch Verrenkungen oder Fehlbelastungen wie z. B. Sitzen, Schreibtischtätigkeit oder unsachgerechtes Tragen und Heben zu schmerzhaften Verspannungen der Rückenmuskulatur, wodurch benachbarte Nerven gereizt werden. Zunächst gelangt der akute Schmerz über Nervenbahnen ins Rückenmark und von dort aus ins Gehirn, wo der Schmerz weiterverarbeitet wird. Beim chronischen Schmerz hingegen kann die Ursache längst schon beseitigt sein, die Nervenzellen aber melden dem Gehirn immer noch Schmerzen, wo gar keine sind, weil sie im Gehirn regelrecht eingebrannt werden, wenn sie nach einer bestimmten Zeit nicht beseitigt sind.\n\nEs gibt mehrere Krankheitsbilder, die häufiger auftreten wie etwa dieses: Kommt es zu einem Austritt von Gallertmasse aus dem Bandscheibenkern, spricht man von einem Bandscheibenvorfall. In einem solchen Fall kann die Masse auf die Rückenmarksnerven drücken, und starke Schmerzen und gegebenenfalls Lähmungen und/oder Gefühlsstörungen verursachen. Die Ursachen für einen Bandscheibenvorfall sind vielfältig. Beispielsweise kann eine jahrelange Vorschädigung durch einseitige Belastung zu einem Bandscheibenvorfall führen, aber auch genetische oder muskuläre Schwächen können die Ursache sein.\n\nBewegungsmangel und Fehlhaltungen sind in der heutigen Zeit Ursache für einen rasanten Anstieg an Bandscheibenvorfällen. Kreuzschmerzen in der Lendenwirbelsäule werden medizinisch als Lumbago bezeichnet, treten sie plötzlich und heftig auf, spricht man von einem Hexenschuss. In solch einem Fall ist die Bewegungsfähigkeit stark eingeschränkt, sogar Sitzen kann sehr schmerzhaft sein. Selbst geringste Bewegungen sind aufgrund der starken Schmerzen unmöglich. Rückenschmerzen können jedoch nicht nur durch eine akute Entzündung hervorgerufen werden, häufig sind auch degenerative Abnutzungserscheinungen der Wirbelkörper-Knochen Grund für die Schmerzen.\n\nEine überwiegend Frauen betreffende Erkrankung ist die Osteoporose. Hier nimmt die Knochenmasse ab, die Reduzierung der Wirbelkörper-Höhe führt zu erheblichen Beschwerden. Verschleißerscheinungen sind aber nicht nur älteren Menschen vorbehalten, sie treten auch schon bei jungen Menschen auf. Eine häufige Krankheit bei ihnen ist die seitliche Krümmung der Wirbelsäule, Skoliose genannt. Diese entsteht während des Wachstums und verschlechtert sich in Zeiten verstärkten Körperwachstums, zum Beispiel in der Pubertät. Wirbelfehlbildungen, Muskelerkrankungen und Beinlängendifferenzen können ebenso der Grund sein.\n\nAber nicht immer sind körperliche Gebrechen Ursache für Rückenschmerzen. Auch Depressionen und psychischer Stress können ein Auslöser sein. Nicht umsonst klagen Menschen in Trauersituationen oft über starke Schmerzen. Umgekehrt können dauerhafte Rückenschmerzen auch Einfluss auf die Psyche nehmen. Leidet ein Mensch jahrelang unter andauernden Schmerzen z. B. durch einen Bandscheibenvorfall, kann ihn dies psychisch zermürben, er wird zunehmend depressiv. Jeder Schritt tut weh, man wagt es kaum noch, sich zu bewegen. Hinzu kommt die Angst, um die körperliche Leistungsfähigkeit und den Job. Erfreulich ist jedoch, dass diese Symptome oft mit einer erfolgreichen Bandscheibenoperation verschwinden.\n\nUm Rückenschmerzen vorzubeugen oder die Behandlung zu unterstützen, müssen Sie Ihren Rücken auch im täglichen Leben trainieren. Sport stärkt die Muskeln und ist gut gegen Verspannungen. Besonders geeignet sind Schwimmen und Rad fahren. Viele Krankenkassen bieten mittlerweile Rückenkurse an, hier lernen die Teilnehmer das rückengerechte Heben, Bücken und Tragen sowie eine gesunde Körperhaltung. Ebenso gibt es Kurse, in denen man erfährt, wie man durch eine gesunde Ernährung Rückenproblemen vorbeugen oder Beschwerden lindern kann. Treten Rückenschmerzen aber häufiger auf, sollen Sie zum Arzt gehen. Dieser kann ausschließen, dass eine ernsthafte Erkrankung vorliegt, und die weitere Therapie mit Ihnen besprechen. Oft sind Massagen und Krankengymnastik effektive Maßnahmen, um die Schmerzen zu lindern und weiteren Beschwerden vorzubeugen.\n\nTest","questions":{"6":{"prompt":"Zwei US Highschool-Schüler sind","options":{"A":"mit dem Geld ihres Bruders reich geworden.","B":"durch eine einfache Idee reich geworden.","C":"durch eine einfache Idee und mit der finanziellen Hilfe ihres Bruders reich geworden."},"answer":"C"},"7":{"prompt":"Ähnliche Internetseiten sind heutzutage","options":{"A":"nur in den USA beliebt.","B":"sowohl in den USA als auch in Deutschland erfolgreich.","C":"überall sehr populär."},"answer":"B"},"8":{"prompt":"Die Idee von Catherine und David Cook wurde erfolgreich, weil","options":{"A":"sie Treffen für Ex-Schüler im Internet organisiert haben.","B":"sie eine Internetseite gegründet haben, die ihrem Schulhof ähnlich ist.","C":"alle für die Schüler wichtigen Sachen auf dieser Seite genauso passieren, als wäre es in der eigenen Schule."},"answer":"C"},"9":{"prompt":"Die Jugendlichen in den USA benutzen solche Netzwerke","options":{"A":"um über die Highschool-Welt informiert zu sein.","B":"um ihre Freizeit virtuell verbringen zu können.","C":"um mit Freunden chatten zu können."},"answer":"B"},"10":{"prompt":"Catherine ist","options":{"A":"als Studentin an der Georgetown University bereits Millionärin.","B":"noch immer an ihrer Seite angemeldet.","C":"mit den 3065 Jungs auf ihrer Profilseite beschäftigt."},"answer":"B"}}},"2.25":{"title":"Leseverstehen, Teil 2","text":"Wir brauchen überall mehr Visionäre\n\nDer Expeditionsleiter Arved Fuchs über die Faszination und den Sinn von Grenzerfahrungen.\n\nDas Wort Abenteurer, wie es in Bezug auf mich so pauschal verwendet wird, habe ich immer ganz anders verstanden. Abenteurer ist für mich etwas, das im Kopf stattfindet. Die Freiheit, das Unmögliche zu denken, Dinge zu wagen, von denen andere erst einmal sagen: Das geht nicht.\n\nDie Freiheit aufzubrechen hat mich schon in meiner Jugend durchdrungen. Und einzutauchen in Naturlandschaften bringt einen auch wirklich vorwärts. Träume, aus denen Visionen entstehen, braucht aber nicht nur das Individuum für sich, sondern auch die Gesellschaft als Ganzes. Denn Visionen sind es, die Aktivitäten generieren. Wenn man sich in der Welt umblickt, entdeckt man mannigfaltige Probleme. Wir brauchen daher mehr Visionäre auf allen Gebieten, ganz besonders aber im Umweltschutz und beim Thema Klimawandel.\n\nDie Polarregionen haben mich schon immer fasziniert. Es sind die Regionen, in denen man dem Weltraum am nächsten ist: Ohne Hilfsmittel sind sie eigentlich nicht bewohnbar. Doch ist es nicht mehr unsere Aufgabe, Neuland zu erobern – es gibt heute auch keine weißen Flecken mehr auf der Landkarte. Die Erde ist entdeckt. Aber es gibt die weißen Flecken auf meiner persönlichen Landkarte. Ich selbst entdecke diese Landschaften und dabei auch mich selbst, indem ich mich mit diesen Naturlandschaften auseinandersetze.\n\nDas gilt in ganz besonderem Maße für eine Nordpolexpedition, die ich 1989 durchgeführt habe. Mit Teilnehmern aus acht verschiedenen Nationen, einem internationalen Team, tausend Kilometer unterwegs über diesen zugefrorenen Ozean – das ist nicht immer nur Spaß. Es ist auch eine Tour der Leiden, mit Erfrierungen und Ähnlichem. Aber man kommt dabei wirklich an die Natur heran. Ich persönlich verbinde sehr viel mit dieser Expedition. Dabei galt tatsächlich der Satz: Der Weg ist das Ziel. Das Zusammenwirken von acht unterschiedlichen Menschen aus acht verschiedenen Kulturkreisen, die sich zusammenraufen mussten, um diese schwierige Aufgabe zu meistern: Das ist eine Lebensschule.\n\nWenn man mich fragt: „Wem nützt das?“, so ist meine Antwort: Zuallererst nützt es mir. Ich möchte das tun, und ich schade ja durch mein Tun niemandem. Ich realisiere solche Träume, solche Visionen für mich. Ich verstehe diese Expeditionen als eine Plattform, um Menschen Zugang zu diesen Landschaften zu gewähren, Menschen, die nicht selbst vor Ort sein können. Ich reise sozusagen als Stellvertreter dorthin, ich betreibe Lobbyarbeit für diese Naturlandschaften und die indigenen Völker, die dort leben und immer die Leidtragenden sind, wenn sich etwas verändert.\n\nIch wollte nie aussteigen oder die Brücken hinter mir abbrechen. Mir ist das Leben hier auch sehr wichtig – Freunde und Familie bedeuten mir viel und auch die Annehmlichkeit der Zivilisation weiß ich zu schätzen. Ich glaube, wenn man sich auf Dauer entfernt, versteht man nicht mehr, was die Menschen beschäftigt. Davor hatte ich immer ein wenig Angst. Heute habe ich sie nicht mehr, auch wenn ich einen Teil des Jahres in der Natur verbringe und anderen Gesetzmäßigkeiten unterworfen bin. Auf diesen Reisen in die Natur lernt man Demut – vor der Natur, vor der Schöpfung.\n\nWir versuchen, unsere Eindrücke auch direkt an junge Menschen weiterzugeben. Im Sommer 2007 gab es am Spitzbergen ein Jugendcamp, in das selbst Jugendliche aus China reisten, um sich unter wissenschaftlicher Anleitung theoretisches Grundwissen über die Polarregion anzueignen. Im zweiten Teil nahmen wir sie mit hinaus, damit sie praktisch erfahren, was ein Gletscher ist. Wir wollen die Jugend begeistern für die Einzigartigkeit dieser Natur, damit sie als Botschafter dieser Landschaften in ihre Länder zurückkehren und bei ihren Altersgenossen als Multiplikatoren wirken.\n\nBald werden wir wieder aufbrechen ins Eis, dann beginnt erneut die Wanderung von dieser Welt in die andere. Ich freue mich sehr darauf – so wie ich mich auch darauf freue, wieder nach Hause zurückzukehren.","questions":{"6":{"prompt":"Arved Fuchs findet Visionen wichtig, weil sie","options":{"A":"die Menschen dazu bringen, etwas zu tun.","B":"Menschen zeigen, wie man sich beruflich verwirklichen kann.","C":"Politikern helfen, ihre Ziele umzusetzen."},"answer":"A"},"7":{"prompt":"Arved Fuchs meint, für die Menschen sei es eine Herausforderung,","options":{"A":"immer neue Regionen zu entdecken.","B":"in der Begegnung mit der Natur sich selbst besser kennenzulernen.","C":"die Polarregion zu industrialisieren."},"answer":"B"},"8":{"prompt":"Bei seiner Nordpolexpedition 1989 war für Arved Fuchs die wichtigste Erfahrung,","options":{"A":"auch in der Kälte Spaß haben zu können.","B":"ein zugefrorenes Meer zu überqueren.","C":"mit Menschen aus verschiedenen Kulturen im Team zu arbeiten."},"answer":"C"},"9":{"prompt":"Arved Fuchs sieht seine Expeditionen als eine Möglichkeit,","options":{"A":"sanften Tourismus zu betreiben.","B":"sich für Natur und Bewohner der Polarregionen zu engagieren.","C":"wissenschaftliche Forschungen durchzuführen."},"answer":"B"},"10":{"prompt":"Das Ziel von Arved Fuchs ist es, dass Jugendliche","options":{"A":"die Polarregion wissenschaftlich erforschen.","B":"mit ihrem Engagement für die Polarregion andere Jugendliche anstecken.","C":"später Botschafter ihrer Länder werden."},"answer":"B"}}},"2.26":{"title":"Leseverstehen, Teil 2","text":"Freizeitbegriff\n\nDas Freizeitverständnis hat sich grundlegend gewandelt. Quantitativ und qualitativ unterscheidet sich die Freizeit heute von früheren Freizeitformen. Auch gegenwärtig findet Erholung von der Arbeit in der Freizeit statt, aber diese Freizeit ist nicht mehr nur – wie in den fünfziger Jahren – Erholungszeit. Für die überwiegende Mehrheit der Bevölkerung hat Freizeit einen eigenständigen Wert bekommen. So vertreten 70% der Bevölkerung die Auffassung, dass Freizeit in erster Linie eine Zeit ist, die man tun und lassen kann, was einem Spaß macht. Aus einem arbeitsabhängigen Zeitbegriff, der Freizeit negativ als Abwesenheit von Arbeit definierte, hat sich heute ein positives Freizeitverständnis entwickelt: Freizeit ist eine Zeit, in der man frei ist.\n\nÜber vierzig Jahre Arbeitszeitverkürzungen sind an den Menschen und ihrer Einstellung zum arbeitsfreien Teil des Lebens nicht spurlos vorübergegangen. Freizeit ist mehr als eine Pause, in der man sich für den nächsten Arbeitstag wieder erholt. Freizeit koppelt sich von der Arbeit ab: Nur für eine Minderheit der Bevölkerung ist Freizeit eine Zeit, die nicht mit Arbeit und Geldverdienen ausgefüllt ist (26%). Dies gilt für Arbeiter (38%) genauso wie für Angestellte (34%) oder Selbstständige (30%). Bei Freizeit denken die meisten erst einmal an den eigenen Spaß. Freizeit ist daher mehr ein positives Lebensgefühl als eine arbeitsabhängige Zeitkategorie. Im subjektiven Empfinden der Menschen sind „arbeitsfreie Zeit“ und „Freizeit“ nicht mehr dasselbe. Mit dem Wandel des subjektiven Freizeitverständnisses ist auch eine gesellschaftliche Neubewertung der Freizeit notwendiger denn je.\n\nVor dem Hintergrund des wachsenden Anteils Nichterwerbstätiger lässt sich für die Zukunft unschwer prognostizieren: Freizeit verliert zunehmend ihre Bedeutung als arbeitsfreie Regenerationszeit. Umso mehr richten sich dann die Hoffnungen auf die Freizeit als Synonym für Lebensqualität und Wohlbefinden. Dies aber heißt sich wohlfühlen, das tun und lassen können, was Spaß und Freude macht, und das Leben in eigener Regie gestalten sowie viel mit Familie und Freunden unternehmen.\n\nFreizeitrituale\n\nAlles hat seine Regeln und Rituale, auch die Freizeit. Die Deutschen haben ihre Freizeit bestens organisiert: samstags auf die Piste und sonntags mit der Familie. Fast jeder dritte Bundesbürger reserviert regelmäßig einen Wochentag für Familie oder Ausgehen, für Sport oder Faulenzen. Mehr als 20% kennen ebenfalls einen festen Termin für Hobby, Verein oder Besuche. Und selbst der Badetag ist für jeden vierten Deutschen nach wie vor ein Begriff.\n\nTrotz kürzerer Arbeitszeiten konzentrieren sich die meisten Freizeittermine auf das lange Wochenende. Ausgehen und Besuche machen stehen ebenso auf dem Programm wie Faulenzen, lesen oder sich dem Hobby widmen. So hat der Samstag für jeden dritten Bundesbürger seinen festen Platz als Hauptausgehtag. Der sonntägliche Terminkalender bestimmen dann bei der Mehrheit der Befragten die beiden „F“: Faulenzen und Familie. Für viele wird damit der Sonntag zum Balanceakt zwischen eigener und gemeinsamer Freizeitgestaltung. Denn auch die Zweisamkeit darf nicht zu kurz kommen.\n\nFür sechs Prozent der Deutschen ist der siebte Tag der Woche ein „Schmusetag“. Freizeitrituale, bisher kaum erforscht, hatten im Alltagsleben der Bevölkerung schon immer ihren festen Platz. Was als liebe Gewohnheit oder Alltagsroutine beginnt, kann zum eingeübten Handlungsmuster und starren Ordnung werden: von den Begrüßungs-, Wasch- und Umziehritualen nach Feierabend bis zum gemeinsamen Frühstück und Familienspaziergang am Sonntag. Solche eingespielten und liebgewordenen Gewohnheiten geben den Menschen im Alltag Struktur und Halt. Gerade im Zusammenleben von Familienmitgliedern haben Rituale eine wichtige Stabilisierungsfunktion. Dahinter verbirgt sich das Bedürfnis nach Sicherheit und Geborgenheit, der Wunsch nach einem harmonischen Feierabend oder schönen Wochenende.","questions":{"6":{"prompt":"Siebzig Prozent der Bevölkerung meinen, dass Freizeit","options":{"A":"nach den eigenen Vorlieben gestaltet werden soll.","B":"nicht unbedingt positiv besetzt ist.","C":"nur dem Ausruhen und Schlafen dienen sollte."},"answer":"A"},"7":{"prompt":"Die Mehrheit der Leute nutzt ihre Freizeit","options":{"A":"für die eigenen Interessen.","B":"zur Aufbesserung des Einkommens.","C":"zur Regeneration für den nächsten Arbeitstag."},"answer":"A"},"8":{"prompt":"Die Deutschen","options":{"A":"gehen nur an Wochenenden ihren Hobbys nach.","B":"organisieren ihre Freizeit gar nicht.","C":"organisieren ihre Freizeit meistens gut und reservieren für ihre Aktivitäten bestimmte Wochentage."},"answer":"C"},"9":{"prompt":"Der Sonntag ist bei vielen reserviert für","options":{"A":"das Ausgehen.","B":"die Freizeitgestaltung mit Freunden oder Kollegen.","C":"Familie und Entspannung."},"answer":"C"},"10":{"prompt":"Freizeitrituale","options":{"A":"schwächen den Gruppenzusammenhalt.","B":"sind für die moderne Familie nicht mehr von Bedeutung.","C":"waren bislang noch nicht oft Gegenstand wissenschaftlicher Untersuchungen."},"answer":"C"}}},"2.27":{"title":"Leseverstehen, Teil 2","text":"Alles Englisch oder was?\n\nWerbeagenturen bevorzugen englischsprachige Werbebotschaften\n\nDie Welt der Werbung wird in Deutschland zunehmend Englisch: „Come in and find out“ wirbt eine Kosmetikkette, „We can help“ bietet ein Telekommunikationsunternehmen auf Werbeseiten in Zeitschriften an, „Think what you drink“ fordert eine Getränkefirma werbewirksam. Doch auch in deutschsprachigen Werbesprüchen steckt vermehrt Englisches: alles ist easy, das Messaging-Mobiltelefon der neueste Schrei.\n\nIn Werbekreisen gilt die englische Sprache als fortschrittlich, zukunftsweisend und weltoffen. „Die Zukunft ist Englisch.“ Diese Aussage scheint Werbetexter und Marketingstrategen bei der Auswahl ihrer Werbebotschaften zu leiten. Die USA wecken bei vielen Menschen Träume von Freiheit und unbegrenzten Möglichkeiten. Warum also nicht die Sprache Amerikas gewinnbringend einsetzen, auf dass sich deutsche Produkte in Deutschland besser verkaufen? Und außerdem sind da auch noch handfeste finanzielle Interessen: Eine Werbeanzeige für den globalen Markt muss – in der Sprache der globalen Welt, auf Englisch abgefasst – nur einmal hergestellt werden, ohne teure nationale Varianten.\n\nOb allerdings die Konsumenten genauso reagieren, wie es sich die Englisch denkende Werbebranche erhofft, das darf jetzt angezweifelt werden. Eine Untersuchung an der Universität Dortmund brachte es an den Tag. Werbesprüche auf Deutsch kommen viel besser bei den deutschen Käufern an als fremdsprachige. Deutsche Werbesprüche bedienen sich oft des Wortspiels und des Wortwitzes. Das „Geiz ist geil“ einer Elektronikmarktes, das „erste Mahl vergisst man nie“ für ein Agrarprodukt aus Deutschland oder das „Wohnst du noch oder lebst du schon?“ eines schwedischen Möbelhauses haben auf die Konsumenten eine starke Wirkung. Deutsche Werbesprüche prägen sich ein, werden sogar zu allgemeinen Bestandteilen der Umgangssprache, die in alltäglichen Situationen völlig losgelöst von der Werbung für ihr Produkt verwendet werden.\n\nDeutsche Werbesprüche wie der einer Haushaltsgerätefirma, die weiß, was Frauen wünschen oder der für eine Schokolade, die quadratisch, praktisch, gut ist, wurden bereits vor Jahrzehnten eingeführt und sind immer noch in Gebrauch, in der Werbung wie in der Alltagssprache. Besonders die Kundschaft über 40 lässt sich von deutschsprachigen Botschaften um ein Vielfaches leichter überzeugen als von englischen. Aber auch junge Leute in Deutschland schätzen es, dass sich der Sinn der Werbeaussage für sie in der Muttersprache eher erschließt als im Global-Englisch, das für die deutsche Kundschaft oft überhaupt keinen Sinn ergibt.","questions":{"6":{"prompt":"Werbeanzeigen in Deutschland sind","options":{"A":"nur noch auf Englisch.","B":"immer häufiger auf Englisch.","C":"zunehmend, seitdem sie auf Englisch sind."},"answer":"B"},"7":{"prompt":"Die englische Sprache","options":{"A":"wird in Zukunft von den meisten Menschen gesprochen werden.","B":"wird von den Werbemachern für die Sprache der Zukunft gehalten.","C":"wird in Zukunft in den Werbeagenturen gesprochen werden."},"answer":"B"},"8":{"prompt":"Manche Werbesprüche auf Deutsch","options":{"A":"werden zu Witzen, die sich die Leute erzählen.","B":"werden von den Leuten stark konsumiert.","C":"vergessen die Leute nicht."},"answer":"C"},"9":{"prompt":"Werbesprüche","options":{"A":"erreichen besonders gut die Wünsche der Frauen.","B":"werden seit Jahrzehnten vorwiegend zu Werbezwecken benutzt.","C":"können zu Redewendungen in der Umgangssprache werden."},"answer":"C"},"10":{"prompt":"Deutsche Konsumenten","options":{"A":"verstehen manchmal nicht, was mit englischen Werbeaussagen gemeint ist.","B":"haben keinen Sinn für die englische Sprache.","C":"können oft kein Englisch."},"answer":"A"}}},"2.28":{"title":"Leseverstehen, Teil 2","text":"Dialekte in Deutschland\n\nWie heißt das runde Gebäck, das viele Leute so gerne zum Frühstück essen, in Ihrer Region? Semmel vielleicht? Oder Weck? Oder Schrippe? Im Atlas zur deutschen Alltagssprache (AdA) werden mehr als zehn verschiedene Begriffe für Brötchen aufgelistet, die in unterschiedlichen Regionen Deutschlands verwendet werden.\n\nDialekte, oder auch Mundarten genannt, sind regionale Varianten einer Sprache. Sie unterscheiden sich nicht nur im Wortschatz (z. B. Brötchen vs. Schrippe), sondern auch in der Grammatik und in der Aussprache von anderen Varianten der gleichen Sprache. In Deutschland gibt es knapp 20 große Dialektgruppen, die wiederum in zahlreiche Untergruppen aufgeteilt sind.\n\nJeder zweite Deutsche gibt an, einen Dialekt sprechen zu können. Besonders viele Dialektsprecher findet man im Süden und Südwesten Deutschlands, und so scheint es nicht verwunderlich, dass Bairisch zu den Dialekten gehört, die in Deutschland am meisten gesprochen und außerdem als besonders sympathisch empfunden werden. Auf der Beliebtheitsskala der deutschen Dialekte rangiert Bairisch in der Regel sehr weit oben und landete in diesem Jahr – wie auch schon im Vorjahr – auf dem zweiten Platz, hinter dem Spitzenreiter Norddeutsch. Auf den Plätzen dahinter folgten Berlinerisch und Rheinländisch, die insgesamt ebenfalls sehr positiv bewertet wurden.\n\nDie Beliebtheitsskalen sollen aber nicht darüber hinwegtäuschen, dass Dialekte in Deutschland oft ein Imageproblem haben. Menschen, die Hochdeutsch sprechen, werden häufig als gebildeter und intelligenter wahrgenommen als Dialektsprecher – völlig zu Unrecht, wie man inzwischen weiß. Dennoch hält sich das Vorurteil hartnäckig und die Ursachen dafür liegen oft in der Schulzeit. Sara Thiel (24) studiert Sprachwissenschaften und erinnert sich:\n\n„Bei uns auf dem Gymnasium war es verpönt, Dialekt zu sprechen. Wer kein Hochdeutsch sprach, wurde von den Lehrern immer wieder ermahnt, doch ‚richtiges Deutsch‘ zu sprechen. Manche Mitschüler machten sich über Dialektsprecher sogar lustig. Das hat mich damals so sehr geprägt, dass ich mir den Dialekt, den ich als Kind von meinen Eltern übernommen hatte, bewusst abgewöhnt habe. Inzwischen bereue ich das und wünschte mir, Dialekt sprechen zu können. Es ist schließlich ein Stück unserer Kultur.“\n\nDas schlechte Image, das viele Dialekte hatten – und zum Teil noch haben – ist sicherlich auch einer der Gründe, warum sie immer weniger gesprochen werden. Während Anfang der 90er-Jahre noch etwa 40 Prozent der Menschen in Ostdeutschland behaupteten, Dialekt sei ihre normale Alltagssprache, sind es heute nur noch knapp über 30 Prozent. In Westdeutschland ist die Entwicklung ähnlich rückläufig. Dass Dialekte in Zukunft komplett aussterben könnten, wie es immer wieder vorausgesagt wird, ist trotzdem nicht zu befürchten. Wahrscheinlich ist allerdings, dass sich lokale Dialekte, die nur in kleinen Regionen gesprochen werden, immer mehr angleichen. Das läuft darauf hinaus, dass es voraussichtlich irgendwann weniger und dafür großräumigere Dialekte geben wird.\n\nDiesen Veränderungen sehen einige gelassen entgegen – mit der Begründung, dass Sprache nicht statisch sei, sondern immer in Bewegung. Andere dagegen versuchen, den Rückzug der Dialekte aufzuhalten und den Stellenwert der Mundarten gezielt zu stärken.\n\nViele Initiativen, die das Dialektsprechen fördern wollen, sind an Schulen ins Leben gerufen worden. Der Dialekt in Hamburg heißt Plattdeutsch und wurde dort im Jahr 2010 an einigen Grundschulen sogar als eigenes Schulfach eingeführt. Denn man hatte festgestellt, dass der Anteil der Menschen, die Plattdeutsch sprechen, zurückgeht. Außerdem zeigen Untersuchungen, dass Kinder, die mit Dialekten aufwachsen, häufig leichter weitere Sprachen lernen.","questions":{"6":{"prompt":"Bairisch","options":{"A":"belegt zum zweiten Mal Platz eins auf der Beliebtheitsskala.","B":"war im letzten Jahr beliebter als der norddeutsche Dialekt.","C":"wurde in diesem Jahr positiver bewertet als Berlinerisch."},"answer":"C"},"7":{"prompt":"Sara Thiel hat","options":{"A":"ihre Einstellung zum Dialektsprechen geändert.","B":"während ihrer gesamten Schulzeit Dialekt gesprochen.","C":"während ihrer Schulzeit keine negativen Erfahrungen mit ihrem Dialekt gemacht."},"answer":"A"},"8":{"prompt":"In Zukunft wird","options":{"A":"es deutschlandweit keine Dialekte mehr geben.","B":"es in Deutschland nicht mehr so viele unterschiedliche Dialekte geben.","C":"man nur noch in Ostdeutschland Dialekt sprechen."},"answer":"B"},"9":{"prompt":"Im Bundesland Hamburg","options":{"A":"ist die Anzahl der Dialektsprecher um zehn Prozent gesunken.","B":"können Grundschulkinder seit 2010 in der Schule Plattdeutsch lernen.","C":"können immer noch viele Menschen Plattdeutsch sprechen."},"answer":"B"},"10":{"prompt":"Eine Untersuchung zeigt, dass","options":{"A":"Dialekte keinen Einfluss auf die Lernfähigkeit haben.","B":"Dialektsprecher leichter Fremdsprachen lernen.","C":"Kinder, die Dialekt sprechen, mehr Probleme mit Fremdsprachen haben."},"answer":"B"}}},"2.29":{"title":"Leseverstehen, Teil 2","text":"Kaffeehäuser werben für Wien\n\nWien als Stätte eines besonderen Lebensstils – Stichwort Kaffeehaus – in aller Welt noch bekannter zu machen, hat sich eine Fachgruppe der Kaffeehäuser vorgenommen.\n\nFür den „echten Wiener“ gibt es tausenderlei Gründe, um ins Kaffeehaus zu gehen: um Kaffee zu trinken, um Zeitungen zu lesen, um geschäftliche oder private Rendezvous zu erledigen, um zu philosophieren oder nur vor sich hin zu meditieren, um Schach, Billard oder Bridge zu spielen, um Briefe zu schreiben – kurz gesagt, um verweilen als sonst üblich zu leben.\n\nDie Fachgruppe der Wiener Kaffeehäuser versucht nun im Rahmen einer groß angelegten Aktion, diese Wiener Kaffeehaus-Kultur wieder mehr ins Rampenlicht zu stellen und damit den Bekanntheitsgrad von Wien als Stätte eines besonderen Lebensstils zu erhöhen. Dabei wendet sie sich gezielt an internationale Journalisten, die sich bei größeren Anlässen oft zu tausenden in Wien befinden. Ihnen will man in Zukunft den Stellenwert des Kaffeehauses in dieser Stadt qualitätsbewusst näherbringen. Die Wiener Kaffeehäuser werden zum Treffpunkt der Weltpresse.\n\nLaut Pressechef der Wirtschaftskammer stammt die Grundidee für diese Aktion von Franz Grundtall, dem Vorgänger des jetzigen Fachgruppenvorstehers Hans Diglas. Diglas und seine Mitstreiter nehmen den Gedanken voll Engagement auf. Das Konzept für „Wien Brüh-Heiß“ liegt nun vor und verspricht einige interessante Events.\n\nGeplant sind Veranstaltungen, die das Wichtigste, Farbenfrohe, ja manchmal Skurrile der Wiener Kaffeehaus-Kultur zeigen sollen. Vorgesehen sind etwa ein 150-minütiges Medienereignis und ein echt blitzlichtiges Veranstaltungsende. Ende des Monats im Café Landtmann, das heuer zudem seinen 125. Geburtstag feiert, teilnehmen werden.\n\nBei einem typischen Wiener Buffet, vom Tafelspitz bis zur Wiener Schankerl, werden die Gäste aus aller Welt verwöhnt und danach gibt es – ergänzt der nicht weniger versierte Veranstaltungsdirektor – verschiedene Vorträge und Ansprachen – eine Damenkapelle mit echter musikalischer „Wiener Mischung“. Denn Musik ist bekanntlich jene Sprache, die auf der ganzen Welt verstanden wird.\n\nAls Draufgabe gibt es am Ende für jeden Teilnehmer eine in drei Sprachen abgefasste Informationsbroschüre, die über die Geschichte des Wiener Kaffeehauses informiert, alte Wiener Rezepte vorstellt sowie die Fülle von Wissenswertem anbietet.\n\nJeder einzelne Journalist hat also die Möglichkeit, persönliche Eindrücke und eigene Notizen mit fundierten Informationen zu versehen und kann so schnell und ohne großen Aufwand seinen Redaktionen einen Artikel zukommen lassen. Um das gute Ruf des Wiener Kaffeehauses in aller Welt zu verbreiten und zu verkünden, dass die Kaffeehäuser eine der wichtigsten Sehenswürdigkeiten dieser Stadt sind.","questions":{"6":{"prompt":"Das Ziel der Aktion der „Fachgruppe für Wiener Kaffeehäuser“ ist,","options":{"A":"das Angebot in Wiens Kaffeehäusern zu verbessern.","B":"die Zahl der Kaffeehäuser in Wien wieder zu erhöhen.","C":"Wien und die Wiener Kaffeehaus-Kultur bekannter zu machen."},"answer":"C"},"7":{"prompt":"Die Aktion der „Fachgruppe für Wiener Kaffeehäuser“ richtet sich vor allem","options":{"A":"an ausländische Touristen.","B":"an die Wiener Bevölkerung.","C":"an internationale Journalisten."},"answer":"C"},"8":{"prompt":"Die Idee für diese Aktion","options":{"A":"hatte der Vorgänger von Hans Diglas.","B":"hatten die Mitarbeiter von Hans Diglas.","C":"hatte der Pressechef der Wirtschaftskammer."},"answer":"A"},"9":{"prompt":"Bei den Veranstaltungen gibt es","options":{"A":"ein Buffet und Musik.","B":"einen Vortrag in drei Sprachen.","C":"typische Wiener Kaffee-Spezialitäten."},"answer":"A"},"10":{"prompt":"Am Ende bekommen die Teilnehmer","options":{"A":"ein Buch für persönliche Eindrücke und Notizen.","B":"einen Artikel über Wiens bekannteste Kaffeehaus-Journalisten.","C":"viele Informationen über die Wiener Kaffeehäuser und deren Geschichte."},"answer":"C"}}},"2.30":{"title":"Leseverstehen, Teil 2","text":"Lustvolles Lernen im Futurum\n\nSchweden erprobt die Schule der Zukunft – ohne Stundenplan und Klassenzimmer\n\nEs war eine Klassenfahrt ins gelobte Gesamtschulland: Die Gewerkschaft Erziehung und Wissenschaft (GEW) hatte Ende Januar 18 deutsche Erziehungswissenschaftler und Journalisten zu einem Besuch nach Schweden eingeladen, und siehe da, die Reisenden waren beeindruckt. Selbst gestandene Kritiker dieser Schulform kamen ins Grübeln. „Was ich hier gesehen habe, kann selbst einen Gesamtschulgegner wie mich dazu bringen, seine Meinung zu ändern. Ich bin begeistert“, schwärmte ein Kollege. Schweden steht gut da im internationalen Schülertest. Und das, obwohl die Skandinavier ein Schulsystem pflegen, das hierzulande vielen als zweite oder dritte Wahl gilt. Bis zur achten Klasse werden die schwedischen Schüler nicht benotet und bis zur neunten gemeinsam unterrichtet.\n\nAber das Etikett Gesamtschule allein sagt wenig. Einer der Reisenden, der Schulforscher Hans-Günther Rolff, erinnerte sich, wie er vor mehr als 30 Jahren hoffnungsvoll nach Schweden fuhr, das schon seit 1962 nur noch die Einheitsschule kennt. Damals fand er nichts, was ihn hätte begeistern können. Alle Schüler besuchten zwar die gleiche Schule, aber der Unterricht hatte sich nichts geändert.\n\nDiesmal fand Rolff seinen Augen nicht und staunte beispielsweise über eine Schule, die sich selbstbewusst Futurum (lateinisch: Zukunft) nennt. Schon die Architektur erinnert nicht mehr an Schule. Die Besucher haben den Eindruck einer Führung durch Ateliers und Labors. Sie sehen Räume, in denen Schüler gemeinsam in Arbeitsgruppen oder still für sich lernen, staunen über Lehrerbüros oder Schreibtisch und Computer für jeden Pädagogen oder über ein professionelles Musikstudio. Alle Räume sind um einen runden, hellen Großraum gebaut, der an einen Dorfplatz erinnert.\n\nNach zwei Stunden fragt einer der Bildungstouristen den Lehrer, der uns führt: „Kommen wir denn auch mal Unterricht sehen?“ Das Echo kommt prompt: „Das hier ist unser Unterricht.“\n\nFuturum ist ein Umbau – übrigens sind alle Schulen in Haninge, einem Landkreis 40 Kilometer westlich von Stockholm, neu oder umgebaut. Die Region gilt als besonders aufstrebend in Schweden und versucht, mit ihrem Bildungsangebot junge Familien anzuziehen. Ältere begeisterte Menschen, die jahrelang an Teams, offenen Büros und nach einer solchen Schule gearbeitet haben, sind inzwischen ebenfalls Teil des Konzepts.\n\nEtwa zehn Prozent der schwedischen Schulen haben wie Futurum begonnen, nicht nur Lehrpläne und die Methoden des Unterrichts zu reformieren, sondern auch den Raum und die Zeit neu zu definieren, in denen der Unterricht stattfindet. Als „Schritte aus der Industrie- in die Wissensgesellschaft“ bezeichnet dies der Lehrer Hans Ahlenius.\n\nKonkret sieht die praktizierte Zukunft so aus: Auf rund tausend Schüler kommen 180 Lehrer, also fünf bis sechs Schüler pro Pädagoge (von denen viele Teilzeit beschäftigt sind). Alle verteilen sich auf sechs kleine Schulen, die jeweils um einen dieser großen Plätze gruppiert sind. Zu diesen kleinen Schulen gehören rund 150 Kinder und Jugendliche im Alter von 6 bis 16 Jahren. Sie sind abermals in zwei Stämme geteilt, hier die Klassen eins bis vier, dort die Fünfte bis zur Neunten, „je älter die Schüler sind“, erklärt Hans Ahlenius, „desto stärker sind die Altersgruppen gemischt“. Da lernt zum Beispiel in Physik ein 12-Jähriger zusammen mit 15-Jährigen.\n\nIm schwedischen Futurum dokumentiert jeder Schüler täglich in einem „Logbuch“, was er sich vornimmt und was er dann auch getan hat. Notiert werden auch die nächsten, mit den Lehrern vereinbarten Lernschritte. Das Logbuch ist somit ein individueller Lehrplan, der quasi den Stundenplan ersetzt. Es ist Sache der Schüler, ob sie ihre wöchentlichen Matheübungen am Mittwochnachmittag oder erst am Donnerstag machen. Aber sie müssen vereinbarte dreizehn Rechenaufgaben ablegen und den vereinbarten Lernstoff kontrollieren und Besprechungen mit den Lehrern vornehmen. Die finden vor großem Auditorium oder in kleinen Gruppen statt.\n\nDiese Lehreranzahl zeigen manche höchstens die Hälfte der Unterrichtszeit aus. „Davon sind wir wenigstens noch ein Jahrzehnt entfernt“, seufzt der Essener Erziehungswissenschaftler Klaus Klemm nicht ohne Neid.\n\nDas derzeit wichtigste Thema an der schwedischen Schulen heiße Individualisierung oder „Wie man den Schülern die Lust am Lernen erhält“, sagt Mats Ekholm, Direktor der nationalen Bildungsagentur Skolverket. Seine Agentur überwacht den Abschlusstest, den auch im Futurum alle Schüler am Ende ihrer Gesamtschulkarriere in Schwedisch, Mathematik und Englisch absolvieren müssen. Diese Prüfungen ermöglichen einen landesweiten Vergleich des Leistungsstandes der Schüler, der im Internet veröffentlicht wird. Für die deutschen Gäste wiederholt Ekholm die einfache Maxime: „Alle Kinder bringen die Lust am Lernen mit. Es gilt nur, diese zu erhalten.“","questions":{"6":{"prompt":"Der Schulforscher Hans-Günther Rolff","options":{"A":"arbeitet seit 1982 in Schweden.","B":"hält das schwedische Schulsystem für zweit- oder drittklassig.","C":"war vom schwedischen Schulsystem zunächst nicht überzeugt."},"answer":"C"},"7":{"prompt":"Gelernt wird im Futurum in Arbeitsgruppen","options":{"A":"immer unter Anleitung von Pädagogen.","B":"unterschiedlichen Alters.","C":"immer zu gleichen Uhrzeiten."},"answer":"B"},"8":{"prompt":"Futurum ist als Schule attraktiv, weil","options":{"A":"die Ausstattung besonders gut ist.","B":"die Schule mitten auf einem Dorfplatz angesiedelt ist.","C":"jeder Schüler einen eigenen Schreibtisch und Computer hat."},"answer":"A"},"9":{"prompt":"Die Schüler","options":{"A":"besprechen ihre Lernschritte grundsätzlich in kleinen Gruppen.","B":"besprechen täglich ihre Lernschritte mit ihrem Lehrer.","C":"tragen ihre Lernschritte in ein Logbuch ein."},"answer":"C"},"10":{"prompt":"Im Futurum","options":{"A":"gibt es einen Abschlusstest in drei Fächern.","B":"gibt es insgesamt 160 Schüler.","C":"lernen 6- und 16-Jährige gemeinsam."},"answer":"A"}}},"2.31":{"title":"LESEN, TEIL 2","text":"Ab wann ist Kaffee ungesund?\n\nKaffee, Espresso und Cappuccino schmecken gut und helfen aus dem Konzentrationstief. Aber wie viele Tassen am Tag sind okay? Und wie schaffe ich es, weniger Kaffee zu trinken und trotzdem konzentriert zu arbeiten?\n\nMorgens gibt es nur eine Sache, die meine Mundwinkel nach oben schiebt: Ein starker Espresso, aufgeschäumt mit warmer Milch. Koffein bleibt den ganzen Tag über mein treuer Begleiter: Sobald ich merke, dass meine Konzentration nachlässt, trinke ich Kaffee. Jedes Mal, wenn eine Tasse geleert habe, fühle ich mich wieder fit und arbeitswillig. Am Tag komme ich so aber auf sechs Tassen Kaffee oder Espresso. Ist das noch gesund? Und wirkt der Kaffee überhaupt noch?\n\nZunächst einmal: Kaffee hilft wirklich. Das enthaltene Koffein stimuliert das zentrale Nervensystem, erklärt die Ernährungswissenschaftlerin Isabelle Keller von der Deutschen Gesellschaft für Ernährung. Die Folge: Herz, Kreislauf, die inneren Organe und die Verdauungstätigkeiten werden angeregt. „Die Müdigkeit wird beseitigt, die Stimmungslage wird verbessert und wir können uns besser konzentrieren“, zählt Keller die Vorteile auf. Auch beim Sport ist die leistungssteigernde Wirkung von Koffein bekannt.\n\nAllerdings gibt es beim Koffein tatsächlich einen Gewöhnungseffekt: Bei Dauertrinkern wie mir ist die stimulierende Wirkung längst nicht so groß wie bei jemandem, der nur ab und zu eine Tasse Kaffee trinkt. Aber auch allgemein vertragen die Menschen Koffein unterschiedlich gut – es gibt einige, die viel Kaffee in kurzer Zeit trinken können und andere, für die das dann schon negative Effekte hat. Gesunde Menschen können über den Tag verteilt mit gutem Gewissen zwei bis drei große beziehungsweise drei bis vier kleine Tassen Kaffee trinken, so die Richtlinie der Deutschen Gesellschaft für Ernährung.\n\nIsabelle Keller warnt hingegen vor Koffeintabletten, die gerade bei Studenten in der Prüfungszeit immer beliebter werden: „Die Gefahr einer Überdosierung von Koffein ist damit einfach viel größer“, sagt sie. Denn wer es mit dem Koffein übertreibt, kann auch die negativen Folgen des Wirkstoffs zu spüren bekommen: Nervosität, Muskelzittern, Magen-Darm-Probleme, Schwindel und Kopfschmerzen.\n\nUnd wie schaffe ich es dann beispielsweise in der Prüfungszeit, mich fit und konzentriert zu fühlen, ohne es mit dem Kaffee zu übertreiben? Genügend zu trinken sei dafür das Wichtigste, meint Isabelle Keller: „Schon bei einem geringen Flüssigkeitsdefizit kommt es zu Konzentrationsschwierigkeiten, das geht sehr schnell.“ Sie empfiehlt, am Tag mindestens 1,5 Liter Flüssigkeit zu sich zu nehmen, am besten Wasser oder andere kalorienarme Getränke wie beispielsweise Kräutertee. Bei starker Hitze oder körperlicher Betätigung kann der tägliche Wasserbedarf das Drei- bis Vierfache erreichen.\n\nAuch die Ernährung spielt eine wichtige Rolle dabei, wi
