<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shpargalka Hören Teil 1</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #1f2937;
      padding: 20px;
      margin-top: 20px;
      border-radius: 18px;
    }
  
/* Shared responsive shell: phone/tablet/desktop */
html,body{max-width:100%;overflow-x:hidden}
@media(min-width:760px){
  body>main,body>.wrap,body>.container{max-width:1040px;margin-left:auto!important;margin-right:auto!important}
}
@media(min-width:1100px){
  body>main,body>.wrap,body>.container{max-width:1100px}
}

</style>
<script src="../app.js"></script>
</head>

<body>

  <a class="back" href="shpargalka-horen.html">← Orqaga</a>

  <h1>🎧 Hören Teil 1</h1>

  
<div class="card" style="padding:28px;">
<h2 style="font-size:32px;text-align:center;">🧠 Kalit so'zlarni yodlash</h2>
<div id="game" style="margin-top:20px"></div>
</div>
<script>
const demo={code:"12",correct:["Europäischen","Kulturhauptstadt","Angestellte"],pool:["Europäischen","Bierkonsum","Kulturhauptstadt","Ticket","Angestellte","Studie","Insel","Erdbeben"]};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(){
 let found=0;
 const g=document.getElementById('game');
 g.innerHTML='<h2 style="text-align:center;font-size:40px">Kod: 12</h2><div id=p style="text-align:center;font-size:24px;margin-bottom:20px">0/3</div>';
 shuffle(demo.pool).forEach(w=>{
  const b=document.createElement('button');
  b.textContent=w;
  b.style.cssText='display:block;width:100%;padding:18px;margin:10px 0;font-size:22px;border-radius:14px;border:none;';
  b.onclick=()=>{
    if(demo.correct.includes(w)){
      if(b.disabled)return;
      b.disabled=true;b.style.background='green';b.style.color='white';found++;
      document.getElementById('p').textContent=found+'/3';
      if(found===3)setTimeout(()=>alert("Ajoyib! Keyingi kod shu yerga qo'shiladi."),300);
    }else{
      b.style.background='crimson';b.style.color='white';
      setTimeout(()=>{b.style.background='';b.style.color='';},500);
    }
  };
  g.appendChild(b);
 });
}
startGame();
</script>

</body>
</html>
