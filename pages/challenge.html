<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Challenge</title><script src="../app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#10182d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:20px}.top{display:flex;gap:15px;align-items:center}.top a{color:#fff;text-decoration:none;font-size:28px}.card{background:#ffffff12;border:1px solid #ffffff1f;border-radius:20px;padding:18px;margin:12px 0}.meter{height:9px;background:#ffffff1a;border-radius:10px;overflow:hidden}.meter div{height:100%;background:#5fd38d}.muted{color:#b8c1d9}</style></head><body><main class="app"><div class="top"><a href="../index.html">‹</a><h1>🔥 Challenge</h1></div><div id="cards"></div></main><script>const p=JB2.profile(),m=JB2.mistakes(),done=Number(localStorage.getItem("jb2MasteredToday")||0),items=[["Bugungi 10 savol",Math.min(10,p.todayQuestions||0),10,"+20 XP"],["3 ta xatoni o‘zlashtir",Math.min(3,done),3,"+30 XP"],["7 kunlik B2 seriya",Math.min(7,p.streak||0),7,"🔥 Streak"],["20 ta xatosiz savol",Math.min(20,p.cleanRun||0),20,"🏆 Badge"]];cards.innerHTML=items.map(x=>`<div class="card"><h3>${x[0]}</h3><p class="muted">${x[1]}/${x[2]} · ${x[3]}</p><div class="meter"><div style="width:${x[1]/x[2]*100}%"></div></div></div>`).join("")</script></body></html>
