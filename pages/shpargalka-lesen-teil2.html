 const box=document.getElementById("options");
 Object.entries(item.options).forEach(([letter,text])=>{
   const b=document.createElement("button"); b.className="option";
   b.textContent=letter+") "+text;
   if(answered[current]){
     b.disabled=true;
     if(letter===item.answer)b.classList.add("correct");
     if(letter===answered[current].chosen && letter!==item.answer)b.classList.add("wrong");
   }
   b.onclick=()=>choose(letter);
   box.appendChild(b);
 });
}
function choose(letter){
 if(answered[current]) return;
 const item=tests[currentTest][current], ok=letter===item.answer;
 answered[current]={chosen:letter,ok:ok};
 if(ok){score++; if(typeof jbCorrectSound==="function")jbCorrectSound();}
 else{if(typeof jbWrongSound==="function")jbWrongSound(); saveWrong(item.q,item.answer,currentTest);}
 showQuestion();
}
function prevQ(){if(current>0){current--;showQuestion();window.scrollTo(0,0)}}
function nextQ(){
 if(current<tests[currentTest].length-1){current++;showQuestion();window.scrollTo(0,0)}
 else showResult();
}
function saveWrong(question,answer,testName){
 let wrongs=JSON.parse(localStorage.getItem("wrongQuestions")||"[]");
 const id="shpargalka-lesen-teil2-"+testName+"-"+(current+6);
 let found=wrongs.find(x=>x.id===id);
 if(!found)wrongs.push({id,section:"lesen",sectionName:"Lesen",teil:"2",test:testName,question,answer,correctCount:0});
 else found.correctCount=0;
 localStorage.setItem("wrongQuestions",JSON.stringify(wrongs));
}
function showResult(){
 const total=tests[currentTest].length;
 const done=Object.keys(answered).length;
 const percent=Math.round((score/total)*100);
 quiz.innerHTML=`<div class="result"><h1>🏆 Natija</h1><h2>${score}/${total}</h2><h1>${percent}%</h1>
 <p>Javob berilgan: ${done}/${total}</p>
 <button class="next" onclick="startTest('${currentTest}')">🔄 Qayta ishlash</button><br><br>
 <button class="next" onclick="backMenu()">← Barcha testlar</button></div>`;
}
function backMenu(){quiz.classList.add("hidden");menu.classList.remove("hidden");window.scrollTo(0,0)}
function jbTone(ok){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=window.__jbAudio||(window.__jbAudio=new C());if(c.state==='suspended')c.resume();const o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?760:190;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
function jbCorrectSound(){jbTone(true)} function jbWrongSound(){jbTone(false)}
</script>
</body></html>
