<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Jurabek TELC B2</title><script src="../app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#10182d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1000px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center}.top a{color:#fff;text-decoration:none;font-size:28px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.user{background:#192745;border:1px solid #334464;border-radius:18px;padding:15px}.card b{font-size:25px;display:block}.muted{color:#aeb9d0;font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,textarea,button{border:0;border-radius:12px;padding:11px;font:inherit}input,textarea{background:#202f50;color:#fff;border:1px solid #405171}button{background:#4168c9;color:#fff;font-weight:700}.danger{background:#a84052}.users{display:grid;gap:10px}.userTop{display:flex;justify-content:space-between;gap:10px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{padding:8px;font-size:12px}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.userTop{display:block}}</style></head><body><main class="app"><div class="top"><a href="profil.html">‹</a><h2>🛡️ Admin panel</h2></div><div id="denied" class="card">Tekshirilmoqda...</div><div id="panel" hidden><section class="cards"><div class="card"><b id="uCount">0</b><span class="muted">Foydalanuvchilar</span></div><div class="card"><b id="active">0</b><span class="muted">7 kun faol</span></div><div class="card"><b id="mastered">0</b><span class="muted">O‘zlashtirilgan</span></div><div class="card"><b id="answers">0</b><span class="muted">Jami javob</span></div></section><h3>📢 Xabar yuborish</h3><div class="tools"><textarea id="msg" rows="3" style="flex:1;min-width:220px" placeholder="Barcha foydalanuvchilarga xabar..."></textarea><button onclick="sendMsg()">Yuborish</button></div><h3>👥 Barcha foydalanuvchilar</h3><div class="tools"><input id="search" placeholder="Ism, username yoki ID" oninput="render()"><button onclick="load()">↻ Yangilash</button></div><div id="users" class="users"></div></div></main><script>let all=[];const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function load(){const me=await JB2.api('/api/me',{method:'POST',body:'{}'});if(!me||!me.is_admin){denied.textContent='⛔ Admin huquqi yo‘q. Render sozlamasida ADMIN_ID yoki ADMIN_IDS ga Telegram ID kiriting.';return}denied.hidden=true;panel.hidden=false;const r=await JB2.api('/api/admin/users',{method:'POST',body:'{}'});if(!r)return;all=r.users||[];const now=Date.now()/1000;uCount.textContent=all.length;active.textContent=all.filter(x=>now-Number(x.last_active||0)<604800).length;mastered.textContent=all.reduce((a,x)=>a+Number(x.mastered||0),0);answers.textContent=all.reduce((a,x)=>a+Number(x.correct||0)+Number(x.wrong||0),0);render()}function render(){const q=(search.value||'').toLowerCase();users.innerHTML=all.filter(x=>[x.id,x.first_name,x.last_name,x.username].join(' ').toLowerCase().includes(q)).map(x=>`<div class="user"><div class="userTop"><div><b>${esc((x.first_name||'')+' '+(x.last_name||''))}</b><div class="muted">@${esc(x.username||'—')} · ID ${esc(x.id)} ${x.is_admin?'· 🛡️ Admin':''} ${x.blocked?'· 🚫 Blok':''}</div></div><b>${Number(x.readiness||0)}%</b></div><div class="muted" style="margin-top:8px">XP ${Number(x.xp||0)} · Test ${Number(x.completed||0)} · ✓ ${Number(x.correct||0)} · ✕ ${Number(x.wrong||0)} · O‘zlashtirilgan ${Number(x.mastered||0)}/${Number(x.total_questions||637)}</div><div class="actions"><button onclick="act('${x.id}','${x.blocked?'unblock':'block'}')">${x.blocked?'Ochish':'Bloklash'}</button><button class="danger" onclick="act('${x.id}','reset')">Reset</button><button onclick="act('${x.id}','${x.is_admin?'remove_admin':'make_admin'}')">${x.is_admin?'Adminni olish':'Admin qilish'}</button></div></div>`).join('')}async function act(id,action){if(action==='reset'&&!confirm('Progressni reset qilasizmi?'))return;await JB2.api('/api/admin/action',{method:'POST',body:JSON.stringify({user_id:id,action})});load()}async function sendMsg(){const text=msg.value.trim();if(!text)return;const r=await JB2.api('/api/admin/broadcast',{method:'POST',body:JSON.stringify({text})});if(r){alert((r.sent||0)+' foydalanuvchiga yuborildi');msg.value=''}}load()</script></body></html>
