<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Statistika</title><script src="../app.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f7f8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 5%,#4a90e259,transparent 28%),radial-gradient(circle at 90% 18%,#975dff47,transparent 30%),linear-gradient(160deg,#10182d,#18284a 55%,#17172c)}.app{max-width:720px;margin:auto;padding:20px 18px 50px}.top{display:flex;align-items:center;gap:15px}.top a{color:#fff;text-decoration:none;font-size:28px}.card{background:#ffffff12;border:1px solid #ffffff1f;border-radius:22px;padding:18px;margin:14px 0}.hero{text-align:center}.hero strong{font-size:52px}.bar{height:11px;background:#ffffff1a;border-radius:12px;overflow:hidden;margin:12px 0}.bar div{height:100%;background:linear-gradient(90deg,#55a7ff,#65d29a)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#ffffff0f;border-radius:16px;padding:14px}.stat strong{display:block;font-size:24px}.stat small,.muted{color:#b8c1d9}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tab{border:0;border-radius:12px;padding:10px 3px;background:#ffffff12;color:#b8c1d9}.tab.active{background:#526fce;color:#fff}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff12}.row:last-child{border:0}@media(max-width:390px){.tabs{grid-template-columns:1fr 1fr}}</style></head><body><main class="app"><div class="top"><a href="../index.html">‹</a><h1>📊 Statistika</h1></div>
<section class="card hero"><small>Umumiy o‘zlashtirish</small><br><strong id="ready">0%</strong><div class="bar"><div id="readyBar"></div></div><div class="muted" id="since"></div></section>
<div class="tabs"><button class="tab active" onclick="range('today',this)">Bugun</button><button class="tab" onclick="range(7,this)">7 kun</button><button class="tab" onclick="range(30,this)">30 kun</button><button class="tab" onclick="range('all',this)">Umumiy</button></div>
<section class="grid" id="summary"></section>
<section class="card"><h3>📚 Bo‘limlar bo‘yicha</h3><div id="sections"></div></section>
<section class="card"><h3>🏆 Umumiy</h3><div class="row"><span>🔥 Streak</span><b id="streak"></b></div><div class="row"><span>🎓 Bajarilgan testlar</span><b id="tests"></b></div><div class="row"><span>🧠 O‘zlashtirilmagan</span><b id="weak"></b></div><div class="row"><span>⭐ XP</span><b id="xp"></b></div></section></main>
<script>
const st=JB2.stats(),p=JB2.profile();ready.textContent=JB2.readiness()+"%";readyBar.style.width=JB2.readiness()+"%";since.textContent="Ilovadan foydalanayotganiga "+JB2.usageDays()+" kun";streak.textContent=(p.streak||0)+" kun";tests.textContent=Object.keys(JB2.results()).length;weak.textContent=JB2.mistakes().length;xp.textContent=p.xp||0;
const ss=JB2.sectionStats();sections.innerHTML=Object.keys(ss).length?Object.entries(ss).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}%</b></div>`).join(""):'<p class="muted">Test natijalari yig‘ilgach ko‘rinadi.</p>';
function fmt(sec){sec=sec||0;let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h?h+" soat "+m+" daq":m+" daqiqa"}
function range(n,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");let vals=Object.entries(st.days||{}).sort((a,b)=>a[0].localeCompare(b[0]));if(n==="today")vals=vals.filter(x=>x[0]===JB2.day());else if(Number.isInteger(n))vals=vals.slice(-n);let z={questions:0,correct:0,wrong:0,mastered:0,tests:0,seconds:0};vals.forEach(([,v])=>Object.keys(z).forEach(k=>z[k]+=Number(v[k]||0)));let acc=z.questions?Math.round(z.correct/z.questions*100):0;summary.innerHTML=`<div class="stat"><strong>${z.questions}</strong><small>Ishlangan savol</small></div><div class="stat"><strong>${z.correct} / ${z.wrong}</strong><small>To‘g‘ri / xato</small></div><div class="stat"><strong>${acc}%</strong><small>Aniqlik</small></div><div class="stat"><strong>${z.mastered}</strong><small>O‘zlashtirilgan</small></div><div class="stat"><strong>${z.tests}</strong><small>Bajarilgan test</small></div><div class="stat"><strong>${fmt(z.seconds)}</strong><small>Shug‘ullanish vaqti</small></div>`}range("today",document.querySelector(".tab"));
</script></body></html>
